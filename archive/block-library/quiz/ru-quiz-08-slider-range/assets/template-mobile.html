<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif; --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background:#f5f5f5; color: var(--lp-text); width: 375px; }
  .step-card { background: var(--lp-bg); min-height: 100vh; padding: 28px 20px 40px; box-sizing: border-box; }
  .progress-bar-wrap { margin-bottom: 20px; }
  .progress-label { font-size: 11px; color:#999; margin-bottom: 5px; }
  .progress-track { background:#eee; border-radius: 4px; height: 5px; }
  .progress-fill { background: var(--lp-accent); height: 5px; border-radius: 4px; width: 60%; }
  .question-text { font-family: var(--lp-font-display); font-size: 20px; font-weight: 700; line-height: 1.25; margin: 0 0 32px; text-align: center; }
  .slider-value-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .slider-value-display { font-family: var(--lp-font-display); font-size: 32px; font-weight: 700; }
  .slider-unit { font-size: 16px; color:#555; }
  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 4px; background:#e0e0e0; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--lp-accent); border:3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.2); }
  .slider-range-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color:#999; }
  .question-comment { margin-top: 20px; font-size: 13px; color:#999; text-align: center; }
  .next-btn { display: block; margin: 28px 0 0; background: var(--lp-accent); color:#fff; border: none; border-radius: 8px; padding: 16px; width: 100%; font-size: 16px; font-weight: 700; text-decoration: none; text-align: center; box-sizing: border-box; }
</style>
<div class="step-card" data-block-id="ru-quiz-08-slider-range">
<div class="progress-bar-wrap">
<div class="progress-label">{{slot:progress-label}}</div>
<div class="progress-track"><div class="progress-fill"></div></div>
</div>
<p class="question-text">{{slot:question-text}}</p>
<div class="slider-value-row">
<span class="slider-value-display">50 000</span>
<span class="slider-unit">{{slot:unit-label}}</span>
</div>
<input max="300000" min="10000" step="5000" type="range" value="50000"/>
<div class="slider-range-labels">
<span>{{slot:min-label}}</span>
<span>{{slot:max-label}}</span>
</div>
<p class="question-comment">{{slot:question-comment}}</p>
<a class="next-btn" href="#">Далее →</a>
</div>
