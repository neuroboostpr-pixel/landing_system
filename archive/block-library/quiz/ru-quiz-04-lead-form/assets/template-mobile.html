<style>
  :root { --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif; --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px; }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; }
  .lead-form { padding: 20px; }
  .headline { font-size: 22px; line-height: 1.2; margin: 0 0 8px; }
  .subhead { color:#555; font-size: 14px; margin: 0 0 16px; }
  .field { margin-bottom: 12px; }
  .field input { width: 100%; padding: 12px; border: 1px solid var(--lp-border); border-radius: 6px; font-size: 16px; box-sizing: border-box; }
  .channel-choice { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .channel-choice label { padding: 12px; border: 1px solid var(--lp-border); border-radius: 6px; text-align: center; }
  .channel-choice input { display: none; }
  .agreement { display: flex; gap: 8px; font-size: 12px; color:#666; margin-bottom: 16px; }
  .cta { width: 100%; padding: 14px; background: var(--lp-accent); color:#fff; border: none; border-radius: 6px; font-weight: 600; }
</style>
<section class="lead-form" data-block-id="ru-quiz-04-lead-form">
<h2 class="headline">{{slot:headline}}</h2>
<p class="subhead">{{slot:subhead}}</p>
<div class="field"><input placeholder="Имя" type="text"/></div>
<div class="field"><input placeholder="+7 ___ ___ __ __" type="tel"/></div>
<fieldset class="channel-choice">
<label><input checked="" name="ch" type="radio" value="tg"/>Telegram</label>
<label><input name="ch" type="radio" value="max"/>Max</label>
<label><input name="ch" type="radio" value="phone"/>Звонок</label>
</fieldset>
<label class="agreement"><input required="" type="checkbox"/> Согласен на обработку ПД (152-ФЗ)</label>
<button class="cta">{{slot:cta}}</button>
</section>
