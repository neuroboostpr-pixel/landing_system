<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif; --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; box-sizing: border-box; }
  .welcome-card { text-align: center; width: 100%; }
  .welcome-badge { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--lp-accent); border: 1.5px solid var(--lp-accent); border-radius: 20px; padding: 3px 12px; margin-bottom: 20px; }
  .headline { font-family: var(--lp-font-display); font-size: 24px; font-weight: 700; line-height: 1.2; margin: 0 0 14px; }
  .subheadline { font-size: 15px; color:#555; line-height: 1.5; margin: 0 0 24px; }
  .lead-magnet { background:var(--lp-bg); border: 1.5px dashed var(--lp-border); border-radius: 10px; padding: 12px 16px; margin-bottom: 24px; font-size: 14px; color:#444; text-align: left; }
  .lead-magnet strong { color: var(--lp-text); }
  .cta-button { display: block; width: 100%; background: var(--lp-accent); color:#fff; font-size: 17px; font-weight: 700; padding: 16px; border-radius: 10px; text-decoration: none; text-align: center; box-sizing: border-box; }
  .trust-note { margin-top: 14px; font-size: 12px; color:#999; }
</style>
<div class="welcome-card" data-block-id="ru-quiz-06-welcome-screen">
<div class="welcome-badge">Бесплатный подбор</div>
<h1 class="headline">{{slot:headline}}</h1>
<p class="subheadline">{{slot:subheadline}}</p>
<div class="lead-magnet">🎁 <strong>Подарок:</strong> скидка 10% + бесплатный замер</div>
<a class="cta-button" href="#">{{slot:cta-button}}</a>
<p class="trust-note">{{slot:trust-note}}</p>
</div>
