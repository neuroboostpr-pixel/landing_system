<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif;
    --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background:#f5f5f5; color: var(--lp-text); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .welcome-card { background: var(--lp-bg); border-radius: 16px; padding: 56px 48px; max-width: 600px; width: 100%; box-shadow: 0 4px 32px rgba(0,0,0,0.08); text-align: center; }
  .welcome-badge { display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--lp-accent); border: 1.5px solid var(--lp-accent); border-radius: 20px; padding: 4px 14px; margin-bottom: 24px; }
  .headline { font-family: var(--lp-font-display); font-size: 32px; font-weight: 700; line-height: 1.2; margin: 0 0 16px; }
  .subheadline { font-size: 18px; color:#555; line-height: 1.5; margin: 0 0 32px; }
  .lead-magnet { background:var(--lp-bg); border: 1.5px dashed var(--lp-border); border-radius: 10px; padding: 14px 20px; margin-bottom: 32px; font-size: 15px; color:#444; }
  .lead-magnet strong { color: var(--lp-text); }
  .cta-button { display: inline-block; background: var(--lp-accent); color:#fff; font-size: 18px; font-weight: 700; padding: 18px 48px; border-radius: 10px; text-decoration: none; cursor: pointer; letter-spacing: 0.02em; border: none; }
  .trust-note { margin-top: 18px; font-size: 13px; color:#999; }
</style>
<div class="welcome-card" data-block-id="ru-quiz-06-welcome-screen">
<div class="welcome-badge">Бесплатный подбор</div>
<h1 class="headline">{{slot:headline}}</h1>
<p class="subheadline">{{slot:subheadline}}</p>
<div class="lead-magnet">🎁 <strong>Подарок за прохождение:</strong> скидка 10% на первый заказ + бесплатный замер</div>
<a class="cta-button" href="#">{{slot:cta-button}}</a>
<p class="trust-note">{{slot:trust-note}}</p>
</div>
