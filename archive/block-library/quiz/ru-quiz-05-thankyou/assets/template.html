<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif;
    --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .thankyou { text-align: center; padding: var(--spacing-lg); max-width: 520px; }
  .success-icon { font-size: 80px; line-height: 1; margin: 0 0 24px; display: block; color: var(--lp-accent); }
  .success-headline { font-family: var(--lp-font-display); font-size: 40px; line-height: 1.1; margin: 0 0 16px; }
  .success-subhead { font-size: 18px; color:#555; margin: 0 0 40px; line-height: 1.5; }
  .cta { display: inline-block; padding: 14px 40px; background: transparent; color: var(--lp-text); border: 2px solid var(--lp-border); text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 16px; }
</style>
<div class="thankyou" data-block-id="ru-quiz-05-thankyou">
<span class="success-icon">{{slot:success-icon}}</span>
<h1 class="success-headline">{{slot:success-headline}}</h1>
<p class="success-subhead">{{slot:success-subhead}}</p>
<a class="cta" href="/">{{slot:back-cta}}</a>
</div>
