<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif; --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background:#f5f5f5; color: var(--lp-text); width: 375px; }
  .step-card { background: var(--lp-bg); min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; }
  .question-text { font-family: var(--lp-font-display); font-size: 20px; line-height: 1.25; margin: 0 0 28px; text-align: center; }
  .answers { display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .answer-btn { display: block; padding: 14px 16px; border: 2px solid var(--lp-border); border-radius: 8px; font-size: 15px; text-align: left; cursor: pointer; background: var(--lp-bg); color: var(--lp-text); text-decoration: none; }
  .question-comment { margin-top: 20px; font-size: 12px; color:#999; text-align: center; }
</style>
<div class="step-card" data-block-id="ru-quiz-01-step-card">
<p class="question-text">{{slot:question-text}}</p>
<div class="answers">
<a class="answer-btn" href="#">{{slot:answer-1-text}}</a>
<a class="answer-btn" href="#">{{slot:answer-2-text}}</a>
<a class="answer-btn" href="#">{{slot:answer-3-text}}</a>
<a class="answer-btn" href="#">{{slot:answer-4-text}}</a>
</div>
<p class="question-comment">{{slot:question-comment}}</p>
</div>
