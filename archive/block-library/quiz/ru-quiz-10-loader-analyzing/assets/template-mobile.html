<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif; --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; box-sizing: border-box; }
  .loader-card { text-align: center; width: 100%; }
  .loader-icon { font-size: 48px; margin-bottom: 20px; }
  .headline { font-family: var(--lp-font-display); font-size: 22px; font-weight: 700; margin: 0 0 10px; }
  .subheadline { font-size: 15px; color:#666; margin: 0 0 32px; line-height: 1.5; }
  .loader-progress-track { background:#eee; border-radius: 8px; height: 8px; overflow: hidden; margin-bottom: 28px; }
  .loader-progress-fill { height: 8px; border-radius: 8px; background: var(--lp-accent); width: 0%; animation: fill-bar 2.5s ease-in-out forwards; }
  @keyframes fill-bar { 0% { width: 0%; } 70% { width: 85%; } 100% { width: 95%; } }
  .steps-list { list-style: none; padding: 0; margin: 0; text-align: left; width: 100%; }
  .steps-list li { display: flex; align-items: center; gap: 10px; font-size: 14px; color:#555; margin-bottom: 10px; }
  .step-text-done { color: var(--lp-text); font-weight: 500; }
</style>
<div class="loader-card" data-block-id="ru-quiz-10-loader-analyzing">
<div class="loader-icon">🔍</div>
<h2 class="headline">{{slot:headline}}</h2>
<p class="subheadline">{{slot:subheadline}}</p>
<div class="loader-progress-track">
<div class="loader-progress-fill"></div>
</div>
<ul class="steps-list">
<li><span>✅</span><span class="step-text-done">{{slot:step-1-text}}</span></li>
<li><span>✅</span><span class="step-text-done">{{slot:step-2-text}}</span></li>
<li><span>⏳</span><span>{{slot:step-3-text}}</span></li>
</ul>
</div>
