<style>.lp-footer-minimal-split {
  background: var(--lp-text);
  color: var(--lp-bg);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md) var(--lp-spacing-md);
}

.lp-footer-minimal-split__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  margin: 0 auto;
  max-width: 1280px;
}

.lp-footer-minimal-split__brand {
  display: grid;
  gap: var(--lp-spacing-sm);
}

.lp-footer-minimal-split__logo {
  align-items: center;
  color: var(--lp-bg);
  display: inline-flex;
  gap: var(--lp-spacing-sm);
  text-decoration: none;
}

.lp-footer-minimal-split__logo:focus-visible,
.lp-footer-minimal-split a:focus-visible {
  border-radius: var(--lp-radius);
  outline: 2px solid var(--lp-accent);
  outline-offset: 4px;
}

.lp-footer-minimal-split__logo-mark {
  background: var(--lp-accent);
  border-radius: var(--lp-radius);
  display: inline-block;
  height: 0.875rem;
  width: 0.875rem;
}

.lp-footer-minimal-split__logo-text {
  font-family: var(--lp-font-display);
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.1;
}

.lp-footer-minimal-split__summary {
  color: var(--lp-border);
  font-size: 0.9375rem;
  line-height: 1.6;
  margin: 0;
  max-width: 34rem;
}

.lp-footer-minimal-split__columns {
  display: grid;
  gap: var(--lp-spacing-md);
}

.lp-footer-minimal-split__list,
.lp-footer-minimal-split__legal {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm) var(--lp-spacing-md);
}

.lp-footer-minimal-split__list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.lp-footer-minimal-split a {
  color: var(--lp-bg);
  font-size: 0.875rem;
  line-height: 1.4;
  text-decoration: none;
}

.lp-footer-minimal-split a:hover {
  color: var(--lp-accent);
}

.lp-footer-minimal-split__contacts {
  color: var(--lp-border);
  display: grid;
  font-style: normal;
  gap: var(--lp-spacing-xs);
}

.lp-footer-minimal-split__contacts a,
.lp-footer-minimal-split__contacts span {
  color: var(--lp-border);
  font-size: 0.875rem;
  line-height: 1.5;
}

.lp-footer-minimal-split__bottom {
  border-top: 1px solid var(--lp-border);
  display: grid;
  gap: var(--lp-spacing-sm);
  margin: var(--lp-spacing-lg) auto 0;
  max-width: 1280px;
  padding-top: var(--lp-spacing-md);
}

.lp-footer-minimal-split__bottom p {
  color: var(--lp-border);
  font-size: 0.8125rem;
  line-height: 1.5;
  margin: 0;
}

.lp-footer-minimal-split__legal {
  margin: 0;
}

.lp-footer-minimal-split__legal a {
  color: var(--lp-border);
  font-size: 0.8125rem;
}

@media (min-width: 768px) {
  .lp-footer-minimal-split {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg) var(--lp-spacing-md);
  }

  .lp-footer-minimal-split__inner {
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  }

  .lp-footer-minimal-split__columns {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    justify-items: end;
  }

  .lp-footer-minimal-split__contacts {
    justify-items: end;
    text-align: right;
  }

  .lp-footer-minimal-split__bottom {
    align-items: center;
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .lp-footer-minimal-split__legal {
    justify-content: flex-end;
  }
}
</style>
<footer aria-labelledby="lp-footer-minimal-split-title" class="lp-footer-minimal-split">
<div class="lp-footer-minimal-split__inner">
<div class="lp-footer-minimal-split__brand">
<a aria-label="{{slot:brand-label}}" class="lp-footer-minimal-split__logo" href="{{slot:brand-url}}">
<span aria-hidden="true" class="lp-footer-minimal-split__logo-mark"></span>
<span class="lp-footer-minimal-split__logo-text" id="lp-footer-minimal-split-title">{{slot:brand-name}}</span>
</a>
<p class="lp-footer-minimal-split__summary">{{slot:footer-summary}}</p>
</div>
<div class="lp-footer-minimal-split__columns">
<nav aria-label="{{slot:footer-nav-label}}" class="lp-footer-minimal-split__nav">
<ul class="lp-footer-minimal-split__list">
<li><a href="{{slot:nav-link-1-url}}">{{slot:nav-link-1-label}}</a></li>
<li><a href="{{slot:nav-link-2-url}}">{{slot:nav-link-2-label}}</a></li>
<li><a href="{{slot:nav-link-3-url}}">{{slot:nav-link-3-label}}</a></li>
</ul>
</nav>
<address class="lp-footer-minimal-split__contacts">
<a href="{{slot:contact-phone-url}}">{{slot:contact-phone}}</a>
<a href="{{slot:contact-email-url}}">{{slot:contact-email}}</a>
<span>{{slot:contact-address}}</span>
</address>
</div>
</div>
<div class="lp-footer-minimal-split__bottom">
<p>{{slot:legal-requisites}}</p>
<nav aria-label="{{slot:legal-nav-label}}" class="lp-footer-minimal-split__legal">
<a href="{{slot:privacy-url}}">{{slot:privacy-label}}</a>
<a href="{{slot:terms-url}}">{{slot:terms-label}}</a>
</nav>
</div>
</footer>
