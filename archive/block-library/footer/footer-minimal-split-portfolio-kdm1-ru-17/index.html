<footer class="lp-footer-minimal-split" aria-labelledby="lp-footer-minimal-split-title">
  <div class="lp-footer-minimal-split__inner">
    <div class="lp-footer-minimal-split__brand">
      <a class="lp-footer-minimal-split__logo" href="{{slot:brand-url}}" aria-label="{{slot:brand-label}}">
        <span class="lp-footer-minimal-split__logo-mark" aria-hidden="true"></span>
        <span id="lp-footer-minimal-split-title" class="lp-footer-minimal-split__logo-text">{{slot:brand-name}}</span>
      </a>
      <p class="lp-footer-minimal-split__summary">{{slot:footer-summary}}</p>
    </div>

    <div class="lp-footer-minimal-split__columns">
      <nav class="lp-footer-minimal-split__nav" aria-label="{{slot:footer-nav-label}}">
        <ul class="lp-footer-minimal-split__list">
          <li><a href="{{slot:nav-link-1-url}}">{{slot:nav-link-1-label}}</a></li>
          <li><a href="{{slot:nav-link-2-url}}">{{slot:nav-link-2-label}}</a></li>
          <li><a href="{{slot:nav-link-3-url}}">{{slot:nav-link-3-label}}</a></li>
        </ul>
      </nav>

      <address class="lp-footer-minimal-split__contacts">
        <a href="{{slot:contact-phone-url}}">{{slot:contact-phone}}</a>
        <a href="{{slot:contact-email-url}}">{{slot:contact-email}}</a>
        <span>{{slot:contact-address}}</span>
      </address>
    </div>
  </div>

  <div class="lp-footer-minimal-split__bottom">
    <p>{{slot:legal-requisites}}</p>
    <nav class="lp-footer-minimal-split__legal" aria-label="{{slot:legal-nav-label}}">
      <a href="{{slot:privacy-url}}">{{slot:privacy-label}}</a>
      <a href="{{slot:terms-url}}">{{slot:terms-label}}</a>
    </nav>
  </div>
</footer>
