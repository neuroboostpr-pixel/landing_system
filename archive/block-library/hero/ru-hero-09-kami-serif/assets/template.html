<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: 'Source Serif 4', Charter, Georgia, serif;
    --lp-font-body: 'Source Sans 3', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--lp-font-display); background: var(--lp-bg); color: var(--lp-text); }
  .shell { max-width: 1120px; margin: 0 auto; padding: 88px 64px 60px; }
  .eyebrow-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--lp-font-body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color:var(--lp-text);
    border-bottom: 1px solid var(--lp-border);
    padding-bottom: 18px;
    margin-bottom: 72px;
  }
  .hero {
    display: grid;
    grid-template-columns: 1.45fr 0.55fr;
    gap: 64px;
    align-items: end;
    margin-bottom: 80px;
  }
  .hero-copy h1 {
    font-family: var(--lp-font-display);
    font-weight: 500;
    font-size: clamp(56px, 7vw, 96px);
    line-height: 1.05;
    letter-spacing: -1.2px;
    color: var(--lp-text);
    margin-bottom: 24px;
  }
  .hero-copy h1 .accent { color: var(--lp-accent); }
  .hero-copy .tagline {
    font-family: var(--lp-font-display);
    font-weight: 400;
    font-size: 20px;
    line-height: 1.5;
    color:var(--lp-text);
    max-width: 42ch;
    margin-bottom: 32px;
  }
  .hero-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .btn-primary {
    display: inline-block;
    padding: 12px 28px;
    background: var(--lp-accent);
    color:#fff;
    font-family: var(--lp-font-body);
    font-weight: 500;
    font-size: 15px;
    text-decoration: none;
    border: none;
    cursor: pointer;
  }
  .btn-ghost {
    display: inline-block;
    padding: 12px 28px;
    background: transparent;
    color: var(--lp-accent);
    font-family: var(--lp-font-body);
    font-weight: 500;
    font-size: 15px;
    text-decoration: none;
    border: 1px solid var(--lp-accent);
    cursor: pointer;
  }
  .hero-tokens {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-end;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.4px;
    color:var(--lp-text);
    text-transform: uppercase;
  }
  .token-row {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background:var(--lp-bg);
    border: 1px solid var(--lp-border);
    border-radius: 6px;
    padding: 10px 14px;
  }
  .token-row b {
    color: var(--lp-accent);
    font-weight: 500;
    font-family: var(--lp-font-display);
    font-size: 14px;
  }
  .token-row span { font-family: var(--lp-font-body); }
</style>
<div class="shell">
<div class="eyebrow-row">
<span>{{slot:eyebrow-left}}</span>
<span>{{slot:eyebrow-right}}</span>
</div>
<section class="hero" data-block-id="ru-hero-09-kami-serif">
<div class="hero-copy">
<h1>{{slot:h1-1}}</h1>
<p class="tagline">{{slot:subhead}}</p>
<div class="hero-actions">
<a class="btn-primary" href="#contact">{{slot:primary-cta}}</a>
<a class="btn-ghost" href="#about">{{slot:secondary-cta}}</a>
</div>
</div>
<div class="hero-tokens">
<div class="token-row">
<b>{{slot:metric-1-value}}</b>
<span>{{slot:metric-1-label}}</span>
</div>
<div class="token-row">
<b>{{slot:metric-2-value}}</b>
<span>{{slot:metric-2-label}}</span>
</div>
<div class="token-row">
<b>{{slot:metric-3-value}}</b>
<span>{{slot:metric-3-label}}</span>
</div>
</div>
</section>
</div>
