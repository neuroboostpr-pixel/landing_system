<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif; --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; }
  .hero-photo { aspect-ratio: 9/16; background:var(--lp-bg); position: relative; }
  .hero-photo .slot-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; color:#666; }
  .hero-text { padding: 20px; }
  .headline { font-family: var(--lp-font-display); font-size: 28px; line-height: 1.15; margin: 0 0 12px; }
  .subhead { font-size: 15px; color:#444; margin: 0 0 16px; }
  .price-tag { display: inline-block; background:var(--lp-bg); padding: 6px 12px; border-radius: 4px; font-weight: 600; margin-bottom: 16px; }
  .cta { display: block; padding: 14px; background: var(--lp-accent); color:#fff; text-align: center; text-decoration: none; border-radius: 6px; font-weight: 600; }
</style>
<section class="hero" data-block-id="ru-hero-01-services-calc">
<div class="hero-photo">
<div class="slot-label">photo · 9:16 · hero-bg</div>
</div>
<div class="hero-text">
<h1 class="headline">{{slot:headline}}</h1>
<p class="subhead">{{slot:subhead}}</p>
<div class="price-tag">{{slot:price-tag}}</div>
<a class="cta" href="#quiz">{{slot:primary-cta}}</a>
</div>
</section>
