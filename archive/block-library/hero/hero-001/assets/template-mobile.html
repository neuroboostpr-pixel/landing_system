<style>.lp-hero-brutalist-split {
  display: grid;
  gap: var(--lp-spacing-lg);
  padding: var(--lp-spacing-lg);
  color: var(--lp-text);
  background: var(--lp-bg);
  border-block: 1px solid var(--lp-border);
  font-family: var(--lp-font-body);
}

.lp-hero-brutalist-split__content {
  display: flex;
  flex-direction: column;
  gap: var(--lp-spacing-md);
  justify-content: center;
}

.lp-hero-brutalist-split__eyebrow {
  align-self: flex-start;
  margin: 0;
  padding: var(--lp-spacing-xs) var(--lp-spacing-sm);
  color: var(--lp-bg);
  background: var(--lp-primary);
  font-size: 0.8rem;
  font-weight: 800;
  line-height: 1.2;
  text-transform: uppercase;
}

.lp-hero-brutalist-split__title {
  margin: 0;
  max-width: 11em;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2.5rem, 12vw, 5.75rem);
  font-weight: 900;
  line-height: 0.92;
  text-transform: uppercase;
}

.lp-hero-brutalist-split__subhead {
  margin: 0;
  max-width: 38rem;
  color: var(--lp-text-muted);
  font-size: clamp(1rem, 4vw, 1.25rem);
  line-height: 1.5;
}

.lp-hero-brutalist-split__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  margin-top: var(--lp-spacing-sm);
}

.lp-hero-brutalist-split__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3.25rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  border: 2px solid var(--lp-primary);
  border-radius: var(--lp-radius);
  font-weight: 800;
  line-height: 1.1;
  text-align: center;
  text-decoration: none;
  text-transform: uppercase;
}

.lp-hero-brutalist-split__button--primary {
  color: var(--lp-bg);
  background: var(--lp-primary);
}

.lp-hero-brutalist-split__button--secondary {
  color: var(--lp-primary);
  background: transparent;
}

.lp-hero-brutalist-split__button:focus-visible {
  outline: 3px solid var(--lp-accent);
  outline-offset: 3px;
}

.lp-hero-brutalist-split__badges {
  display: grid;
  gap: var(--lp-spacing-xs);
  margin: var(--lp-spacing-md) 0 0;
  padding: 0;
  list-style: none;
}

.lp-hero-brutalist-split__badges li {
  padding: var(--lp-spacing-xs) 0;
  color: var(--lp-text);
  border-top: 1px solid var(--lp-border);
  font-size: 0.9rem;
  font-weight: 700;
  text-transform: uppercase;
}

.lp-hero-brutalist-split__media {
  min-height: 18rem;
  overflow: hidden;
  border: 2px solid var(--lp-text);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
}

.lp-hero-brutalist-split__media picture,
.lp-hero-brutalist-split__media img {
  display: block;
  width: 100%;
  height: 100%;
}

.lp-hero-brutalist-split__media img {
  object-fit: cover;
}

@media (min-width: 768px) {
  .lp-hero-brutalist-split {
    grid-template-columns: minmax(0, 1fr) minmax(20rem, 0.9fr);
    align-items: stretch;
    min-height: 42rem;
    padding: var(--lp-spacing-xl);
  }

  .lp-hero-brutalist-split__content {
    padding-block: var(--lp-spacing-xl);
  }

  .lp-hero-brutalist-split__badges {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    max-width: 48rem;
  }

  .lp-hero-brutalist-split__badges li {
    border-top: 2px solid var(--lp-border);
  }

  .lp-hero-brutalist-split__media {
    min-height: 100%;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section aria-labelledby="lp-hero-brutalist-split-title" class="lp-hero-brutalist-split">
<div class="lp-hero-brutalist-split__content">
<p class="lp-hero-brutalist-split__eyebrow">{{slot:eyebrow}}</p>
<h1 class="lp-hero-brutalist-split__title" id="lp-hero-brutalist-split-title">{{slot:title}}</h1>
<p class="lp-hero-brutalist-split__subhead">{{slot:subhead}}</p>
<div class="lp-hero-brutalist-split__actions">
<a class="lp-hero-brutalist-split__button lp-hero-brutalist-split__button--primary" href="{{slot:primary-cta-link}}">
        {{slot:primary-cta-label}}
      </a>
<a class="lp-hero-brutalist-split__button lp-hero-brutalist-split__button--secondary" href="{{slot:secondary-cta-link}}">
        {{slot:secondary-cta-label}}
      </a>
</div>
<ul aria-label="{{slot:badges-label}}" class="lp-hero-brutalist-split__badges">
<li>{{slot:badge-1}}</li>
<li>{{slot:badge-2}}</li>
<li>{{slot:badge-3}}</li>
</ul>
</div>
<div class="lp-hero-brutalist-split__media">
<picture>
<source media="(max-width: 767px)" srcset="{{slot:hero-image-mobile}}"/>
<img alt="{{slot:hero-image-alt}}" loading="lazy" src="{{slot:hero-image}}"/>
</picture>
</div>
</section>
