<style>.lp-hero-cinematic-centered {
  position: relative;
  overflow: hidden;
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-hero-cinematic-centered::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 18%, var(--lp-bg-alt), transparent 38%),
    linear-gradient(180deg, var(--lp-bg-alt), var(--lp-bg));
  opacity: 0.72;
  pointer-events: none;
}

.lp-hero-cinematic-centered__inner {
  position: relative;
  z-index: 1;
  display: grid;
  gap: var(--lp-spacing-lg);
  align-items: center;
  max-width: 1280px;
  margin: 0 auto;
  text-align: center;
}

.lp-hero-cinematic-centered__badge {
  justify-self: center;
  max-width: 100%;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  padding: var(--lp-spacing-xs) var(--lp-spacing-sm);
  color: var(--lp-accent);
  background: var(--lp-bg-alt);
  font-size: 0.875rem;
  line-height: 1.3;
}

.lp-hero-cinematic-centered__content {
  display: grid;
  justify-items: center;
  gap: var(--lp-spacing-md);
}

.lp-hero-cinematic-centered__title {
  max-width: 12ch;
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(3rem, 13vw, 7rem);
  font-weight: 800;
  line-height: 0.88;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-hero-cinematic-centered__subhead {
  max-width: 48rem;
  margin: 0;
  color: var(--lp-text-muted);
  font-size: clamp(1rem, 2.5vw, 1.25rem);
  line-height: 1.6;
}

.lp-hero-cinematic-centered__actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--lp-spacing-sm);
  width: 100%;
}

.lp-hero-cinematic-centered__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3.25rem;
  border-radius: var(--lp-radius);
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  font-family: var(--lp-font-body);
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
}

.lp-hero-cinematic-centered__button--primary {
  color: var(--lp-bg);
  background: var(--lp-accent);
  border: 1px solid var(--lp-accent);
}

.lp-hero-cinematic-centered__button--secondary {
  color: var(--lp-text);
  background: transparent;
  border: 1px solid var(--lp-border);
}

.lp-hero-cinematic-centered__button:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 4px;
}

.lp-hero-cinematic-centered__media {
  width: 100%;
  max-width: 58rem;
  justify-self: center;
  border-radius: var(--lp-radius-lg);
  overflow: hidden;
  border: 1px solid var(--lp-border);
  background: var(--lp-bg-alt);
}

.lp-hero-cinematic-centered__picture {
  display: block;
  aspect-ratio: 16 / 10;
}

.lp-hero-cinematic-centered__picture img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@media (min-width: 768px) {
  .lp-hero-cinematic-centered {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-hero-cinematic-centered__inner {
    gap: var(--lp-spacing-xl);
  }

  .lp-hero-cinematic-centered__content {
    gap: var(--lp-spacing-lg);
  }

  .lp-hero-cinematic-centered__media {
    margin-top: calc(var(--lp-spacing-lg) * -1);
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section aria-labelledby="lp-hero-cinematic-centered-title" class="lp-hero-cinematic-centered">
<div class="lp-hero-cinematic-centered__inner">
<div class="lp-hero-cinematic-centered__badge">{{slot:eyebrow}}</div>
<div class="lp-hero-cinematic-centered__content">
<h1 class="lp-hero-cinematic-centered__title" id="lp-hero-cinematic-centered-title">{{slot:heading}}</h1>
<p class="lp-hero-cinematic-centered__subhead">{{slot:subhead}}</p>
<div class="lp-hero-cinematic-centered__actions">
<a class="lp-hero-cinematic-centered__button lp-hero-cinematic-centered__button--primary" href="{{slot:primary-cta-link}}">
          {{slot:primary-cta-label}}
        </a>
<a class="lp-hero-cinematic-centered__button lp-hero-cinematic-centered__button--secondary" href="{{slot:secondary-cta-link}}">
          {{slot:secondary-cta-label}}
        </a>
</div>
</div>
<div aria-label="{{slot:media-label}}" class="lp-hero-cinematic-centered__media">
<picture class="lp-hero-cinematic-centered__picture">
<source media="(max-width: 767px)" srcset="{{slot:hero-image-mobile}}"/>
<img alt="{{slot:hero-image-alt}}" loading="lazy" src="{{slot:hero-image}}"/>
</picture>
</div>
</div>
</section>
