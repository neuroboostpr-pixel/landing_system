<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: 'Playfair Display', 'Times New Roman', serif;
    --lp-font-body: 'Inter', system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500;1,600;1,700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; }
  .hero {
    display: flex;
    flex-direction: column;
    padding: 24px 16px 32px;
  }
  .hero-art {
    width: 100%;
    aspect-ratio: 4/3;
    background: rgba(21,20,15,0.06);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(21,20,15,0.35);
    margin-bottom: 24px;
  }
  .kicker {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--lp-accent);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .kicker::before {
    content: '';
    width: 14px;
    height: 1px;
    background: var(--lp-accent);
    display: inline-block;
  }
  .headline {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-weight: 800;
    font-size: 38px;
    line-height: 1.0;
    letter-spacing: -0.028em;
    margin-bottom: 16px;
  }
  .headline em {
    font-family: var(--lp-font-display);
    font-style: italic;
    font-weight: 500;
  }
  .subhead {
    font-size: 15px;
    line-height: 1.55;
    color: rgba(21,20,15,0.7);
    margin-bottom: 24px;
  }
  .hero-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .stat {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .stat-ring {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--lp-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .stat-ring.accent { border-color: var(--lp-accent); color: var(--lp-accent); }
  .stat-label {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.25;
  }
  .stat-label b { display: block; font-weight: 700; }
  .btn-primary {
    display: block;
    width: 100%;
    padding: 14px 24px;
    border-radius: 999px;
    background: var(--lp-accent);
    color:#fff;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    text-align: center;
    border: none;
    margin-bottom: 10px;
  }
  .btn-ghost {
    display: block;
    width: 100%;
    padding: 14px 24px;
    border-radius: 999px;
    background: transparent;
    color: var(--lp-text);
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    text-align: center;
    border: 1px solid var(--lp-border);
  }
</style>
<section class="hero" data-block-id="ru-hero-07-editorial-serif">
<div class="hero-art">{{slot:hero-image}}</div>
<span class="kicker">{{slot:kicker}}</span>
<h1 class="headline">{{slot:headline}}</h1>
<p class="subhead">{{slot:subhead}}</p>
<div class="hero-stats">
<div class="stat">
<span class="stat-ring accent">{{slot:stat-1-value}}</span>
<span class="stat-label"><b>{{slot:stat-1-label}}</b></span>
</div>
<div class="stat">
<span class="stat-ring">{{slot:stat-2-value}}</span>
<span class="stat-label"><b>{{slot:stat-2-label}}</b></span>
</div>
</div>
<a class="btn-primary" href="#contact">{{slot:primary-cta}}</a>
<a class="btn-ghost" href="#about">{{slot:secondary-cta}}</a>
</section>
