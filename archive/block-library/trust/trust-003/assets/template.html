<style>.lp-trust-minimal-centered {
  background: var(--lp-text);
  color: var(--lp-bg);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-trust-minimal-centered__inner {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  text-align: center;
}

.lp-trust-minimal-centered__eyebrow {
  margin: 0 0 var(--lp-spacing-sm);
  color: var(--lp-accent);
  font-family: var(--lp-font-body);
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.3;
  text-transform: uppercase;
}

.lp-trust-minimal-centered__title {
  max-width: 820px;
  margin: 0 auto;
  color: var(--lp-bg);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 7vw, 4.75rem);
  font-weight: 800;
  line-height: 0.95;
}

.lp-trust-minimal-centered__subhead {
  max-width: 640px;
  margin: var(--lp-spacing-md) auto 0;
  color: var(--lp-bg-alt);
  font-family: var(--lp-font-body);
  font-size: 1rem;
  line-height: 1.65;
}

.lp-trust-minimal-centered__logo-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--lp-spacing-sm);
  min-height: 260px;
  margin: var(--lp-spacing-xl) 0 0;
  padding: var(--lp-spacing-md);
  list-style: none;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
}

.lp-trust-minimal-centered__logo-item {
  display: flex;
  min-height: 86px;
  align-items: center;
  justify-content: center;
  padding: var(--lp-spacing-md);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
}

.lp-trust-minimal-centered__logo-item img {
  display: block;
  max-width: 100%;
  max-height: 48px;
  object-fit: contain;
}

@media (min-width: 768px) {
  .lp-trust-minimal-centered {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-trust-minimal-centered__logo-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    min-height: 340px;
    padding: var(--lp-spacing-lg);
    gap: var(--lp-spacing-md);
  }

  .lp-trust-minimal-centered__logo-item {
    min-height: 118px;
  }
}
</style>
<section aria-labelledby="trust-minimal-centered-title" class="lp-trust-minimal-centered">
<div class="lp-trust-minimal-centered__inner">
<p class="lp-trust-minimal-centered__eyebrow">{{slot:trust-eyebrow}}</p>
<h2 class="lp-trust-minimal-centered__title" id="trust-minimal-centered-title">{{slot:trust-heading}}</h2>
<p class="lp-trust-minimal-centered__subhead">{{slot:trust-subhead}}</p>
<ul aria-label="{{slot:trust-logos-label}}" class="lp-trust-minimal-centered__logo-grid">
<li class="lp-trust-minimal-centered__logo-item">
<img alt="{{slot:partner-logo-1-alt}}" loading="lazy" src="{{slot:partner-logo-1}}"/>
</li>
<li class="lp-trust-minimal-centered__logo-item">
<img alt="{{slot:partner-logo-2-alt}}" loading="lazy" src="{{slot:partner-logo-2}}"/>
</li>
<li class="lp-trust-minimal-centered__logo-item">
<img alt="{{slot:partner-logo-3-alt}}" loading="lazy" src="{{slot:partner-logo-3}}"/>
</li>
<li class="lp-trust-minimal-centered__logo-item">
<img alt="{{slot:partner-logo-4-alt}}" loading="lazy" src="{{slot:partner-logo-4}}"/>
</li>
<li class="lp-trust-minimal-centered__logo-item">
<img alt="{{slot:partner-logo-5-alt}}" loading="lazy" src="{{slot:partner-logo-5}}"/>
</li>
<li class="lp-trust-minimal-centered__logo-item">
<img alt="{{slot:partner-logo-6-alt}}" loading="lazy" src="{{slot:partner-logo-6}}"/>
</li>
</ul>
</div>
</section>
