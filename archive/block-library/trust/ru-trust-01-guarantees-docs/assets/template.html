<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif;
    --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); }
  .trust { padding: 64px var(--spacing-lg); max-width: 1100px; margin: 0 auto; }
  .section-headline { font-family: var(--lp-font-display); font-size: 36px; text-align: center; margin: 0 0 48px; }
  .badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .badge { border: 1px solid var(--lp-border); border-radius: 12px; padding: 24px 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .badge-icon { width: 44px; height: 44px; border: 2px solid var(--lp-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color:#999; }
  .badge-title { font-family: var(--lp-font-display); font-size: 18px; font-weight: 700; margin: 0; }
  .badge-text { font-size: 13px; color:#555; margin: 0; line-height: 1.5; }
</style>
<section class="trust" data-block-id="ru-trust-01-guarantees-docs">
<h2 class="section-headline">{{slot:headline}}</h2>
<div class="badges">
<div class="badge">
<div class="badge-icon" data-slot-type="icon">{{slot:trust-1-icon}}</div>
<h3 class="badge-title">{{slot:trust-1-title}}</h3>
<p class="badge-text">{{slot:trust-1-text}}</p>
</div>
<div class="badge">
<div class="badge-icon" data-slot-type="icon">{{slot:trust-2-icon}}</div>
<h3 class="badge-title">{{slot:trust-2-title}}</h3>
<p class="badge-text">{{slot:trust-2-text}}</p>
</div>
<div class="badge">
<div class="badge-icon" data-slot-type="icon">{{slot:trust-3-icon}}</div>
<h3 class="badge-title">{{slot:trust-3-title}}</h3>
<p class="badge-text">{{slot:trust-3-text}}</p>
</div>
<div class="badge">
<div class="badge-icon" data-slot-type="icon">{{slot:trust-4-icon}}</div>
<h3 class="badge-title">{{slot:trust-4-title}}</h3>
<p class="badge-text">{{slot:trust-4-text}}</p>
</div>
</div>
</section>
