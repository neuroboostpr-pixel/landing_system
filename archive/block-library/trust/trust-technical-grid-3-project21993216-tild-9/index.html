<section class="lp-trust-technical-grid-3" aria-labelledby="lp-trust-technical-grid-3-title">
  <div class="lp-trust-technical-grid-3__inner">
    <div class="lp-trust-technical-grid-3__header">
      <p class="lp-trust-technical-grid-3__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-trust-technical-grid-3__title" id="lp-trust-technical-grid-3-title">{{slot:heading}}</h2>
      <p class="lp-trust-technical-grid-3__lead">{{slot:subhead}}</p>
    </div>

    <ul class="lp-trust-technical-grid-3__grid" aria-label="{{slot:list-label}}">
      <li class="lp-trust-technical-grid-3__card">
        <span class="lp-trust-technical-grid-3__icon" aria-hidden="true">{{slot:badge-1-icon}}</span>
        <div class="lp-trust-technical-grid-3__card-body">
          <h3 class="lp-trust-technical-grid-3__card-title">{{slot:badge-1-title}}</h3>
          <p class="lp-trust-technical-grid-3__card-text">{{slot:badge-1-text}}</p>
        </div>
      </li>

      <li class="lp-trust-technical-grid-3__card">
        <span class="lp-trust-technical-grid-3__icon" aria-hidden="true">{{slot:badge-2-icon}}</span>
        <div class="lp-trust-technical-grid-3__card-body">
          <h3 class="lp-trust-technical-grid-3__card-title">{{slot:badge-2-title}}</h3>
          <p class="lp-trust-technical-grid-3__card-text">{{slot:badge-2-text}}</p>
        </div>
      </li>

      <li class="lp-trust-technical-grid-3__card">
        <span class="lp-trust-technical-grid-3__icon" aria-hidden="true">{{slot:badge-3-icon}}</span>
        <div class="lp-trust-technical-grid-3__card-body">
          <h3 class="lp-trust-technical-grid-3__card-title">{{slot:badge-3-title}}</h3>
          <p class="lp-trust-technical-grid-3__card-text">{{slot:badge-3-text}}</p>
        </div>
      </li>
    </ul>
  </div>
</section>
