<style>.lp-trust-luxury-centered {
  color: var(--lp-text);
  background: var(--lp-bg);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
  font-family: var(--lp-font-body);
}

.lp-trust-luxury-centered__inner {
  width: min(100%, 1180px);
  margin: 0 auto;
  display: grid;
  justify-items: center;
  gap: var(--lp-spacing-md);
  text-align: center;
}

.lp-trust-luxury-centered__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-size: 0.78rem;
  line-height: 1.4;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-trust-luxury-centered__title {
  margin: 0;
  max-width: 11ch;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(3.6rem, 14vw, 10rem);
  font-weight: 500;
  line-height: 0.9;
  letter-spacing: 0;
}

.lp-trust-luxury-centered__caption {
  margin: 0;
  max-width: 680px;
  color: var(--lp-text-muted);
  font-size: clamp(1rem, 2vw, 1.25rem);
  line-height: 1.7;
}

.lp-trust-luxury-centered__list {
  width: 100%;
  margin: var(--lp-spacing-lg) 0 0;
  padding: var(--lp-spacing-sm) 0 0;
  list-style: none;
  display: grid;
  gap: var(--lp-spacing-sm);
  border-top: 1px solid var(--lp-border);
}

.lp-trust-luxury-centered__item {
  display: grid;
  gap: var(--lp-spacing-xs);
  padding: var(--lp-spacing-md);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg-alt);
}

.lp-trust-luxury-centered__value {
  color: var(--lp-accent);
  font-family: var(--lp-font-display);
  font-size: clamp(1.8rem, 5vw, 3rem);
  line-height: 1;
}

.lp-trust-luxury-centered__label {
  color: var(--lp-text-muted);
  font-size: 0.95rem;
  line-height: 1.5;
}

@media (min-width: 768px) {
  .lp-trust-luxury-centered {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-trust-luxury-centered__inner {
    gap: var(--lp-spacing-lg);
  }

  .lp-trust-luxury-centered__list {
    grid-template-columns: repeat(3, 1fr);
    gap: var(--lp-spacing-md);
  }

  .lp-trust-luxury-centered__item {
    padding: var(--lp-spacing-lg);
  }
}
</style>
<section aria-labelledby="lp-trust-luxury-centered-title" class="lp-trust-luxury-centered">
<div class="lp-trust-luxury-centered__inner">
<p class="lp-trust-luxury-centered__eyebrow">{{slot:eyebrow}}</p>
<h2 class="lp-trust-luxury-centered__title" id="lp-trust-luxury-centered-title">
      {{slot:heading}}
    </h2>
<p class="lp-trust-luxury-centered__caption">{{slot:caption}}</p>
<ul aria-label="{{slot:trust-list-label}}" class="lp-trust-luxury-centered__list">
<li class="lp-trust-luxury-centered__item">
<span class="lp-trust-luxury-centered__value">{{slot:stat-1-value}}</span>
<span class="lp-trust-luxury-centered__label">{{slot:stat-1-label}}</span>
</li>
<li class="lp-trust-luxury-centered__item">
<span class="lp-trust-luxury-centered__value">{{slot:stat-2-value}}</span>
<span class="lp-trust-luxury-centered__label">{{slot:stat-2-label}}</span>
</li>
<li class="lp-trust-luxury-centered__item">
<span class="lp-trust-luxury-centered__value">{{slot:stat-3-value}}</span>
<span class="lp-trust-luxury-centered__label">{{slot:stat-3-label}}</span>
</li>
</ul>
</div>
</section>
