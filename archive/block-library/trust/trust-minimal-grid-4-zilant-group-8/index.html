<section class="lp-trust-minimal-grid-4" aria-labelledby="lp-trust-minimal-grid-4-title">
  <div class="lp-trust-minimal-grid-4__inner">
    <div class="lp-trust-minimal-grid-4__header">
      <p class="lp-trust-minimal-grid-4__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-trust-minimal-grid-4__title" id="lp-trust-minimal-grid-4-title">{{slot:heading}}</h2>
      <p class="lp-trust-minimal-grid-4__text">{{slot:subhead}}</p>
    </div>

    <ul class="lp-trust-minimal-grid-4__list" aria-label="{{slot:logos-list-label}}">
      <li class="lp-trust-minimal-grid-4__item">
        <img src="{{slot:logo-1}}" alt="{{slot:logo-1-alt}}" loading="lazy">
      </li>
      <li class="lp-trust-minimal-grid-4__item">
        <img src="{{slot:logo-2}}" alt="{{slot:logo-2-alt}}" loading="lazy">
      </li>
      <li class="lp-trust-minimal-grid-4__item">
        <img src="{{slot:logo-3}}" alt="{{slot:logo-3-alt}}" loading="lazy">
      </li>
      <li class="lp-trust-minimal-grid-4__item">
        <img src="{{slot:logo-4}}" alt="{{slot:logo-4-alt}}" loading="lazy">
      </li>
    </ul>
  </div>
</section>
