<style>.lp-trust-minimal-grid-4 {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-trust-minimal-grid-4__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  margin: 0 auto;
  max-width: 1280px;
}

.lp-trust-minimal-grid-4__header {
  display: grid;
  gap: var(--lp-spacing-sm);
  max-width: 48rem;
}

.lp-trust-minimal-grid-4__eyebrow {
  color: var(--lp-accent);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.4;
  margin: 0;
}

.lp-trust-minimal-grid-4__title {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(1.75rem, 4vw, 3rem);
  line-height: 1.1;
  margin: 0;
}

.lp-trust-minimal-grid-4__text {
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.65;
  margin: 0;
}

.lp-trust-minimal-grid-4__list {
  display: grid;
  gap: var(--lp-spacing-sm);
  grid-template-columns: repeat(2, minmax(0, 1fr));
  list-style: none;
  margin: 0;
  padding: 0;
}

.lp-trust-minimal-grid-4__item {
  align-items: center;
  background: var(--lp-bg-alt);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  display: flex;
  justify-content: center;
  min-height: 5rem;
  padding: var(--lp-spacing-md);
}

.lp-trust-minimal-grid-4__item img {
  display: block;
  height: auto;
  max-height: 2.25rem;
  max-width: 100%;
  object-fit: contain;
}

@media (min-width: 768px) {
  .lp-trust-minimal-grid-4 {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-trust-minimal-grid-4__inner {
    align-items: center;
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  }

  .lp-trust-minimal-grid-4__list {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lp-trust-minimal-grid-4__item {
    min-height: 6rem;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section aria-labelledby="lp-trust-minimal-grid-4-title" class="lp-trust-minimal-grid-4">
<div class="lp-trust-minimal-grid-4__inner">
<div class="lp-trust-minimal-grid-4__header">
<p class="lp-trust-minimal-grid-4__eyebrow">{{slot:eyebrow}}</p>
<h2 class="lp-trust-minimal-grid-4__title" id="lp-trust-minimal-grid-4-title">{{slot:heading}}</h2>
<p class="lp-trust-minimal-grid-4__text">{{slot:subhead}}</p>
</div>
<ul aria-label="{{slot:logos-list-label}}" class="lp-trust-minimal-grid-4__list">
<li class="lp-trust-minimal-grid-4__item">
<img alt="{{slot:logo-1-alt}}" loading="lazy" src="{{slot:logo-1}}"/>
</li>
<li class="lp-trust-minimal-grid-4__item">
<img alt="{{slot:logo-2-alt}}" loading="lazy" src="{{slot:logo-2}}"/>
</li>
<li class="lp-trust-minimal-grid-4__item">
<img alt="{{slot:logo-3-alt}}" loading="lazy" src="{{slot:logo-3}}"/>
</li>
<li class="lp-trust-minimal-grid-4__item">
<img alt="{{slot:logo-4-alt}}" loading="lazy" src="{{slot:logo-4}}"/>
</li>
</ul>
</div>
</section>
