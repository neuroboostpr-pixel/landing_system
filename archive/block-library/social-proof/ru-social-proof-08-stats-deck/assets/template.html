<style>
  :root { --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0; --lp-bg-alt: #e8e8e8; --lp-font-display:'Playfair Display',Georgia,serif; --lp-font-body:'Inter Tight',system-ui,sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;1,400&display=swap');
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--lp-font-body); background:var(--lp-bg); color:var(--lp-text); }
  .stats-section { padding:80px 0; border-top:1px solid var(--lp-border); }
  .wrap { max-width:1200px; margin:0 auto; padding:0 64px; }
  .stats-head { margin-bottom:56px; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--lp-accent); display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .kicker::before { content:''; width:18px; height:1px; background:var(--lp-accent); }
  .section-title { font-size:clamp(32px,3.6vw,50px); font-weight:800; letter-spacing:-0.028em; max-width:28ch; }
  .section-title em { font-family:var(--lp-font-display); font-style:italic; font-weight:500; }
  .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--lp-border); border:1px solid var(--lp-border); }
  .stat-card { background:var(--lp-bg-alt); padding:32px 28px; display:flex; flex-direction:column; gap:12px; }
  .stat-card:nth-child(2n) { background:var(--lp-bg); }
  .stat-value { font-size:clamp(40px,4.5vw,64px); font-weight:800; letter-spacing:-0.04em; line-height:1; color:var(--lp-text); }
  .stat-value .accent { color:var(--lp-accent); }
  .stat-label { font-size:13px; color:rgba(21,20,15,0.6); line-height:1.4; font-weight:400; }
  .stat-desc { font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(21,20,15,0.35); }
</style>
<section class="stats-section" data-block-id="ru-social-proof-08-stats-deck">
<div class="wrap">
<div class="stats-head">
<div class="kicker">{{slot:kicker}}</div>
<h2 class="section-title">{{slot:section-title}}</h2>
</div>
<div class="stats-grid">
<div class="stat-card">
<div class="stat-value">{{slot:stat-value}}</div>
<div class="stat-label">{{slot:stat-1-label}}</div>
<div class="stat-desc">{{slot:stat-1-desc}}</div>
</div>
<div class="stat-card">
<div class="stat-value">{{slot:div-1}}</div>
<div class="stat-label">{{slot:stat-2-label}}</div>
<div class="stat-desc">{{slot:stat-2-desc}}</div>
</div>
<div class="stat-card">
<div class="stat-value">{{slot:div-2}}</div>
<div class="stat-label">{{slot:stat-3-label}}</div>
<div class="stat-desc">{{slot:stat-3-desc}}</div>
</div>
<div class="stat-card">
<div class="stat-value">{{slot:div-3}}</div>
<div class="stat-label">{{slot:stat-4-label}}</div>
<div class="stat-desc">{{slot:stat-4-desc}}</div>
</div>
</div>
</div>
</section>
