<style>
  /* Wireframe: ч/б, CSS-only, no external deps.
     CSS vars in :root are MANDATORY — block-composition/inject-tokens.py relies on these names. */
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif;
    --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background:var(--lp-bg); color: var(--lp-text); width: 375px; }
  .logos-section { padding: 32px 16px; text-align: center; }
  .section-headline { font-family: var(--lp-font-display); font-size: 14px; color:#888; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 24px; }
  .logos-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .logo-slot { background:#eee; border-radius: 4px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 9px; color:#bbb; filter: grayscale(100%); opacity: 0.6; }
</style>
<section class="logos-section" data-block-id="ru-social-proof-03-client-logos">

<div class="logos-grid">
<div class="logo-slot">{{slot:logo-1}}</div>

<div class="logo-slot">{{slot:logo-3}}</div>
<div class="logo-slot">{{slot:logo-4}}</div>

<div class="logo-slot">{{slot:logo-6}}</div>

</div>
</section>
