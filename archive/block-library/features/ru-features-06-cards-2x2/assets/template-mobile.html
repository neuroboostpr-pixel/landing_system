<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333;
    --lp-border: #e0e0e0; --lp-bg-alt: #e8e8e8;
    --lp-font-display: 'Playfair Display', Georgia, serif;
    --lp-font-body: 'Inter Tight', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; padding: 40px 16px; }
  .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--lp-accent); display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .kicker::before { content: ''; width: 14px; height: 1px; background: var(--lp-accent); }
  .section-title { font-size: 34px; font-weight: 800; letter-spacing: -0.028em; margin-bottom: 14px; line-height: 1.0; }
  .section-title em { font-family: var(--lp-font-display); font-style: italic; font-weight: 500; }
  .section-lead { font-size: 15px; line-height: 1.55; color: rgba(21,20,15,0.65); margin-bottom: 28px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { padding: 18px 16px 22px; background: var(--lp-bg-alt); border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(21,20,15,0.06); }
  .card-num { font-size: 18px; color: var(--lp-accent); font-style: italic; margin-bottom: 12px; }
  .card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
  .card p { font-size: 12px; color: rgba(21,20,15,0.6); line-height: 1.5; }
</style>
<section data-block-id="ru-features-06-cards-2x2">
<div class="kicker">{{slot:kicker}}</div>
<h2 class="section-title">{{slot:section-title}}</h2>
<p class="section-lead">{{slot:subhead}}</p>
<div class="cards">
<div class="card"><div class="card-num">01</div><h3>{{slot:card-1-title}}</h3><p>{{slot:card-1-desc}}</p></div>
<div class="card"><div class="card-num">02</div><h3>{{slot:card-2-title}}</h3><p>{{slot:card-2-desc}}</p></div>
<div class="card"><div class="card-num">03</div><h3>{{slot:card-3-title}}</h3><p>{{slot:card-3-desc}}</p></div>
<div class="card"><div class="card-num">04</div><h3>{{slot:card-4-title}}</h3><p>{{slot:card-4-desc}}</p></div>
</div>
</section>
