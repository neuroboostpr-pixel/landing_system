<style>
  :root { --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0; --lp-font-display:'Playfair Display',Georgia,serif; --lp-font-body:'Inter Tight',system-ui,sans-serif; --spacing-md:16px; --spacing-lg:32px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--lp-font-body); background:var(--lp-bg); color:var(--lp-text); }
  .about-section { padding:100px 0; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 64px; }
  .about-grid { display:grid; grid-template-columns:1.05fr 1fr; gap:80px; align-items:center; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--lp-accent); display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .kicker::before { content:''; width:18px; height:1px; background:var(--lp-accent); }
  .section-title { font-family:var(--lp-font-body); font-weight:800; font-size:clamp(38px,4.5vw,66px); line-height:1.0; letter-spacing:-0.028em; margin-bottom:24px; }
  .section-title em { font-family:var(--lp-font-display); font-style:italic; font-weight:500; }
  .section-lead { font-size:16px; line-height:1.6; color:rgba(21,20,15,0.7); margin-bottom:32px; max-width:44ch; }
  .btn-ghost { display:inline-flex; align-items:center; gap:10px; padding:12px 24px; border-radius:999px; background:transparent; color:var(--lp-text); font-family:var(--lp-font-body); font-size:14px; font-weight:500; text-decoration:none; border:1px solid var(--lp-border); cursor:pointer; }
  .about-art { position:relative; aspect-ratio:1/1; background:rgba(21,20,15,0.06); border:1px solid var(--lp-border); display:flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(21,20,15,0.3); border-radius:4px; }
  .footer-row { display:flex; align-items:center; gap:16px; margin-top:40px; color:rgba(21,20,15,0.45); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; border-top:1px solid var(--lp-border); padding-top:24px; }
</style>
<section class="about-section" data-block-id="ru-features-07-2col-split">
<div class="wrap">
<div class="about-grid">
<div class="about-copy">
<div class="kicker">{{slot:kicker}}</div>
<h2 class="section-title">{{slot:section-title}}</h2>
<p class="section-lead">{{slot:subhead}}</p>
<a class="btn-ghost" href="#about">{{slot:cta}}</a>
<div class="footer-row">
<span>{{slot:footnote}}</span>
</div>
</div>
<div class="about-art">{{slot:art-image}}</div>
</div>
</div>
</section>
