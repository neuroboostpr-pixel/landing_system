<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif;
    --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); }
  .features { padding: 64px var(--spacing-lg); max-width: 1100px; margin: 0 auto; }
  .section-headline { font-family: var(--lp-font-display); font-size: 36px; text-align: center; margin: 0 0 40px; }
  .bento { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 240px 240px; gap: 16px; }
  .bento-photo { grid-row: 1 / 3; background:var(--lp-bg); border: 1px solid var(--lp-border); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 11px; color:#888; text-transform: uppercase; }
  .bento-card { border: 1px solid var(--lp-border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
  .icon-placeholder { width: 40px; height: 40px; border: 2px solid var(--lp-border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color:#999; }
  .bento-title { font-family: var(--lp-font-display); font-size: 18px; font-weight: 700; margin: 0; }
  .bento-text { font-size: 14px; color:#555; margin: 0; line-height: 1.5; }
</style>
<section class="features" data-block-id="ru-features-02-bento-grid">
<h2 class="section-headline">{{slot:headline}}</h2>
<div class="bento">
<div class="bento-photo">{{slot:feature-photo}}</div>
<div class="bento-card">
<div class="icon-placeholder" data-slot-type="icon">{{slot:bento-1-icon}}</div>
<h3 class="bento-title">{{slot:bento-1-title}}</h3>
<p class="bento-text">{{slot:bento-1-text}}</p>
</div>
<div class="bento-card">
<div class="icon-placeholder" data-slot-type="icon">{{slot:bento-2-icon}}</div>
<h3 class="bento-title">{{slot:bento-2-title}}</h3>
<p class="bento-text">{{slot:bento-2-text}}</p>
</div>
</div>
<div class="bento" style="margin-top: 16px; grid-template-rows: 240px;">
<div class="bento-card">
<div class="icon-placeholder" data-slot-type="icon">{{slot:bento-3-icon}}</div>
<h3 class="bento-title">{{slot:bento-3-title}}</h3>
<p class="bento-text">{{slot:bento-3-text}}</p>
</div>
</div>
</section>
