<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif; --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; }
  .features { padding: 40px 20px; }
  .section-headline { font-family: var(--lp-font-display); font-size: 24px; text-align: center; margin: 0 0 32px; }
  .col { display: flex; flex-direction: row; align-items: flex-start; gap: 16px; margin-bottom: 28px; }
  .icon-placeholder { width: 48px; height: 48px; border: 2px solid var(--lp-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color:#999; flex-shrink: 0; }
  .col-text { flex: 1; }
  .feature-title { font-family: var(--lp-font-display); font-size: 17px; font-weight: 700; margin: 0 0 6px; }
  .feature-text { font-size: 14px; color:#555; margin: 0; line-height: 1.5; }
</style>
<section class="features" data-block-id="ru-features-01-3col-icons">
<h2 class="section-headline">{{slot:headline}}</h2>
<div class="col">
<div class="icon-placeholder" data-slot-type="icon">{{slot:feature-1-icon}}</div>
<div class="col-text">
<h3 class="feature-title">{{slot:feature-1-title}}</h3>
<p class="feature-text">{{slot:feature-1-text}}</p>
</div>
</div>
<div class="col">
<div class="icon-placeholder" data-slot-type="icon">{{slot:feature-2-icon}}</div>
<div class="col-text">
<h3 class="feature-title">{{slot:feature-2-title}}</h3>
<p class="feature-text">{{slot:feature-2-text}}</p>
</div>
</div>
<div class="col">
<div class="icon-placeholder" data-slot-type="icon">{{slot:feature-3-icon}}</div>
<div class="col-text">
<h3 class="feature-title">{{slot:feature-3-title}}</h3>
<p class="feature-text">{{slot:feature-3-text}}</p>
</div>
</div>
</section>
