<section class="lp-features-editorial-split" aria-labelledby="features-editorial-split-title">
  <div class="lp-features-editorial-split__inner">
    <div class="lp-features-editorial-split__content">
      <p class="lp-features-editorial-split__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-features-editorial-split__title" id="features-editorial-split-title">{{slot:heading}}</h2>
      <p class="lp-features-editorial-split__lead">{{slot:subhead}}</p>

      <ul class="lp-features-editorial-split__list" role="list">
        <li class="lp-features-editorial-split__item">
          <span class="lp-features-editorial-split__marker" aria-hidden="true"></span>
          <div class="lp-features-editorial-split__item-body">
            <h3 class="lp-features-editorial-split__item-title">{{slot:feature-1-title}}</h3>
            <p class="lp-features-editorial-split__item-text">{{slot:feature-1-text}}</p>
          </div>
        </li>
        <li class="lp-features-editorial-split__item">
          <span class="lp-features-editorial-split__marker" aria-hidden="true"></span>
          <div class="lp-features-editorial-split__item-body">
            <h3 class="lp-features-editorial-split__item-title">{{slot:feature-2-title}}</h3>
            <p class="lp-features-editorial-split__item-text">{{slot:feature-2-text}}</p>
          </div>
        </li>
        <li class="lp-features-editorial-split__item">
          <span class="lp-features-editorial-split__marker" aria-hidden="true"></span>
          <div class="lp-features-editorial-split__item-body">
            <h3 class="lp-features-editorial-split__item-title">{{slot:feature-3-title}}</h3>
            <p class="lp-features-editorial-split__item-text">{{slot:feature-3-text}}</p>
          </div>
        </li>
      </ul>

      <a class="lp-features-editorial-split__cta" href="{{slot:cta-url}}">{{slot:cta-label}}</a>
    </div>

    <figure class="lp-features-editorial-split__media">
      <picture>
        <source media="(max-width: 767px)" srcset="{{slot:image-mobile}}">
        <img src="{{slot:image}}" alt="{{slot:image-alt}}" loading="lazy">
      </picture>
      <figcaption class="lp-features-editorial-split__caption">{{slot:image-caption}}</figcaption>
    </figure>
  </div>
</section>
