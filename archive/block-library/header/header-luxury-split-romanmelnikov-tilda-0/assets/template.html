<style>.lp-header-luxury-split {
  width: 100%;
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  border-bottom: 1px solid var(--lp-border);
}

.lp-header-luxury-split__inner {
  width: min(100%, 1280px);
  margin: 0 auto;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--lp-spacing-sm);
}

.lp-header-luxury-split__brand {
  display: inline-flex;
  align-items: center;
  gap: var(--lp-spacing-xs);
  min-width: 0;
  color: var(--lp-text);
  text-decoration: none;
}

.lp-header-luxury-split__brand-mark {
  width: 0.75rem;
  height: 0.75rem;
  flex: 0 0 0.75rem;
  border: 1px solid var(--lp-accent);
  border-radius: 50%;
  background: transparent;
}

.lp-header-luxury-split__brand-text {
  font-family: var(--lp-font-display);
  font-size: 1rem;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.lp-header-luxury-split__nav {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--lp-spacing-xs) var(--lp-spacing-md);
  padding-top: var(--lp-spacing-xs);
  border-top: 1px solid var(--lp-border);
}

.lp-header-luxury-split__link,
.lp-header-luxury-split__contact {
  color: var(--lp-text-muted);
  text-decoration: none;
  font-size: 0.78rem;
  line-height: 1.3;
}

.lp-header-luxury-split__link:focus-visible,
.lp-header-luxury-split__contact:focus-visible,
.lp-header-luxury-split__cta:focus-visible,
.lp-header-luxury-split__brand:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 0.25rem;
}

.lp-header-luxury-split__link:hover,
.lp-header-luxury-split__contact:hover {
  color: var(--lp-accent);
}

.lp-header-luxury-split__actions {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--lp-spacing-sm);
}

.lp-header-luxury-split__contact {
  display: none;
}

.lp-header-luxury-split__cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 2.25rem;
  padding: 0 var(--lp-spacing-sm);
  border: 1px solid var(--lp-accent);
  border-radius: var(--lp-radius);
  color: var(--lp-accent);
  background: transparent;
  text-decoration: none;
  font-size: 0.78rem;
  line-height: 1.2;
  white-space: nowrap;
}

.lp-header-luxury-split__cta:hover {
  background: var(--lp-accent);
  color: var(--lp-bg);
}

@media (min-width: 768px) {
  .lp-header-luxury-split__inner {
    grid-template-columns: minmax(10rem, 1fr) auto minmax(10rem, 1fr);
    gap: var(--lp-spacing-lg);
    padding: var(--lp-spacing-sm) var(--lp-spacing-xl);
  }

  .lp-header-luxury-split__nav {
    grid-column: auto;
    justify-content: center;
    padding-top: 0;
    border-top: 0;
  }

  .lp-header-luxury-split__contact {
    display: inline-flex;
  }
}
</style>
<header aria-label="{{slot:header-aria-label}}" class="lp-header-luxury-split">
<div class="lp-header-luxury-split__inner">
<a aria-label="{{slot:brand-aria-label}}" class="lp-header-luxury-split__brand" href="{{slot:brand-link}}">
<span aria-hidden="true" class="lp-header-luxury-split__brand-mark"></span>
<span class="lp-header-luxury-split__brand-text">{{slot:brand-name}}</span>
</a>
<nav aria-label="{{slot:navigation-aria-label}}" class="lp-header-luxury-split__nav">
<a class="lp-header-luxury-split__link" href="{{slot:nav-link-1}}">{{slot:nav-label-1}}</a>
<a class="lp-header-luxury-split__link" href="{{slot:nav-link-2}}">{{slot:nav-label-2}}</a>
<a class="lp-header-luxury-split__link" href="{{slot:nav-link-3}}">{{slot:nav-label-3}}</a>
<a class="lp-header-luxury-split__link" href="{{slot:nav-link-4}}">{{slot:nav-label-4}}</a>
</nav>
<div class="lp-header-luxury-split__actions">
<a class="lp-header-luxury-split__contact" href="{{slot:contact-link}}">{{slot:contact-label}}</a>
<a class="lp-header-luxury-split__cta" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
</div>
</div>
</header>
