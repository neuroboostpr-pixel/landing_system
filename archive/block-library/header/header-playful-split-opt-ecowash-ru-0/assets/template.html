<style>.lp-header-playful-split {
  width: 100%;
  background: var(--lp-primary);
  color: var(--lp-bg);
  font-family: var(--lp-font-body);
}

.lp-header-playful-split__inner {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--lp-spacing-md);
  align-items: center;
  width: min(100%, 1280px);
  margin: 0 auto;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
}

.lp-header-playful-split__brand {
  display: inline-flex;
  min-width: 0;
  align-items: center;
  gap: var(--lp-spacing-sm);
  color: currentColor;
  text-decoration: none;
}

.lp-header-playful-split__logo {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  border-radius: var(--lp-radius);
  object-fit: contain;
  background: var(--lp-bg);
}

.lp-header-playful-split__brand-text {
  overflow: hidden;
  color: currentColor;
  font-family: var(--lp-font-display);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.lp-header-playful-split__nav {
  display: none;
}

.lp-header-playful-split__nav-link {
  color: currentColor;
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.2;
  text-decoration: none;
}

.lp-header-playful-split__nav-link:hover,
.lp-header-playful-split__nav-link:focus-visible {
  color: var(--lp-accent);
}

.lp-header-playful-split__actions {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--lp-spacing-xs);
}

.lp-header-playful-split__contact {
  display: none;
  color: currentColor;
  font-size: 0.95rem;
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
}

.lp-header-playful-split__cta {
  display: inline-flex;
  min-height: 40px;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--lp-accent);
  border-radius: var(--lp-radius-lg);
  padding: var(--lp-spacing-xs) var(--lp-spacing-sm);
  background: var(--lp-accent);
  color: var(--lp-text);
  font-size: 0.9rem;
  font-weight: 800;
  line-height: 1.1;
  text-align: center;
  text-decoration: none;
}

.lp-header-playful-split__cta:hover,
.lp-header-playful-split__cta:focus-visible {
  border-color: var(--lp-bg);
  background: var(--lp-bg);
  color: var(--lp-primary);
}

@media (min-width: 768px) {
  .lp-header-playful-split__inner {
    grid-template-columns: auto 1fr auto;
    padding: var(--lp-spacing-md) var(--lp-spacing-lg);
  }

  .lp-header-playful-split__nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--lp-spacing-md);
  }

  .lp-header-playful-split__contact {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
  }

  .lp-header-playful-split__actions {
    gap: var(--lp-spacing-sm);
  }

  .lp-header-playful-split__cta {
    padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  }
}
</style>
<header aria-label="{{slot:header-aria-label}}" class="lp-header-playful-split">
<div class="lp-header-playful-split__inner">
<a aria-label="{{slot:brand-aria-label}}" class="lp-header-playful-split__brand" href="{{slot:brand-link}}">
<img alt="{{slot:brand-logo-alt}}" class="lp-header-playful-split__logo" loading="lazy" src="{{slot:brand-logo}}"/>
<span class="lp-header-playful-split__brand-text">{{slot:brand-name}}</span>
</a>
<nav aria-label="{{slot:nav-aria-label}}" class="lp-header-playful-split__nav">
<a class="lp-header-playful-split__nav-link" href="{{slot:nav-link-1-url}}">{{slot:nav-link-1-label}}</a>
<a class="lp-header-playful-split__nav-link" href="{{slot:nav-link-2-url}}">{{slot:nav-link-2-label}}</a>
<a class="lp-header-playful-split__nav-link" href="{{slot:nav-link-3-url}}">{{slot:nav-link-3-label}}</a>
<a class="lp-header-playful-split__nav-link" href="{{slot:nav-link-4-url}}">{{slot:nav-link-4-label}}</a>
</nav>
<div class="lp-header-playful-split__actions">
<a class="lp-header-playful-split__contact" href="{{slot:contact-link}}">{{slot:contact-label}}</a>
<a class="lp-header-playful-split__cta" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
</div>
</div>
</header>
