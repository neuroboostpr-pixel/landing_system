<!-- Parallax hero — minimal markup. Drop into a page or paste into a PHP block-part.
     Make sure parallax.css and parallax.js are enqueued. -->
<section class="lp-hero" data-parallax-hero aria-label="Hero">
  <div class="lp-hero__layer lp-hero__layer--bg" aria-hidden="true"></div>
  <div class="lp-hero__layer lp-hero__layer--far" aria-hidden="true"></div>

  <div class="lp-hero__title" aria-hidden="true">HERO</div>

  <div class="lp-hero__layer lp-hero__layer--subject" aria-hidden="true"></div>
  <div class="lp-hero__layer lp-hero__layer--near" aria-hidden="true"></div>

  <div class="lp-hero__content">
    <h1 class="lp-hero__h1">Headline goes here</h1>
    <p class="lp-hero__sub">Supporting subhead, one or two sentences.</p>
    <a class="btn btn-primary" href="#cta">CTA</a>
  </div>
</section>
