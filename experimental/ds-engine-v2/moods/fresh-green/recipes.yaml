# Fresh-green mood — RECIPES (приёмы коллажа/декора)
#
# ВИД снят ГЛАЗАМИ с ___References/29/ (01,02,04.jpg — вебинар по нутрициологии).
# Читает АГЕНТ при этапе 07c (compose), НЕ код. Рецепт направляет руку агента —
# не рендерится генератором.
#
# ЧТО ЗДЕСЬ ЕСТЬ: только приёмы «как этот мод делает красоту» (декор/зоны/маски/
#   разделители/акценты), в терминах lp-классов и токенов из palette.css/typography.css.
# ЧЕГО ЗДЕСЬ НЕТ: текстов, слотов, «какие блоки» — это даёт ПРОТОТИП (prototype-NN.yaml).
#   Поэтому recipes переносится на любой проект на fresh-green без изменений.
#
# Правило трёх источников: вид=recipes/референс · структура=прототип · красота=правила коллажа.
# Слот-контракт 08 (block-template-format.md) агент ОБЯЗАН сохранить: {{slot:name}},
#   один <section class="lp-..."> на блок, предсказуемые lp-классы.

meta:
  mood: fresh-green
  ref: "___References/29/ (01,02,04.jpg)"
  character: "свежий, светлый, здоровье/природа; 2 акцента: зелёный (база) + пинк (CTA), золото вторичное"
  reader: agent            # читает агент, не build_composed.py
  stage: "07c"

# ─────────────────────────── ПРИЁМЫ ───────────────────────────
recipes:

  - id: hero_layout
    title: "КАРТА ЗОН hero — светлый, фигура СПРАВА в маске (реф 29)"
    analysis: "Заполнять по _REFERENCE-ANALYSIS-LOGIC.md (роли зон ← реф, смыслы ← прототип, без дубля). Геометрия — Г1–Г5 того же файла."
    intent: >
      Hero реф 29: текст СЛЕВА (коридор), фигура (врач/эксперт) СПРАВА в круглой органик-маске.
      Светлый фон, italic-акцент в заголовке, pink-CTA. НЕ тёмный, НЕ контурный гигант.
    zones:
      figure: {pos: "ПРАВЫЙ коридор, круглая органик-маска", role: "фото в маске с белой обводкой (Г5: пропорции)"}
      text_col: {pos: "ЛЕВЫЙ коридор, поток сверху вниз", items: "badges → H1(accent-слово italic) → lead → фишки → pink-CTA"}
      anchor: {style: "ключевое слово italic-зелёным; контурного гиганта НЕТ"}
      decor: {pos: "по пустотам, в своей зоне (Г3)", style: "золотые точки, листья; волны — между секциями, не в hero"}
      badge: {pos: "на фигуре намеренно (Г2), читаемый", style: "белая pill-плашка"}
    layout: "2 коридора: левый текст (шире) + правый фигура-маска. Декор — абсолют в границах зоны (Г3). Фигура без деформации (Г5)."
    when_to_use: "hero. Левый коридор — поток. CTA pink. Контур-гигант НЕ использовать."

  - id: block_divider
    title: "Волнистый разделитель секций (КЛЮЧЕВОЙ приём мода)"
    intent: "Переход между блоками — НЕ прямая линия, а зелёная волна (как на реф 29 между hero и green-zone)."
    lp_class: "lp-wave-divider"
    css_hint: >
      Инлайн-SVG <path> волной во всю ширину, fill=var(--lp-surface-2) (зелёный).
      Кладётся встык между секциями. Вариант top (волна сверху зоны) и bottom (снизу).
      Высота 60–120px, тянется по ширине (preserveAspectRatio="none").
    tokens: ["--lp-surface-2"]
    when_to_use: "Каждый переход к/от зелёной акцент-зоны. Минимум 1 пара на лендинг."

  - id: section_bg_rhythm
    title: "Смена фона секций (ритм, П2)"
    intent: "Фон чередуется: белый (--lp-surface) ↔ тёплый (--lp-bg) ↔ зелёная зона (--lp-surface-2). Зелёные зоны = accent_band-якоря между светлыми. Не все секции одним фоном."
    lp_class: "чередование на <section>"
    css_hint: "Светлые секции — surface/bg попеременно; 1–2 зелёные зоны (accent_zone) как яркие якоря."
    tokens: ["--lp-surface", "--lp-bg", "--lp-surface-2"]
    when_to_use: "Все секции. Зелёные зоны держат яркость (П2)."

  - id: accent_zone
    title: "Сочно-зелёная акцент-зона, обёрнутая волнами"
    intent: "Важный блок (форма/CTA/процесс) выносится на зелёную заливку, сверху+снизу — волны. Контраст со светлыми зонами."
    lp_class: "lp-green-zone"
    css_hint: >
      background:var(--lp-surface-2); текст белый (var(--lp-text-on-dark)).
      Карточки/инпуты внутри — белые (var(--lp-surface)) со скруглением 16–28px.
      Чипы/подложки — полупрозрачный белый (var(--lp-overlay)).
      Сверху lp-wave-divider top, снизу lp-wave-divider bottom.
    tokens: ["--lp-surface-2", "--lp-text-on-dark", "--lp-surface", "--lp-overlay"]
    when_to_use: "1–2 блока за лендинг — не все. Иначе теряется контраст светлое/зелёное."

  - id: cta
    title: "Пинк-кнопка CTA (не зелёная!)"
    intent: "Целевое действие — всегда ПИНК, чтобы выделяться и на белом, и на зелёном. Зелёный — это база, не CTA."
    lp_class: "lp-cta-btn"
    css_hint: >
      background:var(--lp-cta); color:var(--lp-on-cta); border-radius:40px (пилюля);
      padding ~16px 34px; мягкая тень розового оттенка; hover → var(--lp-cta-2) + lift.
    tokens: ["--lp-cta", "--lp-on-cta", "--lp-cta-2"]
    when_to_use: "Любая главная кнопка действия (hero CTA, форма, мини-план)."

  - id: headline_anchor
    title: "Italic-акцент на ключевом слове заголовка"
    intent: "Во второй строке/ключевом слове H1-H2 — рукописно-курсивный playfair, цвет зелёный или золото (как «за консультацию», «о проекте» на реф 29)."
    lp_class: "lp-accent-italic"
    css_hint: >
      font-family Playfair italic; color:var(--lp-accent) (зелёный) ИЛИ var(--lp-gold) (золото)
      для подарочно-эмоциональных блоков. Только на ОДНО ключевое слово/фразу, не на весь заголовок.
    tokens: ["--lp-accent", "--lp-gold"]
    when_to_use: "H1 hero (акцент-слово прототипа), H2 секций. Один акцент на заголовок."

  - id: mask
    title: "Круглая маска-аватар в зелёном кольце"
    intent: "Фото людей/еды — в КРУГЕ с зелёной обводкой-кольцом (как ряд экспертов «Кому стоит» на реф 29)."
    lp_class: "lp-circle-mask"
    css_hint: >
      border-radius:50%; обводка 3–5px var(--lp-accent) ИЛИ кольцо var(--lp-accent-soft);
      опционально лёгкая тень. Для рядов аватаров — равный размер, gap.
    tokens: ["--lp-accent", "--lp-accent-soft"]
    when_to_use: "Аватары экспертов/кейсов/команды, иконки-кружки фич."

  - id: void_decor
    title: "Природный декор по пустотам + золото"
    intent: "Пустые углы/поля заполняются природными элементами (колоски, листья, овощи-вырезы) и/или золотыми точками-конфетти. Лёгкость, «здоровье»."
    lp_class: "lp-void-decor"
    css_hint: >
      position:absolute, низкий z-index, opacity .5–.9. SVG-листья/колоски var(--lp-accent)/var(--lp-gold);
      или мелкие золотые ромбы/кружки (var(--lp-gold)) рассыпью у акцент-зон.
      НЕ перекрывать текст — только по пустотам, согласованно с композицией.
    tokens: ["--lp-accent", "--lp-gold", "--lp-accent-soft"]
    when_to_use: "Углы hero, поля green-zone, фон за крупными объектами."

  - id: list_marker
    title: "Маркер списка — зелёная галка/точка"
    intent: "Пункты-выгоды/фишки с зелёным маркером (галка в мягком кружке). Нейтральные пункты — простая точка."
    lp_class: "lp-tick"
    css_hint: >
      Кружок var(--lp-accent-soft) + галка var(--lp-accent) внутри (важное);
      или маленькая точка var(--lp-accent) (нейтральное). Размер ~22px.
    tokens: ["--lp-accent", "--lp-accent-soft"]
    when_to_use: "Списки фич/выгод (gains). Боли (pains) — нейтральный маркер (точка/контур)."

  - id: card_panel
    title: "Белая карточка-панель с мягкой тенью"
    intent: "Карточки/панели на светлом фоне — белые, сильно скруглённые, воздушная тень (без жёстких рамок-коробок)."
    lp_class: "lp-card"
    css_hint: >
      background:var(--lp-surface); border-radius:20–28px; box-shadow мягкая зелёно-серая;
      без border (или 1px var(--lp-border)). На зелёной зоне — те же белые карточки.
    tokens: ["--lp-surface", "--lp-border"]
    when_to_use: "stats-карточки, панели болей/выгод, форматы, кейсы."

# ─────────────────────── ЗАМЕТКИ ПО ПРИМЕНЕНИЮ ───────────────────────
notes:
  - "Контраст-ритм: светлая зона → зелёная акцент-зона (с волнами) → светлая. Не делать всё зелёным."
  - "Пинк ТОЛЬКО на CTA. Зелёный — база/акцент-зоны. Золото — italic-слова, декор, эмоц. блоки (подарки)."
  - "Italic-акцент — на ОДНО ключевое слово заголовка (берётся accent_word из прототипа, если задан)."
  - "Все приёмы — обёртка вокруг слот-структуры прототипа, НЕ замена. Текст всегда в {{slot:name}}."
