# Grooming mood — RECIPES (приёмы коллажа/декора)
#
# ВИД снят ГЛАЗАМИ с ___References/01/ (02,04,05,08.png — груминг-салон «Пёс и Ко»).
# Читает АГЕНТ при этапе 07c (compose), НЕ код. Рецепт направляет руку агента.
#
# ЧТО ЕСТЬ: только приёмы «как мод делает красоту», в терминах lp-классов + токенов.
# ЧЕГО НЕТ: текстов, слотов, «какие блоки» — это даёт ПРОТОТИП. Переносится без изменений.
# 08-формат: реальный текст в семантических тегах (h1/p/li/a), один <section class="lp-...">
#   на блок — 08 извлекает поля Lazy Blocks из текста сам.

meta:
  mood: grooming
  ref: "___References/01/ (02,04,05,08.png)"
  character: "светлый editorial, тёплый беж, воздушно; оранж #DF6B2C ТОЧЕЧНО (акцент-вкрапление, не зона); фото в скруглённых блоках/кругах, тонкие дуги-линии, много белого"
  reader: agent
  stage: "07c"

recipes:

  - id: hero_layout
    title: "КАРТА ЗОН hero — editorial, фигура СПРАВА в круге (реф 01)"
    analysis: "Заполнять по _REFERENCE-ANALYSIS-LOGIC.md (роли зон ← реф, смыслы ← прототип, без дубля). Геометрия — Г1–Г5 того же файла."
    intent: >
      Hero реф 01: текст СЛЕВА (коридор), фигура животного/субъекта СПРАВА в круге-подложке
      (оранжевый круг за фото-squircle). Воздушно, много белого. НЕ тёмный коллаж.
    zones:
      figure: {pos: "ПРАВЫЙ коридор, в круге-подложке", role: "фото-squircle на оранж-круге"}
      text_col: {pos: "ЛЕВЫЙ коридор, поток сверху вниз", items: "eyebrow → H1(accent-слово оранж) → lead → фишки → CTA"}
      anchor: {style: "акцент-слово оранж ИЛИ росчерк; контурного гиганта НЕТ (editorial, не дисплей)"}
      decor: {pos: "по пустотам/углам, в своей зоне (Г3)", style: "тонкие дуги, редкие оранж-точки"}
      badge: {pos: "на фигуре намеренно (Г2), читаемый", style: "белая плашка"}
    layout: "2 коридора: левый текст (шире) + правый фигура. Декор — абсолют в границах зоны (Г3). Фигура без деформации (Г5)."
    when_to_use: "hero. Левый коридор — поток. Контур-гигант НЕ использовать (характер мягкий)."

  - id: block_divider
    title: "Воздушный переход: тонкая дуга / много белого (НЕ заливка, НЕ волна)"
    intent: "Между блоками — НЕ цветная зона, а воздух: тонкая оранжевая дуга-линия или окружность по краю + крупные отступы. Глубина за счёт лёгкости, как реф 01/08 (тонкие дуги на полях)."
    lp_class: "lp-arc-divider"
    css_hint: >
      Inline-SVG дуга/окружность: stroke var(--lp-accent) ИЛИ var(--lp-border-strong), fill none,
      stroke-width 1–1.5px, opacity .4–.7. Position absolute по краю/углу. Между секциями — большие
      вертикальные отступы (var(--lp-bg) везде), без цветных полос.
    tokens: ["--lp-accent", "--lp-border-strong", "--lp-bg"]
    when_to_use: "Переходы между секциями. Декор-дуги — по 1–2 на блок, по пустотам."

  - id: accent_zone
    title: "Оранжевый круг-подложка под фигурой (точечно)"
    intent: "Акцент не заливкой зоны, а КРУГОМ: фигура животного/объекта частично на большом оранжевом круге — как hero реф 01/02,01/08. Оранж появляется пятном, не фоном секции."
    lp_class: "lp-accent-circle"
    css_hint: >
      Большой круг background:var(--lp-accent) (или gradient к --lp-accent-2), border-radius:50%,
      position absolute за/под фигурой. Фон секции остаётся светлым (var(--lp-bg)).
    tokens: ["--lp-accent", "--lp-accent-2", "--lp-bg"]
    when_to_use: "hero (под фигурой), 1 сильный визуальный блок. Не повторять часто."

  - id: accent_band
    title: "Полноширинная ОРАНЖЕВАЯ зона-якорь (держит яркость лендинга)"
    intent: >
      Минимум одна секция/полоса во всю ширину залита оранжевым (var(--lp-accent)),
      текст белый — как активный FAQ реф 01/14 или CTA-зона. Это крупное яркое пятно,
      «цепляющее глаз». Без него лендинг пресный даже с мелкими акцентами (см. П2).
    lp_class: "lp-accent-band (full-bleed)"
    css_hint: >
      Секция full-bleed background:var(--lp-accent); текст/заголовки #fff; CTA внутри —
      белая кнопка с оранж-текстом (инверсия). Скругления крупные. 1–2 раза за лендинг.
    tokens: ["--lp-accent"]
    when_to_use: "CTA-зона перед футером, активный FAQ, выделенный блок. Не каждую секцию."

  - id: section_bg_rhythm
    title: "Смена фона секций (ритм, П2)"
    intent: "Фон секций чередуется: белый (--lp-surface) ↔ тёплый беж (--lp-bg) ↔ светло-серый (--lp-surface-2). Не все секции одним фоном."
    lp_class: "чередование на <section>"
    css_hint: "Соседние секции — разный фон из 3 тонов. Перед/после accent_band — светлый."
    tokens: ["--lp-surface", "--lp-bg", "--lp-surface-2"]
    when_to_use: "Все секции. Чередовать тон, чтобы был ритм."

  - id: cta
    title: "Оранжевая кнопка-пилюля (или круглая в hero)"
    intent: "Действие — оранж. Hero-CTA может быть КРУГЛОЙ кнопкой внутри оранжевого круга («Записаться онлайн» реф 01/02); прочие — пилюля."
    lp_class: "lp-cta-btn"
    css_hint: >
      background:var(--lp-accent); color:var(--lp-on-accent) (белый); border-radius:40px пилюля
      ИЛИ 50% круг для hero. Мягкая тёплая тень. hover → var(--lp-accent-dark)+lift.
    tokens: ["--lp-accent", "--lp-on-accent", "--lp-accent-dark"]
    when_to_use: "Главные CTA. Круглый вариант — hero."

  - id: headline_anchor
    title: "Заголовок El Messiri + оранжевый росчерк/слово"
    intent: "Крупный засечный El Messiri графитом; ключевое слово — оранж (var(--lp-accent)) ИЛИ оранжевое подчёркивание-росчерк под словом. Как «Груминг кошек и собак» реф 01/02."
    lp_class: "lp-accent-word / lp-underline-stroke"
    css_hint: >
      Акцент-слово: color:var(--lp-accent). ИЛИ росчерк: SVG-линия/кисть под словом,
      stroke var(--lp-accent), небрежная. Только ОДНО ключевое слово.
    tokens: ["--lp-accent"]
    when_to_use: "H1 hero (accent_word прототипа), H2 секций. Один акцент."

  - id: mask
    title: "Фото в мягко-скруглённом блоке (squircle), точки-маркеры"
    intent: "Фото — НЕ прямоугольник, а скруглённый блок/squircle или круг (реф 01/02,01/08). На фото — мелкие белые точки-маркеры (○) как поинты внимания."
    lp_class: "lp-photo-squircle"
    css_hint: >
      border-radius:32px (squircle) ИЛИ 50% круг; object-fit cover. Опц. белая обводка
      var(--lp-surface) 5px + мягкая тень. Точки: малые круги var(--lp-surface) с тенью поверх фото.
    tokens: ["--lp-surface"]
    when_to_use: "hero-фигура, фото кейсов/команды, до/после."

  - id: void_decor
    title: "Тонкие дуги/окружности + редкие оранжевые точки"
    intent: "Декор пустот — лёгкие линии-дуги, окружности, изредка оранжевая точка/лапка. Воздух, не плотный коллаж. Как поля реф 01/08."
    lp_class: "lp-arc / lp-dot"
    css_hint: >
      SVG-дуги/круги stroke var(--lp-border-strong)/var(--lp-accent) fill none, opacity .4–.7.
      Точки: малый круг var(--lp-accent) opacity .6. Низкий z-index, по углам/полям, не на тексте.
    tokens: ["--lp-border-strong", "--lp-accent"]
    when_to_use: "Углы hero, поля секций, фон за цифрами/карточками. Сдержанно."

  - id: list_marker
    title: "Маркер списка — оранжевая точка/галка (тонко)"
    intent: "Пункты — небольшая оранжевая точка или тонкая галка. Сдержанно, в тон editorial."
    lp_class: "lp-tick"
    css_hint: >
      Кружок var(--lp-accent-soft) + галка var(--lp-accent) (важное);
      или малая точка var(--lp-accent) (нейтральное). ~22px, лёгкий.
    tokens: ["--lp-accent", "--lp-accent-soft"]
    when_to_use: "Списки выгод/фич. Нейтральные пункты — простая точка."

  - id: card_panel
    title: "Белые карточки + ОДНА сплошная оранжевая (featured) в сетке"
    intent: >
      Карточки — белые (var(--lp-surface)), скруглённые, тёплая тень, без жёстких границ.
      В КАЖДОЙ сетке ОДНА карточка — featured: сплошная оранжевая заливка (var(--lp-accent)),
      белый текст — как «Маникюр и уход за лапами» реф 01/09. Это главный акцент editorial-сеток.
      Круглая оранж-кнопка-стрелка в углу карточек (реф 01/06,09).
    lp_class: "lp-card / lp-card--featured / lp-card-arrow"
    css_hint: >
      base: background:var(--lp-surface); border-radius:24–28px; мягкая тень; без border.
      featured: background:var(--lp-accent); color:#fff (заголовок/текст белые); та же геометрия.
      arrow: круглая кнопка var(--lp-accent), белая стрелка ↗, в углу карточки.
    tokens: ["--lp-surface", "--lp-accent"]
    when_to_use: "stats, форматы, кейсы, trust. В сетке из N карточек — ровно одна featured."

notes:
  - "Оранж — ТОЧЕЧНО: акцент-слово, CTA, круг-подложка, маркеры, тонкие дуги. НИКОГДА не заливка целой секции."
  - "Фон секций всегда светлый (беж/белый). Глубина — воздухом, скруглениями и дугами, не тёмными зонами."
  - "Фото — скруглённые блоки/круги, не прямоугольники. Точки-маркеры (○) поверх — фирменная деталь."
  - "Все приёмы — обёртка вокруг семантики (h1/p/li). Текст реальный, 08 извлекает из тегов."
