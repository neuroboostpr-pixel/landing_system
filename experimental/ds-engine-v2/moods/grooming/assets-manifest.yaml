meta:
  mood: grooming
  ref: ___References/01/ (02–15.png, все 14 экранов)
  snyato: глазами, Шаг 0
assets:
- id: page-bg
  нужен: true
  роль_где: фон страницы — тёплый беж база
  источник: снят-с-рефа (палитра 01/05.png) → CSS-токен
  формат: CSS
  размеры: —
  слой_поведение: нижний; стабилен
  слот: var(--lp-bg)
  статус: готов
  режим: —
  бриф: 'заливка var(--lp-bg) #F4F2EF. Без изображения.'
- id: section-bg-rhythm
  нужен: true
  роль_где: 'смена фона секций: светлый ↔ ПОЛНОШИРИННАЯ ОРАНЖ-ЗОНА ↔ светлый (01/10,01/15)'
  источник: снят-с-рефа 01/10,01/15 → CSS-токены
  формат: CSS
  размеры: —
  слой_поведение: фон секции (Г7); стабилен
  слот: класс .gr-bg-* / .gr-accent-band
  статус: готов
  режим: —
  бриф: чередование светлых тонов + 1–2 полноширинные оранж-зоны (accent_band).
- id: section-bg-photo
  нужен: optional
  роль_где: полноширинное фоновое ФОТО в финальной/CTA-секции (на рефе 01/15 — атмосферный кадр на закате)
  источник: снят-с-рефа 01/15 → клиентское ИЛИ генерится
  формат: JPG/PNG
  размеры: ≥1920w ×2; cover; фокус по центру не режется (Г7)
  слой_поведение: фон секции, нижний z; затемнение для читаемости (Г7); стабилен
  слот: '{{bg:section-photo}}'
  статус: заглушка
  режим: single
  бриф: 'ПОДРОБНО. Тёплое атмосферное фото на закате/мягком свете, субъект и сцена — из ниши проекта (market-profile).
    Золотой час, размытый задний план, тёплая гамма под беж-оранж палитру. Горизонталь, фокус-субъект
    по центру/трети. Без текста. Под затемнение оверлеем.

    '
  промпт: Тёплое атмосферное фото на закате, золотой час, мягкий рассеянный свет. {субъект из ниши}. Размытый
    задний план (боке), тёплая бежево-оранжевая гамма. Горизонтальный кадр 1920x1080, фокус-субъект по
    правилу третей. Фотореализм. Без текста и логотипов.
- id: page-sweep
  нужен: true
  роль_где: СКВОЗНАЯ оранж-нить/дуга через экраны (Г8) — подтверждено 01/03,07,10,13,15
  источник: снят-с-рефа 01/03,07,10,13,15
  формат: SVG
  размеры: viewBox растяжимый по высоте; stroke ~1.5px; opacity .18–.4
  слой_поведение: page-level, нижний z, pointer-events:none, СТАБИЛЕН (не reveal)
  слот: '{{decor:page-sweep}}'
  статус: заглушка
  режим: single
  бриф: 'СРЕДНЕ. Тонкая непрерывная оранж-линия (var(--lp-accent)), живой плавный изгиб с лёгкими завитками,
    идёт сквозь весь лендинг связывая секции. Постоянная толщина ~1.5px, НЕ машинная синусоида — как от
    руки. Прозрачный фон.

    '
  промпт: Одна тонкая непрерывная линия-нить, плавный волнистый изгиб с лёгкими завитками, идёт сверху
    вниз через всю композицию. Нарисована от руки, постоянная толщина, не машинная синусоида. Только линия,
    прозрачный фон, без цвета (контур).
- id: scribble-accent
  нужен: true
  роль_где: росчерк-кисть у акцент-слова заголовков (01/09,10,12,13,15)
  источник: снят-с-рефа 01/09,10,12,13,15
  формат: SVG
  размеры: viewBox под слово; высота .4–.6em
  слой_поведение: у текста заголовка; СТАБИЛЕН (не reveal)
  слот: '{{decor:scribble-N}}'
  статус: заглушка
  режим: batch-series
  бриф: 'СРЕДНЕ. ЖИВЫЕ мазки маркером, оранж, ПЕРЕМЕННАЯ толщина (нажим), РАЗНЫЕ формы — снято с рефа:
    (1) подчёркивание прямое, (2) завиток с петлёй [01/10], (3) стрелка-черта с заострением [01/13], (4)
    волнистое подчёркивание [01/12]. Небрежные, как от руки. Прозрачный фон. Набор 4 вариаций.

    '
  промпт: 'Набор из 4 рукописных мазков-подчёркиваний маркером: (1) прямое, (2) с петлёй, (3) стрелка-черта
    с заострением, (4) волнистое. Переменная толщина (имитация нажима), небрежные, живые. На прозрачном
    фоне, без цвета (силуэт мазка).'
- id: arc-circle
  нужен: true
  роль_где: тонкие дуги/окружности по полям секций (01/08,10,13,14 — углы)
  источник: снят-с-рефа 01/08,10,13,14
  формат: SVG
  размеры: viewBox 0 0 200 200; stroke 1px; opacity .4
  слой_поведение: декор в границах секции (Г3); СТАБИЛЕН
  слот: '{{decor:arc}}'
  статус: заглушка
  режим: batch-series
  бриф: СРЕДНЕ. Тонкая незамкнутая окружность/дуга оранж, толщина 1px, opacity .4. 3–4 варианта.
  промпт: Набор из 4 тонких незамкнутых дуг и окружностей, нарисованных от руки, постоянная толщина линии.
    Прозрачный фон, без цвета (контур).
- id: blob-soft
  нужен: true
  роль_где: мягкие оранж-блобы/завитки на фоне ОРАНЖ-зон (01/15 — CTA)
  источник: снят-с-рефа 01/15
  формат: SVG
  размеры: крупные, viewBox свободный; тон чуть светлее/темнее зоны, low contrast
  слой_поведение: фон оранж-зоны, под контентом; СТАБИЛЕН
  слот: '{{decor:blob}}'
  статус: заглушка
  режим: batch-series
  бриф: 'СРЕДНЕ. Крупные мягкие органические завитки/пятна, тон в тон оранж-зоны (чуть светлее/темнее),
    низкий контраст — фактура фона, не акцент. Плавные, текучие. 2–3 формы. Прозрачный фон.

    '
  промпт: 2-3 крупные мягкие органические формы-кляксы, плавные текучие края. Сплошная заливка, прозрачный
    фон, без цвета (силуэт формы).
- id: outline-number
  нужен: optional
  роль_где: крупная КОНТУРНАЯ цифра на фоне (01/10 — «2»)
  источник: снят-с-рефа 01/10
  формат: SVG ИЛИ CSS-текст (контур)
  размеры: гигант, opacity .15–.3, за контентом
  слой_поведение: декор-фон секции; СТАБИЛЕН
  слот: '{{decor:outline-num}}'
  статус: заглушка
  режим: single
  бриф: СРЕДНЕ. Большая контурная цифра (этап/счёт), оранж stroke, прозрачная заливка, низкий opacity.
  промпт: Большая цифра контуром (только обводка, прозрачная заливка), тонкая линия. Прозрачный фон, без
    цвета.
- id: corner-glyph
  нужен: optional
  роль_где: мелкие геом-значки в углах карточек (01/13)
  источник: снят-с-рефа 01/13
  формат: SVG
  размеры: viewBox 0 0 24 24; opacity .3
  слой_поведение: декор карточки; стабилен
  слот: '{{decor:corner-glyph}}'
  статус: заглушка
  режим: batch-sheet
  бриф: КРАТКО. Мелкие геом-узоры (квадратики/точки-сетка) оранж low-opacity в углах карточек. 4-6 на
    листе.
  промпт: Набор 4-6 мелких геометрических узоров (сетка точек, квадратики, штрихи) одной толщиной линии.
    Прозрачный фон, без цвета (контур).
- id: hero-figure
  нужен: true
  роль_где: фигура-вырез субъекта в hero + по экранам (01/02,03,08,10,15)
  источник: снят-с-рефа (фигуры-вырезы субъекта) → клиентское/генерится
  формат: PNG-прозрачный
  размеры: ≥1200px по высоте ×2; фон прозрачный; пропорции родные (Г5)
  слой_поведение: контент, зона фигуры; reveal допустим
  слот: '{{figure:hero}}'
  статус: заглушка (photo.png)
  режим: single
  бриф: 'ПОДРОБНО. Субъект ниши крупно, вырезан по контуру (фон прозрачный), фронтальный ракурс, мягкий
    студийный свет, тёплая обработка под беж-оранж. Голова не обрезана сверху, низ под край.

    '
  промпт: '{субъект из ниши}, крупный план по пояс, вырезан по контуру на прозрачном фоне (без фона).
    Фронтальный ракурс, взгляд в камеру, мягкий студийный свет, тёплая бежевая обработка. Голова не обрезана
    сверху, низ уходит под край кадра. Фотореализм.'
- id: feature-icons
  нужен: true
  роль_где: оранж-иконки фич в карточках (на рефе 01/10 — простые знаки фич, оранж)
  источник: снят-с-рефа 01/10 (стиль) → генерится под нишу
  формат: SVG (нарезка из листа)
  размеры: viewBox 0 0 48 48; заливка/линия var(--lp-accent)
  слой_поведение: контент карточки
  слот: '{{icon:feature-N}}'
  статус: заглушка (placeholder)
  режим: batch-sheet
  бриф: 'КРАТКО (свой промпт). Концепция = фичи прототипа (что именно — из market-profile); стиль с рефа
    01/10 = простые мягкие линейные знаки, оранж, 1 тон, узнаваемые. 10–20 на листе, нарезать 48×48.

    '
  промпт: 'Лист из 10-20 простых линейных иконок на тему {фичи из прототипа}. Единый стиль: тонкая линия,
    скруглённые концы, минимализм, мягкие формы, без заливки, без фона, на равной сетке. Без цвета (контур).'
- id: case-photos
  нужен: optional
  роль_где: круглые аватары отзывов/команды (01/11,13 — круглые маски)
  источник: снят-с-рефа 01/11,13 → клиентское/серия
  формат: PNG/JPG
  размеры: квадрат ≥600px ×2; кадр под круг
  слой_поведение: контент
  слот: '{{photo:case-N}}'
  статус: заглушка
  режим: batch-series
  бриф: 'ПОДРОБНО (единый стиль серии): субъекты ниши, одинаковый свет/обработка, портрет под круг.'
  промпт: 'Серия портретов {субъект из ниши} в едином стиле: одинаковый мягкий свет и тёплая обработка,
    нейтральный размытый фон, лицо по центру под круглый кадр. Фотореализм.'
- id: logo
  нужен: true
  роль_где: логотип шапка/футер (01 — «ПЁС и КО» засечный)
  источник: снят-с-рефа (стиль) → клиентское/генерится
  формат: SVG + PNG-fallback
  размеры: вектор; ~28px в шапке
  слой_поведение: контент шапки
  слот: '{{brand:logo}}'
  статус: заглушка (буква-лого)
  режим: single
  бриф: КРАТКО. Знак + название, засечный (El Messiri), оранж-акцент. SVG.
  промпт: 'Логотип: знак-символ + название, засечный шрифт, чистый минимализм. Вектор, прозрачный фон.
    {название из ниши}.'
- id: favicon
  нужен: true
  роль_где: иконка вкладки
  источник: из логотипа → набор
  формат: ICO + PNG-набор
  размеры: 16/32/180/512
  слой_поведение: site-level
  слот: '{{brand:favicon}}'
  статус: заглушка (дефолт)
  режим: single
  бриф: КРАТКО. Знак из лого, читаем в 16px, оранж/прозрачный. Набор размеров.
  промпт: Компактный знак из логотипа, читаемый в маленьком размере 16px, простая форма, прозрачный фон.
- id: photo-mask
  нужен: true
  роль_где: 'маски фото: squircle (hero 01/08), круг (аватары 01/11), оранж-круг-подложка (01/02)'
  источник: снят-с-рефа 01/02,08,11 → CSS
  формат: CSS
  размеры: —
  слой_поведение: обрезка фото
  слот: класс .gr-photo / .gr-circle
  статус: готов
  режим: —
  бриф: squircle 36px hero, круг аватары, оранж-круг-подложка за фигурой. CSS.
- id: glow-shadow
  нужен: true
  роль_где: мягкие тёплые тени карточек/фигуры (по всем экранам)
  источник: снят-с-рефа → CSS
  формат: CSS
  размеры: —
  слой_поведение: под элементом; стабилен
  слот: box-shadow токены
  статус: готов
  режим: —
  бриф: тёплая мягкая тень (тон графита, low alpha). CSS.
to_generate:
