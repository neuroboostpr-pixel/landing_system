<section class="lp-gallery-playful-grid-4" aria-labelledby="lp-gallery-playful-grid-4-title">
  <div class="lp-gallery-playful-grid-4__inner">
    <div class="lp-gallery-playful-grid-4__header">
      <p class="lp-gallery-playful-grid-4__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-gallery-playful-grid-4__title" id="lp-gallery-playful-grid-4-title">{{slot:heading}}</h2>
      <p class="lp-gallery-playful-grid-4__lead">{{slot:subhead}}</p>
    </div>

    <ul class="lp-gallery-playful-grid-4__list">
      <li class="lp-gallery-playful-grid-4__item">
        <figure class="lp-gallery-playful-grid-4__figure">
          <div class="lp-gallery-playful-grid-4__media">
            <img src="{{slot:item-1-image}}" alt="{{slot:item-1-image-alt}}" loading="lazy">
          </div>
          <figcaption class="lp-gallery-playful-grid-4__caption">
            <span class="lp-gallery-playful-grid-4__name">{{slot:item-1-title}}</span>
            <span class="lp-gallery-playful-grid-4__text">{{slot:item-1-text}}</span>
          </figcaption>
        </figure>
      </li>

      <li class="lp-gallery-playful-grid-4__item">
        <figure class="lp-gallery-playful-grid-4__figure">
          <div class="lp-gallery-playful-grid-4__media">
            <img src="{{slot:item-2-image}}" alt="{{slot:item-2-image-alt}}" loading="lazy">
          </div>
          <figcaption class="lp-gallery-playful-grid-4__caption">
            <span class="lp-gallery-playful-grid-4__name">{{slot:item-2-title}}</span>
            <span class="lp-gallery-playful-grid-4__text">{{slot:item-2-text}}</span>
          </figcaption>
        </figure>
      </li>

      <li class="lp-gallery-playful-grid-4__item">
        <figure class="lp-gallery-playful-grid-4__figure">
          <div class="lp-gallery-playful-grid-4__media">
            <img src="{{slot:item-3-image}}" alt="{{slot:item-3-image-alt}}" loading="lazy">
          </div>
          <figcaption class="lp-gallery-playful-grid-4__caption">
            <span class="lp-gallery-playful-grid-4__name">{{slot:item-3-title}}</span>
            <span class="lp-gallery-playful-grid-4__text">{{slot:item-3-text}}</span>
          </figcaption>
        </figure>
      </li>

      <li class="lp-gallery-playful-grid-4__item">
        <figure class="lp-gallery-playful-grid-4__figure">
          <div class="lp-gallery-playful-grid-4__media">
            <img src="{{slot:item-4-image}}" alt="{{slot:item-4-image-alt}}" loading="lazy">
          </div>
          <figcaption class="lp-gallery-playful-grid-4__caption">
            <span class="lp-gallery-playful-grid-4__name">{{slot:item-4-title}}</span>
            <span class="lp-gallery-playful-grid-4__text">{{slot:item-4-text}}</span>
          </figcaption>
        </figure>
      </li>
    </ul>
  </div>
</section>
