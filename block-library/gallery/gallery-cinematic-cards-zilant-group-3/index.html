<section class="lp-gallery-cinematic-cards" aria-labelledby="lp-gallery-cinematic-cards-title">
  <div class="lp-gallery-cinematic-cards__inner">
    <div class="lp-gallery-cinematic-cards__header">
      <span class="lp-gallery-cinematic-cards__eyebrow">{{slot:gallery-eyebrow}}</span>
      <h2 class="lp-gallery-cinematic-cards__title" id="lp-gallery-cinematic-cards-title">{{slot:gallery-title}}</h2>
      <p class="lp-gallery-cinematic-cards__lead">{{slot:gallery-subhead}}</p>
    </div>

    <div class="lp-gallery-cinematic-cards__grid">
      <figure class="lp-gallery-cinematic-cards__item">
        <img src="{{slot:gallery-image-1}}" alt="{{slot:gallery-image-1-alt}}" loading="lazy">
        <figcaption class="lp-gallery-cinematic-cards__caption">
          <span class="lp-gallery-cinematic-cards__label">{{slot:gallery-card-1-title}}</span>
          <span class="lp-gallery-cinematic-cards__text">{{slot:gallery-card-1-text}}</span>
        </figcaption>
      </figure>

      <figure class="lp-gallery-cinematic-cards__item">
        <img src="{{slot:gallery-image-2}}" alt="{{slot:gallery-image-2-alt}}" loading="lazy">
        <figcaption class="lp-gallery-cinematic-cards__caption">
          <span class="lp-gallery-cinematic-cards__label">{{slot:gallery-card-2-title}}</span>
          <span class="lp-gallery-cinematic-cards__text">{{slot:gallery-card-2-text}}</span>
        </figcaption>
      </figure>

      <figure class="lp-gallery-cinematic-cards__item">
        <img src="{{slot:gallery-image-3}}" alt="{{slot:gallery-image-3-alt}}" loading="lazy">
        <figcaption class="lp-gallery-cinematic-cards__caption">
          <span class="lp-gallery-cinematic-cards__label">{{slot:gallery-card-3-title}}</span>
          <span class="lp-gallery-cinematic-cards__text">{{slot:gallery-card-3-text}}</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
