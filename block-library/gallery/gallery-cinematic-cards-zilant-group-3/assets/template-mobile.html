<style>.lp-gallery-cinematic-cards {
  background: var(--lp-bg);
  color: var(--lp-text);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
  font-family: var(--lp-font-body);
}

.lp-gallery-cinematic-cards__inner {
  max-width: 1180px;
  margin: 0 auto;
}

.lp-gallery-cinematic-cards__header {
  display: grid;
  gap: var(--lp-spacing-sm);
  margin-bottom: var(--lp-spacing-lg);
}

.lp-gallery-cinematic-cards__eyebrow {
  color: var(--lp-accent);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-gallery-cinematic-cards__title {
  max-width: 820px;
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 6vw, 4.75rem);
  line-height: 0.95;
  letter-spacing: 0;
}

.lp-gallery-cinematic-cards__lead {
  max-width: 620px;
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.65;
}

.lp-gallery-cinematic-cards__grid {
  display: grid;
  gap: var(--lp-spacing-md);
}

.lp-gallery-cinematic-cards__item {
  position: relative;
  min-height: 320px;
  margin: 0;
  overflow: hidden;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
  isolation: isolate;
}

.lp-gallery-cinematic-cards__item::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(transparent, black);
  opacity: 0.78;
}

.lp-gallery-cinematic-cards__item img {
  width: 100%;
  height: 100%;
  min-height: 320px;
  display: block;
  object-fit: cover;
  filter: saturate(0.9) contrast(1.05);
  transform: scale(1);
  transition: transform 420ms ease, filter 420ms ease;
}

.lp-gallery-cinematic-cards__caption {
  position: absolute;
  left: var(--lp-spacing-md);
  right: var(--lp-spacing-md);
  bottom: var(--lp-spacing-md);
  z-index: 2;
  display: grid;
  gap: var(--lp-spacing-xs);
  color: white;
}

.lp-gallery-cinematic-cards__label {
  font-family: var(--lp-font-display);
  font-size: 1.35rem;
  line-height: 1.1;
}

.lp-gallery-cinematic-cards__text {
  color: white;
  font-size: 0.95rem;
  line-height: 1.5;
  opacity: 0.86;
}

.lp-gallery-cinematic-cards__item:hover img,
.lp-gallery-cinematic-cards__item:focus-within img {
  filter: saturate(1.05) contrast(1.12);
  transform: scale(1.04);
}

@media (min-width: 768px) {
  .lp-gallery-cinematic-cards {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-gallery-cinematic-cards__header {
    grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
    align-items: end;
  }

  .lp-gallery-cinematic-cards__eyebrow {
    grid-column: 1 / -1;
  }

  .lp-gallery-cinematic-cards__lead {
    justify-self: end;
  }

  .lp-gallery-cinematic-cards__grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lp-gallery-cinematic-cards__item {
    min-height: 430px;
  }

  .lp-gallery-cinematic-cards__item:nth-child(2) {
    margin-top: var(--lp-spacing-lg);
  }

  .lp-gallery-cinematic-cards__item img {
    min-height: 430px;
  }
}

@media (prefers-reduced-motion: no-preference) {
  .lp-gallery-cinematic-cards__item {
    animation: lp-gallery-cinematic-cards-reveal 700ms ease both;
  }

  .lp-gallery-cinematic-cards__item:nth-child(2) {
    animation-delay: 120ms;
  }

  .lp-gallery-cinematic-cards__item:nth-child(3) {
    animation-delay: 240ms;
  }

  @keyframes lp-gallery-cinematic-cards-reveal {
    from {
      opacity: 0;
      transform: translateY(var(--lp-spacing-md));
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-gallery-cinematic-cards" aria-labelledby="lp-gallery-cinematic-cards-title">
  <div class="lp-gallery-cinematic-cards__inner">
    <div class="lp-gallery-cinematic-cards__header">
      <span class="lp-gallery-cinematic-cards__eyebrow">{{slot:gallery-eyebrow}}</span>
      <h2 class="lp-gallery-cinematic-cards__title" id="lp-gallery-cinematic-cards-title">{{slot:gallery-title}}</h2>
      <p class="lp-gallery-cinematic-cards__lead">{{slot:gallery-subhead}}</p>
    </div>

    <div class="lp-gallery-cinematic-cards__grid">
      <figure class="lp-gallery-cinematic-cards__item">
        <img src="{{slot:gallery-image-1}}" alt="{{slot:gallery-image-1-alt}}" loading="lazy">
        <figcaption class="lp-gallery-cinematic-cards__caption">
          <span class="lp-gallery-cinematic-cards__label">{{slot:gallery-card-1-title}}</span>
          <span class="lp-gallery-cinematic-cards__text">{{slot:gallery-card-1-text}}</span>
        </figcaption>
      </figure>

      <figure class="lp-gallery-cinematic-cards__item">
        <img src="{{slot:gallery-image-2}}" alt="{{slot:gallery-image-2-alt}}" loading="lazy">
        <figcaption class="lp-gallery-cinematic-cards__caption">
          <span class="lp-gallery-cinematic-cards__label">{{slot:gallery-card-2-title}}</span>
          <span class="lp-gallery-cinematic-cards__text">{{slot:gallery-card-2-text}}</span>
        </figcaption>
      </figure>

      <figure class="lp-gallery-cinematic-cards__item">
        <img src="{{slot:gallery-image-3}}" alt="{{slot:gallery-image-3-alt}}" loading="lazy">
        <figcaption class="lp-gallery-cinematic-cards__caption">
          <span class="lp-gallery-cinematic-cards__label">{{slot:gallery-card-3-title}}</span>
          <span class="lp-gallery-cinematic-cards__text">{{slot:gallery-card-3-text}}</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
