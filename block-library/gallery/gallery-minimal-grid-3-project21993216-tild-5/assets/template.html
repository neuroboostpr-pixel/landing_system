<style>.lp-gallery-minimal-grid-3 {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-gallery-minimal-grid-3__inner {
  max-width: 1280px;
  margin: 0 auto;
}

.lp-gallery-minimal-grid-3__header {
  display: grid;
  gap: var(--lp-spacing-sm);
  max-width: 760px;
  margin-bottom: var(--lp-spacing-lg);
}

.lp-gallery-minimal-grid-3__eyebrow,
.lp-gallery-minimal-grid-3__title,
.lp-gallery-minimal-grid-3__subtitle,
.lp-gallery-minimal-grid-3__badge,
.lp-gallery-minimal-grid-3__name,
.lp-gallery-minimal-grid-3__text {
  margin: 0;
}

.lp-gallery-minimal-grid-3__eyebrow {
  color: var(--lp-accent);
  font-size: 0.875rem;
  font-weight: 700;
  line-height: 1.4;
}

.lp-gallery-minimal-grid-3__title {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 5vw, 3.5rem);
  line-height: 1.05;
}

.lp-gallery-minimal-grid-3__subtitle {
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.7;
}

.lp-gallery-minimal-grid-3__grid {
  display: grid;
  gap: var(--lp-spacing-md);
}

.lp-gallery-minimal-grid-3__card {
  display: grid;
  gap: var(--lp-spacing-md);
  margin: 0;
  overflow: hidden;
  min-height: 100%;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: linear-gradient(135deg, var(--lp-bg-alt), var(--lp-bg));
}

.lp-gallery-minimal-grid-3__media {
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: linear-gradient(135deg, var(--lp-bg-alt), var(--lp-accent));
}

.lp-gallery-minimal-grid-3__media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.lp-gallery-minimal-grid-3__content {
  display: grid;
  gap: var(--lp-spacing-sm);
  padding: 0 var(--lp-spacing-md) var(--lp-spacing-md);
}

.lp-gallery-minimal-grid-3__badge {
  width: fit-content;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  color: var(--lp-accent);
  background: var(--lp-bg);
  padding: var(--lp-spacing-xs) var(--lp-spacing-sm);
  font-size: 0.8125rem;
  font-weight: 700;
  line-height: 1.3;
}

.lp-gallery-minimal-grid-3__name {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 1.35rem;
  line-height: 1.2;
}

.lp-gallery-minimal-grid-3__text {
  color: var(--lp-text-muted);
  font-size: 0.975rem;
  line-height: 1.65;
}

.lp-gallery-minimal-grid-3__link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: fit-content;
  min-height: 2.75rem;
  margin-top: var(--lp-spacing-xs);
  border: 1px solid var(--lp-primary);
  border-radius: var(--lp-radius);
  color: var(--lp-bg);
  background: var(--lp-primary);
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  font-weight: 700;
  line-height: 1;
  text-decoration: none;
}

.lp-gallery-minimal-grid-3__link:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 3px;
}

@media (min-width: 768px) {
  .lp-gallery-minimal-grid-3 {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-gallery-minimal-grid-3__header {
    margin-bottom: var(--lp-spacing-xl);
  }

  .lp-gallery-minimal-grid-3__grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--lp-spacing-lg);
  }

  .lp-gallery-minimal-grid-3__content {
    padding: 0 var(--lp-spacing-lg) var(--lp-spacing-lg);
  }
}
</style>
<section class="lp-gallery-minimal-grid-3" aria-labelledby="lp-gallery-minimal-grid-3-title">
  <div class="lp-gallery-minimal-grid-3__inner">
    <div class="lp-gallery-minimal-grid-3__header">
      <p class="lp-gallery-minimal-grid-3__eyebrow">{{slot:gallery-eyebrow}}</p>
      <h2 class="lp-gallery-minimal-grid-3__title" id="lp-gallery-minimal-grid-3-title">{{slot:gallery-title}}</h2>
      <p class="lp-gallery-minimal-grid-3__subtitle">{{slot:gallery-subtitle}}</p>
    </div>

    <div class="lp-gallery-minimal-grid-3__grid">
      <figure class="lp-gallery-minimal-grid-3__card">
        <div class="lp-gallery-minimal-grid-3__media">
          <img src="{{slot:category-1-image}}" alt="{{slot:category-1-image-alt}}" loading="lazy">
        </div>
        <figcaption class="lp-gallery-minimal-grid-3__content">
          <p class="lp-gallery-minimal-grid-3__badge">{{slot:category-1-badge}}</p>
          <h3 class="lp-gallery-minimal-grid-3__name">{{slot:category-1-title}}</h3>
          <p class="lp-gallery-minimal-grid-3__text">{{slot:category-1-text}}</p>
          <a class="lp-gallery-minimal-grid-3__link" href="{{slot:category-1-link}}">
            <span>{{slot:category-1-link-label}}</span>
          </a>
        </figcaption>
      </figure>

      <figure class="lp-gallery-minimal-grid-3__card">
        <div class="lp-gallery-minimal-grid-3__media">
          <img src="{{slot:category-2-image}}" alt="{{slot:category-2-image-alt}}" loading="lazy">
        </div>
        <figcaption class="lp-gallery-minimal-grid-3__content">
          <p class="lp-gallery-minimal-grid-3__badge">{{slot:category-2-badge}}</p>
          <h3 class="lp-gallery-minimal-grid-3__name">{{slot:category-2-title}}</h3>
          <p class="lp-gallery-minimal-grid-3__text">{{slot:category-2-text}}</p>
          <a class="lp-gallery-minimal-grid-3__link" href="{{slot:category-2-link}}">
            <span>{{slot:category-2-link-label}}</span>
          </a>
        </figcaption>
      </figure>

      <figure class="lp-gallery-minimal-grid-3__card">
        <div class="lp-gallery-minimal-grid-3__media">
          <img src="{{slot:category-3-image}}" alt="{{slot:category-3-image-alt}}" loading="lazy">
        </div>
        <figcaption class="lp-gallery-minimal-grid-3__content">
          <p class="lp-gallery-minimal-grid-3__badge">{{slot:category-3-badge}}</p>
          <h3 class="lp-gallery-minimal-grid-3__name">{{slot:category-3-title}}</h3>
          <p class="lp-gallery-minimal-grid-3__text">{{slot:category-3-text}}</p>
          <a class="lp-gallery-minimal-grid-3__link" href="{{slot:category-3-link}}">
            <span>{{slot:category-3-link-label}}</span>
          </a>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
