<section class="lp-gallery-minimal-grid-3" aria-labelledby="lp-gallery-minimal-grid-3-title">
  <div class="lp-gallery-minimal-grid-3__inner">
    <div class="lp-gallery-minimal-grid-3__header">
      <p class="lp-gallery-minimal-grid-3__eyebrow">{{slot:gallery-eyebrow}}</p>
      <h2 class="lp-gallery-minimal-grid-3__title" id="lp-gallery-minimal-grid-3-title">{{slot:gallery-title}}</h2>
      <p class="lp-gallery-minimal-grid-3__subtitle">{{slot:gallery-subtitle}}</p>
    </div>

    <div class="lp-gallery-minimal-grid-3__grid">
      <figure class="lp-gallery-minimal-grid-3__card">
        <div class="lp-gallery-minimal-grid-3__media">
          <img src="{{slot:category-1-image}}" alt="{{slot:category-1-image-alt}}" loading="lazy">
        </div>
        <figcaption class="lp-gallery-minimal-grid-3__content">
          <p class="lp-gallery-minimal-grid-3__badge">{{slot:category-1-badge}}</p>
          <h3 class="lp-gallery-minimal-grid-3__name">{{slot:category-1-title}}</h3>
          <p class="lp-gallery-minimal-grid-3__text">{{slot:category-1-text}}</p>
          <a class="lp-gallery-minimal-grid-3__link" href="{{slot:category-1-link}}">
            <span>{{slot:category-1-link-label}}</span>
          </a>
        </figcaption>
      </figure>

      <figure class="lp-gallery-minimal-grid-3__card">
        <div class="lp-gallery-minimal-grid-3__media">
          <img src="{{slot:category-2-image}}" alt="{{slot:category-2-image-alt}}" loading="lazy">
        </div>
        <figcaption class="lp-gallery-minimal-grid-3__content">
          <p class="lp-gallery-minimal-grid-3__badge">{{slot:category-2-badge}}</p>
          <h3 class="lp-gallery-minimal-grid-3__name">{{slot:category-2-title}}</h3>
          <p class="lp-gallery-minimal-grid-3__text">{{slot:category-2-text}}</p>
          <a class="lp-gallery-minimal-grid-3__link" href="{{slot:category-2-link}}">
            <span>{{slot:category-2-link-label}}</span>
          </a>
        </figcaption>
      </figure>

      <figure class="lp-gallery-minimal-grid-3__card">
        <div class="lp-gallery-minimal-grid-3__media">
          <img src="{{slot:category-3-image}}" alt="{{slot:category-3-image-alt}}" loading="lazy">
        </div>
        <figcaption class="lp-gallery-minimal-grid-3__content">
          <p class="lp-gallery-minimal-grid-3__badge">{{slot:category-3-badge}}</p>
          <h3 class="lp-gallery-minimal-grid-3__name">{{slot:category-3-title}}</h3>
          <p class="lp-gallery-minimal-grid-3__text">{{slot:category-3-text}}</p>
          <a class="lp-gallery-minimal-grid-3__link" href="{{slot:category-3-link}}">
            <span>{{slot:category-3-link-label}}</span>
          </a>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
