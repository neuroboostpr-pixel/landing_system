<section class="lp-gallery-minimal-stacked" aria-labelledby="lp-gallery-minimal-stacked-title">
  <div class="lp-gallery-minimal-stacked__inner">
    <div class="lp-gallery-minimal-stacked__header">
      <p class="lp-gallery-minimal-stacked__eyebrow">{{slot:gallery-eyebrow}}</p>
      <h2 class="lp-gallery-minimal-stacked__title" id="lp-gallery-minimal-stacked-title">{{slot:gallery-title}}</h2>
      <p class="lp-gallery-minimal-stacked__text">{{slot:gallery-subhead}}</p>
    </div>

    <figure class="lp-gallery-minimal-stacked__media">
      <picture>
        <source media="(max-width: 767px)" srcset="{{slot:gallery-image-mobile}}">
        <img src="{{slot:gallery-image}}" alt="{{slot:gallery-image-alt}}" loading="lazy">
      </picture>
      <button class="lp-gallery-minimal-stacked__play" type="button" aria-label="{{slot:play-button-label}}">
        <span class="lp-gallery-minimal-stacked__play-icon" aria-hidden="true"></span>
      </button>
      <figcaption class="lp-gallery-minimal-stacked__caption">{{slot:gallery-caption}}</figcaption>
    </figure>
  </div>
</section>
