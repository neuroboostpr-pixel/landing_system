<section class="lp-gallery-cinematic-grid-4" aria-labelledby="gallery-cinematic-grid-4-title">
  <div class="lp-gallery-cinematic-grid-4__inner">
    <div class="lp-gallery-cinematic-grid-4__header">
      <p class="lp-gallery-cinematic-grid-4__eyebrow">{{slot:gallery-eyebrow}}</p>
      <h2 class="lp-gallery-cinematic-grid-4__title" id="gallery-cinematic-grid-4-title">{{slot:gallery-title}}</h2>
      <p class="lp-gallery-cinematic-grid-4__subhead">{{slot:gallery-subhead}}</p>
    </div>

    <div class="lp-gallery-cinematic-grid-4__grid">
      <figure class="lp-gallery-cinematic-grid-4__item lp-gallery-cinematic-grid-4__item--featured">
        <img src="{{slot:gallery-image-1}}" alt="{{slot:gallery-image-1-alt}}" loading="lazy">
        <figcaption class="lp-gallery-cinematic-grid-4__caption">
          <span>{{slot:gallery-caption-1}}</span>
        </figcaption>
      </figure>

      <figure class="lp-gallery-cinematic-grid-4__item">
        <img src="{{slot:gallery-image-2}}" alt="{{slot:gallery-image-2-alt}}" loading="lazy">
        <figcaption class="lp-gallery-cinematic-grid-4__caption">
          <span>{{slot:gallery-caption-2}}</span>
        </figcaption>
      </figure>

      <figure class="lp-gallery-cinematic-grid-4__item">
        <img src="{{slot:gallery-image-3}}" alt="{{slot:gallery-image-3-alt}}" loading="lazy">
        <figcaption class="lp-gallery-cinematic-grid-4__caption">
          <span>{{slot:gallery-caption-3}}</span>
        </figcaption>
      </figure>

      <figure class="lp-gallery-cinematic-grid-4__item">
        <img src="{{slot:gallery-image-4}}" alt="{{slot:gallery-image-4-alt}}" loading="lazy">
        <figcaption class="lp-gallery-cinematic-grid-4__caption">
          <span>{{slot:gallery-caption-4}}</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
