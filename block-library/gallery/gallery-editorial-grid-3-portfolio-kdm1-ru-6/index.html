<section class="lp-gallery-editorial-grid-3" aria-labelledby="gallery-editorial-grid-3-title">
  <div class="lp-gallery-editorial-grid-3__inner">
    <div class="lp-gallery-editorial-grid-3__header">
      <p class="lp-gallery-editorial-grid-3__eyebrow">{{slot:gallery-eyebrow}}</p>
      <h2 class="lp-gallery-editorial-grid-3__title" id="gallery-editorial-grid-3-title">{{slot:gallery-title}}</h2>
      <p class="lp-gallery-editorial-grid-3__lead">{{slot:gallery-subhead}}</p>
    </div>

    <div class="lp-gallery-editorial-grid-3__grid">
      <figure class="lp-gallery-editorial-grid-3__item lp-gallery-editorial-grid-3__item--large">
        <img src="{{slot:gallery-image-1}}" alt="{{slot:gallery-image-1-alt}}" loading="lazy">
        <figcaption class="lp-gallery-editorial-grid-3__caption">
          <span>{{slot:gallery-item-1-label}}</span>
          <strong>{{slot:gallery-item-1-title}}</strong>
        </figcaption>
      </figure>

      <article class="lp-gallery-editorial-grid-3__text-card">
        <span class="lp-gallery-editorial-grid-3__text-kicker">{{slot:gallery-card-1-kicker}}</span>
        <h3 class="lp-gallery-editorial-grid-3__text-title">{{slot:gallery-card-1-title}}</h3>
        <p class="lp-gallery-editorial-grid-3__text">{{slot:gallery-card-1-text}}</p>
      </article>

      <figure class="lp-gallery-editorial-grid-3__item">
        <img src="{{slot:gallery-image-2}}" alt="{{slot:gallery-image-2-alt}}" loading="lazy">
        <figcaption class="lp-gallery-editorial-grid-3__caption">
          <span>{{slot:gallery-item-2-label}}</span>
          <strong>{{slot:gallery-item-2-title}}</strong>
        </figcaption>
      </figure>

      <figure class="lp-gallery-editorial-grid-3__item">
        <img src="{{slot:gallery-image-3}}" alt="{{slot:gallery-image-3-alt}}" loading="lazy">
        <figcaption class="lp-gallery-editorial-grid-3__caption">
          <span>{{slot:gallery-item-3-label}}</span>
          <strong>{{slot:gallery-item-3-title}}</strong>
        </figcaption>
      </figure>

      <article class="lp-gallery-editorial-grid-3__text-card lp-gallery-editorial-grid-3__text-card--accent">
        <span class="lp-gallery-editorial-grid-3__text-kicker">{{slot:gallery-card-2-kicker}}</span>
        <h3 class="lp-gallery-editorial-grid-3__text-title">{{slot:gallery-card-2-title}}</h3>
        <p class="lp-gallery-editorial-grid-3__text">{{slot:gallery-card-2-text}}</p>
      </article>

      <figure class="lp-gallery-editorial-grid-3__item lp-gallery-editorial-grid-3__item--wide">
        <img src="{{slot:gallery-image-4}}" alt="{{slot:gallery-image-4-alt}}" loading="lazy">
        <figcaption class="lp-gallery-editorial-grid-3__caption">
          <span>{{slot:gallery-item-4-label}}</span>
          <strong>{{slot:gallery-item-4-title}}</strong>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
