<section class="lp-gallery-corporate-cards" aria-labelledby="lp-gallery-corporate-cards-title">
  <div class="lp-gallery-corporate-cards__inner">
    <div class="lp-gallery-corporate-cards__header">
      <p class="lp-gallery-corporate-cards__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-gallery-corporate-cards__title" id="lp-gallery-corporate-cards-title">{{slot:heading}}</h2>
      <p class="lp-gallery-corporate-cards__subhead">{{slot:subhead}}</p>
    </div>

    <div class="lp-gallery-corporate-cards__grid" role="list">
      <figure class="lp-gallery-corporate-cards__item" role="listitem">
        <div class="lp-gallery-corporate-cards__media">
          <img src="{{slot:item-1-image}}" alt="{{slot:item-1-image-alt}}" loading="lazy">
        </div>
        <figcaption class="lp-gallery-corporate-cards__content">
          <span class="lp-gallery-corporate-cards__badge">{{slot:item-1-badge}}</span>
          <h3 class="lp-gallery-corporate-cards__name">{{slot:item-1-title}}</h3>
          <p class="lp-gallery-corporate-cards__text">{{slot:item-1-text}}</p>
          <div class="lp-gallery-corporate-cards__meta">
            <span class="lp-gallery-corporate-cards__price">{{slot:item-1-price}}</span>
            <a class="lp-gallery-corporate-cards__link" href="{{slot:item-1-link}}">{{slot:item-1-cta}}</a>
          </div>
        </figcaption>
      </figure>

      <figure class="lp-gallery-corporate-cards__item" role="listitem">
        <div class="lp-gallery-corporate-cards__media">
          <img src="{{slot:item-2-image}}" alt="{{slot:item-2-image-alt}}" loading="lazy">
        </div>
        <figcaption class="lp-gallery-corporate-cards__content">
          <span class="lp-gallery-corporate-cards__badge">{{slot:item-2-badge}}</span>
          <h3 class="lp-gallery-corporate-cards__name">{{slot:item-2-title}}</h3>
          <p class="lp-gallery-corporate-cards__text">{{slot:item-2-text}}</p>
          <div class="lp-gallery-corporate-cards__meta">
            <span class="lp-gallery-corporate-cards__price">{{slot:item-2-price}}</span>
            <a class="lp-gallery-corporate-cards__link" href="{{slot:item-2-link}}">{{slot:item-2-cta}}</a>
          </div>
        </figcaption>
      </figure>

      <figure class="lp-gallery-corporate-cards__item" role="listitem">
        <div class="lp-gallery-corporate-cards__media">
          <img src="{{slot:item-3-image}}" alt="{{slot:item-3-image-alt}}" loading="lazy">
        </div>
        <figcaption class="lp-gallery-corporate-cards__content">
          <span class="lp-gallery-corporate-cards__badge">{{slot:item-3-badge}}</span>
          <h3 class="lp-gallery-corporate-cards__name">{{slot:item-3-title}}</h3>
          <p class="lp-gallery-corporate-cards__text">{{slot:item-3-text}}</p>
          <div class="lp-gallery-corporate-cards__meta">
            <span class="lp-gallery-corporate-cards__price">{{slot:item-3-price}}</span>
            <a class="lp-gallery-corporate-cards__link" href="{{slot:item-3-link}}">{{slot:item-3-cta}}</a>
          </div>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
