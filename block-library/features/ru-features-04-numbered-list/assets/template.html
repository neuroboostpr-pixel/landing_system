<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-bg-alt: #e8e8e8;
    --lp-text-muted: #999;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); }
  .features-section {
    background: var(--lp-bg-alt);
    border-top: 1px solid var(--lp-border);
    border-bottom: 1px solid var(--lp-border);
    padding: 80px 0;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 32px; }
  .section-label {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--lp-text-muted);
    margin-bottom: 48px;
    text-align: center;
  }
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
  }
  .feature-num {
    font-family: ui-monospace, monospace;
    color: var(--lp-accent);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
    font-weight: 600;
  }
  .feature h3 {
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }
  .feature p {
    margin: 0;
    color: var(--lp-text-muted);
    font-size: 14.5px;
    line-height: 1.6;
  }
</style>
<section class="features-section" data-block-id="ru-features-04-numbered-list">
<div class="wrap">
<p class="section-label">{{slot:section-label}}</p>
<div class="feature-grid">
<div class="feature">
<span class="feature-num">{{slot:feat-1-num}}</span>
<h3>{{slot:feat-1-title}}</h3>
<p>{{slot:feat-1-desc}}</p>
</div>
<div class="feature">
<span class="feature-num">{{slot:feat-2-num}}</span>
<h3>{{slot:feat-2-title}}</h3>
<p>{{slot:feat-2-desc}}</p>
</div>
<div class="feature">
<span class="feature-num">{{slot:feat-3-num}}</span>
<h3>{{slot:feat-3-title}}</h3>
<p>{{slot:feat-3-desc}}</p>
</div>
</div>
</div>
</section>
