<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-bg-alt: #e8e8e8;
    --lp-text-muted: #999;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; }
  .features-section {
    background: var(--lp-bg-alt);
    border-top: 1px solid var(--lp-border);
    border-bottom: 1px solid var(--lp-border);
    padding: 48px 20px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .section-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--lp-text-muted);
    text-align: center;
  }
  .feature-num {
    font-family: ui-monospace, monospace;
    color: var(--lp-accent);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: block;
    font-weight: 600;
  }
  .feature { border-top: 1px solid var(--lp-border); padding-top: 24px; }
  .feature h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.01em; }
  .feature p { color: var(--lp-text-muted); font-size: 14px; line-height: 1.6; }
</style>
<section class="features-section" data-block-id="ru-features-04-numbered-list">
<p class="section-label">{{slot:section-label}}</p>
<div class="feature">
<span class="feature-num">01</span>
<h3>{{slot:feat-1-title}}</h3>
<p>{{slot:feat-1-desc}}</p>
</div>
<div class="feature">
<span class="feature-num">02</span>
<h3>{{slot:feat-2-title}}</h3>
<p>{{slot:feat-2-desc}}</p>
</div>
<div class="feature">
<span class="feature-num">03</span>
<h3>{{slot:feat-3-title}}</h3>
<p>{{slot:feat-3-desc}}</p>
</div>
</section>
