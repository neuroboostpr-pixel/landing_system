<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/saas-landing/example.html | License: Apache-2.0 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-features-04-numbered-list — mobile</title>
<style>
  :root {
    --color-bg: #fafaf9;
    --color-fg: #1c1b1a;
    --color-accent: #c96442;
    --color-border: #e6e4e0;
    --color-surface: #ffffff;
    --color-muted: #6b6964;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .features-section {
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
    border-bottom: 1px solid var(--color-border);
    padding: 48px 20px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .section-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--color-muted);
    text-align: center;
  }
  .feature-num {
    font-family: ui-monospace, monospace;
    color: var(--color-accent);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: block;
    font-weight: 600;
  }
  .feature { border-top: 1px solid var(--color-border); padding-top: 24px; }
  .feature h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.01em; }
  .feature p { color: var(--color-muted); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <section class="features-section" data-block-id="ru-features-04-numbered-list">
    <p class="section-label" data-slot="section-label">[Преимущества]</p>
    <div class="feature">
      <span class="feature-num">01</span>
      <h3 data-slot="feat-1-title">[Первое преимущество]</h3>
      <p data-slot="feat-1-desc">[Описание первого преимущества]</p>
    </div>
    <div class="feature">
      <span class="feature-num">02</span>
      <h3 data-slot="feat-2-title">[Второе преимущество]</h3>
      <p data-slot="feat-2-desc">[Описание второго преимущества]</p>
    </div>
    <div class="feature">
      <span class="feature-num">03</span>
      <h3 data-slot="feat-3-title">[Третье преимущество]</h3>
      <p data-slot="feat-3-desc">[Описание третьего преимущества]</p>
    </div>
  </section>
</body>
</html>
