layout_summary_ru: Левая колонка — kicker, заголовок, подзаголовок. Правая — сетка
  2×2 из карточек с числами 01–04 и тегом. Bone-фон карточек контрастирует с тёплым
  bg. Mobile — заголовок сверху, сетка 2×2 снизу.
