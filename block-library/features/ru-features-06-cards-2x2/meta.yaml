category: features
conversion_notes: Сетка 2×2 предпочтительна для 4+ равноважных услуг. Тег в правом
  верхнем углу карточки помогает категоризации. Hover-эффект (translateY) добавляет
  живости без JS.
created: '2026-05-13'
description: Четыре карточки в сетке 2×2 (тёплый bone-фон, тени, скруглённые углы)
  рядом с заголовком и описанием. Стиль capabilities-grid от open-design-landing.
display_name_ru: Четыре карточки 2×2 — bone-фон, тени, курсивные числа
id: ru-features-06-cards-2x2
