description: 'Четыре карточки в сетке 2×2 (тёплый bone-фон, тени, скруглённые углы)
  рядом с заголовком и описанием. Стиль capabilities-grid от open-design-landing.'
display_name_ru: Четыре карточки 2×2 — bone-фон, тени, курсивные числа
layout_summary_ru: Левая колонка — kicker, заголовок, подзаголовок. Правая — сетка
  2×2 из карточек с числами 01–04 и тегом. Bone-фон карточек контрастирует с тёплым
  bg. Mobile — заголовок сверху, сетка 2×2 снизу.
