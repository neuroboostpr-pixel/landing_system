<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/open-design-landing/example.html | License: Apache-2.0 -->
<html lang="ru"><head><meta charset="UTF-8"><title>ru-features-07-2col-split — desktop</title>
<style>
  :root { --color-bg:#efe7d2; --color-fg:#15140f; --color-accent:#ed6f5c; --color-border:rgba(21,20,15,0.16); --font-display:'Playfair Display',Georgia,serif; --font-body:'Inter Tight',system-ui,sans-serif; --spacing-md:16px; --spacing-lg:32px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); }
  .about-section { padding:100px 0; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 64px; }
  .about-grid { display:grid; grid-template-columns:1.05fr 1fr; gap:80px; align-items:center; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent); display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .kicker::before { content:''; width:18px; height:1px; background:var(--color-accent); }
  .section-title { font-family:var(--font-body); font-weight:800; font-size:clamp(38px,4.5vw,66px); line-height:1.0; letter-spacing:-0.028em; margin-bottom:24px; }
  .section-title em { font-family:var(--font-display); font-style:italic; font-weight:500; }
  .section-lead { font-size:16px; line-height:1.6; color:rgba(21,20,15,0.7); margin-bottom:32px; max-width:44ch; }
  .btn-ghost { display:inline-flex; align-items:center; gap:10px; padding:12px 24px; border-radius:999px; background:transparent; color:var(--color-fg); font-family:var(--font-body); font-size:14px; font-weight:500; text-decoration:none; border:1px solid var(--color-border); cursor:pointer; }
  .about-art { position:relative; aspect-ratio:1/1; background:rgba(21,20,15,0.06); border:1px solid var(--color-border); display:flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(21,20,15,0.3); border-radius:4px; }
  .footer-row { display:flex; align-items:center; gap:16px; margin-top:40px; color:rgba(21,20,15,0.45); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; border-top:1px solid var(--color-border); padding-top:24px; }
</style></head>
<body>
  <section class="about-section" data-block-id="ru-features-07-2col-split">
    <div class="wrap">
      <div class="about-grid">
        <div class="about-copy">
          <div class="kicker" data-slot="kicker">[О нас / О компании]</div>
          <h2 class="section-title" data-slot="headline">[Заголовок с <em>курсивным</em> ключевым словом]</h2>
          <p class="section-lead" data-slot="subhead">[Манифест или ключевая история компании. Почему вы работаете именно так. 2–3 предложения о подходе.]</p>
          <a class="btn-ghost" data-slot="cta" href="#about">[Узнать больше о нас]</a>
          <div class="footer-row">
            <span data-slot="footnote">[Исследование · Дизайн · Результат]</span>
          </div>
        </div>
        <div class="about-art" data-slot="art-image">Фото / Иллюстрация</div>
      </div>
    </div>
  </section>
</body></html>
