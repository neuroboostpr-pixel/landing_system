<style>
  :root { --color-bg:#efe7d2; --color-fg:#15140f; --color-accent:#ed6f5c; --color-border:rgba(21,20,15,0.16); --font-display:'Playfair Display',Georgia,serif; --font-body:'Inter Tight',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); width:375px; padding:40px 20px; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent); display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .kicker::before { content:''; width:14px; height:1px; background:var(--color-accent); }
  .art { width:100%; aspect-ratio:4/3; background:rgba(21,20,15,0.06); border:1px solid var(--color-border); display:flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(21,20,15,0.3); margin-bottom:28px; }
  h2 { font-size:36px; font-weight:800; letter-spacing:-0.028em; margin-bottom:16px; line-height:1.0; }
  h2 em { font-family:var(--font-display); font-style:italic; font-weight:500; }
  p { font-size:15px; line-height:1.6; color:rgba(21,20,15,0.7); margin-bottom:24px; }
  .btn-ghost { display:block; width:100%; padding:13px 24px; border-radius:999px; background:transparent; color:var(--color-fg); font-size:15px; font-weight:500; text-decoration:none; text-align:center; border:1px solid var(--color-border); }
</style>
<section data-block-id="ru-features-07-2col-split">
<div class="art">{{slot:art-image}}</div>
<div class="kicker">{{slot:kicker}}</div>
<h2>{{slot:h2-1}}</h2>
<p>{{slot:subhead}}</p>
<a class="btn-ghost" href="#about">{{slot:cta}}</a>
</section>
