<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-features-01-3col-icons — mobile</title>
<style>
  :root {
    --color-bg: #fff; --color-fg: #111; --color-accent: #333; --color-border: #ccc;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .features { padding: 40px 20px; }
  .section-headline { font-family: var(--font-display); font-size: 24px; text-align: center; margin: 0 0 32px; }
  .col { display: flex; flex-direction: row; align-items: flex-start; gap: 16px; margin-bottom: 28px; }
  .icon-placeholder { width: 48px; height: 48px; border: 2px solid var(--color-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #999; flex-shrink: 0; }
  .col-text { flex: 1; }
  .feature-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 0 0 6px; }
  .feature-text { font-size: 14px; color: #555; margin: 0; line-height: 1.5; }
</style>
</head>
<body>
  <section class="features" data-block-id="ru-features-01-3col-icons">
    <h2 class="section-headline" data-slot="headline">[HEADLINE]</h2>
    <div class="col">
      <div class="icon-placeholder" data-slot="feature-1-icon">icon</div>
      <div class="col-text">
        <h3 class="feature-title" data-slot="feature-1-title">[Преимущество 1]</h3>
        <p class="feature-text" data-slot="feature-1-text">[Описание 1]</p>
      </div>
    </div>
    <div class="col">
      <div class="icon-placeholder" data-slot="feature-2-icon">icon</div>
      <div class="col-text">
        <h3 class="feature-title" data-slot="feature-2-title">[Преимущество 2]</h3>
        <p class="feature-text" data-slot="feature-2-text">[Описание 2]</p>
      </div>
    </div>
    <div class="col">
      <div class="icon-placeholder" data-slot="feature-3-icon">icon</div>
      <div class="col-text">
        <h3 class="feature-title" data-slot="feature-3-title">[Преимущество 3]</h3>
        <p class="feature-text" data-slot="feature-3-text">[Описание 3]</p>
      </div>
    </div>
  </section>
</body>
</html>
