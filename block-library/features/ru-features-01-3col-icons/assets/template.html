<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); }
  .features { padding: 64px var(--spacing-lg); max-width: 1100px; margin: 0 auto; }
  .section-headline { font-family: var(--font-display); font-size: 36px; text-align: center; margin: 0 0 48px; }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .col { display: flex; flex-direction: column; align-items: flex-start; }
  .icon-placeholder { width: 48px; height: 48px; border: 2px solid var(--lp-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color:#999; margin-bottom: 16px; flex-shrink: 0; }
  .feature-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .feature-text { font-size: 15px; color:#555; margin: 0; line-height: 1.5; }
</style>
<section class="features" data-block-id="ru-features-01-3col-icons">
<h2 class="section-headline">{{slot:headline}}</h2>
<div class="cols">
<div class="col">
<div class="icon-placeholder" data-slot-type="icon">{{slot:feature-1-icon}}</div>
<h3 class="feature-title">{{slot:feature-1-title}}</h3>
<p class="feature-text">{{slot:feature-1-text}}</p>
</div>
<div class="col">
<div class="icon-placeholder" data-slot-type="icon">{{slot:feature-2-icon}}</div>
<h3 class="feature-title">{{slot:feature-2-title}}</h3>
<p class="feature-text">{{slot:feature-2-text}}</p>
</div>
<div class="col">
<div class="icon-placeholder" data-slot-type="icon">{{slot:feature-3-icon}}</div>
<h3 class="feature-title">{{slot:feature-3-title}}</h3>
<p class="feature-text">{{slot:feature-3-text}}</p>
</div>
</div>
</section>
