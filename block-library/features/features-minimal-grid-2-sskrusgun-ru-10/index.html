<section class="lp-features-minimal-grid-2" aria-labelledby="lp-features-minimal-grid-2-title">
  <div class="lp-features-minimal-grid-2__inner">
    <div class="lp-features-minimal-grid-2__header">
      <p class="lp-features-minimal-grid-2__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-features-minimal-grid-2__title" id="lp-features-minimal-grid-2-title">{{slot:title}}</h2>
      <p class="lp-features-minimal-grid-2__subhead">{{slot:subhead}}</p>
    </div>

    <div class="lp-features-minimal-grid-2__grid">
      <article class="lp-features-minimal-grid-2__card">
        <div class="lp-features-minimal-grid-2__media">
          <img src="{{slot:feature-1-image}}" alt="{{slot:feature-1-image-alt}}" loading="lazy">
        </div>
        <div class="lp-features-minimal-grid-2__content">
          <p class="lp-features-minimal-grid-2__badge">{{slot:feature-1-badge}}</p>
          <h3 class="lp-features-minimal-grid-2__card-title">{{slot:feature-1-title}}</h3>
          <p class="lp-features-minimal-grid-2__text">{{slot:feature-1-text}}</p>
          <a class="lp-features-minimal-grid-2__button" href="{{slot:feature-1-link}}">{{slot:feature-1-cta}}</a>
        </div>
      </article>

      <article class="lp-features-minimal-grid-2__card">
        <div class="lp-features-minimal-grid-2__media">
          <img src="{{slot:feature-2-image}}" alt="{{slot:feature-2-image-alt}}" loading="lazy">
        </div>
        <div class="lp-features-minimal-grid-2__content">
          <p class="lp-features-minimal-grid-2__badge">{{slot:feature-2-badge}}</p>
          <h3 class="lp-features-minimal-grid-2__card-title">{{slot:feature-2-title}}</h3>
          <p class="lp-features-minimal-grid-2__text">{{slot:feature-2-text}}</p>
          <a class="lp-features-minimal-grid-2__button" href="{{slot:feature-2-link}}">{{slot:feature-2-cta}}</a>
        </div>
      </article>
    </div>
  </div>
</section>
