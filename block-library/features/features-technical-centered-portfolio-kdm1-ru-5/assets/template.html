<style>.lp-features-technical-centered {
  color: var(--lp-text);
  background: var(--lp-bg-alt);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-features-technical-centered__inner {
  max-width: 1180px;
  margin: 0 auto;
}

.lp-features-technical-centered__intro {
  max-width: 760px;
  margin: 0 auto var(--lp-spacing-lg);
  text-align: center;
}

.lp-features-technical-centered__eyebrow,
.lp-features-technical-centered__panel-kicker {
  margin: 0 0 var(--lp-spacing-xs);
  color: var(--lp-primary);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-features-technical-centered__title {
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 6vw, 4.25rem);
  line-height: 1.02;
  letter-spacing: 0;
}

.lp-features-technical-centered__lead {
  margin: var(--lp-spacing-md) auto 0;
  max-width: 620px;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.7;
}

.lp-features-technical-centered__showcase {
  display: grid;
  gap: var(--lp-spacing-md);
  align-items: stretch;
}

.lp-features-technical-centered__media {
  position: relative;
  overflow: hidden;
  min-height: 360px;
  margin: 0;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg);
}

.lp-features-technical-centered__media img {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 360px;
  object-fit: cover;
}

.lp-features-technical-centered__hotspot {
  position: absolute;
  display: grid;
  width: 2.75rem;
  height: 2.75rem;
  padding: 0;
  place-items: center;
  border: 1px solid var(--lp-border);
  border-radius: 50%;
  color: var(--lp-text);
  background: var(--lp-bg);
  cursor: pointer;
  transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease;
}

.lp-features-technical-centered__hotspot span {
  display: block;
  width: 0.75rem;
  height: 0.75rem;
  border-radius: 50%;
  background: var(--lp-accent);
}

.lp-features-technical-centered__hotspot:hover,
.lp-features-technical-centered__hotspot:focus-visible {
  transform: scale(1.08);
  border-color: var(--lp-primary);
  background: var(--lp-bg-alt);
  outline: 2px solid var(--lp-primary);
  outline-offset: 3px;
}

.lp-features-technical-centered__hotspot--one {
  top: 24%;
  left: 24%;
}

.lp-features-technical-centered__hotspot--two {
  top: 48%;
  right: 22%;
}

.lp-features-technical-centered__hotspot--three {
  right: 36%;
  bottom: 18%;
}

.lp-features-technical-centered__panel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg);
  padding: var(--lp-spacing-lg);
}

.lp-features-technical-centered__panel-title {
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(1.35rem, 4vw, 2.25rem);
  line-height: 1.12;
  letter-spacing: 0;
}

.lp-features-technical-centered__panel-text {
  margin: var(--lp-spacing-sm) 0 0;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.7;
}

.lp-features-technical-centered__list {
  display: grid;
  gap: var(--lp-spacing-sm);
  margin: var(--lp-spacing-md) 0 0;
  padding: 0;
  list-style: none;
}

.lp-features-technical-centered__list li {
  display: flex;
  gap: var(--lp-spacing-sm);
  align-items: flex-start;
  color: var(--lp-text);
  font-size: 0.98rem;
  line-height: 1.55;
}

.lp-features-technical-centered__marker {
  flex: 0 0 auto;
  width: 0.75rem;
  height: 0.75rem;
  margin-top: 0.4rem;
  border-radius: 50%;
  background: var(--lp-primary);
}

.lp-features-technical-centered__cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  align-self: flex-start;
  min-height: 3rem;
  margin-top: var(--lp-spacing-lg);
  padding: 0 var(--lp-spacing-md);
  border: 1px solid var(--lp-primary);
  border-radius: var(--lp-radius);
  color: var(--lp-bg);
  background: var(--lp-primary);
  font-weight: 700;
  text-decoration: none;
  transition: transform 180ms ease, background-color 180ms ease, color 180ms ease;
}

.lp-features-technical-centered__cta:hover,
.lp-features-technical-centered__cta:focus-visible {
  transform: translateY(-2px);
  color: var(--lp-primary);
  background: transparent;
  outline: 2px solid var(--lp-primary);
  outline-offset: 3px;
}

@media (min-width: 768px) {
  .lp-features-technical-centered {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-features-technical-centered__showcase {
    grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.75fr);
    gap: var(--lp-spacing-lg);
  }

  .lp-features-technical-centered__media,
  .lp-features-technical-centered__media img {
    min-height: 560px;
  }
}

@media (prefers-reduced-motion: no-preference) {
  .lp-features-technical-centered__hotspot span {
    animation: lp-features-technical-centered-pulse 1800ms ease-in-out infinite;
  }

  @keyframes lp-features-technical-centered-pulse {
    0% {
      box-shadow: 0 0 0 0 var(--lp-accent);
    }

    70% {
      box-shadow: 0 0 0 0.8rem transparent;
    }

    100% {
      box-shadow: 0 0 0 0 transparent;
    }
  }
}
</style>
<section class="lp-features-technical-centered" aria-labelledby="features-technical-centered-title">
  <div class="lp-features-technical-centered__inner">
    <div class="lp-features-technical-centered__intro">
      <p class="lp-features-technical-centered__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-features-technical-centered__title" id="features-technical-centered-title">{{slot:title}}</h2>
      <p class="lp-features-technical-centered__lead">{{slot:lead}}</p>
    </div>

    <div class="lp-features-technical-centered__showcase">
      <figure class="lp-features-technical-centered__media">
        <picture>
          <source media="(max-width: 767px)" srcset="{{slot:product-image-mobile}}">
          <img src="{{slot:product-image}}" alt="{{slot:product-image-alt}}" loading="lazy">
        </picture>

        <button class="lp-features-technical-centered__hotspot lp-features-technical-centered__hotspot--one" type="button" aria-label="{{slot:hotspot-one-label}}">
          <span></span>
        </button>
        <button class="lp-features-technical-centered__hotspot lp-features-technical-centered__hotspot--two" type="button" aria-label="{{slot:hotspot-two-label}}">
          <span></span>
        </button>
        <button class="lp-features-technical-centered__hotspot lp-features-technical-centered__hotspot--three" type="button" aria-label="{{slot:hotspot-three-label}}">
          <span></span>
        </button>
      </figure>

      <div class="lp-features-technical-centered__panel">
        <p class="lp-features-technical-centered__panel-kicker">{{slot:detail-kicker}}</p>
        <h3 class="lp-features-technical-centered__panel-title">{{slot:detail-title}}</h3>
        <p class="lp-features-technical-centered__panel-text">{{slot:detail-text}}</p>

        <ul class="lp-features-technical-centered__list" aria-label="{{slot:features-list-label}}">
          <li>
            <span class="lp-features-technical-centered__marker"></span>
            <span>{{slot:feature-one}}</span>
          </li>
          <li>
            <span class="lp-features-technical-centered__marker"></span>
            <span>{{slot:feature-two}}</span>
          </li>
          <li>
            <span class="lp-features-technical-centered__marker"></span>
            <span>{{slot:feature-three}}</span>
          </li>
        </ul>

        <a class="lp-features-technical-centered__cta" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
      </div>
    </div>
  </div>
</section>
