<section class="lp-features-technical-centered" aria-labelledby="features-technical-centered-title">
  <div class="lp-features-technical-centered__inner">
    <div class="lp-features-technical-centered__intro">
      <p class="lp-features-technical-centered__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-features-technical-centered__title" id="features-technical-centered-title">{{slot:title}}</h2>
      <p class="lp-features-technical-centered__lead">{{slot:lead}}</p>
    </div>

    <div class="lp-features-technical-centered__showcase">
      <figure class="lp-features-technical-centered__media">
        <picture>
          <source media="(max-width: 767px)" srcset="{{slot:product-image-mobile}}">
          <img src="{{slot:product-image}}" alt="{{slot:product-image-alt}}" loading="lazy">
        </picture>

        <button class="lp-features-technical-centered__hotspot lp-features-technical-centered__hotspot--one" type="button" aria-label="{{slot:hotspot-one-label}}">
          <span></span>
        </button>
        <button class="lp-features-technical-centered__hotspot lp-features-technical-centered__hotspot--two" type="button" aria-label="{{slot:hotspot-two-label}}">
          <span></span>
        </button>
        <button class="lp-features-technical-centered__hotspot lp-features-technical-centered__hotspot--three" type="button" aria-label="{{slot:hotspot-three-label}}">
          <span></span>
        </button>
      </figure>

      <div class="lp-features-technical-centered__panel">
        <p class="lp-features-technical-centered__panel-kicker">{{slot:detail-kicker}}</p>
        <h3 class="lp-features-technical-centered__panel-title">{{slot:detail-title}}</h3>
        <p class="lp-features-technical-centered__panel-text">{{slot:detail-text}}</p>

        <ul class="lp-features-technical-centered__list" aria-label="{{slot:features-list-label}}">
          <li>
            <span class="lp-features-technical-centered__marker"></span>
            <span>{{slot:feature-one}}</span>
          </li>
          <li>
            <span class="lp-features-technical-centered__marker"></span>
            <span>{{slot:feature-two}}</span>
          </li>
          <li>
            <span class="lp-features-technical-centered__marker"></span>
            <span>{{slot:feature-three}}</span>
          </li>
        </ul>

        <a class="lp-features-technical-centered__cta" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
      </div>
    </div>
  </div>
</section>
