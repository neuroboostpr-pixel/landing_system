<style>.lp-features-minimal-grid-2 {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-features-minimal-grid-2__inner {
  max-width: 1280px;
  margin: 0 auto;
}

.lp-features-minimal-grid-2__header {
  display: grid;
  gap: var(--lp-spacing-sm);
  margin-bottom: var(--lp-spacing-lg);
  max-width: 48rem;
}

.lp-features-minimal-grid-2__eyebrow {
  color: var(--lp-primary);
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.3;
  margin: 0;
}

.lp-features-minimal-grid-2__title {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 2rem;
  line-height: 1.1;
  margin: 0;
}

.lp-features-minimal-grid-2__subhead {
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.6;
  margin: 0;
}

.lp-features-minimal-grid-2__grid {
  display: grid;
  gap: var(--lp-spacing-md);
  list-style: none;
  margin: 0;
  padding: 0;
}

.lp-features-minimal-grid-2__card {
  min-width: 0;
}

.lp-features-minimal-grid-2__link {
  background: var(--lp-bg-alt);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  color: var(--lp-text);
  display: grid;
  gap: var(--lp-spacing-md);
  min-height: 100%;
  overflow: hidden;
  padding: var(--lp-spacing-md);
  text-decoration: none;
}

.lp-features-minimal-grid-2__link:focus-visible {
  outline: 2px solid var(--lp-primary);
  outline-offset: 4px;
}

.lp-features-minimal-grid-2__media {
  align-items: center;
  background: var(--lp-bg);
  border-radius: var(--lp-radius);
  display: flex;
  justify-content: center;
  min-height: 14rem;
  overflow: hidden;
  padding: var(--lp-spacing-md);
}

.lp-features-minimal-grid-2__media img {
  display: block;
  height: auto;
  max-height: 16rem;
  max-width: 100%;
  object-fit: contain;
}

.lp-features-minimal-grid-2__content {
  display: grid;
  gap: var(--lp-spacing-xs);
}

.lp-features-minimal-grid-2__name {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.25;
}

.lp-features-minimal-grid-2__text {
  color: var(--lp-text-muted);
  font-size: 0.9375rem;
  line-height: 1.55;
}

@media (min-width: 768px) {
  .lp-features-minimal-grid-2 {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-features-minimal-grid-2__header {
    margin-bottom: var(--lp-spacing-xl);
  }

  .lp-features-minimal-grid-2__title {
    font-size: 3rem;
  }

  .lp-features-minimal-grid-2__grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lp-features-minimal-grid-2__link {
    padding: var(--lp-spacing-lg);
  }

  .lp-features-minimal-grid-2__media {
    min-height: 18rem;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-features-minimal-grid-2" aria-labelledby="features-minimal-grid-2-title">
  <div class="lp-features-minimal-grid-2__inner">
    <div class="lp-features-minimal-grid-2__header">
      <p class="lp-features-minimal-grid-2__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-features-minimal-grid-2__title" id="features-minimal-grid-2-title">{{slot:title}}</h2>
      <p class="lp-features-minimal-grid-2__subhead">{{slot:subhead}}</p>
    </div>

    <ul class="lp-features-minimal-grid-2__grid">
      <li class="lp-features-minimal-grid-2__card">
        <a class="lp-features-minimal-grid-2__link" href="{{slot:feature-1-link}}" aria-label="{{slot:feature-1-link-label}}">
          <span class="lp-features-minimal-grid-2__media">
            <img src="{{slot:feature-1-image}}" alt="{{slot:feature-1-image-alt}}" loading="lazy">
          </span>
          <span class="lp-features-minimal-grid-2__content">
            <span class="lp-features-minimal-grid-2__name">{{slot:feature-1-title}}</span>
            <span class="lp-features-minimal-grid-2__text">{{slot:feature-1-text}}</span>
          </span>
        </a>
      </li>

      <li class="lp-features-minimal-grid-2__card">
        <a class="lp-features-minimal-grid-2__link" href="{{slot:feature-2-link}}" aria-label="{{slot:feature-2-link-label}}">
          <span class="lp-features-minimal-grid-2__media">
            <img src="{{slot:feature-2-image}}" alt="{{slot:feature-2-image-alt}}" loading="lazy">
          </span>
          <span class="lp-features-minimal-grid-2__content">
            <span class="lp-features-minimal-grid-2__name">{{slot:feature-2-title}}</span>
            <span class="lp-features-minimal-grid-2__text">{{slot:feature-2-text}}</span>
          </span>
        </a>
      </li>

      <li class="lp-features-minimal-grid-2__card">
        <a class="lp-features-minimal-grid-2__link" href="{{slot:feature-3-link}}" aria-label="{{slot:feature-3-link-label}}">
          <span class="lp-features-minimal-grid-2__media">
            <img src="{{slot:feature-3-image}}" alt="{{slot:feature-3-image-alt}}" loading="lazy">
          </span>
          <span class="lp-features-minimal-grid-2__content">
            <span class="lp-features-minimal-grid-2__name">{{slot:feature-3-title}}</span>
            <span class="lp-features-minimal-grid-2__text">{{slot:feature-3-text}}</span>
          </span>
        </a>
      </li>

      <li class="lp-features-minimal-grid-2__card">
        <a class="lp-features-minimal-grid-2__link" href="{{slot:feature-4-link}}" aria-label="{{slot:feature-4-link-label}}">
          <span class="lp-features-minimal-grid-2__media">
            <img src="{{slot:feature-4-image}}" alt="{{slot:feature-4-image-alt}}" loading="lazy">
          </span>
          <span class="lp-features-minimal-grid-2__content">
            <span class="lp-features-minimal-grid-2__name">{{slot:feature-4-title}}</span>
            <span class="lp-features-minimal-grid-2__text">{{slot:feature-4-text}}</span>
          </span>
        </a>
      </li>
    </ul>
  </div>
</section>
