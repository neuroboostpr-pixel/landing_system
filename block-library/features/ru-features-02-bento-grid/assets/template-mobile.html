<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-features-02-bento-grid — mobile</title>
<style>
  :root {
    --color-bg: #fff; --color-fg: #111; --color-accent: #333; --color-border: #ccc;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .features { padding: 40px 16px; }
  .section-headline { font-family: var(--font-display); font-size: 24px; text-align: center; margin: 0 0 28px; }
  .bento-photo { width: 100%; aspect-ratio: 1/1; background: #ddd; border: 1px solid var(--color-border); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #888; margin-bottom: 12px; }
  .bento-card { border: 1px solid var(--color-border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .icon-placeholder { width: 36px; height: 36px; border: 2px solid var(--color-border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #999; }
  .bento-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 0; }
  .bento-text { font-size: 14px; color: #555; margin: 0; line-height: 1.5; }
</style>
</head>
<body>
  <section class="features" data-block-id="ru-features-02-bento-grid">
    <h2 class="section-headline" data-slot="headline">[HEADLINE]</h2>
    <div class="bento-photo" data-slot="feature-photo">photo · 1:1 · feature-photo</div>
    <div class="bento-card">
      <div class="icon-placeholder" data-slot="bento-1-icon">icon</div>
      <h3 class="bento-title" data-slot="bento-1-title">[Преимущество 1]</h3>
      <p class="bento-text" data-slot="bento-1-text">[Описание 1]</p>
    </div>
    <div class="bento-card">
      <div class="icon-placeholder" data-slot="bento-2-icon">icon</div>
      <h3 class="bento-title" data-slot="bento-2-title">[Преимущество 2]</h3>
      <p class="bento-text" data-slot="bento-2-text">[Описание 2]</p>
    </div>
    <div class="bento-card">
      <div class="icon-placeholder" data-slot="bento-3-icon">icon</div>
      <h3 class="bento-title" data-slot="bento-3-title">[Преимущество 3]</h3>
      <p class="bento-text" data-slot="bento-3-text">[Описание 3]</p>
    </div>
  </section>
</body>
</html>
