<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-features-02-bento-grid — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .features { padding: 64px var(--spacing-lg); max-width: 1100px; margin: 0 auto; }
  .section-headline { font-family: var(--font-display); font-size: 36px; text-align: center; margin: 0 0 40px; }
  .bento { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 240px 240px; gap: 16px; }
  .bento-photo { grid-row: 1 / 3; background: #ddd; border: 1px solid var(--color-border); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #888; text-transform: uppercase; }
  .bento-card { border: 1px solid var(--color-border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
  .icon-placeholder { width: 40px; height: 40px; border: 2px solid var(--color-border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #999; }
  .bento-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0; }
  .bento-text { font-size: 14px; color: #555; margin: 0; line-height: 1.5; }
</style>
</head>
<body>
  <section class="features" data-block-id="ru-features-02-bento-grid">
    <h2 class="section-headline" data-slot="headline">[HEADLINE: заголовок секции]</h2>
    <div class="bento">
      <div class="bento-photo" data-slot="feature-photo">photo · 1:1 · feature-photo</div>
      <div class="bento-card">
        <div class="icon-placeholder" data-slot="bento-1-icon" data-slot-type="icon">icon</div>
        <h3 class="bento-title" data-slot="bento-1-title">[Преимущество 1]</h3>
        <p class="bento-text" data-slot="bento-1-text">[Описание первого преимущества]</p>
      </div>
      <div class="bento-card">
        <div class="icon-placeholder" data-slot="bento-2-icon" data-slot-type="icon">icon</div>
        <h3 class="bento-title" data-slot="bento-2-title">[Преимущество 2]</h3>
        <p class="bento-text" data-slot="bento-2-text">[Описание второго преимущества]</p>
      </div>
    </div>
    <div class="bento" style="margin-top: 16px; grid-template-rows: 240px;">
      <div class="bento-card">
        <div class="icon-placeholder" data-slot="bento-3-icon" data-slot-type="icon">icon</div>
        <h3 class="bento-title" data-slot="bento-3-title">[Преимущество 3]</h3>
        <p class="bento-text" data-slot="bento-3-text">[Описание третьего преимущества]</p>
      </div>
    </div>
  </section>
</body>
</html>
