<section class="lp-features-corporate-split" aria-labelledby="features-corporate-split-title">
  <div class="lp-features-corporate-split__content">
    <div class="lp-features-corporate-split__header">
      <span class="lp-features-corporate-split__eyebrow">{{slot:eyebrow}}</span>
      <h2 class="lp-features-corporate-split__title" id="features-corporate-split-title">{{slot:title}}</h2>
      <p class="lp-features-corporate-split__lead">{{slot:lead}}</p>
    </div>

    <ul class="lp-features-corporate-split__list" aria-label="{{slot:features-list-label}}">
      <li class="lp-features-corporate-split__item">
        <span class="lp-features-corporate-split__mark" aria-hidden="true"></span>
        <div class="lp-features-corporate-split__item-body">
          <h3 class="lp-features-corporate-split__item-title">{{slot:feature-1-title}}</h3>
          <p class="lp-features-corporate-split__item-text">{{slot:feature-1-text}}</p>
        </div>
      </li>
      <li class="lp-features-corporate-split__item">
        <span class="lp-features-corporate-split__mark" aria-hidden="true"></span>
        <div class="lp-features-corporate-split__item-body">
          <h3 class="lp-features-corporate-split__item-title">{{slot:feature-2-title}}</h3>
          <p class="lp-features-corporate-split__item-text">{{slot:feature-2-text}}</p>
        </div>
      </li>
      <li class="lp-features-corporate-split__item">
        <span class="lp-features-corporate-split__mark" aria-hidden="true"></span>
        <div class="lp-features-corporate-split__item-body">
          <h3 class="lp-features-corporate-split__item-title">{{slot:feature-3-title}}</h3>
          <p class="lp-features-corporate-split__item-text">{{slot:feature-3-text}}</p>
        </div>
      </li>
      <li class="lp-features-corporate-split__item">
        <span class="lp-features-corporate-split__mark" aria-hidden="true"></span>
        <div class="lp-features-corporate-split__item-body">
          <h3 class="lp-features-corporate-split__item-title">{{slot:feature-4-title}}</h3>
          <p class="lp-features-corporate-split__item-text">{{slot:feature-4-text}}</p>
        </div>
      </li>
    </ul>
  </div>

  <figure class="lp-features-corporate-split__media">
    <picture>
      <source media="(max-width: 767px)" srcset="{{slot:image-mobile}}">
      <img src="{{slot:image}}" alt="{{slot:image-alt}}" loading="lazy">
    </picture>
    <figcaption class="lp-features-corporate-split__caption">{{slot:image-caption}}</figcaption>
  </figure>
</section>
