<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; padding: 32px 16px; }
  .headline { font-family: var(--font-display); font-size: 2rem; line-height: .95; text-transform: uppercase; letter-spacing: -.03em; margin-bottom: 24px; }
  .headline span { color: var(--lp-accent); }
  .cards-grid { display: flex; flex-direction: column; gap: 14px; }
  .card { border: 3px solid var(--lp-border); padding: 16px; box-shadow: 5px 5px 0 var(--lp-border); display: flex; flex-direction: column; gap: 8px; }
  .card-c1 { background:#fff; }
  .card-c2 { background:var(--lp-accent); }
  .card-c3 { background:var(--lp-accent); }
  .card-c4 { background:var(--lp-accent); color:var(--lp-text-muted); }
  .card-num { font-size: 2.2rem; font-weight: 900; line-height: 1; }
  .card-title { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; }
  .card-text { font-size: .875rem; line-height: 1.4; font-weight: 600; opacity: .85; }
</style>
<section data-block-id="ru-features-03-swiss-cards">
<h2 class="headline">{{slot:headline}}</h2>
<div class="cards-grid">
<article class="card card-c1">
<div class="card-num">01</div>
<div class="card-title">{{slot:card-1-title}}</div>
<p class="card-text">{{slot:card-1-text}}</p>
</article>
<article class="card card-c2">
<div class="card-num">02</div>
<div class="card-title">{{slot:card-2-title}}</div>
<p class="card-text">{{slot:card-2-text}}</p>
</article>
<article class="card card-c3">
<div class="card-num">03</div>
<div class="card-title">{{slot:card-3-title}}</div>
<p class="card-text">{{slot:card-3-text}}</p>
</article>
<article class="card card-c4">
<div class="card-num">04</div>
<div class="card-title">{{slot:card-4-title}}</div>
<p class="card-text">{{slot:card-4-text}}</p>
</article>
</div>
</section>
