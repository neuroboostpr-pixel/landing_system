<style>
  :root {
    --color-bg: #efe7d2; --color-fg: #15140f; --color-accent: #ed6f5c;
    --color-border: rgba(21,20,15,0.16); --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Inter Tight', system-ui, sans-serif; --spacing-md: 16px; --spacing-lg: 32px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .method-section { padding: 100px 0; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 64px; }
  .method-head { display: grid; grid-template-columns: 1.4fr 1fr; gap: 60px; align-items: end; margin-bottom: 60px; }
  .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-accent); display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .kicker::before { content: ''; width: 18px; height: 1px; background: var(--color-accent); }
  .section-title { font-family: var(--font-body); font-weight: 800; font-size: clamp(36px, 4vw, 58px); line-height: 1.0; letter-spacing: -0.028em; }
  .section-title em { font-family: var(--font-display); font-style: italic; font-weight: 500; }
  .section-lead { font-size: 15px; line-height: 1.55; color: rgba(21,20,15,0.65); }
  .method-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; position: relative; }
  .method-grid::before { content: ''; position: absolute; top: 28px; left: 40px; right: 40px; height: 1px; background: var(--color-border); z-index: 0; }
  .step { position: relative; z-index: 1; }
  .step-num { font-family: var(--font-body); font-size: 28px; font-weight: 700; color: var(--color-accent); letter-spacing: -0.02em; margin-bottom: 16px; background: var(--color-bg); display: inline-block; padding-right: 12px; }
  .step h4 { font-size: 17px; font-weight: 700; margin-bottom: 10px; line-height: 1.2; }
  .step p { font-size: 13.5px; color: rgba(21,20,15,0.65); line-height: 1.55; }
</style>
<section class="method-section" data-block-id="ru-features-05-method-steps">
<div class="wrap">
<div class="method-head">
<div>
<div class="kicker">{{slot:kicker}}</div>
<h2 class="section-title">{{slot:section-title}}</h2>
</div>
<p class="section-lead">{{slot:subhead}}</p>
</div>
<div class="method-grid">
<div class="step">
<div class="step-num">01</div>
<h4>{{slot:step-1-title}}</h4>
<p>{{slot:step-1-desc}}</p>
</div>
<div class="step">
<div class="step-num">02</div>
<h4>{{slot:step-2-title}}</h4>
<p>{{slot:step-2-desc}}</p>
</div>
<div class="step">
<div class="step-num">03</div>
<h4>{{slot:step-3-title}}</h4>
<p>{{slot:step-3-desc}}</p>
</div>
<div class="step">
<div class="step-num">04</div>
<h4>{{slot:step-4-title}}</h4>
<p>{{slot:step-4-desc}}</p>
</div>
</div>
</div>
</section>
