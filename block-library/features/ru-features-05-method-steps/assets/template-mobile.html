<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333;
    --lp-border: #e0e0e0;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Inter Tight', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; padding: 40px 20px; }
  .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--lp-accent); display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .kicker::before { content: ''; width: 14px; height: 1px; background: var(--lp-accent); }
  .section-title { font-size: 36px; font-weight: 800; letter-spacing: -0.028em; margin-bottom: 16px; }
  .section-title em { font-family: var(--font-display); font-style: italic; font-weight: 500; }
  .section-lead { font-size: 15px; line-height: 1.55; color: rgba(21,20,15,0.65); margin-bottom: 36px; }
  .step { border-top: 1px solid var(--lp-border); padding: 20px 0; }
  .step-num { font-size: 24px; font-weight: 700; color: var(--lp-accent); margin-bottom: 12px; }
  .step h4 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .step p { font-size: 13px; color: rgba(21,20,15,0.65); line-height: 1.55; }
</style>
<section data-block-id="ru-features-05-method-steps">
<div class="kicker">{{slot:kicker}}</div>
<h2 class="section-title">{{slot:section-title}}</h2>
<p class="section-lead">{{slot:subhead}}</p>
<div class="step"><div class="step-num">01</div><h4>{{slot:step-1-title}}</h4><p>{{slot:step-1-desc}}</p></div>
<div class="step"><div class="step-num">02</div><h4>{{slot:step-2-title}}</h4><p>{{slot:step-2-desc}}</p></div>
<div class="step"><div class="step-num">03</div><h4>{{slot:step-3-title}}</h4><p>{{slot:step-3-desc}}</p></div>
<div class="step"><div class="step-num">04</div><h4>{{slot:step-4-title}}</h4><p>{{slot:step-4-desc}}</p></div>
</section>
