<!DOCTYPE html>

<html lang="ru"><head><meta charset="UTF-8"><title>ru-features-05-method-steps — mobile</title>
<style>
  :root {
    --color-bg: #efe7d2; --color-fg: #15140f; --color-accent: #ed6f5c;
    --color-border: rgba(21,20,15,0.16);
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Inter Tight', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; padding: 40px 20px; }
  .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-accent); display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .kicker::before { content: ''; width: 14px; height: 1px; background: var(--color-accent); }
  .section-title { font-size: 36px; font-weight: 800; letter-spacing: -0.028em; margin-bottom: 16px; }
  .section-title em { font-family: var(--font-display); font-style: italic; font-weight: 500; }
  .section-lead { font-size: 15px; line-height: 1.55; color: rgba(21,20,15,0.65); margin-bottom: 36px; }
  .step { border-top: 1px solid var(--color-border); padding: 20px 0; }
  .step-num { font-size: 24px; font-weight: 700; color: var(--color-accent); margin-bottom: 12px; }
  .step h4 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .step p { font-size: 13px; color: rgba(21,20,15,0.65); line-height: 1.55; }
</style></head>
<body>
  <section data-block-id="ru-features-05-method-steps">
    <div class="kicker" data-slot="kicker">[Наш метод]</div>
    <h2 class="section-title" data-slot="headline">[Заголовок с <em>акцентом</em>]</h2>
    <p class="section-lead" data-slot="subhead">[Кратко о подходе]</p>
    <div class="step"><div class="step-num">01</div><h4 data-slot="step-1-title">[Шаг 1]</h4><p data-slot="step-1-desc">[Описание]</p></div>
    <div class="step"><div class="step-num">02</div><h4 data-slot="step-2-title">[Шаг 2]</h4><p data-slot="step-2-desc">[Описание]</p></div>
    <div class="step"><div class="step-num">03</div><h4 data-slot="step-3-title">[Шаг 3]</h4><p data-slot="step-3-desc">[Описание]</p></div>
    <div class="step"><div class="step-num">04</div><h4 data-slot="step-4-title">[Результат]</h4><p data-slot="step-4-desc">[Результат]</p></div>
  </section>
</body></html>
