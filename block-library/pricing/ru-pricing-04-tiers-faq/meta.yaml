id: ru-pricing-04-tiers-faq
category: pricing
ru_market: true
use_cases:
- services
- b2c
description: 'Pricing-блок с тремя тирами и секцией FAQ по оплате на одной странице.
  Синий акцент, featured-бейдж, встроенные FAQ без collapse. Адаптирован из pricing-page (Apache-2.0).'
display_name_ru: Тарифы + FAQ о стоимости — комбинированный блок
layout_summary_ru: Три тарифные карточки вверху (featured с border-highlight), затем
  заголовок FAQ и три вопроса-ответа в static-режиме (без accordion). Mobile — стек.
slots:
- {type: text, name: headline, max_chars: 60, required: true}
- {type: text, name: subhead, max_chars: 160, required: false}
- {type: text, name: tier-1-name, max_chars: 30, required: true}
- {type: text, name: tier-1-price, max_chars: 30, required: true}
- {type: text, name: tier-1-desc, max_chars: 80, required: false}
- {type: cta, name: tier-1-cta, default_text: Начать, required: true}
- {type: text, name: tier-2-name, max_chars: 30, required: true}
- {type: text, name: tier-2-price, max_chars: 30, required: true}
- {type: text, name: tier-2-desc, max_chars: 80, required: false}
- {type: cta, name: tier-2-cta, default_text: Выбрать Профи, required: true}
- {type: text, name: tier-3-name, max_chars: 30, required: true}
- {type: text, name: tier-3-price, max_chars: 30, required: true}
- {type: text, name: tier-3-desc, max_chars: 80, required: false}
- {type: cta, name: tier-3-cta, default_text: Связаться, required: true}
- {type: text, name: faq-headline, max_chars: 60, required: false}
- {type: text, name: faq-1-q, max_chars: 100, required: true}
- {type: text, name: faq-1-a, max_chars: 300, required: true}
- {type: text, name: faq-2-q, max_chars: 100, required: true}
- {type: text, name: faq-2-a, max_chars: 300, required: true}
- {type: text, name: faq-3-q, max_chars: 100, required: true}
- {type: text, name: faq-3-a, max_chars: 300, required: true}
conversion_notes: Встроенный FAQ снимает страхи по оплате прямо в секции pricing.
  FAQ без collapse (всё видно) работает лучше на landing-страницах. Задавайте
  типичные возражения клиентов по оплате.
source: opendesign
source_attribution: 'github.com/nexu-io/open-design: design-templates/pricing-page (Apache-2.0)'
