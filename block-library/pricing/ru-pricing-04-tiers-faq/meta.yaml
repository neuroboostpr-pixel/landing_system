category: Pricing
conversion_notes: Встроенный FAQ снимает страхи по оплате прямо в секции pricing.
  FAQ без collapse (всё видно) работает лучше на landing-страницах. Задавайте типичные
  возражения клиентов по оплате.
created: '2026-05-13'
description: Pricing-блок с тремя тирами и секцией FAQ по оплате на одной странице.
  Синий акцент, featured-бейдж, встроенные FAQ без collapse. Адаптирован из pricing-page
  (Apache-2.0).
