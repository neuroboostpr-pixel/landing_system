<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/pricing-page/example.html | License: Apache-2.0 -->
<html lang="ru"><head><meta charset="UTF-8"><title>ru-pricing-04-tiers-faq — mobile</title>
<style>
  :root { --color-bg:#ffffff; --color-fg:#111110; --color-accent:#2563eb; --color-border:#e5e7eb; --color-muted:#6b7280; --font-body:system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); width:375px; padding:40px 20px; display:flex; flex-direction:column; gap:20px; }
  h2 { font-size:26px; font-weight:700; letter-spacing:-0.02em; text-align:center; }
  .tier { border:1px solid var(--color-border); border-radius:12px; padding:22px; }
  .tier.featured { border-color:var(--color-accent); }
  .tier-badge { display:inline-block; background:var(--color-accent); color:#fff; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; margin-bottom:8px; }
  .tier-name { font-size:16px; font-weight:600; margin-bottom:4px; }
  .tier-price { font-size:32px; font-weight:700; letter-spacing:-0.02em; margin-bottom:16px; }
  .tier-price small { font-size:13px; color:var(--color-muted); font-weight:400; }
  .tier-btn { display:block; width:100%; padding:11px; border-radius:8px; font:inherit; font-weight:500; cursor:pointer; text-align:center; text-decoration:none; }
  .btn-primary { background:var(--color-accent); color:#fff; border:none; }
  .btn-outline { background:transparent; color:var(--color-fg); border:1px solid var(--color-border); }
  .faq-head h3 { font-size:20px; font-weight:700; margin-bottom:16px; }
  .faq-item { border-top:1px solid var(--color-border); padding:14px 0; }
  .faq-q { font-size:14px; font-weight:600; margin-bottom:6px; }
  .faq-a { font-size:13px; line-height:1.6; color:var(--color-muted); }
</style></head>
<body>
  <h2 data-slot="headline">[Тарифы]</h2>
  <div class="tier"><div class="tier-name">[Базовый]</div><div class="tier-price">[X ₽<small>/мес</small>]</div><a class="tier-btn btn-outline" href="#contact">[Начать]</a></div>
  <div class="tier featured"><div class="tier-badge">Популярный</div><div class="tier-name">[Профи]</div><div class="tier-price">[Y ₽<small>/мес</small>]</div><a class="tier-btn btn-primary" href="#contact">[Выбрать]</a></div>
  <div class="tier"><div class="tier-name">[Enterprise]</div><div class="tier-price">[Индивидуально]</div><a class="tier-btn btn-outline" href="#contact">[Связаться]</a></div>
  <div class="faq-head"><h3 data-slot="faq-headline">[FAQ о стоимости]</h3></div>
  <div class="faq-item"><div class="faq-q" data-slot="faq-1-q">[Вопрос 1]</div><div class="faq-a" data-slot="faq-1-a">[Ответ 1]</div></div>
  <div class="faq-item"><div class="faq-q" data-slot="faq-2-q">[Вопрос 2]</div><div class="faq-a" data-slot="faq-2-a">[Ответ 2]</div></div>
  <div class="faq-item"><div class="faq-q" data-slot="faq-3-q">[Вопрос 3]</div><div class="faq-a" data-slot="faq-3-a">[Ответ 3]</div></div>
</body></html>
