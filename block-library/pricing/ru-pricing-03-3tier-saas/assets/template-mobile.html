<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/saas-landing/example.html | License: Apache-2.0 -->
<html lang="ru"><head><meta charset="UTF-8"><title>ru-pricing-03-3tier-saas — mobile</title>
<style>
  :root { --color-bg:#fafaf9; --color-fg:#1c1b1a; --color-accent:#c96442; --color-border:#e6e4e0; --color-surface:#ffffff; --color-muted:#6b6964; --font-body:system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); width:375px; padding:40px 20px; display:flex; flex-direction:column; gap:24px; }
  .section-head { text-align:center; }
  .section-head h2 { font-size:28px; letter-spacing:-0.02em; margin-bottom:10px; font-weight:700; }
  .section-head p { color:var(--color-muted); font-size:15px; }
  .tier { background:var(--color-surface); border:1px solid var(--color-border); border-radius:14px; padding:24px; position:relative; }
  .tier.featured { border-color:var(--color-accent); }
  .tier.featured::before { content:"Рекомендуем"; position:absolute; top:-12px; left:20px; background:var(--color-accent); color:white; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:500; }
  .tier-name { font-size:17px; font-weight:600; margin-bottom:6px; }
  .tier-price { font-size:36px; letter-spacing:-0.02em; font-weight:700; margin-bottom:16px; }
  .tier-price small { font-size:14px; color:var(--color-muted); font-weight:400; }
  .tier-features { list-style:none; padding:0; margin:0 0 20px; color:var(--color-muted); font-size:13px; border-top:1px solid var(--color-border); }
  .tier-features li { padding:6px 0; border-bottom:1px solid var(--color-border); display:flex; align-items:center; gap:6px; }
  .tier-features li::before { content:"✓"; color:var(--color-accent); font-weight:700; }
  .btn-primary { display:block; width:100%; padding:12px 20px; background:var(--color-accent); color:white; border:none; border-radius:8px; font:inherit; font-weight:500; cursor:pointer; text-align:center; text-decoration:none; }
  .btn-secondary { display:block; width:100%; padding:12px 20px; background:transparent; color:var(--color-fg); border:1px solid var(--color-border); border-radius:8px; font:inherit; font-weight:500; cursor:pointer; text-align:center; text-decoration:none; }
</style></head>
<body>
  <div class="section-head">
    <h2 data-slot="headline">[Тарифы]</h2>
    <p data-slot="subhead">[Выберите подходящий тариф]</p>
  </div>
  <div class="tier">
    <div class="tier-name" data-slot="tier-1-name">[Старт]</div>
    <div class="tier-price" data-slot="tier-1-price">[X ₽<small>/мес</small>]</div>
    <ul class="tier-features">
      <li>[Функция 1]</li><li>[Функция 2]</li><li>[Функция 3]</li>
    </ul>
    <a class="btn-secondary" data-slot="tier-1-cta" href="#contact">[Начать]</a>
  </div>
  <div class="tier featured">
    <div class="tier-name" data-slot="tier-2-name">[Бизнес]</div>
    <div class="tier-price" data-slot="tier-2-price">[Y ₽<small>/мес</small>]</div>
    <ul class="tier-features">
      <li>[Функция 1]</li><li>[Функция 2]</li><li>[Функция 3]</li><li>[Функция 4]</li>
    </ul>
    <a class="btn-primary" data-slot="tier-2-cta" href="#contact">[Выбрать]</a>
  </div>
  <div class="tier">
    <div class="tier-name" data-slot="tier-3-name">[Корпоративный]</div>
    <div class="tier-price">[Индивидуально]</div>
    <ul class="tier-features">
      <li>[SLA]</li><li>[Поддержка]</li><li>[Индивидуально]</li>
    </ul>
    <a class="btn-secondary" data-slot="tier-3-cta" href="#contact">[Обсудить]</a>
  </div>
</body></html>
