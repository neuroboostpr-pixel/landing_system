<style>.lp-cta-minimal-centered {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-cta-minimal-centered__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  margin: 0 auto;
  max-width: 1120px;
  place-items: center;
  text-align: center;
}

.lp-cta-minimal-centered__media {
  display: grid;
  max-width: 280px;
  place-items: center;
}

.lp-cta-minimal-centered__media img {
  display: block;
  height: auto;
  max-width: 100%;
  object-fit: contain;
}

.lp-cta-minimal-centered__content {
  display: grid;
  gap: var(--lp-spacing-md);
  justify-items: center;
  max-width: 760px;
}

.lp-cta-minimal-centered__eyebrow {
  color: var(--lp-accent);
  font-family: var(--lp-font-body);
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.3;
  margin: 0;
}

.lp-cta-minimal-centered__title {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 7vw, 4.5rem);
  font-weight: 800;
  letter-spacing: 0;
  line-height: 0.95;
  margin: 0;
}

.lp-cta-minimal-centered__text {
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.6;
  margin: 0;
  max-width: 620px;
}

.lp-cta-minimal-centered__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  justify-content: center;
  margin-top: var(--lp-spacing-xs);
}

.lp-cta-minimal-centered__button {
  align-items: center;
  background: var(--lp-primary);
  border: 1px solid var(--lp-primary);
  border-radius: var(--lp-radius);
  color: white;
  display: inline-flex;
  font-weight: 700;
  justify-content: center;
  line-height: 1.2;
  min-height: 3.25rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  text-decoration: none;
}

.lp-cta-minimal-centered__button:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 3px;
}

@media (min-width: 768px) {
  .lp-cta-minimal-centered {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-cta-minimal-centered__inner {
    gap: var(--lp-spacing-xl);
  }

  .lp-cta-minimal-centered__media {
    max-width: 360px;
  }

  .lp-cta-minimal-centered__text {
    font-size: 1.125rem;
  }
}
</style>
<section class="lp-cta-minimal-centered" aria-labelledby="lp-cta-minimal-centered-title">
  <div class="lp-cta-minimal-centered__inner">
    <div class="lp-cta-minimal-centered__media" aria-hidden="true">
      <img src="{{slot:decor-image}}" alt="{{slot:decor-image-alt}}" loading="lazy">
    </div>

    <div class="lp-cta-minimal-centered__content">
      <p class="lp-cta-minimal-centered__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-cta-minimal-centered__title" id="lp-cta-minimal-centered-title">{{slot:heading}}</h2>
      <p class="lp-cta-minimal-centered__text">{{slot:subhead}}</p>

      <div class="lp-cta-minimal-centered__actions">
        <a class="lp-cta-minimal-centered__button" href="{{slot:primary-cta-link}}">
          {{slot:primary-cta-label}}
        </a>
      </div>
    </div>
  </div>
</section>
