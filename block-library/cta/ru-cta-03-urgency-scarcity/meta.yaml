description: "Акцентная полоса дефицита: 'Осталось X мест / До конца акции'. Оранжевый фон, текст счётчика и CTA 'Успеть получить'. Без таймера на JS."
display_name_ru: "⏰ Полоса срочности — осталось X мест"
layout_summary_ru: "Оранжевая полоса с крупным числом 'Осталось X мест' или датой окончания, подзаголовком и одной кнопкой. Дефицит без JS-таймера — только текст."
slots:
  - {type: text, name: urgency-label, max_chars: 60, required: true}
  - {type: text, name: seats-count, max_chars: 5, required: false}
  - {type: text, name: deadline-date, max_chars: 30, required: false}
  - {type: text, name: subhead, max_chars: 120, required: false}
  - {type: cta, name: primary-cta, default_text: "Успеть получить", required: true}
conversion_notes: "Дефицит по количеству или дате — один из сильнейших триггеров (книга, стр. 29). Важно: не обманывать — если указана дата, держать слово."
source: manual
