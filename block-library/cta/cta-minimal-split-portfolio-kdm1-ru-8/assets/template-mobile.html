<style>.lp-cta-minimal-split {
  background: var(--lp-bg-alt);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-cta-minimal-split__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  margin: 0 auto;
  max-width: 1280px;
}

.lp-cta-minimal-split__media {
  background: var(--lp-bg);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  overflow: hidden;
}

.lp-cta-minimal-split__media img {
  aspect-ratio: 4 / 3;
  display: block;
  height: 100%;
  object-fit: cover;
  width: 100%;
}

.lp-cta-minimal-split__card {
  background: var(--lp-bg);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  padding: var(--lp-spacing-lg);
}

.lp-cta-minimal-split__eyebrow {
  color: var(--lp-accent);
  font-size: 0.875rem;
  font-weight: 700;
  margin: 0 0 var(--lp-spacing-sm);
}

.lp-cta-minimal-split__title {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 2rem;
  line-height: 1.1;
  margin: 0;
}

.lp-cta-minimal-split__text {
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.6;
  margin: var(--lp-spacing-md) 0 0;
}

.lp-cta-minimal-split__form {
  display: grid;
  gap: var(--lp-spacing-md);
  margin-top: var(--lp-spacing-lg);
}

.lp-cta-minimal-split__field {
  display: grid;
  gap: var(--lp-spacing-xs);
}

.lp-cta-minimal-split__field label {
  color: var(--lp-text);
  font-size: 0.875rem;
  font-weight: 700;
}

.lp-cta-minimal-split__field input,
.lp-cta-minimal-split__field textarea {
  background: var(--lp-bg-alt);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  color: var(--lp-text);
  font: inherit;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  width: 100%;
}

.lp-cta-minimal-split__field textarea {
  resize: vertical;
}

.lp-cta-minimal-split__field input:focus,
.lp-cta-minimal-split__field textarea:focus {
  border-color: var(--lp-primary);
  outline: 2px solid var(--lp-primary);
  outline-offset: 2px;
}

.lp-cta-minimal-split__button {
  align-items: center;
  background: var(--lp-primary);
  border: 1px solid var(--lp-primary);
  border-radius: var(--lp-radius);
  color: var(--lp-bg);
  cursor: pointer;
  display: inline-flex;
  font: inherit;
  font-weight: 700;
  justify-content: center;
  min-height: 3rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  text-align: center;
}

.lp-cta-minimal-split__button:focus {
  outline: 2px solid var(--lp-accent);
  outline-offset: 2px;
}

.lp-cta-minimal-split__note {
  color: var(--lp-text-muted);
  font-size: 0.875rem;
  line-height: 1.5;
  margin: 0;
}

@media (min-width: 768px) {
  .lp-cta-minimal-split__inner {
    align-items: center;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }

  .lp-cta-minimal-split__card {
    padding: var(--lp-spacing-xl);
  }

  .lp-cta-minimal-split__title {
    font-size: 3rem;
  }

  .lp-cta-minimal-split__media img {
    aspect-ratio: 1 / 1;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-cta-minimal-split" aria-labelledby="lp-cta-minimal-split-title">
  <div class="lp-cta-minimal-split__inner">
    <div class="lp-cta-minimal-split__media">
      <img src="{{slot:cta-image}}" alt="{{slot:cta-image-alt}}" loading="lazy">
    </div>

    <div class="lp-cta-minimal-split__card">
      <p class="lp-cta-minimal-split__eyebrow">{{slot:cta-eyebrow}}</p>
      <h2 class="lp-cta-minimal-split__title" id="lp-cta-minimal-split-title">{{slot:cta-heading}}</h2>
      <p class="lp-cta-minimal-split__text">{{slot:cta-subhead}}</p>

      <form class="lp-cta-minimal-split__form" action="{{slot:form-action}}" method="post">
        <div class="lp-cta-minimal-split__field">
          <label for="lp-cta-minimal-split-name">{{slot:name-label}}</label>
          <input id="lp-cta-minimal-split-name" name="name" type="text" placeholder="{{slot:name-placeholder}}">
        </div>

        <div class="lp-cta-minimal-split__field">
          <label for="lp-cta-minimal-split-contact">{{slot:contact-label}}</label>
          <input id="lp-cta-minimal-split-contact" name="contact" type="text" placeholder="{{slot:contact-placeholder}}">
        </div>

        <div class="lp-cta-minimal-split__field">
          <label for="lp-cta-minimal-split-message">{{slot:message-label}}</label>
          <textarea id="lp-cta-minimal-split-message" name="message" rows="4" placeholder="{{slot:message-placeholder}}"></textarea>
        </div>

        <button class="lp-cta-minimal-split__button" type="submit">{{slot:submit-label}}</button>
        <p class="lp-cta-minimal-split__note">{{slot:form-note}}</p>
      </form>
    </div>
  </div>
</section>
