<style>.lp-cta-brutalist-split {
  position: relative;
  display: grid;
  gap: var(--lp-spacing-lg);
  overflow: hidden;
  padding: var(--lp-spacing-xl);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
}

.lp-cta-brutalist-split__content {
  position: relative;
  z-index: 1;
  display: grid;
  gap: var(--lp-spacing-md);
  max-width: 44rem;
}

.lp-cta-brutalist-split__badge {
  width: fit-content;
  margin: 0;
  padding: var(--lp-spacing-xs) var(--lp-spacing-sm);
  border: 1px solid var(--lp-primary);
  background: var(--lp-primary);
  color: var(--lp-bg);
  font-size: 0.78rem;
  font-weight: 800;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0;
}

.lp-cta-brutalist-split__title {
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2.4rem, 12vw, 6.5rem);
  font-weight: 900;
  line-height: 0.88;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-cta-brutalist-split__text {
  max-width: 36rem;
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.55;
}

.lp-cta-brutalist-split__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  padding-top: var(--lp-spacing-sm);
}

.lp-cta-brutalist-split__button {
  display: inline-flex;
  min-height: 3rem;
  align-items: center;
  justify-content: center;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  border: 1px solid var(--lp-text);
  border-radius: var(--lp-radius);
  font-weight: 800;
  line-height: 1;
  text-decoration: none;
  text-transform: uppercase;
}

.lp-cta-brutalist-split__button--primary {
  background: var(--lp-primary);
  color: var(--lp-bg);
  border-color: var(--lp-primary);
}

.lp-cta-brutalist-split__button--secondary {
  background: transparent;
  color: var(--lp-text);
}

.lp-cta-brutalist-split__media {
  position: relative;
  min-height: 16rem;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg-alt);
}

.lp-cta-brutalist-split__media::before {
  content: "";
  position: absolute;
  inset: var(--lp-spacing-md);
  border: 1px solid var(--lp-primary);
}

.lp-cta-brutalist-split__media picture,
.lp-cta-brutalist-split__media img {
  display: block;
  width: 100%;
  height: 100%;
}

.lp-cta-brutalist-split__media img {
  object-fit: cover;
  object-position: center;
}

@media (min-width: 768px) {
  .lp-cta-brutalist-split {
    grid-template-columns: minmax(0, 1.15fr) minmax(18rem, 0.85fr);
    align-items: stretch;
    min-height: 34rem;
  }

  .lp-cta-brutalist-split__content {
    align-content: center;
  }

  .lp-cta-brutalist-split__media {
    min-height: 100%;
  }
}
</style>
<section class="lp-cta-brutalist-split" aria-labelledby="lp-cta-brutalist-split-title">
  <div class="lp-cta-brutalist-split__content">
    <p class="lp-cta-brutalist-split__badge">{{slot:badge}}</p>
    <h2 class="lp-cta-brutalist-split__title" id="lp-cta-brutalist-split-title">{{slot:heading}}</h2>
    <p class="lp-cta-brutalist-split__text">{{slot:subhead}}</p>
    <div class="lp-cta-brutalist-split__actions">
      <a class="lp-cta-brutalist-split__button lp-cta-brutalist-split__button--primary" href="{{slot:primary-cta-link}}">
        {{slot:primary-cta-label}}
      </a>
      <a class="lp-cta-brutalist-split__button lp-cta-brutalist-split__button--secondary" href="{{slot:secondary-cta-link}}">
        {{slot:secondary-cta-label}}
      </a>
    </div>
  </div>
  <div class="lp-cta-brutalist-split__media" aria-hidden="true">
    <picture>
      <source media="(max-width: 767px)" srcset="{{slot:background-image-mobile}}">
      <img src="{{slot:background-image}}" alt="{{slot:background-image-alt}}" loading="lazy">
    </picture>
  </div>
</section>
