<section class="lp-cta-brutalist-split" aria-labelledby="cta-brutalist-split-title">
  <div class="lp-cta-brutalist-split__content">
    <p class="lp-cta-brutalist-split__eyebrow">{{slot:eyebrow}}</p>
    <h2 class="lp-cta-brutalist-split__title" id="cta-brutalist-split-title">{{slot:heading}}</h2>
    <p class="lp-cta-brutalist-split__text">{{slot:subhead}}</p>

    <form class="lp-cta-brutalist-split__form" action="{{slot:form-action}}" method="post">
      <label class="lp-cta-brutalist-split__field">
        <span>{{slot:field-name-label}}</span>
        <input type="text" name="{{slot:field-name-name}}" placeholder="{{slot:field-name-placeholder}}" autocomplete="name">
      </label>

      <label class="lp-cta-brutalist-split__field">
        <span>{{slot:field-contact-label}}</span>
        <input type="tel" name="{{slot:field-contact-name}}" placeholder="{{slot:field-contact-placeholder}}" autocomplete="tel">
      </label>

      <button class="lp-cta-brutalist-split__button" type="submit">{{slot:cta-label}}</button>

      <p class="lp-cta-brutalist-split__note">{{slot:form-note}}</p>
    </form>
  </div>

  <figure class="lp-cta-brutalist-split__media">
    <img src="{{slot:lead-image}}" alt="{{slot:lead-image-alt}}" loading="lazy">
    <figcaption class="lp-cta-brutalist-split__caption">{{slot:image-caption}}</figcaption>
  </figure>
</section>
