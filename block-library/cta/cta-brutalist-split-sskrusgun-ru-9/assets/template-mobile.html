<style>.lp-cta-brutalist-split {
  display: grid;
  gap: var(--lp-spacing-lg);
  padding: var(--lp-spacing-xl);
  color: var(--lp-text);
  background: var(--lp-primary);
  border: 1px solid var(--lp-border);
  font-family: var(--lp-font-body);
}

.lp-cta-brutalist-split__content {
  display: flex;
  flex-direction: column;
  gap: var(--lp-spacing-md);
}

.lp-cta-brutalist-split__eyebrow {
  margin: 0;
  color: var(--lp-bg);
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-cta-brutalist-split__title {
  max-width: 12em;
  margin: 0;
  color: var(--lp-bg);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 8vw, 4.75rem);
  line-height: 0.95;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-cta-brutalist-split__text {
  max-width: 38rem;
  margin: 0;
  color: var(--lp-bg-alt);
  font-size: 1rem;
  line-height: 1.6;
}

.lp-cta-brutalist-split__form {
  display: grid;
  gap: var(--lp-spacing-sm);
  max-width: 42rem;
  padding: var(--lp-spacing-md);
  background: var(--lp-bg);
  border: 1px solid var(--lp-text);
  border-radius: var(--lp-radius);
}

.lp-cta-brutalist-split__field {
  display: grid;
  gap: var(--lp-spacing-xs);
  color: var(--lp-text);
  font-size: 0.875rem;
  font-weight: 700;
}

.lp-cta-brutalist-split__field input {
  width: 100%;
  box-sizing: border-box;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  color: var(--lp-text);
  background: var(--lp-bg-alt);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  font: inherit;
}

.lp-cta-brutalist-split__field input:focus {
  outline: 2px solid var(--lp-accent);
  outline-offset: 2px;
}

.lp-cta-brutalist-split__button {
  width: 100%;
  min-height: 3.25rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  color: var(--lp-bg);
  background: var(--lp-text);
  border: 1px solid var(--lp-text);
  border-radius: var(--lp-radius);
  font-family: var(--lp-font-display);
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
  cursor: pointer;
}

.lp-cta-brutalist-split__button:focus {
  outline: 2px solid var(--lp-accent);
  outline-offset: 2px;
}

.lp-cta-brutalist-split__note {
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 0.8125rem;
  line-height: 1.5;
}

.lp-cta-brutalist-split__media {
  position: relative;
  min-height: 18rem;
  margin: 0;
  overflow: hidden;
  background: var(--lp-bg-alt);
  border: 1px solid var(--lp-text);
  border-radius: var(--lp-radius-lg);
}

.lp-cta-brutalist-split__media img {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 18rem;
  object-fit: cover;
}

.lp-cta-brutalist-split__caption {
  position: absolute;
  right: var(--lp-spacing-sm);
  bottom: var(--lp-spacing-sm);
  max-width: 70%;
  padding: var(--lp-spacing-xs) var(--lp-spacing-sm);
  color: var(--lp-bg);
  background: var(--lp-text);
  border-radius: var(--lp-radius);
  font-size: 0.75rem;
  font-weight: 700;
}

@media (min-width: 768px) {
  .lp-cta-brutalist-split {
    grid-template-columns: minmax(0, 1.05fr) minmax(18rem, 0.95fr);
    align-items: stretch;
    padding: var(--lp-spacing-xl);
  }

  .lp-cta-brutalist-split__form {
    grid-template-columns: 1fr 1fr;
    align-items: end;
  }

  .lp-cta-brutalist-split__button,
  .lp-cta-brutalist-split__note {
    grid-column: 1 / -1;
  }

  .lp-cta-brutalist-split__media,
  .lp-cta-brutalist-split__media img {
    min-height: 100%;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-cta-brutalist-split" aria-labelledby="cta-brutalist-split-title">
  <div class="lp-cta-brutalist-split__content">
    <p class="lp-cta-brutalist-split__eyebrow">{{slot:eyebrow}}</p>
    <h2 class="lp-cta-brutalist-split__title" id="cta-brutalist-split-title">{{slot:heading}}</h2>
    <p class="lp-cta-brutalist-split__text">{{slot:subhead}}</p>

    <form class="lp-cta-brutalist-split__form" action="{{slot:form-action}}" method="post">
      <label class="lp-cta-brutalist-split__field">
        <span>{{slot:field-name-label}}</span>
        <input type="text" name="{{slot:field-name-name}}" placeholder="{{slot:field-name-placeholder}}" autocomplete="name">
      </label>

      <label class="lp-cta-brutalist-split__field">
        <span>{{slot:field-contact-label}}</span>
        <input type="tel" name="{{slot:field-contact-name}}" placeholder="{{slot:field-contact-placeholder}}" autocomplete="tel">
      </label>

      <button class="lp-cta-brutalist-split__button" type="submit">{{slot:cta-label}}</button>

      <p class="lp-cta-brutalist-split__note">{{slot:form-note}}</p>
    </form>
  </div>

  <figure class="lp-cta-brutalist-split__media">
    <img src="{{slot:lead-image}}" alt="{{slot:lead-image-alt}}" loading="lazy">
    <figcaption class="lp-cta-brutalist-split__caption">{{slot:image-caption}}</figcaption>
  </figure>
</section>
