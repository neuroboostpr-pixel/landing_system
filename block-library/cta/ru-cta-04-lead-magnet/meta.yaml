description: "CTA лид-магнита: крупный заголовок 'Получите бесплатно', описание PDF/чек-листа/консультации, поле телефона и кнопка. Легкий первый шаг."
display_name_ru: "🎁 Лид-магнит — получите бесплатно"
layout_summary_ru: "Светлый блок: крупный заголовок + описание бесплатного материала слева, поле телефона + кнопка 'Получить' справа. На mobile — вертикальный stack."
slots:
  - {type: text, name: freebie-title, max_chars: 60, required: true}
  - {type: text, name: freebie-description, max_chars: 200, required: true}
  - {type: text, name: phone-input, max_chars: 20, required: true}
  - {type: cta, name: primary-cta, default_text: "Получить бесплатно", required: true}
  - {type: text, name: agreement-text, max_chars: 200, required: false}
conversion_notes: "Бесплатный шаг снижает барьер входа. Примеры: бесплатное занятие, каталог, чек-лист, квиз, бонус (книга, стр. 10–13). CTA не 'Купить', а 'Получить'."
source: manual
