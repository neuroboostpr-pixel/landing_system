<style>.lp-cta-corporate-grid-3 {
  background: var(--lp-bg-alt);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-cta-corporate-grid-3__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  max-width: 1280px;
  margin: 0 auto;
}

.lp-cta-corporate-grid-3__content {
  display: grid;
  gap: var(--lp-spacing-md);
  align-content: center;
}

.lp-cta-corporate-grid-3__eyebrow {
  margin: 0;
  color: var(--lp-primary);
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-cta-corporate-grid-3__title {
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 4vw, 4rem);
  line-height: 1.05;
  letter-spacing: 0;
}

.lp-cta-corporate-grid-3__text {
  max-width: 42rem;
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 1.0625rem;
  line-height: 1.7;
}

.lp-cta-corporate-grid-3__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  align-items: center;
}

.lp-cta-corporate-grid-3__button,
.lp-cta-corporate-grid-3__link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3rem;
  border-radius: var(--lp-radius);
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
}

.lp-cta-corporate-grid-3__button {
  background: var(--lp-primary);
  color: white;
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
}

.lp-cta-corporate-grid-3__link {
  color: var(--lp-text);
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  border: 1px solid var(--lp-border);
}

.lp-cta-corporate-grid-3__cards {
  display: grid;
  gap: var(--lp-spacing-md);
  padding: 0;
  margin: 0;
  list-style: none;
}

.lp-cta-corporate-grid-3__card {
  display: grid;
  gap: var(--lp-spacing-sm);
  padding: var(--lp-spacing-lg);
  background: var(--lp-bg);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
}

.lp-cta-corporate-grid-3__card-marker {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: var(--lp-radius);
  background: var(--lp-accent);
}

.lp-cta-corporate-grid-3__card-title {
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 1.25rem;
  line-height: 1.2;
  letter-spacing: 0;
}

.lp-cta-corporate-grid-3__card-text {
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.6;
}

.lp-cta-corporate-grid-3__button:focus-visible,
.lp-cta-corporate-grid-3__link:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 3px;
}

@media (min-width: 768px) {
  .lp-cta-corporate-grid-3__inner {
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
    align-items: center;
  }

  .lp-cta-corporate-grid-3__cards {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lp-cta-corporate-grid-3__card {
    min-height: 100%;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-cta-corporate-grid-3" aria-labelledby="lp-cta-corporate-grid-3-title">
  <div class="lp-cta-corporate-grid-3__inner">
    <div class="lp-cta-corporate-grid-3__content">
      <p class="lp-cta-corporate-grid-3__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-cta-corporate-grid-3__title" id="lp-cta-corporate-grid-3-title">{{slot:heading}}</h2>
      <p class="lp-cta-corporate-grid-3__text">{{slot:subhead}}</p>
      <div class="lp-cta-corporate-grid-3__actions">
        <a class="lp-cta-corporate-grid-3__button" href="{{slot:primary-cta-link}}">{{slot:primary-cta-label}}</a>
        <a class="lp-cta-corporate-grid-3__link" href="{{slot:secondary-cta-link}}">{{slot:secondary-cta-label}}</a>
      </div>
    </div>

    <ul class="lp-cta-corporate-grid-3__cards" aria-label="{{slot:benefits-list-label}}">
      <li class="lp-cta-corporate-grid-3__card">
        <span class="lp-cta-corporate-grid-3__card-marker" aria-hidden="true"></span>
        <h3 class="lp-cta-corporate-grid-3__card-title">{{slot:benefit-1-title}}</h3>
        <p class="lp-cta-corporate-grid-3__card-text">{{slot:benefit-1-text}}</p>
      </li>
      <li class="lp-cta-corporate-grid-3__card">
        <span class="lp-cta-corporate-grid-3__card-marker" aria-hidden="true"></span>
        <h3 class="lp-cta-corporate-grid-3__card-title">{{slot:benefit-2-title}}</h3>
        <p class="lp-cta-corporate-grid-3__card-text">{{slot:benefit-2-text}}</p>
      </li>
      <li class="lp-cta-corporate-grid-3__card">
        <span class="lp-cta-corporate-grid-3__card-marker" aria-hidden="true"></span>
        <h3 class="lp-cta-corporate-grid-3__card-title">{{slot:benefit-3-title}}</h3>
        <p class="lp-cta-corporate-grid-3__card-text">{{slot:benefit-3-text}}</p>
      </li>
    </ul>
  </div>
</section>
