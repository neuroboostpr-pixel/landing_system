<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-cta-02-banner-stripe — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #2563eb;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }

  .cta-banner {
    /* Full-width, accent background with diagonal stripe pattern */
    background-color: var(--color-accent);
    background-image: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 18px,
      rgba(255, 255, 255, 0.04) 18px,
      rgba(255, 255, 255, 0.04) 36px
    );
    padding: calc(var(--spacing-lg) * 2.5) var(--spacing-lg);
    text-align: center;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-md);
    /* No max-width — full width */
  }

  .banner-headline {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 900;
    line-height: 1.1;
    margin: 0;
    letter-spacing: -0.01em;
    max-width: 760px;
  }

  .banner-subhead {
    font-size: 20px;
    opacity: 0.88;
    margin: 0;
    line-height: 1.5;
    max-width: 560px;
  }

  .banner-cta {
    display: inline-block;
    margin-top: 8px;
    padding: 18px 48px;
    background: #fff;
    color: var(--color-accent);
    text-decoration: none;
    border-radius: 6px;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <section class="cta-banner" data-block-id="ru-cta-02-banner-stripe">

    <h2 class="banner-headline" data-slot="headline">[HEADLINE: призыв к действию — главная мысль]</h2>

    <p class="banner-subhead" data-slot="subhead">[SUBHEAD: уточнение оффера или снятие возражения — одно предложение]</p>

    <a class="banner-cta" data-slot="primary-cta" href="#contact">[Оставить заявку]</a>

  </section>
</body>
</html>
