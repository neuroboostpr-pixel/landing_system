<section class="lp-cta-corporate-stacked" aria-labelledby="cta-corporate-stacked-title">
  <div class="lp-cta-corporate-stacked__inner">
    <div class="lp-cta-corporate-stacked__content">
      <p class="lp-cta-corporate-stacked__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-cta-corporate-stacked__title" id="cta-corporate-stacked-title">{{slot:heading}}</h2>
      <p class="lp-cta-corporate-stacked__subhead">{{slot:subhead}}</p>
      <div class="lp-cta-corporate-stacked__contact" aria-label="{{slot:contact-label}}">
        <span class="lp-cta-corporate-stacked__contact-item">{{slot:contact-primary}}</span>
        <span class="lp-cta-corporate-stacked__contact-item">{{slot:contact-secondary}}</span>
      </div>
    </div>

    <form class="lp-cta-corporate-stacked__form" action="{{slot:form-action}}" method="post" aria-label="{{slot:form-label}}">
      <div class="lp-cta-corporate-stacked__field">
        <label for="cta-corporate-stacked-name">{{slot:name-label}}</label>
        <input id="cta-corporate-stacked-name" name="name" type="text" placeholder="{{slot:name-placeholder}}" autocomplete="name">
      </div>
      <div class="lp-cta-corporate-stacked__field">
        <label for="cta-corporate-stacked-contact">{{slot:contact-field-label}}</label>
        <input id="cta-corporate-stacked-contact" name="contact" type="text" placeholder="{{slot:contact-field-placeholder}}" autocomplete="tel">
      </div>
      <button class="lp-cta-corporate-stacked__button" type="submit">{{slot:cta-label}}</button>
      <p class="lp-cta-corporate-stacked__note">{{slot:form-note}}</p>
    </form>
  </div>
</section>
