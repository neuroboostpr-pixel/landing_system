<style>.lp-cta-corporate-split {
  display: grid;
  gap: var(--lp-spacing-lg);
  padding: var(--lp-spacing-lg);
  color: var(--lp-text);
  background: var(--lp-bg-alt);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  font-family: var(--lp-font-body);
}

.lp-cta-corporate-split__content {
  display: grid;
  gap: var(--lp-spacing-sm);
}

.lp-cta-corporate-split__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-size: 0.875rem;
  font-weight: 700;
  line-height: 1.3;
}

.lp-cta-corporate-split__title {
  margin: 0;
  max-width: 42rem;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 1.75rem;
  line-height: 1.12;
  letter-spacing: 0;
}

.lp-cta-corporate-split__text {
  margin: 0;
  max-width: 46rem;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.6;
}

.lp-cta-corporate-split__actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--lp-spacing-sm);
}

.lp-cta-corporate-split__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  color: var(--lp-bg);
  background: var(--lp-primary);
  border: 1px solid var(--lp-primary);
  border-radius: var(--lp-radius);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
}

.lp-cta-corporate-split__button:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 3px;
}

.lp-cta-corporate-split__note {
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 0.875rem;
  line-height: 1.45;
  text-align: center;
}

@media (min-width: 768px) {
  .lp-cta-corporate-split {
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--lp-spacing-xl);
    padding: var(--lp-spacing-xl);
  }

  .lp-cta-corporate-split__title {
    font-size: 2.25rem;
  }

  .lp-cta-corporate-split__actions {
    align-items: flex-end;
    min-width: 14rem;
  }

  .lp-cta-corporate-split__note {
    max-width: 18rem;
    text-align: right;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-cta-corporate-split" aria-labelledby="lp-cta-corporate-split-title">
  <div class="lp-cta-corporate-split__content">
    <p class="lp-cta-corporate-split__eyebrow">{{slot:cta-eyebrow}}</p>
    <h2 class="lp-cta-corporate-split__title" id="lp-cta-corporate-split-title">{{slot:cta-title}}</h2>
    <p class="lp-cta-corporate-split__text">{{slot:cta-text}}</p>
  </div>
  <div class="lp-cta-corporate-split__actions">
    <a class="lp-cta-corporate-split__button" href="{{slot:cta-primary-link}}">
      {{slot:cta-primary-label}}
    </a>
    <p class="lp-cta-corporate-split__note">{{slot:cta-note}}</p>
  </div>
</section>
