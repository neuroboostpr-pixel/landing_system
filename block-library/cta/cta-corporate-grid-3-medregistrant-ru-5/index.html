<section class="lp-cta-corporate-grid-3" aria-labelledby="lp-cta-corporate-grid-3-title">
  <div class="lp-cta-corporate-grid-3__inner">
    <div class="lp-cta-corporate-grid-3__content">
      <p class="lp-cta-corporate-grid-3__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-cta-corporate-grid-3__title" id="lp-cta-corporate-grid-3-title">{{slot:heading}}</h2>
      <p class="lp-cta-corporate-grid-3__text">{{slot:subhead}}</p>
      <div class="lp-cta-corporate-grid-3__actions">
        <a class="lp-cta-corporate-grid-3__button" href="{{slot:primary-cta-link}}">{{slot:primary-cta-label}}</a>
        <a class="lp-cta-corporate-grid-3__link" href="{{slot:secondary-cta-link}}">{{slot:secondary-cta-label}}</a>
      </div>
    </div>

    <ul class="lp-cta-corporate-grid-3__cards" aria-label="{{slot:benefits-list-label}}">
      <li class="lp-cta-corporate-grid-3__card">
        <span class="lp-cta-corporate-grid-3__card-marker" aria-hidden="true"></span>
        <h3 class="lp-cta-corporate-grid-3__card-title">{{slot:benefit-1-title}}</h3>
        <p class="lp-cta-corporate-grid-3__card-text">{{slot:benefit-1-text}}</p>
      </li>
      <li class="lp-cta-corporate-grid-3__card">
        <span class="lp-cta-corporate-grid-3__card-marker" aria-hidden="true"></span>
        <h3 class="lp-cta-corporate-grid-3__card-title">{{slot:benefit-2-title}}</h3>
        <p class="lp-cta-corporate-grid-3__card-text">{{slot:benefit-2-text}}</p>
      </li>
      <li class="lp-cta-corporate-grid-3__card">
        <span class="lp-cta-corporate-grid-3__card-marker" aria-hidden="true"></span>
        <h3 class="lp-cta-corporate-grid-3__card-title">{{slot:benefit-3-title}}</h3>
        <p class="lp-cta-corporate-grid-3__card-text">{{slot:benefit-3-text}}</p>
      </li>
    </ul>
  </div>
</section>
