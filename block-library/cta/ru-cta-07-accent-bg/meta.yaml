description: 'Полноширинный CTA с акцентным фоном (терракотовый), белым текстом
  и белой кнопкой. Максимально простой и контрастный. Стиль closing от saas-landing.'
display_name_ru: 'CTA на акцентном фоне — контраст, минимум элементов'
layout_summary_ru: Полноширинная секция с акцентным фоном. Центрированный заголовок,
  подзаголовок, белая кнопка, footnote. Минималистичный. Mobile аналогичен desktop.
