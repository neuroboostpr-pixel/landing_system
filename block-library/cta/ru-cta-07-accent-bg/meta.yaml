- {type: text, name: footnote, max_chars: 100, required: false}
conversion_notes: Максимальный контраст — белая кнопка на акцентном фоне. Footnote
  снимает страхи (без обязательств, бесплатно первые N дней). НЕ использовать
  WhatsApp/Telegram. Хорошо как финальный CTA перед footer.
