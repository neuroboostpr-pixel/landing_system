<!DOCTYPE html>

<html lang="ru"><head><meta charset="UTF-8"><title>ru-cta-07-accent-bg — mobile</title>
<style>
  :root { --color-bg:#c96442; --color-fg:#ffffff; --font-body:system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); width:375px; padding:56px 20px; text-align:center; }
  .cta-title { font-size:30px; letter-spacing:-0.02em; font-weight:700; margin-bottom:14px; line-height:1.1; }
  .cta-lead { font-size:16px; opacity:0.88; margin-bottom:28px; line-height:1.55; }
  .btn { display:block; width:100%; padding:14px 24px; border-radius:8px; font:inherit; font-weight:500; font-size:16px; cursor:pointer; text-decoration:none; background:white; color:var(--color-bg); border:none; text-align:center; }
  .footnote { margin-top:14px; font-size:13px; opacity:0.7; }
</style></head>
<body>
  <section data-block-id="ru-cta-07-accent-bg">
    <h2 class="cta-title" data-slot="headline">[Финальный призыв к действию]</h2>
    <p class="cta-lead" data-slot="subhead">[Главный бенефит кратко]</p>
    <a class="btn" data-slot="primary-cta" href="#contact">[Начать сейчас]</a>
    <p class="footnote" data-slot="footnote">[Без обязательств]</p>
  </section>
</body></html>
