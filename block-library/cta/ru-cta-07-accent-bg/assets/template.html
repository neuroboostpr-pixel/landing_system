<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/saas-landing/example.html | License: Apache-2.0 -->
<html lang="ru"><head><meta charset="UTF-8"><title>ru-cta-07-accent-bg — desktop</title>
<style>
  :root { --color-bg:#c96442; --color-fg:#ffffff; --color-accent:#c96442; --color-border:rgba(255,255,255,0.2); --font-body:system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); }
  .cta-section { background:var(--color-bg); color:var(--color-fg); padding:80px 0; text-align:center; }
  .wrap { max-width:720px; margin:0 auto; padding:0 32px; }
  .cta-title { font-size:clamp(28px,3.8vw,46px); letter-spacing:-0.02em; font-weight:700; margin-bottom:14px; line-height:1.1; }
  .cta-lead { font-size:17px; opacity:0.88; margin-bottom:32px; line-height:1.55; }
  .btn { display:inline-block; padding:14px 32px; border-radius:8px; font:inherit; font-weight:500; font-size:16px; cursor:pointer; text-decoration:none; background:white; color:var(--color-bg); border:none; }
  .footnote { margin-top:16px; font-size:13px; opacity:0.7; }
</style></head>
<body>
  <section class="cta-section" data-block-id="ru-cta-07-accent-bg">
    <div class="wrap">
      <h2 class="cta-title" data-slot="headline">[Финальный призыв к действию. Кратко и ударно.]</h2>
      <p class="cta-lead" data-slot="subhead">[Одно предложение с главным бенефитом. Без воды.]</p>
      <a class="btn" data-slot="primary-cta" href="#contact">[Начать сейчас]</a>
      <p class="footnote" data-slot="footnote">[Без регистрации · Бесплатно первые 14 дней]</p>
    </div>
  </section>
</body></html>
