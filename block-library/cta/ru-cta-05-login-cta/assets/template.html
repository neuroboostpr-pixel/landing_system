<!DOCTYPE html>
<!-- Source: /tmp/open-design/skills/login-flow/example.html (Apache-2.0, adapted for RU block-library schema) -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-cta-05-login-cta — desktop</title>
<style>
  :root {
    --color-bg: #f7f8fa;
    --color-fg: #1a1a2e;
    --color-accent: #4f46e5;
    --color-border: #e5e7eb;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); display: flex; align-items: center; justify-content: center; min-height: 600px; padding: 48px; }
  .cta-card { width: 420px; background: #fff; border-radius: 20px; padding: 48px 40px; box-shadow: 0 20px 48px rgba(0,0,0,.08); text-align: center; }
  .brand-icon-wrap { width: 60px; height: 60px; background: var(--color-accent); border-radius: 14px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
  .brand-icon-wrap svg { width: 32px; height: 32px; fill: #fff; }
  .cta-headline { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; margin-bottom: 10px; letter-spacing: -.02em; }
  .cta-subhead { font-size: .95rem; color: #6b7280; line-height: 1.5; margin-bottom: 28px; }
  .input-field { width: 100%; height: 50px; padding: 0 16px; border: 1.5px solid var(--color-border); border-radius: 12px; font-size: 1rem; color: var(--color-fg); outline: none; margin-bottom: 14px; transition: border-color .2s; }
  .input-field:focus { border-color: var(--color-accent); }
  .cta-btn { width: 100%; height: 52px; background: var(--color-accent); color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 16px; transition: opacity .2s; }
  .cta-btn:hover { opacity: .9; }
  .trust-note { font-size: .8rem; color: #9ca3af; }
</style>
</head>
<body>
  <section class="cta-card" data-block-id="ru-cta-05-login-cta">
    <div class="brand-icon-wrap" data-slot="brand-icon" data-slot-type="icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <h2 class="cta-headline" data-slot="headline">[HEADLINE: запишитесь прямо сейчас]</h2>
    <p class="cta-subhead" data-slot="subhead">[SUBHEAD: получите первую консультацию бесплатно]</p>
    <input class="input-field" type="tel" data-slot="input-placeholder" placeholder="[+7 (___) ___-__-__]">
    <button class="cta-btn" data-slot="primary-cta">[CTA: Получить доступ]</button>
    <p class="trust-note" data-slot="trust-note">[Без спама. Данные защищены.]</p>
  </section>
</body>
</html>
