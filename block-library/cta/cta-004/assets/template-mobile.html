<style>.lp-cta-corporate-centered {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md) 0;
  overflow: hidden;
}

.lp-cta-corporate-centered__inner {
  max-width: 1180px;
  margin: 0 auto;
  display: grid;
  gap: var(--lp-spacing-lg);
  text-align: center;
}

.lp-cta-corporate-centered__content {
  display: grid;
  gap: var(--lp-spacing-sm);
  justify-items: center;
}

.lp-cta-corporate-centered__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-family: var(--lp-font-display);
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-cta-corporate-centered__title {
  margin: 0;
  max-width: 860px;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 4vw, 4.75rem);
  line-height: 0.95;
  letter-spacing: 0;
}

.lp-cta-corporate-centered__text {
  margin: 0;
  max-width: 680px;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.65;
}

.lp-cta-corporate-centered__form {
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
  padding: var(--lp-spacing-md);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
  display: grid;
  gap: var(--lp-spacing-md);
  text-align: left;
}

.lp-cta-corporate-centered__fields {
  display: grid;
  gap: var(--lp-spacing-sm);
}

.lp-cta-corporate-centered__field {
  display: grid;
  gap: var(--lp-spacing-xs);
  color: var(--lp-text);
  font-size: 0.9rem;
  line-height: 1.4;
}

.lp-cta-corporate-centered__field input,
.lp-cta-corporate-centered__field textarea {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
  color: var(--lp-text);
  font: inherit;
  padding: var(--lp-spacing-sm);
}

.lp-cta-corporate-centered__field textarea {
  resize: vertical;
  min-height: 7rem;
}

.lp-cta-corporate-centered__field input:focus,
.lp-cta-corporate-centered__field textarea:focus {
  outline: 2px solid var(--lp-accent);
  outline-offset: 2px;
}

.lp-cta-corporate-centered__actions {
  display: grid;
  gap: var(--lp-spacing-sm);
  justify-items: center;
  text-align: center;
}

.lp-cta-corporate-centered__button {
  border: 0;
  border-radius: var(--lp-radius);
  background: var(--lp-primary);
  color: white;
  cursor: pointer;
  font-family: var(--lp-font-display);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
}

.lp-cta-corporate-centered__button:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 3px;
}

.lp-cta-corporate-centered__note {
  margin: 0;
  max-width: 560px;
  color: var(--lp-text-muted);
  font-size: 0.9rem;
  line-height: 1.5;
}

.lp-cta-corporate-centered__lineup {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: end;
  gap: var(--lp-spacing-xs);
  margin-top: var(--lp-spacing-md);
  border-top: 1px solid var(--lp-border);
  padding-top: var(--lp-spacing-md);
}

.lp-cta-corporate-centered__figure {
  margin: 0;
  min-width: 0;
}

.lp-cta-corporate-centered__figure img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 14rem;
  object-fit: contain;
}

@media (min-width: 768px) {
  .lp-cta-corporate-centered {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg) 0;
  }

  .lp-cta-corporate-centered__form {
    padding: var(--lp-spacing-lg);
  }

  .lp-cta-corporate-centered__fields {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lp-cta-corporate-centered__field:nth-child(3) {
    grid-column: 1 / -1;
  }

  .lp-cta-corporate-centered__lineup {
    gap: var(--lp-spacing-md);
    padding-top: var(--lp-spacing-lg);
  }

  .lp-cta-corporate-centered__figure img {
    max-height: 20rem;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-cta-corporate-centered" aria-labelledby="lp-cta-corporate-centered-title">
  <div class="lp-cta-corporate-centered__inner">
    <div class="lp-cta-corporate-centered__content">
      <p class="lp-cta-corporate-centered__eyebrow">{{slot:cta-eyebrow}}</p>
      <h2 class="lp-cta-corporate-centered__title" id="lp-cta-corporate-centered-title">{{slot:cta-heading}}</h2>
      <p class="lp-cta-corporate-centered__text">{{slot:cta-subhead}}</p>
    </div>

    <form class="lp-cta-corporate-centered__form" action="{{slot:form-action}}" method="post" aria-label="{{slot:form-aria-label}}">
      <div class="lp-cta-corporate-centered__fields">
        <label class="lp-cta-corporate-centered__field">
          <span>{{slot:name-label}}</span>
          <input type="text" name="name" autocomplete="name" placeholder="{{slot:name-placeholder}}">
        </label>

        <label class="lp-cta-corporate-centered__field">
          <span>{{slot:phone-label}}</span>
          <input type="tel" name="phone" autocomplete="tel" placeholder="{{slot:phone-placeholder}}">
        </label>

        <label class="lp-cta-corporate-centered__field">
          <span>{{slot:message-label}}</span>
          <textarea name="message" rows="4" placeholder="{{slot:message-placeholder}}"></textarea>
        </label>
      </div>

      <div class="lp-cta-corporate-centered__actions">
        <button class="lp-cta-corporate-centered__button" type="submit">{{slot:primary-cta-label}}</button>
        <p class="lp-cta-corporate-centered__note">{{slot:form-note}}</p>
      </div>
    </form>

    <div class="lp-cta-corporate-centered__lineup" aria-label="{{slot:lineup-aria-label}}">
      <figure class="lp-cta-corporate-centered__figure">
        <img src="{{slot:character-image-1}}" alt="{{slot:character-image-1-alt}}" loading="lazy">
      </figure>
      <figure class="lp-cta-corporate-centered__figure">
        <img src="{{slot:character-image-2}}" alt="{{slot:character-image-2-alt}}" loading="lazy">
      </figure>
      <figure class="lp-cta-corporate-centered__figure">
        <img src="{{slot:character-image-3}}" alt="{{slot:character-image-3-alt}}" loading="lazy">
      </figure>
      <figure class="lp-cta-corporate-centered__figure">
        <img src="{{slot:character-image-4}}" alt="{{slot:character-image-4-alt}}" loading="lazy">
      </figure>
    </div>
  </div>
</section>
