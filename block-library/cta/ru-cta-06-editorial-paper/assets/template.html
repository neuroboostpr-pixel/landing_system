<!DOCTYPE html>

<html lang="ru"><head><meta charset="UTF-8"><title>ru-cta-06-editorial-paper — desktop</title>
<style>
  :root { --color-bg:#efe7d2; --color-fg:#15140f; --color-accent:#ed6f5c; --color-border:rgba(21,20,15,0.16); --font-display:'Playfair Display',Georgia,serif; --font-body:'Inter Tight',system-ui,sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;1,400&display=swap');
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); }
  .cta-section { padding:100px 0; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 64px; }
  .sec-rule { border-top:1px solid var(--color-border); padding-top:18px; display:flex; justify-content:space-between; align-items:center; font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(21,20,15,0.45); margin-bottom:60px; }
  .sec-rule .roman { font-family:var(--font-display); font-style:italic; color:var(--color-accent); font-size:14px; text-transform:none; }
  .cta-grid { display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent); display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .kicker::before { content:''; width:18px; height:1px; background:var(--color-accent); }
  .cta-title { font-family:var(--font-body); font-weight:800; font-size:clamp(36px,4.2vw,60px); line-height:1.0; letter-spacing:-0.028em; margin-bottom:24px; }
  .cta-title em { font-family:var(--font-display); font-style:italic; font-weight:500; }
  .cta-lead { font-size:16px; line-height:1.55; color:rgba(21,20,15,0.65); margin-bottom:36px; max-width:42ch; }
  .cta-actions { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .btn-primary { display:inline-flex; align-items:center; gap:10px; padding:14px 28px; border-radius:999px; background:var(--color-accent); color:#fff; font-family:var(--font-body); font-size:14px; font-weight:600; text-decoration:none; border:none; cursor:pointer; }
  .cta-link { display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:500; color:rgba(21,20,15,0.7); text-decoration:none; border-bottom:1px solid var(--color-border); padding-bottom:2px; }
  .cta-foot { margin-top:32px; display:flex; align-items:center; gap:16px; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(21,20,15,0.4); }
  .pulse { width:6px; height:6px; border-radius:50%; background:var(--color-accent); display:inline-block; animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .cta-art { position:relative; aspect-ratio:1; background:rgba(21,20,15,0.06); border:1px solid var(--color-border); display:flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(21,20,15,0.3); }
</style></head>
<body>
  <section class="cta-section" data-block-id="ru-cta-06-editorial-paper">
    <div class="wrap">
      <div class="sec-rule">
        <span class="roman" data-slot="section-num">[VIII.]</span>
        <span data-slot="section-label">[Контакт / Начать работу]</span>
        <span data-slot="section-index">[008]</span>
      </div>
      <div class="cta-grid">
        <div>
          <div class="kicker" data-slot="kicker">[Начните сейчас]</div>
          <h2 class="cta-title" data-slot="headline">[Построим <em>что-то</em> выдающееся <em>вместе</em>]</h2>
          <p class="cta-lead" data-slot="subhead">[Одно-два предложения призыва к действию. Что произойдёт, если клиент нажмёт на кнопку.]</p>
          <div class="cta-actions">
            <a class="btn-primary" data-slot="primary-cta" href="#contact">[Оставить заявку]</a>
            <a class="cta-link" data-slot="secondary-cta" href="#cases">[Посмотреть кейсы →]</a>
          </div>
          <div class="cta-foot">
            <span class="pulse"></span>
            <span data-slot="footer-note">[Отвечаем в течение 24 часов]</span>
          </div>
        </div>
        <div class="cta-art" data-slot="cta-image">Изображение</div>
      </div>
    </div>
  </section>
</body></html>
