<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/open-design-landing/example.html | License: Apache-2.0 -->
<html lang="ru"><head><meta charset="UTF-8"><title>ru-cta-06-editorial-paper — mobile</title>
<style>
  :root { --color-bg:#efe7d2; --color-fg:#15140f; --color-accent:#ed6f5c; --color-border:rgba(21,20,15,0.16); --font-display:'Playfair Display',Georgia,serif; --font-body:'Inter Tight',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); width:375px; padding:40px 20px; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent); margin-bottom:18px; }
  h2 { font-size:36px; font-weight:800; letter-spacing:-0.028em; margin-bottom:16px; }
  h2 em { font-family:var(--font-display); font-style:italic; font-weight:500; }
  p { font-size:15px; line-height:1.55; color:rgba(21,20,15,0.65); margin-bottom:28px; }
  .btn-primary { display:block; width:100%; padding:14px 24px; border-radius:999px; background:var(--color-accent); color:#fff; font-family:var(--font-body); font-size:15px; font-weight:600; text-decoration:none; text-align:center; border:none; margin-bottom:14px; }
  .cta-link { display:block; text-align:center; font-size:14px; font-weight:500; color:rgba(21,20,15,0.7); text-decoration:none; border-bottom:1px solid var(--color-border); padding-bottom:2px; margin-bottom:24px; width:fit-content; margin-left:auto; margin-right:auto; }
  .footer-note { font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(21,20,15,0.4); text-align:center; }
</style></head>
<body>
  <section data-block-id="ru-cta-06-editorial-paper">
    <div class="kicker" data-slot="kicker">[Начните сейчас]</div>
    <h2 data-slot="headline">[Построим <em>что-то</em> выдающееся]</h2>
    <p data-slot="subhead">[Призыв к действию кратко]</p>
    <a class="btn-primary" data-slot="primary-cta" href="#contact">[Оставить заявку]</a>
    <a class="cta-link" data-slot="secondary-cta" href="#cases">[Посмотреть кейсы →]</a>
    <div class="footer-note" data-slot="footer-note">[Ответим в течение 24 часов]</div>
  </section>
</body></html>
