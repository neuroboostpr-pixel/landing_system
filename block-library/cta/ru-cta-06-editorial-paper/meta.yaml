id: ru-cta-06-editorial-paper
category: cta
ru_market: true
use_cases:
- services
- b2c
- local
description: 'Редакционный CTA-блок: бежевый фон, курсивный заголовок, пульсирующая
  точка, нумерация раздела. Стиль cta-section от open-design-landing (Apache-2.0).'
display_name_ru: Редакционный CTA — бежевый, курсив, пульс, нумерация
layout_summary_ru: Двухколоночный layout (текст слева, изображение справа). Нумерация
  раздела в roman-цифрах. Пульсирующая точка у footer-note. Mobile — стек.
slots:
- {type: text, name: section-num, max_chars: 10, required: false}
- {type: text, name: section-label, max_chars: 40, required: false}
- {type: text, name: section-index, max_chars: 6, required: false}
- {type: text, name: kicker, max_chars: 50, required: false}
- {type: text, name: headline, max_chars: 80, required: true}
- {type: text, name: subhead, max_chars: 220, required: false}
- {type: cta, name: primary-cta, default_text: Оставить заявку, required: true}
- {type: cta, name: secondary-cta, default_text: Посмотреть кейсы, required: false}
- {type: text, name: footer-note, max_chars: 60, required: false}
- {type: photo, name: cta-image, ratio: '1:1', mobile_ratio: 'skip', required: false}
conversion_notes: Пульсирующая точка добавляет ощущение активности ("сейчас онлайн").
  Нумерация создаёт финальность — "это последний блок". Изображение скрывается на mobile.
  НЕ использовать WhatsApp/Telegram кнопки.
source: opendesign
source_attribution: 'github.com/nexu-io/open-design: design-templates/open-design-landing (Apache-2.0)'
created: '2026-05-13'
recommended_styles_ru:
- Editorial & Magazine Style
- Minimalism & Swiss Style
