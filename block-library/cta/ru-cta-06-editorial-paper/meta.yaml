category: Conversion
conversion_notes: Пульсирующая точка добавляет ощущение активности ("сейчас онлайн").
  Нумерация создаёт финальность — "это последний блок". Изображение скрывается на
  mobile. НЕ использовать WhatsApp/Telegram кнопки.
