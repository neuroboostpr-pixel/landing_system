<style>.lp-cta-technical-split {
  background: var(--lp-bg-alt);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-lg) var(--lp-spacing-md);
}

.lp-cta-technical-split__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  max-width: 1280px;
  margin: 0 auto;
  overflow: hidden;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg);
}

.lp-cta-technical-split__content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--lp-spacing-md);
  padding: var(--lp-spacing-lg);
}

.lp-cta-technical-split__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-cta-technical-split__title {
  max-width: 12em;
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 7vw, 4rem);
  line-height: 0.95;
  letter-spacing: 0;
}

.lp-cta-technical-split__text {
  max-width: 36rem;
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.65;
}

.lp-cta-technical-split__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  padding-top: var(--lp-spacing-xs);
}

.lp-cta-technical-split__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  font-weight: 700;
  line-height: 1.1;
  text-align: center;
  text-decoration: none;
}

.lp-cta-technical-split__button--primary {
  background: var(--lp-primary);
  border-color: var(--lp-primary);
  color: white;
}

.lp-cta-technical-split__button--secondary {
  background: transparent;
  color: var(--lp-text);
}

.lp-cta-technical-split__media {
  position: relative;
  min-height: 16rem;
  margin: 0;
  overflow: hidden;
  background: var(--lp-bg-alt);
}

.lp-cta-technical-split__media::before {
  content: "";
  position: absolute;
  inset: var(--lp-spacing-md);
  z-index: 1;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  pointer-events: none;
}

.lp-cta-technical-split__media img {
  width: 100%;
  height: 100%;
  min-height: 16rem;
  object-fit: cover;
  filter: blur(0.35rem);
  transform: scale(1.04);
  opacity: 0.72;
}

.lp-cta-technical-split__caption {
  position: absolute;
  right: var(--lp-spacing-md);
  bottom: var(--lp-spacing-md);
  z-index: 2;
  max-width: 16rem;
  padding: var(--lp-spacing-xs) var(--lp-spacing-sm);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
  color: var(--lp-text-muted);
  font-size: 0.8rem;
  line-height: 1.4;
}

@media (min-width: 768px) {
  .lp-cta-technical-split {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-cta-technical-split__inner {
    grid-template-columns: minmax(0, 1.05fr) minmax(18rem, 0.95fr);
    align-items: stretch;
  }

  .lp-cta-technical-split__content {
    min-height: 25rem;
    padding: var(--lp-spacing-xl);
  }

  .lp-cta-technical-split__media {
    min-height: auto;
  }

  .lp-cta-technical-split__media img {
    min-height: 100%;
  }
}
</style>
<section class="lp-cta-technical-split" aria-labelledby="lp-cta-technical-split-title">
  <div class="lp-cta-technical-split__inner">
    <div class="lp-cta-technical-split__content">
      <p class="lp-cta-technical-split__eyebrow">{{slot:cta-eyebrow}}</p>
      <h2 class="lp-cta-technical-split__title" id="lp-cta-technical-split-title">{{slot:cta-title}}</h2>
      <p class="lp-cta-technical-split__text">{{slot:cta-text}}</p>
      <div class="lp-cta-technical-split__actions">
        <a class="lp-cta-technical-split__button lp-cta-technical-split__button--primary" href="{{slot:cta-primary-link}}">
          {{slot:cta-primary-label}}
        </a>
        <a class="lp-cta-technical-split__button lp-cta-technical-split__button--secondary" href="{{slot:cta-secondary-link}}">
          {{slot:cta-secondary-label}}
        </a>
      </div>
    </div>

    <figure class="lp-cta-technical-split__media">
      <img src="{{slot:cta-image}}" alt="{{slot:cta-image-alt}}" loading="lazy">
      <figcaption class="lp-cta-technical-split__caption">{{slot:cta-image-caption}}</figcaption>
    </figure>
  </div>
</section>
