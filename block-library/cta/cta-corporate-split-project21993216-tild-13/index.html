<section class="lp-cta-corporate-split" aria-labelledby="lp-cta-corporate-split-title">
  <div class="lp-cta-corporate-split__content">
    <p class="lp-cta-corporate-split__eyebrow">{{slot:eyebrow}}</p>
    <h2 class="lp-cta-corporate-split__title" id="lp-cta-corporate-split-title">{{slot:heading}}</h2>
    <p class="lp-cta-corporate-split__text">{{slot:subhead}}</p>
    <ul class="lp-cta-corporate-split__points" aria-label="{{slot:benefits-label}}">
      <li>{{slot:benefit-1}}</li>
      <li>{{slot:benefit-2}}</li>
      <li>{{slot:benefit-3}}</li>
    </ul>
  </div>

  <form class="lp-cta-corporate-split__form" action="{{slot:form-action}}" method="post">
    <div class="lp-cta-corporate-split__field">
      <label for="lp-cta-corporate-split-name">{{slot:name-label}}</label>
      <input id="lp-cta-corporate-split-name" name="name" type="text" placeholder="{{slot:name-placeholder}}" autocomplete="name">
    </div>

    <div class="lp-cta-corporate-split__field">
      <label for="lp-cta-corporate-split-phone">{{slot:phone-label}}</label>
      <input id="lp-cta-corporate-split-phone" name="phone" type="tel" placeholder="{{slot:phone-placeholder}}" autocomplete="tel">
    </div>

    <div class="lp-cta-corporate-split__field">
      <label for="lp-cta-corporate-split-message">{{slot:message-label}}</label>
      <textarea id="lp-cta-corporate-split-message" name="message" rows="4" placeholder="{{slot:message-placeholder}}"></textarea>
    </div>

    <button class="lp-cta-corporate-split__button" type="submit">{{slot:cta-label}}</button>
    <p class="lp-cta-corporate-split__note">{{slot:form-note}}</p>
  </form>
</section>
