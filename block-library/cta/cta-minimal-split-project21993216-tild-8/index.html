<section class="lp-cta-minimal-split" aria-labelledby="lp-cta-minimal-split-title">
  <div class="lp-cta-minimal-split__content">
    <p class="lp-cta-minimal-split__eyebrow">{{slot:cta-eyebrow}}</p>
    <h2 class="lp-cta-minimal-split__title" id="lp-cta-minimal-split-title">{{slot:cta-title}}</h2>
    <p class="lp-cta-minimal-split__text">{{slot:cta-text}}</p>
  </div>
  <div class="lp-cta-minimal-split__action">
    <a class="lp-cta-minimal-split__button" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
  </div>
</section>
