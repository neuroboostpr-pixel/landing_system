<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/open-design-landing/example.html | License: Apache-2.0 -->
<html lang="ru"><head><meta charset="UTF-8"><title>ru-process-03-4steps-numbered — mobile</title>
<style>
  :root { --color-bg:#efe7d2; --color-fg:#15140f; --color-accent:#ed6f5c; --color-border:rgba(21,20,15,0.16); --font-display:'Playfair Display',Georgia,serif; --font-body:'Inter Tight',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); width:375px; padding:40px 0; }
  .head { padding:0 20px 32px; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent); margin-bottom:14px; }
  h2 { font-size:32px; font-weight:800; letter-spacing:-0.028em; }
  h2 em { font-family:var(--font-display); font-style:italic; font-weight:500; }
  .process-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--color-border); border-top:1px solid var(--color-border); }
  .step { background:var(--color-bg); padding:22px 18px; }
  .step-num-accent { font-size:22px; font-weight:700; color:var(--color-accent); margin-bottom:10px; letter-spacing:-0.02em; }
  .step h4 { font-size:15px; font-weight:700; margin-bottom:8px; }
  .step p { font-size:12px; color:rgba(21,20,15,0.65); line-height:1.5; }
</style></head>
<body>
  <section data-block-id="ru-process-03-4steps-numbered">
    <div class="head">
      <div class="kicker" data-slot="kicker">[Процесс]</div>
      <h2 data-slot="headline">[От запроса до <em>результата</em>]</h2>
    </div>
    <div class="process-grid">
      <div class="step"><div class="step-num-accent">01</div><h4 data-slot="step-1-title">[Шаг 1]</h4><p data-slot="step-1-desc">[Описание]</p></div>
      <div class="step"><div class="step-num-accent">02</div><h4 data-slot="step-2-title">[Шаг 2]</h4><p data-slot="step-2-desc">[Описание]</p></div>
      <div class="step"><div class="step-num-accent">03</div><h4 data-slot="step-3-title">[Шаг 3]</h4><p data-slot="step-3-desc">[Описание]</p></div>
      <div class="step"><div class="step-num-accent">04</div><h4 data-slot="step-4-title">[Шаг 4]</h4><p data-slot="step-4-desc">[Описание]</p></div>
    </div>
  </section>
</body></html>
