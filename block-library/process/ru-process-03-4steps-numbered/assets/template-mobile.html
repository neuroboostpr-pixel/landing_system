<style>
  :root { --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0; --lp-font-display:'Playfair Display',Georgia,serif; --lp-font-body:'Inter Tight',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--lp-font-body); background:var(--lp-bg); color:var(--lp-text); width:375px; padding:40px 0; }
  .head { padding:0 20px 32px; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--lp-accent); margin-bottom:14px; }
  h2 { font-size:32px; font-weight:800; letter-spacing:-0.028em; }
  h2 em { font-family:var(--lp-font-display); font-style:italic; font-weight:500; }
  .process-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--lp-border); border-top:1px solid var(--lp-border); }
  .step { background:var(--lp-bg); padding:22px 18px; }
  .step-num-accent { font-size:22px; font-weight:700; color:var(--lp-accent); margin-bottom:10px; letter-spacing:-0.02em; }
  .step h4 { font-size:15px; font-weight:700; margin-bottom:8px; }
  .step p { font-size:12px; color:rgba(21,20,15,0.65); line-height:1.5; }
</style>
<section data-block-id="ru-process-03-4steps-numbered">
<div class="head">
<div class="kicker">{{slot:kicker}}</div>
<h2>{{slot:h2-1}}</h2>
</div>
<div class="process-grid">
<div class="step"><div class="step-num-accent">01</div><h4>{{slot:step-1-title}}</h4><p>{{slot:step-1-desc}}</p></div>
<div class="step"><div class="step-num-accent">02</div><h4>{{slot:step-2-title}}</h4><p>{{slot:step-2-desc}}</p></div>
<div class="step"><div class="step-num-accent">03</div><h4>{{slot:step-3-title}}</h4><p>{{slot:step-3-desc}}</p></div>
<div class="step"><div class="step-num-accent">04</div><h4>{{slot:step-4-title}}</h4><p>{{slot:step-4-desc}}</p></div>
</div>
</section>
