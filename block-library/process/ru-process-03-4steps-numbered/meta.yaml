display_name_ru: Процесс — 4 шага в сетке с бордерами и иллюстрациями
layout_summary_ru: Двухчастный header (заголовок слева, подзаголовок справа), затем
  сетка 4×1 ячеек с бордером между ними. Иллюстрация + акцентное число + заголовок + описание.
  Mobile — сетка 2×2.
