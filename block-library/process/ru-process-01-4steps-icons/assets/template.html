<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); }
  .process { padding: 64px var(--spacing-lg); max-width: 1100px; margin: 0 auto; }
  .section-headline { font-family: var(--font-display); font-size: 36px; text-align: center; margin: 0 0 48px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .step { display: flex; flex-direction: column; align-items: flex-start; position: relative; }
  .step-num { font-family: var(--font-display); font-size: 64px; font-weight: 900; color:#e0e0e0; line-height: 1; margin: 0 0 8px; }
  .step-icon { width: 40px; height: 40px; border: 2px solid var(--lp-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color:#999; margin-bottom: 12px; }
  .step-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0 0 8px; }
  .step-text { font-size: 14px; color:#555; margin: 0; line-height: 1.5; }
</style>
<section class="process" data-block-id="ru-process-01-4steps-icons">
<h2 class="section-headline">{{slot:headline}}</h2>
<div class="steps">
<div class="step">
<div class="step-num">1</div>
<div class="step-icon" data-slot-type="icon">{{slot:step-1-icon}}</div>
<h3 class="step-title">{{slot:step-1-title}}</h3>
<p class="step-text">{{slot:step-1-text}}</p>
</div>
<div class="step">
<div class="step-num">2</div>
<div class="step-icon" data-slot-type="icon">{{slot:step-2-icon}}</div>
<h3 class="step-title">{{slot:step-2-title}}</h3>
<p class="step-text">{{slot:step-2-text}}</p>
</div>
<div class="step">
<div class="step-num">3</div>
<div class="step-icon" data-slot-type="icon">{{slot:step-3-icon}}</div>
<h3 class="step-title">{{slot:step-3-title}}</h3>
<p class="step-text">{{slot:step-3-text}}</p>
</div>
<div class="step">
<div class="step-num">4</div>
<div class="step-icon" data-slot-type="icon">{{slot:step-4-icon}}</div>
<h3 class="step-title">{{slot:step-4-title}}</h3>
<p class="step-text">{{slot:step-4-text}}</p>
</div>
</div>
</section>
