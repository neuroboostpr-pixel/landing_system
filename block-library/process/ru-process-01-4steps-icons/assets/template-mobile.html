<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; }
  .process { padding: 40px 16px; }
  .section-headline { font-family: var(--font-display); font-size: 24px; text-align: center; margin: 0 0 28px; }
  .step { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 24px; }
  .step-left { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
  .step-num { font-family: var(--font-display); font-size: 40px; font-weight: 900; color:#e0e0e0; line-height: 1; }
  .step-icon { width: 36px; height: 36px; border: 2px solid var(--lp-border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 9px; color:#999; }
  .step-right { flex: 1; padding-top: 4px; }
  .step-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .step-text { font-size: 13px; color:#555; margin: 0; line-height: 1.5; }
</style>
<section class="process" data-block-id="ru-process-01-4steps-icons">
<h2 class="section-headline">{{slot:headline}}</h2>
<div class="step">
<div class="step-left">
<div class="step-num">1</div>
<div class="step-icon" data-slot-type="icon">{{slot:step-1-icon}}</div>
</div>
<div class="step-right">
<h3 class="step-title">{{slot:step-1-title}}</h3>
<p class="step-text">{{slot:step-1-text}}</p>
</div>
</div>
<div class="step">
<div class="step-left">
<div class="step-num">2</div>
<div class="step-icon" data-slot-type="icon">{{slot:step-2-icon}}</div>
</div>
<div class="step-right">
<h3 class="step-title">{{slot:step-2-title}}</h3>
<p class="step-text">{{slot:step-2-text}}</p>
</div>
</div>
<div class="step">
<div class="step-left">
<div class="step-num">3</div>
<div class="step-icon" data-slot-type="icon">{{slot:step-3-icon}}</div>
</div>
<div class="step-right">
<h3 class="step-title">{{slot:step-3-title}}</h3>
<p class="step-text">{{slot:step-3-text}}</p>
</div>
</div>
<div class="step">
<div class="step-left">
<div class="step-num">4</div>
<div class="step-icon" data-slot-type="icon">{{slot:step-4-icon}}</div>
</div>
<div class="step-right">
<h3 class="step-title">{{slot:step-4-title}}</h3>
<p class="step-text">{{slot:step-4-text}}</p>
</div>
</div>
</section>
