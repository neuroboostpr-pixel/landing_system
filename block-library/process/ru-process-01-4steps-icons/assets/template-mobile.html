<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-process-01-4steps-icons — mobile</title>
<style>
  :root {
    --color-bg: #fff; --color-fg: #111; --color-accent: #333; --color-border: #ccc;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .process { padding: 40px 16px; }
  .section-headline { font-family: var(--font-display); font-size: 24px; text-align: center; margin: 0 0 28px; }
  .step { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 24px; }
  .step-left { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
  .step-num { font-family: var(--font-display); font-size: 40px; font-weight: 900; color: #e0e0e0; line-height: 1; }
  .step-icon { width: 36px; height: 36px; border: 2px solid var(--color-border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #999; }
  .step-right { flex: 1; padding-top: 4px; }
  .step-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .step-text { font-size: 13px; color: #555; margin: 0; line-height: 1.5; }
</style>
</head>
<body>
  <section class="process" data-block-id="ru-process-01-4steps-icons">
    <h2 class="section-headline" data-slot="headline">[HEADLINE]</h2>
    <div class="step">
      <div class="step-left">
        <div class="step-num">1</div>
        <div class="step-icon" data-slot="step-1-icon">icon</div>
      </div>
      <div class="step-right">
        <h3 class="step-title" data-slot="step-1-title">[Шаг 1]</h3>
        <p class="step-text" data-slot="step-1-text">[Описание 1]</p>
      </div>
    </div>
    <div class="step">
      <div class="step-left">
        <div class="step-num">2</div>
        <div class="step-icon" data-slot="step-2-icon">icon</div>
      </div>
      <div class="step-right">
        <h3 class="step-title" data-slot="step-2-title">[Шаг 2]</h3>
        <p class="step-text" data-slot="step-2-text">[Описание 2]</p>
      </div>
    </div>
    <div class="step">
      <div class="step-left">
        <div class="step-num">3</div>
        <div class="step-icon" data-slot="step-3-icon">icon</div>
      </div>
      <div class="step-right">
        <h3 class="step-title" data-slot="step-3-title">[Шаг 3]</h3>
        <p class="step-text" data-slot="step-3-text">[Описание 3]</p>
      </div>
    </div>
    <div class="step">
      <div class="step-left">
        <div class="step-num">4</div>
        <div class="step-icon" data-slot="step-4-icon">icon</div>
      </div>
      <div class="step-right">
        <h3 class="step-title" data-slot="step-4-title">[Шаг 4]</h3>
        <p class="step-text" data-slot="step-4-text">[Описание 4]</p>
      </div>
    </div>
  </section>
</body>
</html>
