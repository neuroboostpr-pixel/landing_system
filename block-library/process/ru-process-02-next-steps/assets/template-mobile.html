<!DOCTYPE html>
<!-- Source: /tmp/open-design/skills/release-notes-one-pager/example.html (Apache-2.0, adapted for RU block-library schema) -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ru-process-02-next-steps — mobile</title>
<style>
  :root {
    --color-bg: #fafaf7;
    --color-fg: #1a1916;
    --color-accent: #c96442;
    --color-border: #e8e5df;
    --font-display: Georgia, serif;
    --font-body: system-ui, sans-serif;
    --font-mono: ui-monospace, monospace;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; padding: 32px 16px; }
  .process-headline { font: 600 1.6rem/1.1 var(--font-display); letter-spacing: -.015em; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--color-border); }
  .step-row { padding: 16px 0; border-top: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 6px; }
  .step-row:last-of-type { border-bottom: 1px solid var(--color-border); }
  .step-timing { font: 11px/1 var(--font-mono); color: #888; }
  .step-title { font-size: 1.05rem; font-weight: 600; }
  .step-text { font-size: .875rem; color: #666; line-height: 1.55; }
  .step-row.final { background: var(--color-fg); border-radius: 8px; padding: 16px; border: none; margin-top: 4px; }
  .step-row.final .step-timing, .step-row.final .step-title, .step-row.final .step-text { color: #f5f1ea; }
  .step-row.final .step-text { color: #aaa; }
  .cta-btn { display: block; margin-top: 28px; padding: 14px 24px; background: var(--color-accent); color: #fff; text-align: center; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: .95rem; }
</style>
</head>
<body>
  <section data-block-id="ru-process-02-next-steps">
    <h2 class="process-headline" data-slot="headline">[Как мы работаем]</h2>
    <div class="step-row">
      <span class="step-timing" data-slot="step1-timing">[День 1–2]</span>
      <div class="step-title" data-slot="step1-title">[Шаг 1: Знакомство]</div>
      <p class="step-text" data-slot="step1-text">[Описание шага 1]</p>
    </div>
    <div class="step-row">
      <span class="step-timing" data-slot="step2-timing">[День 3–7]</span>
      <div class="step-title" data-slot="step2-title">[Шаг 2: Подготовка]</div>
      <p class="step-text" data-slot="step2-text">[Описание шага 2]</p>
    </div>
    <div class="step-row final">
      <span class="step-timing" data-slot="step3-timing">[День 8+]</span>
      <div class="step-title" data-slot="step3-title">[Шаг 3: Результат]</div>
      <p class="step-text" data-slot="step3-text">[Итоговый результат]</p>
    </div>
    <a class="cta-btn" data-slot="primary-cta" href="#contact">[CTA: Начать]</a>
  </section>
</body>
</html>
