<style>
  :root {
    --color-bg: #fafaf7;
    --color-fg: #1a1916;
    --color-accent: #c96442;
    --color-border: #e8e5df;
    --font-display: Georgia, serif;
    --font-body: system-ui, sans-serif;
    --font-mono: ui-monospace, monospace;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; padding: 32px 16px; }
  .process-headline { font: 600 1.6rem/1.1 var(--font-display); letter-spacing: -.015em; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--color-border); }
  .step-row { padding: 16px 0; border-top: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 6px; }
  .step-row:last-of-type { border-bottom: 1px solid var(--color-border); }
  .step-timing { font: 11px/1 var(--font-mono); color: #888; }
  .step-title { font-size: 1.05rem; font-weight: 600; }
  .step-text { font-size: .875rem; color: #666; line-height: 1.55; }
  .step-row.final { background: var(--color-fg); border-radius: 8px; padding: 16px; border: none; margin-top: 4px; }
  .step-row.final .step-timing, .step-row.final .step-title, .step-row.final .step-text { color: #f5f1ea; }
  .step-row.final .step-text { color: #aaa; }
  .cta-btn { display: block; margin-top: 28px; padding: 14px 24px; background: var(--color-accent); color: #fff; text-align: center; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: .95rem; }
</style>
<section data-block-id="ru-process-02-next-steps">
<h2 class="process-headline">{{slot:headline}}</h2>
<div class="step-row">
<span class="step-timing">{{slot:step1-timing}}</span>
<div class="step-title">{{slot:step1-title}}</div>
<p class="step-text">{{slot:step1-text}}</p>
</div>
<div class="step-row">
<span class="step-timing">{{slot:step2-timing}}</span>
<div class="step-title">{{slot:step2-title}}</div>
<p class="step-text">{{slot:step2-text}}</p>
</div>
<div class="step-row final">
<span class="step-timing">{{slot:step3-timing}}</span>
<div class="step-title">{{slot:step3-title}}</div>
<p class="step-text">{{slot:step3-text}}</p>
</div>
<a class="cta-btn" href="#contact">{{slot:primary-cta}}</a>
</section>
