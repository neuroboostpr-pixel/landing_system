<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/open-design-landing/example.html | License: Apache-2.0 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-hero-07-editorial-serif — desktop</title>
<style>
  :root {
    --color-bg: #efe7d2;
    --color-fg: #15140f;
    --color-accent: #ed6f5c;
    --color-border: rgba(21,20,15,0.16);
    --font-display: 'Playfair Display', 'Times New Roman', serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500;1,600;1,700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 0.78fr) minmax(0, 1.22fr);
    min-height: 580px;
    border-bottom: 1px solid var(--color-border);
    padding: 0 64px;
    max-width: 1360px;
    margin: 0 auto;
    align-items: stretch;
    gap: 36px;
  }
  .hero-copy {
    padding: 60px 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--color-accent);
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .kicker::before {
    content: '';
    width: 18px;
    height: 1px;
    background: var(--color-accent);
    display: inline-block;
  }
  .headline {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(44px, 5vw, 78px);
    line-height: 1.0;
    letter-spacing: -0.028em;
    margin-bottom: 24px;
  }
  .headline em {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    letter-spacing: -0.018em;
  }
  .subhead {
    font-size: 16px;
    line-height: 1.55;
    color: rgba(21,20,15,0.7);
    max-width: 40ch;
    margin-bottom: 32px;
  }
  .hero-stats {
    display: flex;
    gap: 22px;
    margin-bottom: 32px;
  }
  .stat {
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .stat-ring {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--color-fg);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 700;
  }
  .stat-ring.accent { border-color: var(--color-accent); color: var(--color-accent); }
  .stat-label {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.25;
  }
  .stat-label b { display: block; font-weight: 700; }
  .hero-actions {
    display: flex;
    gap: 14px;
    margin-bottom: 36px;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border-radius: 999px;
    background: var(--color-accent);
    color: #fff;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border: none;
    cursor: pointer;
  }
  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border-radius: 999px;
    background: transparent;
    color: var(--color-fg);
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid var(--color-border);
    cursor: pointer;
  }
  .hero-art {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-left: 1px solid var(--color-border);
    padding: 40px;
  }
  .art-placeholder {
    width: 100%;
    aspect-ratio: 4/3;
    background: rgba(21,20,15,0.06);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(21,20,15,0.35);
  }
  .sec-rule {
    border-top: 1px solid var(--color-border);
    padding: 14px 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(21,20,15,0.5);
    max-width: 1360px;
    margin: 0 auto;
  }
  .sec-rule .roman {
    font-family: var(--font-display);
    font-style: italic;
    color: var(--color-accent);
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: none;
  }
</style>
</head>
<body>
  <div class="sec-rule">
    <span class="roman">I.</span>
    <span>Hero / Редакционный</span>
    <span>001</span>
  </div>
  <section class="hero" data-block-id="ru-hero-07-editorial-serif">
    <div class="hero-copy">
      <span class="kicker" data-slot="kicker">[Ниша / Специализация]</span>
      <h1 class="headline" data-slot="headline">
        [Заголовок с <em>курсивным акцентом</em> на ключевом слове]
      </h1>
      <p class="subhead" data-slot="subhead">[Подзаголовок: 1–2 предложения о главной ценности для клиента. Конкретно, без воды.]</p>
      <div class="hero-stats">
        <div class="stat">
          <span class="stat-ring accent" data-slot="stat-1-value">[N]</span>
          <span class="stat-label"><b data-slot="stat-1-label">[Лет опыта]</b></span>
        </div>
        <div class="stat">
          <span class="stat-ring" data-slot="stat-2-value">[N]</span>
          <span class="stat-label"><b data-slot="stat-2-label">[Проектов]</b></span>
        </div>
        <div class="stat">
          <span class="stat-ring" data-slot="stat-3-value">[N]</span>
          <span class="stat-label"><b data-slot="stat-3-label">[Клиентов]</b></span>
        </div>
      </div>
      <div class="hero-actions">
        <a class="btn-primary" data-slot="primary-cta" href="#contact">[Начать работу]</a>
        <a class="btn-ghost" data-slot="secondary-cta" href="#about">[Узнать подробнее]</a>
      </div>
    </div>
    <div class="hero-art">
      <div class="art-placeholder" data-slot="hero-image">Фото / Иллюстрация</div>
    </div>
  </section>
</body>
</html>
