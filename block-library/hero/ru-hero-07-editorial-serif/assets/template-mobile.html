<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/open-design-landing/example.html | License: Apache-2.0 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-hero-07-editorial-serif — mobile</title>
<style>
  :root {
    --color-bg: #efe7d2;
    --color-fg: #15140f;
    --color-accent: #ed6f5c;
    --color-border: rgba(21,20,15,0.16);
    --font-display: 'Playfair Display', 'Times New Roman', serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500;1,600;1,700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .hero {
    display: flex;
    flex-direction: column;
    padding: 24px 16px 32px;
  }
  .hero-art {
    width: 100%;
    aspect-ratio: 4/3;
    background: rgba(21,20,15,0.06);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(21,20,15,0.35);
    margin-bottom: 24px;
  }
  .kicker {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--color-accent);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .kicker::before {
    content: '';
    width: 14px;
    height: 1px;
    background: var(--color-accent);
    display: inline-block;
  }
  .headline {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-weight: 800;
    font-size: 38px;
    line-height: 1.0;
    letter-spacing: -0.028em;
    margin-bottom: 16px;
  }
  .headline em {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
  }
  .subhead {
    font-size: 15px;
    line-height: 1.55;
    color: rgba(21,20,15,0.7);
    margin-bottom: 24px;
  }
  .hero-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .stat {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .stat-ring {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--color-fg);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .stat-ring.accent { border-color: var(--color-accent); color: var(--color-accent); }
  .stat-label {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.25;
  }
  .stat-label b { display: block; font-weight: 700; }
  .btn-primary {
    display: block;
    width: 100%;
    padding: 14px 24px;
    border-radius: 999px;
    background: var(--color-accent);
    color: #fff;
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    text-align: center;
    border: none;
    margin-bottom: 10px;
  }
  .btn-ghost {
    display: block;
    width: 100%;
    padding: 14px 24px;
    border-radius: 999px;
    background: transparent;
    color: var(--color-fg);
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    text-align: center;
    border: 1px solid var(--color-border);
  }
</style>
</head>
<body>
  <section class="hero" data-block-id="ru-hero-07-editorial-serif">
    <div class="hero-art" data-slot="hero-image">Фото / Иллюстрация</div>
    <span class="kicker" data-slot="kicker">[Ниша / Специализация]</span>
    <h1 class="headline" data-slot="headline">
      [Заголовок с <em>акцентом</em>]
    </h1>
    <p class="subhead" data-slot="subhead">[Подзаголовок: главная ценность кратко]</p>
    <div class="hero-stats">
      <div class="stat">
        <span class="stat-ring accent" data-slot="stat-1-value">[N]</span>
        <span class="stat-label"><b data-slot="stat-1-label">[Лет]</b></span>
      </div>
      <div class="stat">
        <span class="stat-ring" data-slot="stat-2-value">[N]</span>
        <span class="stat-label"><b data-slot="stat-2-label">[Проектов]</b></span>
      </div>
    </div>
    <a class="btn-primary" data-slot="primary-cta" href="#contact">[Начать работу]</a>
    <a class="btn-ghost" data-slot="secondary-cta" href="#about">[Подробнее]</a>
  </section>
</body>
</html>
