description: 'Hero в редакционном стиле: тёплый бежевый фон, крупный заголовок с
  курсивным акцентом, кольцевые метрики, две кнопки. Стиль Atelier Zero от Open Design.'
display_name_ru: Редакционный герой — бежевый фон, курсив, метрики-кольца
layout_summary_ru: 'Двухколоночный: копи слева, фото справа. Заголовок с засечками
  в курсиве, оранжевый акцент, кольца со статистикой, две кнопки. Mobile — стек.'
