conversion_notes: Курсивный акцент в заголовке создаёт элегантность и доверие. Кольца
  с цифрами хорошо работают для ниш с измеримыми результатами (лет опыта, проектов,
  клиентов). Оранжевый CTA на тёплом фоне — контраст достаточный при насыщенном
  #ed6f5c.
