<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-hero-02-b2c-expert — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .hero { display: grid; grid-template-columns: 340px 1fr; min-height: 560px; align-items: center; gap: var(--spacing-lg); padding: var(--spacing-lg); max-width: 1200px; margin: 0 auto; }
  .expert-col { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .expert-photo { width: 220px; height: 220px; border-radius: 50%; background: #ddd; border: 3px solid var(--color-border); display: flex; align-items: center; justify-content: center; font-size: 11px; color: #666; text-transform: uppercase; }
  .expert-name { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; }
  .expert-credentials { font-size: 15px; color: #555; margin: 0; }
  .text-col { display: flex; flex-direction: column; justify-content: center; }
  .headline { font-family: var(--font-display); font-size: 40px; line-height: 1.1; margin: 0 0 16px; }
  .subhead { font-size: 18px; color: #444; margin: 0 0 28px; line-height: 1.5; }
  .cta { display: inline-block; padding: 16px 32px; background: var(--color-accent); color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 16px; }
</style>
</head>
<body>
  <section class="hero" data-block-id="ru-hero-02-b2c-expert">
    <div class="expert-col">
      <div class="expert-photo" data-slot="expert-photo">photo · 1:1 · expert-photo</div>
      <p class="expert-name" data-slot="expert-name">[Имя Эксперта]</p>
      <p class="expert-credentials" data-slot="expert-credentials">[Психолог, 15 лет практики]</p>
    </div>
    <div class="text-col">
      <h1 class="headline" data-slot="headline">[HEADLINE: результат для клиента]</h1>
      <p class="subhead" data-slot="subhead">[SUBHEAD: детализация предложения]</p>
      <a class="cta" data-slot="primary-cta" href="#quiz">[Подобрать программу]</a>
    </div>
  </section>
</body>
</html>
