<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; }
  .hero { display: flex; flex-direction: column; align-items: center; padding: 24px 20px; }
  .expert-photo { width: 140px; height: 140px; border-radius: 50%; background:var(--lp-bg); border: 3px solid var(--lp-border); display: flex; align-items: center; justify-content: center; font-size: 10px; color:#666; text-align: center; margin-bottom: 12px; }
  .expert-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0 0 4px; text-align: center; }
  .expert-credentials { font-size: 13px; color:#555; margin: 0 0 20px; text-align: center; }
  .headline { font-family: var(--font-display); font-size: 26px; line-height: 1.15; margin: 0 0 12px; text-align: center; }
  .subhead { font-size: 15px; color:#444; margin: 0 0 20px; text-align: center; line-height: 1.5; }
  .cta { display: block; width: 100%; padding: 14px; background: var(--lp-accent); color:#fff; text-align: center; text-decoration: none; border-radius: 6px; font-weight: 600; box-sizing: border-box; }
</style>
<section class="hero" data-block-id="ru-hero-02-b2c-expert">
<div class="expert-photo">{{slot:expert-photo}}</div>
<p class="expert-name">{{slot:expert-name}}</p>
<p class="expert-credentials">{{slot:expert-credentials}}</p>
<h1 class="headline">{{slot:headline}}</h1>
<p class="subhead">{{slot:subhead}}</p>
<a class="cta" href="#quiz">{{slot:primary-cta}}</a>
</section>
