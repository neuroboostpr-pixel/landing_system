<style>.lp-hero-technical-split {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
  overflow: hidden;
}

.lp-hero-technical-split__inner {
  display: grid;
  gap: var(--lp-spacing-xl);
  max-width: 1280px;
  margin: 0 auto;
  align-items: center;
}

.lp-hero-technical-split__content {
  display: flex;
  flex-direction: column;
  gap: var(--lp-spacing-md);
}

.lp-hero-technical-split__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-hero-technical-split__title {
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2.5rem, 12vw, 4.75rem);
  line-height: 0.95;
  letter-spacing: 0;
  max-width: 11ch;
}

.lp-hero-technical-split__subhead {
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.65;
  max-width: 40rem;
}

.lp-hero-technical-split__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  padding-top: var(--lp-spacing-xs);
}

.lp-hero-technical-split__button {
  display: inline-flex;
  min-height: 3rem;
  align-items: center;
  justify-content: center;
  border-radius: var(--lp-radius);
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  font-weight: 700;
  line-height: 1;
  text-decoration: none;
  border: 1px solid var(--lp-border);
}

.lp-hero-technical-split__button--primary {
  background: var(--lp-primary);
  color: white;
  border-color: var(--lp-primary);
}

.lp-hero-technical-split__button--secondary {
  background: transparent;
  color: var(--lp-text);
}

.lp-hero-technical-split__button:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 3px;
}

.lp-hero-technical-split__badges {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-xs);
  margin: 0;
  padding: var(--lp-spacing-sm) 0 0;
  list-style: none;
}

.lp-hero-technical-split__badges li {
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  color: var(--lp-text-muted);
  padding: var(--lp-spacing-xs) var(--lp-spacing-sm);
  font-size: 0.88rem;
}

.lp-hero-technical-split__media {
  position: relative;
  margin: 0;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
  padding: var(--lp-spacing-sm);
}

.lp-hero-technical-split__media picture {
  display: block;
  border-radius: var(--lp-radius);
  overflow: hidden;
  aspect-ratio: 4 / 3;
}

.lp-hero-technical-split__media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.lp-hero-technical-split__caption {
  margin-top: var(--lp-spacing-sm);
  color: var(--lp-text-muted);
  font-size: 0.88rem;
  line-height: 1.45;
}

@media (min-width: 768px) {
  .lp-hero-technical-split {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-hero-technical-split__inner {
    grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
  }

  .lp-hero-technical-split__title {
    font-size: clamp(4rem, 6vw, 6.75rem);
  }

  .lp-hero-technical-split__subhead {
    font-size: 1.12rem;
  }

  .lp-hero-technical-split__media {
    padding: var(--lp-spacing-md);
  }

  .lp-hero-technical-split__media picture {
    aspect-ratio: 1 / 1;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-hero-technical-split" aria-labelledby="lp-hero-technical-split-title">
  <div class="lp-hero-technical-split__inner">
    <div class="lp-hero-technical-split__content">
      <p class="lp-hero-technical-split__eyebrow">{{slot:eyebrow}}</p>
      <h1 class="lp-hero-technical-split__title" id="lp-hero-technical-split-title">{{slot:heading}}</h1>
      <p class="lp-hero-technical-split__subhead">{{slot:subhead}}</p>
      <div class="lp-hero-technical-split__actions">
        <a class="lp-hero-technical-split__button lp-hero-technical-split__button--primary" href="{{slot:primary-cta-url}}">
          {{slot:primary-cta-label}}
        </a>
        <a class="lp-hero-technical-split__button lp-hero-technical-split__button--secondary" href="{{slot:secondary-cta-url}}">
          {{slot:secondary-cta-label}}
        </a>
      </div>
      <ul class="lp-hero-technical-split__badges" aria-label="{{slot:badges-label}}">
        <li>{{slot:badge-1}}</li>
        <li>{{slot:badge-2}}</li>
        <li>{{slot:badge-3}}</li>
      </ul>
    </div>

    <figure class="lp-hero-technical-split__media">
      <picture>
        <source media="(max-width: 767px)" srcset="{{slot:product-image-mobile}}">
        <img src="{{slot:product-image}}" alt="{{slot:product-image-alt}}" loading="lazy">
      </picture>
      <figcaption class="lp-hero-technical-split__caption">{{slot:image-caption}}</figcaption>
    </figure>
  </div>
</section>
