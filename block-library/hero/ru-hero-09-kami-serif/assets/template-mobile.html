<style>
  :root {
    --color-bg: #f5f4ed;
    --color-fg: #141413;
    --color-accent: #1B365D;
    --color-border: #e8e6dc;
    --font-display: 'Source Serif 4', Charter, Georgia, serif;
    --font-body: 'Source Sans 3', system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-display); background: var(--color-bg); color: var(--color-fg); width: 375px; padding: 32px 20px 40px; }
  .eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #6b6a64;
    border-bottom: 1px solid var(--color-border);
    padding-bottom: 14px;
    margin-bottom: 36px;
    display: flex;
    justify-content: space-between;
  }
  .headline {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 52px;
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 18px;
  }
  .headline .accent { color: var(--color-accent); }
  .tagline {
    font-size: 17px;
    line-height: 1.5;
    color: #504e49;
    margin-bottom: 28px;
  }
  .hero-tokens {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .token-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #faf9f5;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 11px;
    color: #6b6a64;
  }
  .token-row b {
    color: var(--color-accent);
    font-weight: 500;
    font-size: 13px;
  }
  .btn-primary {
    display: block;
    width: 100%;
    padding: 13px 24px;
    background: var(--color-accent);
    color: #fff;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15px;
    text-decoration: none;
    text-align: center;
    border: none;
    margin-bottom: 10px;
  }
  .btn-ghost {
    display: block;
    width: 100%;
    padding: 13px 24px;
    background: transparent;
    color: var(--color-accent);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15px;
    text-decoration: none;
    text-align: center;
    border: 1px solid var(--color-accent);
  }
</style>
<div class="eyebrow">
<span>{{slot:eyebrow-left}}</span>
<span>{{slot:eyebrow-right}}</span>
</div>
<section data-block-id="ru-hero-09-kami-serif">
<h1 class="headline">{{slot:headline}}</h1>
<p class="tagline">{{slot:subhead}}</p>
<div class="hero-tokens">
<div class="token-row"><b>{{slot:metric-1-value}}</b><span>{{slot:metric-1-label}}</span></div>
<div class="token-row"><b>{{slot:metric-2-value}}</b><span>{{slot:metric-2-label}}</span></div>
<div class="token-row"><b>{{slot:metric-3-value}}</b><span>{{slot:metric-3-label}}</span></div>
</div>
<a class="btn-primary" href="#contact">{{slot:primary-cta}}</a>
<a class="btn-ghost" href="#about">{{slot:secondary-cta}}</a>
</section>
