<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/kami-landing/example.html | License: Apache-2.0 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-hero-09-kami-serif — mobile</title>
<style>
  :root {
    --color-bg: #f5f4ed;
    --color-fg: #141413;
    --color-accent: #1B365D;
    --color-border: #e8e6dc;
    --font-display: 'Source Serif 4', Charter, Georgia, serif;
    --font-body: 'Source Sans 3', system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-display); background: var(--color-bg); color: var(--color-fg); width: 375px; padding: 32px 20px 40px; }
  .eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #6b6a64;
    border-bottom: 1px solid var(--color-border);
    padding-bottom: 14px;
    margin-bottom: 36px;
    display: flex;
    justify-content: space-between;
  }
  .headline {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 52px;
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 18px;
  }
  .headline .accent { color: var(--color-accent); }
  .tagline {
    font-size: 17px;
    line-height: 1.5;
    color: #504e49;
    margin-bottom: 28px;
  }
  .hero-tokens {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .token-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #faf9f5;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 11px;
    color: #6b6a64;
  }
  .token-row b {
    color: var(--color-accent);
    font-weight: 500;
    font-size: 13px;
  }
  .btn-primary {
    display: block;
    width: 100%;
    padding: 13px 24px;
    background: var(--color-accent);
    color: #fff;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15px;
    text-decoration: none;
    text-align: center;
    border: none;
    margin-bottom: 10px;
  }
  .btn-ghost {
    display: block;
    width: 100%;
    padding: 13px 24px;
    background: transparent;
    color: var(--color-accent);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15px;
    text-decoration: none;
    text-align: center;
    border: 1px solid var(--color-accent);
  }
</style>
</head>
<body>
  <div class="eyebrow">
    <span data-slot="eyebrow-left">[Компания]</span>
    <span data-slot="eyebrow-right">[Год]</span>
  </div>
  <section data-block-id="ru-hero-09-kami-serif">
    <h1 class="headline" data-slot="headline">[Заголовок с <span class="accent">акцентом</span>]</h1>
    <p class="tagline" data-slot="subhead">[Главная ценность кратко]</p>
    <div class="hero-tokens">
      <div class="token-row"><b data-slot="metric-1-value">[N]</b><span data-slot="metric-1-label">[Пар. 1]</span></div>
      <div class="token-row"><b data-slot="metric-2-value">[N]</b><span data-slot="metric-2-label">[Пар. 2]</span></div>
      <div class="token-row"><b data-slot="metric-3-value">[N]</b><span data-slot="metric-3-label">[Пар. 3]</span></div>
    </div>
    <a class="btn-primary" data-slot="primary-cta" href="#contact">[Начать сейчас]</a>
    <a class="btn-ghost" data-slot="secondary-cta" href="#about">[О нас]</a>
  </section>
</body>
</html>
