<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); }

  .hero {
    padding: calc(var(--spacing-lg) * 3) var(--spacing-lg);
    text-align: center;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-md);
  }

  /* Decorative thin lines */
  .deco-line {
    display: block;
    width: 80px;
    height: 1px;
    background: var(--lp-border);
    margin: 0 auto;
  }

  .tagline {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color:#888;
    margin: 0;
  }

  .headline {
    font-family: var(--font-display);
    font-size: 64px;
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin: 0;
    max-width: 820px;
  }

  .subhead {
    font-size: 20px;
    color:#555;
    line-height: 1.5;
    margin: 0;
    max-width: 560px;
  }

  .primary-cta {
    display: inline-block;
    padding: 18px 44px;
    background: var(--lp-text);
    color: var(--lp-bg);
    text-decoration: none;
    border-radius: 4px;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.02em;
    margin-top: 8px;
  }
</style>
<section class="hero" data-block-id="ru-hero-05-centered-bold">
<!-- Top decoration -->
<span aria-hidden="true" class="deco-line"></span>
<p class="tagline">{{slot:tagline}}</p>
<h1 class="headline">{{slot:headline}}</h1>
<p class="subhead">{{slot:subhead}}</p>
<a class="primary-cta" href="#contact">{{slot:primary-cta}}</a>
<!-- Bottom decoration -->
<span aria-hidden="true" class="deco-line"></span>
</section>
