<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-hero-05-centered-bold — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }

  .hero {
    padding: calc(var(--spacing-lg) * 3) var(--spacing-lg);
    text-align: center;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-md);
  }

  /* Decorative thin lines */
  .deco-line {
    display: block;
    width: 80px;
    height: 1px;
    background: var(--color-border);
    margin: 0 auto;
  }

  .tagline {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #888;
    margin: 0;
  }

  .headline {
    font-family: var(--font-display);
    font-size: 64px;
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin: 0;
    max-width: 820px;
  }

  .subhead {
    font-size: 20px;
    color: #555;
    line-height: 1.5;
    margin: 0;
    max-width: 560px;
  }

  .primary-cta {
    display: inline-block;
    padding: 18px 44px;
    background: var(--color-fg);
    color: var(--color-bg);
    text-decoration: none;
    border-radius: 4px;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.02em;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <section class="hero" data-block-id="ru-hero-05-centered-bold">

    <!-- Top decoration -->
    <span class="deco-line" aria-hidden="true"></span>

    <p class="tagline" data-slot="tagline">[TAGLINE: необязательная метка — например, «С 2010 ГОДА»]</p>

    <h1 class="headline" data-slot="headline">[HEADLINE: крупный, смелый заголовок — суть бренда одной фразой]</h1>

    <p class="subhead" data-slot="subhead">[SUBHEAD: одно-два предложения с ценностным предложением или ключевой выгодой]</p>

    <a class="primary-cta" data-slot="primary-cta" href="#contact">[Начать сотрудничество]</a>

    <!-- Bottom decoration -->
    <span class="deco-line" aria-hidden="true"></span>

  </section>
</body>
</html>
