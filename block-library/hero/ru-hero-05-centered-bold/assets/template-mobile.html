<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-hero-05-centered-bold — mobile</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }

  .hero {
    padding: calc(var(--spacing-lg) * 2) 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-md);
  }

  .deco-line {
    display: block;
    width: 48px;
    height: 1px;
    background: var(--color-border);
    margin: 0 auto;
  }

  .tagline {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #888;
    margin: 0;
  }

  .headline {
    font-family: var(--font-display);
    font-size: 36px;
    line-height: 1.1;
    font-weight: 900;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .subhead {
    font-size: 16px;
    color: #555;
    line-height: 1.5;
    margin: 0;
  }

  .primary-cta {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--color-fg);
    color: var(--color-bg);
    text-decoration: none;
    border-radius: 4px;
    font-weight: 700;
    font-size: 16px;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <section class="hero" data-block-id="ru-hero-05-centered-bold">

    <span class="deco-line" aria-hidden="true"></span>

    <p class="tagline" data-slot="tagline">[TAGLINE: необязательная метка]</p>

    <h1 class="headline" data-slot="headline">[HEADLINE: крупный смелый заголовок]</h1>

    <p class="subhead" data-slot="subhead">[SUBHEAD: ценностное предложение]</p>

    <a class="primary-cta" data-slot="primary-cta" href="#contact">[Начать сотрудничество]</a>

    <span class="deco-line" aria-hidden="true"></span>

  </section>
</body>
</html>
