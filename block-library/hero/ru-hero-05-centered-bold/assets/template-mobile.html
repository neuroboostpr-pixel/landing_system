<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif;
    --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; }

  .hero {
    padding: calc(var(--spacing-lg) * 2) 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-md);
  }

  .deco-line {
    display: block;
    width: 48px;
    height: 1px;
    background: var(--lp-border);
    margin: 0 auto;
  }

  .tagline {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color:#888;
    margin: 0;
  }

  .headline {
    font-family: var(--lp-font-display);
    font-size: 36px;
    line-height: 1.1;
    font-weight: 900;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .subhead {
    font-size: 16px;
    color:#555;
    line-height: 1.5;
    margin: 0;
  }

  .primary-cta {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--lp-text);
    color: var(--lp-bg);
    text-decoration: none;
    border-radius: 4px;
    font-weight: 700;
    font-size: 16px;
    text-align: center;
    margin-top: 8px;
  }
</style>
<section class="hero" data-block-id="ru-hero-05-centered-bold">
<span aria-hidden="true" class="deco-line"></span>
<p class="tagline">{{slot:tagline}}</p>
<h1 class="headline">{{slot:headline}}</h1>
<p class="subhead">{{slot:subhead}}</p>
<a class="primary-cta" href="#contact">{{slot:primary-cta}}</a>
<span aria-hidden="true" class="deco-line"></span>
</section>
