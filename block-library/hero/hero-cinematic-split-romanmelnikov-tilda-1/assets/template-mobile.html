<style>.lp-hero-cinematic-split {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-hero-cinematic-split__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  margin: 0 auto;
  max-width: 1280px;
}

.lp-hero-cinematic-split__headline,
.lp-hero-cinematic-split__content {
  display: grid;
  gap: var(--lp-spacing-md);
}

.lp-hero-cinematic-split__eyebrow {
  color: var(--lp-accent);
  font-size: 0.78rem;
  letter-spacing: 0;
  line-height: 1.4;
  margin: 0;
  text-transform: uppercase;
}

.lp-hero-cinematic-split__title {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2.6rem, 12vw, 6.8rem);
  font-weight: 600;
  letter-spacing: 0;
  line-height: 0.95;
  margin: 0;
  max-width: 10ch;
}

.lp-hero-cinematic-split__lead {
  color: var(--lp-text-muted);
  font-size: 1.05rem;
  line-height: 1.7;
  margin: 0;
  max-width: 34rem;
}

.lp-hero-cinematic-split__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
}

.lp-hero-cinematic-split__button {
  align-items: center;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  display: inline-flex;
  font-size: 0.95rem;
  justify-content: center;
  line-height: 1;
  min-height: 3rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  text-decoration: none;
}

.lp-hero-cinematic-split__button--primary {
  background: var(--lp-accent);
  border-color: var(--lp-accent);
  color: var(--lp-bg);
}

.lp-hero-cinematic-split__button--secondary {
  background: transparent;
  color: var(--lp-text);
}

.lp-hero-cinematic-split__scene {
  border-top: 1px solid var(--lp-border);
  display: grid;
  gap: var(--lp-spacing-sm);
  margin: var(--lp-spacing-md) 0 0;
  padding-top: var(--lp-spacing-md);
}

.lp-hero-cinematic-split__scene picture {
  display: block;
  overflow: hidden;
  border-radius: var(--lp-radius-lg);
}

.lp-hero-cinematic-split__scene img {
  aspect-ratio: 16 / 9;
  display: block;
  filter: grayscale(1);
  height: auto;
  object-fit: cover;
  width: 100%;
}

.lp-hero-cinematic-split__caption {
  color: var(--lp-text-muted);
  font-size: 0.85rem;
  line-height: 1.5;
}

@media (min-width: 768px) {
  .lp-hero-cinematic-split {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-hero-cinematic-split__inner {
    grid-template-columns: minmax(0, 1.25fr) minmax(18rem, 0.75fr);
  }

  .lp-hero-cinematic-split__content {
    align-content: end;
    border-left: 1px solid var(--lp-border);
    padding-left: var(--lp-spacing-lg);
  }

  .lp-hero-cinematic-split__scene {
    grid-column: 1 / -1;
  }

  .lp-hero-cinematic-split__scene img {
    aspect-ratio: 21 / 8;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-hero-cinematic-split" aria-labelledby="lp-hero-cinematic-split-title">
  <div class="lp-hero-cinematic-split__inner">
    <div class="lp-hero-cinematic-split__headline">
      <p class="lp-hero-cinematic-split__eyebrow">{{slot:eyebrow}}</p>
      <h1 id="lp-hero-cinematic-split-title" class="lp-hero-cinematic-split__title">{{slot:title}}</h1>
    </div>

    <div class="lp-hero-cinematic-split__content">
      <p class="lp-hero-cinematic-split__lead">{{slot:subhead}}</p>
      <div class="lp-hero-cinematic-split__actions">
        <a class="lp-hero-cinematic-split__button lp-hero-cinematic-split__button--primary" href="{{slot:primary-cta-link}}">
          {{slot:primary-cta-label}}
        </a>
        <a class="lp-hero-cinematic-split__button lp-hero-cinematic-split__button--secondary" href="{{slot:secondary-cta-link}}">
          {{slot:secondary-cta-label}}
        </a>
      </div>
    </div>

    <figure class="lp-hero-cinematic-split__scene">
      <picture>
        <source media="(max-width: 767px)" srcset="{{slot:scene-image-mobile}}">
        <img src="{{slot:scene-image}}" alt="{{slot:scene-image-alt}}" loading="lazy">
      </picture>
      <figcaption class="lp-hero-cinematic-split__caption">{{slot:scene-caption}}</figcaption>
    </figure>
  </div>
</section>
