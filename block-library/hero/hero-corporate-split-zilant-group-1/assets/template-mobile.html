<style>.lp-hero-corporate-split {
  background: var(--lp-bg-alt);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
  overflow: hidden;
}

.lp-hero-corporate-split__inner {
  display: grid;
  gap: var(--lp-spacing-xl);
  max-width: 1280px;
  margin: 0 auto;
  align-items: center;
}

.lp-hero-corporate-split__content {
  display: flex;
  flex-direction: column;
  gap: var(--lp-spacing-md);
}

.lp-hero-corporate-split__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-hero-corporate-split__title {
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2.25rem, 8vw, 4.75rem);
  line-height: 0.98;
  letter-spacing: 0;
}

.lp-hero-corporate-split__subhead {
  margin: 0;
  max-width: 42rem;
  color: var(--lp-text-muted);
  font-size: 1.0625rem;
  line-height: 1.6;
}

.lp-hero-corporate-split__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  padding-top: var(--lp-spacing-sm);
}

.lp-hero-corporate-split__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3.25rem;
  border-radius: var(--lp-radius);
  border: 1px solid var(--lp-border);
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  color: var(--lp-text);
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
}

.lp-hero-corporate-split__button--primary {
  background: var(--lp-primary);
  border-color: var(--lp-primary);
  color: white;
}

.lp-hero-corporate-split__button--secondary {
  background: transparent;
  color: var(--lp-primary);
}

.lp-hero-corporate-split__badges {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-xs);
  margin: 0;
  padding: var(--lp-spacing-sm) 0 0;
  list-style: none;
}

.lp-hero-corporate-split__badge {
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
  padding: var(--lp-spacing-xs) var(--lp-spacing-sm);
  color: var(--lp-text-muted);
  font-size: 0.875rem;
  line-height: 1.3;
}

.lp-hero-corporate-split__media {
  position: relative;
  min-height: 18rem;
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg);
  overflow: hidden;
}

.lp-hero-corporate-split__media picture,
.lp-hero-corporate-split__media img {
  display: block;
  width: 100%;
  height: 100%;
}

.lp-hero-corporate-split__media img {
  min-height: 18rem;
  object-fit: cover;
}

.lp-hero-corporate-split__stat {
  position: absolute;
  right: var(--lp-spacing-md);
  bottom: var(--lp-spacing-md);
  display: grid;
  gap: var(--lp-spacing-xs);
  max-width: 14rem;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
  padding: var(--lp-spacing-md);
}

.lp-hero-corporate-split__stat strong {
  color: var(--lp-primary);
  font-family: var(--lp-font-display);
  font-size: 1.75rem;
  line-height: 1;
}

.lp-hero-corporate-split__stat span {
  color: var(--lp-text-muted);
  font-size: 0.875rem;
  line-height: 1.35;
}

@media (min-width: 768px) {
  .lp-hero-corporate-split {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-hero-corporate-split__inner {
    grid-template-columns: minmax(0, 1fr) minmax(20rem, 0.86fr);
  }

  .lp-hero-corporate-split__subhead {
    font-size: 1.1875rem;
  }

  .lp-hero-corporate-split__media {
    min-height: 34rem;
  }

  .lp-hero-corporate-split__media img {
    min-height: 34rem;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section aria-labelledby="lp-hero-corporate-split-title" class="lp-hero-corporate-split">
<div class="lp-hero-corporate-split__inner">
<div class="lp-hero-corporate-split__content">
<p class="lp-hero-corporate-split__eyebrow">{{slot:eyebrow}}</p>
<h1 class="lp-hero-corporate-split__title" id="lp-hero-corporate-split-title">{{slot:heading}}</h1>
<p class="lp-hero-corporate-split__subhead">{{slot:subhead}}</p>
<div aria-label="{{slot:actions-label}}" class="lp-hero-corporate-split__actions">
<a class="lp-hero-corporate-split__button lp-hero-corporate-split__button--primary" href="{{slot:primary-cta-url}}">
          {{slot:primary-cta-label}}
        </a>
<a class="lp-hero-corporate-split__button lp-hero-corporate-split__button--secondary" href="{{slot:secondary-cta-url}}">
          {{slot:secondary-cta-label}}
        </a>
</div>
<ul aria-label="{{slot:badges-label}}" class="lp-hero-corporate-split__badges">
<li class="lp-hero-corporate-split__badge">{{slot:badge-1}}</li>
<li class="lp-hero-corporate-split__badge">{{slot:badge-2}}</li>
<li class="lp-hero-corporate-split__badge">{{slot:badge-3}}</li>
</ul>
</div>
<div aria-label="{{slot:media-label}}" class="lp-hero-corporate-split__media">
<picture>
<source media="(max-width: 767px)" srcset="{{slot:hero-image-mobile}}"/>
<img alt="{{slot:hero-image-alt}}" loading="lazy" src="{{slot:hero-image}}"/>
</picture>
<div class="lp-hero-corporate-split__stat">
<strong>{{slot:stat-value}}</strong>
<span>{{slot:stat-label}}</span>
</div>
</div>
</div>
</section>
