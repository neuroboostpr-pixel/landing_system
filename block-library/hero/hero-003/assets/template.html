<style>.lp-hero-corporate-split {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-hero-corporate-split__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  max-width: 1180px;
  margin: 0 auto;
}

.lp-hero-corporate-split__media {
  overflow: hidden;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
}

.lp-hero-corporate-split__media img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 4 / 3;
  object-fit: cover;
}

.lp-hero-corporate-split__content {
  display: flex;
  flex-direction: column;
  gap: var(--lp-spacing-md);
}

.lp-hero-corporate-split__badge {
  align-self: flex-start;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  color: var(--lp-primary);
  background: var(--lp-bg-alt);
  font-size: 0.875rem;
  line-height: 1.4;
  padding: var(--lp-spacing-xs) var(--lp-spacing-sm);
}

.lp-hero-corporate-split__title {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 5vw, 4rem);
  line-height: 1.05;
  letter-spacing: 0;
  margin: 0;
}

.lp-hero-corporate-split__subtitle {
  color: var(--lp-text-muted);
  font-size: 1.0625rem;
  line-height: 1.6;
  margin: 0;
  max-width: 42rem;
}

.lp-hero-corporate-split__form {
  display: grid;
  gap: var(--lp-spacing-sm);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
  padding: var(--lp-spacing-md);
}

.lp-hero-corporate-split__form-head {
  display: grid;
  gap: var(--lp-spacing-xs);
  margin-bottom: var(--lp-spacing-xs);
}

.lp-hero-corporate-split__form-title {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 1.25rem;
  line-height: 1.2;
  margin: 0;
}

.lp-hero-corporate-split__form-note,
.lp-hero-corporate-split__privacy {
  color: var(--lp-text-muted);
  font-size: 0.875rem;
  line-height: 1.5;
  margin: 0;
}

.lp-hero-corporate-split__field {
  display: grid;
  gap: var(--lp-spacing-xs);
  color: var(--lp-text);
  font-size: 0.875rem;
  line-height: 1.4;
}

.lp-hero-corporate-split__field input {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
  color: var(--lp-text);
  font: inherit;
  min-height: 3rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
}

.lp-hero-corporate-split__field input:focus {
  outline: 2px solid var(--lp-accent);
  outline-offset: 2px;
}

.lp-hero-corporate-split__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--lp-primary);
  border-radius: var(--lp-radius);
  background: var(--lp-primary);
  color: white;
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  min-height: 3rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
}

.lp-hero-corporate-split__button:focus {
  outline: 2px solid var(--lp-accent);
  outline-offset: 2px;
}

@media (min-width: 768px) {
  .lp-hero-corporate-split {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-hero-corporate-split__inner {
    align-items: center;
    grid-template-columns: minmax(0, 1fr) minmax(20rem, 0.9fr);
  }

  .lp-hero-corporate-split__media img {
    min-height: 34rem;
  }

  .lp-hero-corporate-split__form {
    padding: var(--lp-spacing-lg);
  }
}
</style>
<section aria-labelledby="lp-hero-corporate-split-title" class="lp-hero-corporate-split">
<div class="lp-hero-corporate-split__inner">
<div class="lp-hero-corporate-split__media">
<picture>
<source media="(max-width: 767px)" srcset="{{slot:hero-image-mobile}}"/>
<img alt="{{slot:hero-image-alt}}" loading="lazy" src="{{slot:hero-image}}"/>
</picture>
</div>
<div class="lp-hero-corporate-split__content">
<div class="lp-hero-corporate-split__badge">{{slot:hero-badge}}</div>
<h1 class="lp-hero-corporate-split__title" id="lp-hero-corporate-split-title">{{slot:hero-title}}</h1>
<p class="lp-hero-corporate-split__subtitle">{{slot:hero-subtitle}}</p>
<form action="{{slot:form-action}}" aria-label="{{slot:form-aria-label}}" class="lp-hero-corporate-split__form" method="post">
<div class="lp-hero-corporate-split__form-head">
<h2 class="lp-hero-corporate-split__form-title">{{slot:form-title}}</h2>
<p class="lp-hero-corporate-split__form-note">{{slot:form-note}}</p>
</div>
<label class="lp-hero-corporate-split__field">
<span>{{slot:name-label}}</span>
<input autocomplete="name" name="name" placeholder="{{slot:name-placeholder}}" type="text"/>
</label>
<label class="lp-hero-corporate-split__field">
<span>{{slot:phone-label}}</span>
<input autocomplete="tel" name="phone" placeholder="{{slot:phone-placeholder}}" type="tel"/>
</label>
<button class="lp-hero-corporate-split__button" type="submit">{{slot:primary-cta-label}}</button>
<p class="lp-hero-corporate-split__privacy">{{slot:privacy-text}}</p>
</form>
</div>
</div>
</section>
