<style>.lp-hero-minimal-split {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-hero-minimal-split__inner {
  display: grid;
  gap: var(--lp-spacing-xl);
  max-width: 1180px;
  margin: 0 auto;
}

.lp-hero-minimal-split__content {
  display: flex;
  flex-direction: column;
  gap: var(--lp-spacing-md);
}

.lp-hero-minimal-split__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-size: 0.875rem;
  font-weight: 700;
  line-height: 1.3;
}

.lp-hero-minimal-split__title {
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2.5rem, 9vw, 5.5rem);
  line-height: 0.95;
  letter-spacing: 0;
}

.lp-hero-minimal-split__subhead {
  max-width: 38rem;
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 1.125rem;
  line-height: 1.6;
}

.lp-hero-minimal-split__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  margin-top: var(--lp-spacing-sm);
}

.lp-hero-minimal-split__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3.25rem;
  border-radius: var(--lp-radius);
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
}

.lp-hero-minimal-split__button--primary {
  background: var(--lp-primary);
  color: var(--lp-bg);
}

.lp-hero-minimal-split__button--secondary {
  border: 1px solid var(--lp-border);
  background: transparent;
  color: var(--lp-text);
}

.lp-hero-minimal-split__trust {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--lp-spacing-sm);
  padding: 0;
  margin: var(--lp-spacing-md) 0 0;
  list-style: none;
}

.lp-hero-minimal-split__trust-item {
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  padding: var(--lp-spacing-md);
  background: var(--lp-bg-alt);
}

.lp-hero-minimal-split__trust-value,
.lp-hero-minimal-split__trust-label {
  display: block;
}

.lp-hero-minimal-split__trust-value {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 1.5rem;
  font-weight: 800;
  line-height: 1.1;
}

.lp-hero-minimal-split__trust-label {
  margin-top: var(--lp-spacing-xs);
  color: var(--lp-text-muted);
  font-size: 0.875rem;
  line-height: 1.4;
}

.lp-hero-minimal-split__visual {
  position: relative;
  min-height: 22rem;
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
  padding: var(--lp-spacing-md);
}

.lp-hero-minimal-split__media {
  height: 100%;
  min-height: 20rem;
  margin: 0;
  overflow: hidden;
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg);
}

.lp-hero-minimal-split__media img {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 20rem;
  object-fit: cover;
}

.lp-hero-minimal-split__markers {
  display: grid;
  gap: var(--lp-spacing-sm);
  padding: 0;
  margin: var(--lp-spacing-md) 0 0;
  list-style: none;
}

.lp-hero-minimal-split__marker {
  display: flex;
  align-items: center;
  gap: var(--lp-spacing-sm);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  color: var(--lp-text);
  font-size: 0.9375rem;
  font-weight: 700;
  line-height: 1.35;
}

.lp-hero-minimal-split__marker-dot {
  flex: 0 0 0.75rem;
  width: 0.75rem;
  height: 0.75rem;
  border-radius: 999px;
  background: var(--lp-accent);
}

@media (min-width: 768px) {
  .lp-hero-minimal-split {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-hero-minimal-split__inner {
    grid-template-columns: minmax(0, 1fr) minmax(22rem, 0.9fr);
    align-items: center;
  }

  .lp-hero-minimal-split__content {
    gap: var(--lp-spacing-lg);
  }

  .lp-hero-minimal-split__visual {
    min-height: 36rem;
    padding: var(--lp-spacing-lg);
  }

  .lp-hero-minimal-split__media,
  .lp-hero-minimal-split__media img {
    min-height: 32rem;
  }

  .lp-hero-minimal-split__markers {
    position: absolute;
    inset: var(--lp-spacing-lg);
    pointer-events: none;
    margin: 0;
  }

  .lp-hero-minimal-split__marker {
    position: absolute;
    max-width: 16rem;
    pointer-events: auto;
  }

  .lp-hero-minimal-split__marker--top {
    top: var(--lp-spacing-lg);
    left: 0;
  }

  .lp-hero-minimal-split__marker--bottom {
    right: 0;
    bottom: var(--lp-spacing-lg);
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-hero-minimal-split" aria-labelledby="lp-hero-minimal-split-title">
  <div class="lp-hero-minimal-split__inner">
    <div class="lp-hero-minimal-split__content">
      <p class="lp-hero-minimal-split__eyebrow">{{slot:eyebrow}}</p>
      <h1 class="lp-hero-minimal-split__title" id="lp-hero-minimal-split-title">{{slot:heading}}</h1>
      <p class="lp-hero-minimal-split__subhead">{{slot:subhead}}</p>

      <div class="lp-hero-minimal-split__actions" aria-label="{{slot:cta-group-label}}">
        <a class="lp-hero-minimal-split__button lp-hero-minimal-split__button--primary" href="{{slot:primary-cta-link}}">
          {{slot:primary-cta-label}}
        </a>
        <a class="lp-hero-minimal-split__button lp-hero-minimal-split__button--secondary" href="{{slot:secondary-cta-link}}">
          {{slot:secondary-cta-label}}
        </a>
      </div>

      <ul class="lp-hero-minimal-split__trust" aria-label="{{slot:trust-list-label}}">
        <li class="lp-hero-minimal-split__trust-item">
          <span class="lp-hero-minimal-split__trust-value">{{slot:trust-value-1}}</span>
          <span class="lp-hero-minimal-split__trust-label">{{slot:trust-label-1}}</span>
        </li>
        <li class="lp-hero-minimal-split__trust-item">
          <span class="lp-hero-minimal-split__trust-value">{{slot:trust-value-2}}</span>
          <span class="lp-hero-minimal-split__trust-label">{{slot:trust-label-2}}</span>
        </li>
      </ul>
    </div>

    <div class="lp-hero-minimal-split__visual" aria-label="{{slot:visual-label}}">
      <figure class="lp-hero-minimal-split__media">
        <img src="{{slot:hero-image}}" alt="{{slot:hero-image-alt}}" loading="lazy">
      </figure>

      <ul class="lp-hero-minimal-split__markers" aria-label="{{slot:benefits-list-label}}">
        <li class="lp-hero-minimal-split__marker lp-hero-minimal-split__marker--top">
          <span class="lp-hero-minimal-split__marker-dot" aria-hidden="true"></span>
          <span>{{slot:benefit-marker-1}}</span>
        </li>
        <li class="lp-hero-minimal-split__marker lp-hero-minimal-split__marker--bottom">
          <span class="lp-hero-minimal-split__marker-dot" aria-hidden="true"></span>
          <span>{{slot:benefit-marker-2}}</span>
        </li>
      </ul>
    </div>
  </div>
</section>
