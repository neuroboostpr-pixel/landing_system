<section class="lp-hero-minimal-split" aria-labelledby="lp-hero-minimal-split-title">
  <div class="lp-hero-minimal-split__inner">
    <div class="lp-hero-minimal-split__content">
      <p class="lp-hero-minimal-split__eyebrow">{{slot:eyebrow}}</p>
      <h1 class="lp-hero-minimal-split__title" id="lp-hero-minimal-split-title">{{slot:heading}}</h1>
      <p class="lp-hero-minimal-split__subhead">{{slot:subhead}}</p>

      <div class="lp-hero-minimal-split__actions" aria-label="{{slot:cta-group-label}}">
        <a class="lp-hero-minimal-split__button lp-hero-minimal-split__button--primary" href="{{slot:primary-cta-link}}">
          {{slot:primary-cta-label}}
        </a>
        <a class="lp-hero-minimal-split__button lp-hero-minimal-split__button--secondary" href="{{slot:secondary-cta-link}}">
          {{slot:secondary-cta-label}}
        </a>
      </div>

      <ul class="lp-hero-minimal-split__trust" aria-label="{{slot:trust-list-label}}">
        <li class="lp-hero-minimal-split__trust-item">
          <span class="lp-hero-minimal-split__trust-value">{{slot:trust-value-1}}</span>
          <span class="lp-hero-minimal-split__trust-label">{{slot:trust-label-1}}</span>
        </li>
        <li class="lp-hero-minimal-split__trust-item">
          <span class="lp-hero-minimal-split__trust-value">{{slot:trust-value-2}}</span>
          <span class="lp-hero-minimal-split__trust-label">{{slot:trust-label-2}}</span>
        </li>
      </ul>
    </div>

    <div class="lp-hero-minimal-split__visual" aria-label="{{slot:visual-label}}">
      <figure class="lp-hero-minimal-split__media">
        <img src="{{slot:hero-image}}" alt="{{slot:hero-image-alt}}" loading="lazy">
      </figure>

      <ul class="lp-hero-minimal-split__markers" aria-label="{{slot:benefits-list-label}}">
        <li class="lp-hero-minimal-split__marker lp-hero-minimal-split__marker--top">
          <span class="lp-hero-minimal-split__marker-dot" aria-hidden="true"></span>
          <span>{{slot:benefit-marker-1}}</span>
        </li>
        <li class="lp-hero-minimal-split__marker lp-hero-minimal-split__marker--bottom">
          <span class="lp-hero-minimal-split__marker-dot" aria-hidden="true"></span>
          <span>{{slot:benefit-marker-2}}</span>
        </li>
      </ul>
    </div>
  </div>
</section>
