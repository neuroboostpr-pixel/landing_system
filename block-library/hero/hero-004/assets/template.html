<style>.lp-hero-editorial-centered {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-hero-editorial-centered__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  justify-items: center;
  max-width: 1180px;
  margin: 0 auto;
  text-align: center;
}

.lp-hero-editorial-centered__eyebrow {
  color: var(--lp-primary);
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.4;
}

.lp-hero-editorial-centered__title {
  max-width: 11em;
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2.625rem, 12vw, 6.75rem);
  font-weight: 700;
  line-height: 0.96;
  letter-spacing: 0;
}

.lp-hero-editorial-centered__subhead {
  max-width: 42rem;
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 1.0625rem;
  line-height: 1.7;
}

.lp-hero-editorial-centered__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  justify-content: center;
  width: 100%;
}

.lp-hero-editorial-centered__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3.25rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
}

.lp-hero-editorial-centered__button--primary {
  background: var(--lp-accent);
  border-color: var(--lp-accent);
  color: var(--lp-bg);
}

.lp-hero-editorial-centered__button--secondary {
  background: transparent;
  color: var(--lp-text);
}

.lp-hero-editorial-centered__button:focus-visible {
  outline: 2px solid var(--lp-primary);
  outline-offset: 3px;
}

.lp-hero-editorial-centered__media {
  display: grid;
  gap: var(--lp-spacing-sm);
  width: 100%;
  max-width: 760px;
  margin: var(--lp-spacing-sm) 0 0;
}

.lp-hero-editorial-centered__media picture {
  display: block;
  overflow: hidden;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
}

.lp-hero-editorial-centered__media img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}

.lp-hero-editorial-centered__caption {
  color: var(--lp-text-muted);
  font-size: 0.875rem;
  line-height: 1.5;
}

@media (min-width: 768px) {
  .lp-hero-editorial-centered {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-hero-editorial-centered__inner {
    gap: var(--lp-spacing-xl);
  }

  .lp-hero-editorial-centered__subhead {
    font-size: 1.25rem;
  }

  .lp-hero-editorial-centered__actions {
    width: auto;
  }
}
</style>
<section class="lp-hero-editorial-centered" aria-labelledby="lp-hero-editorial-centered-title">
  <div class="lp-hero-editorial-centered__inner">
    <div class="lp-hero-editorial-centered__eyebrow">{{slot:eyebrow}}</div>

    <h1 class="lp-hero-editorial-centered__title" id="lp-hero-editorial-centered-title">
      {{slot:heading}}
    </h1>

    <p class="lp-hero-editorial-centered__subhead">
      {{slot:subhead}}
    </p>

    <div class="lp-hero-editorial-centered__actions">
      <a class="lp-hero-editorial-centered__button lp-hero-editorial-centered__button--primary" href="{{slot:primary-cta-url}}">
        {{slot:primary-cta-label}}
      </a>
      <a class="lp-hero-editorial-centered__button lp-hero-editorial-centered__button--secondary" href="{{slot:secondary-cta-url}}">
        {{slot:secondary-cta-label}}
      </a>
    </div>

    <figure class="lp-hero-editorial-centered__media">
      <picture>
        <source media="(max-width: 767px)" srcset="{{slot:hero-image-mobile}}">
        <img src="{{slot:hero-image}}" alt="{{slot:hero-image-alt}}" loading="lazy">
      </picture>
      <figcaption class="lp-hero-editorial-centered__caption">
        {{slot:media-caption}}
      </figcaption>
    </figure>
  </div>
</section>
