<style>.lp-hero-cinematic-split {
  position: relative;
  overflow: hidden;
  color: var(--lp-text);
  background: var(--lp-bg);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-hero-cinematic-split::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 78% 24%, var(--lp-primary), transparent 32%),
    linear-gradient(135deg, var(--lp-bg), var(--lp-bg-alt));
  opacity: 0.38;
  pointer-events: none;
}

.lp-hero-cinematic-split__inner {
  position: relative;
  z-index: 1;
  display: grid;
  gap: var(--lp-spacing-xl);
  width: min(100%, 1280px);
  margin: 0 auto;
}

.lp-hero-cinematic-split__content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--lp-spacing-md);
}

.lp-hero-cinematic-split__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.lp-hero-cinematic-split__title {
  max-width: 12em;
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2.5rem, 12vw, 5.75rem);
  font-weight: 800;
  line-height: 0.92;
  letter-spacing: 0;
}

.lp-hero-cinematic-split__text {
  max-width: 40rem;
  margin: 0;
  color: var(--lp-text-muted);
  font-size: clamp(1rem, 2vw, 1.2rem);
  line-height: 1.65;
}

.lp-hero-cinematic-split__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  margin-top: var(--lp-spacing-xs);
}

.lp-hero-cinematic-split__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3.25rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  color: var(--lp-text);
  font-weight: 700;
  line-height: 1;
  text-decoration: none;
}

.lp-hero-cinematic-split__button--primary {
  border-color: var(--lp-primary);
  background: var(--lp-primary);
  color: white;
}

.lp-hero-cinematic-split__button--secondary {
  background: transparent;
  color: var(--lp-text);
}

.lp-hero-cinematic-split__benefits {
  display: grid;
  gap: var(--lp-spacing-sm);
  width: 100%;
  margin: var(--lp-spacing-md) 0 0;
  padding: 0;
  list-style: none;
}

.lp-hero-cinematic-split__benefit {
  display: flex;
  align-items: center;
  gap: var(--lp-spacing-sm);
  padding: var(--lp-spacing-sm);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg-alt);
  color: var(--lp-text);
  font-size: 0.95rem;
}

.lp-hero-cinematic-split__benefit-mark {
  flex: 0 0 0.7rem;
  width: 0.7rem;
  height: 0.7rem;
  border-radius: var(--lp-radius);
  background: var(--lp-accent);
}

.lp-hero-cinematic-split__visual {
  position: relative;
  min-height: 22rem;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
  overflow: hidden;
}

.lp-hero-cinematic-split__picture {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 22rem;
}

.lp-hero-cinematic-split__picture img {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 22rem;
  object-fit: cover;
}

.lp-hero-cinematic-split__stat {
  position: absolute;
  display: grid;
  gap: var(--lp-spacing-xs);
  max-width: 12rem;
  padding: var(--lp-spacing-sm);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
}

.lp-hero-cinematic-split__stat--top {
  top: var(--lp-spacing-md);
  left: var(--lp-spacing-md);
}

.lp-hero-cinematic-split__stat--bottom {
  right: var(--lp-spacing-md);
  bottom: var(--lp-spacing-md);
}

.lp-hero-cinematic-split__stat-value {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 1.5rem;
  font-weight: 800;
  line-height: 1;
}

.lp-hero-cinematic-split__stat-label {
  color: var(--lp-text-muted);
  font-size: 0.85rem;
  line-height: 1.35;
}

@media (min-width: 768px) {
  .lp-hero-cinematic-split {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-hero-cinematic-split__inner {
    grid-template-columns: minmax(0, 1fr) minmax(22rem, 0.92fr);
    align-items: center;
  }

  .lp-hero-cinematic-split__benefits {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lp-hero-cinematic-split__visual {
    min-height: 34rem;
  }

  .lp-hero-cinematic-split__picture,
  .lp-hero-cinematic-split__picture img {
    min-height: 34rem;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section class="lp-hero-cinematic-split" aria-labelledby="lp-hero-cinematic-split-title">
  <div class="lp-hero-cinematic-split__inner">
    <div class="lp-hero-cinematic-split__content">
      <p class="lp-hero-cinematic-split__eyebrow">{{slot:eyebrow}}</p>
      <h1 class="lp-hero-cinematic-split__title" id="lp-hero-cinematic-split-title">{{slot:headline}}</h1>
      <p class="lp-hero-cinematic-split__text">{{slot:subhead}}</p>

      <div class="lp-hero-cinematic-split__actions" aria-label="{{slot:actions-label}}">
        <a class="lp-hero-cinematic-split__button lp-hero-cinematic-split__button--primary" href="{{slot:primary-cta-link}}">
          {{slot:primary-cta-label}}
        </a>
        <a class="lp-hero-cinematic-split__button lp-hero-cinematic-split__button--secondary" href="{{slot:secondary-cta-link}}">
          {{slot:secondary-cta-label}}
        </a>
      </div>

      <ul class="lp-hero-cinematic-split__benefits" aria-label="{{slot:benefits-label}}">
        <li class="lp-hero-cinematic-split__benefit">
          <span class="lp-hero-cinematic-split__benefit-mark" aria-hidden="true"></span>
          <span>{{slot:benefit-1}}</span>
        </li>
        <li class="lp-hero-cinematic-split__benefit">
          <span class="lp-hero-cinematic-split__benefit-mark" aria-hidden="true"></span>
          <span>{{slot:benefit-2}}</span>
        </li>
        <li class="lp-hero-cinematic-split__benefit">
          <span class="lp-hero-cinematic-split__benefit-mark" aria-hidden="true"></span>
          <span>{{slot:benefit-3}}</span>
        </li>
      </ul>
    </div>

    <div class="lp-hero-cinematic-split__visual" aria-label="{{slot:visual-label}}">
      <picture class="lp-hero-cinematic-split__picture">
        <source media="(max-width: 767px)" srcset="{{slot:hero-image-mobile}}">
        <img src="{{slot:hero-image}}" alt="{{slot:hero-image-alt}}" loading="lazy">
      </picture>

      <div class="lp-hero-cinematic-split__stat lp-hero-cinematic-split__stat--top">
        <span class="lp-hero-cinematic-split__stat-value">{{slot:stat-1-value}}</span>
        <span class="lp-hero-cinematic-split__stat-label">{{slot:stat-1-label}}</span>
      </div>

      <div class="lp-hero-cinematic-split__stat lp-hero-cinematic-split__stat--bottom">
        <span class="lp-hero-cinematic-split__stat-value">{{slot:stat-2-value}}</span>
        <span class="lp-hero-cinematic-split__stat-label">{{slot:stat-2-label}}</span>
      </div>
    </div>
  </div>
</section>
