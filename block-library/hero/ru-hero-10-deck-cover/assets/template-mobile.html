<style>
  :root {
    --color-bg: #efe7d2;
    --color-fg: #15140f;
    --color-accent: #ed6f5c;
    --color-border: rgba(21,20,15,0.16);
    --font-display: 'Playfair Display', 'Times New Roman', serif;
    --font-body: 'Inter Tight', system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; padding: 32px 20px 40px; }
  .cover-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--color-accent);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .cover-label::before { content: ''; width: 14px; height: 1px; background: var(--color-accent); }
  .art-frame {
    width: 100%;
    aspect-ratio: 4/3;
    background: rgba(21,20,15,0.06);
    border: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(21,20,15,0.3);
    margin-bottom: 24px;
  }
  .cover-title {
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 42px;
    line-height: 0.96;
    letter-spacing: -0.03em;
    margin-bottom: 18px;
  }
  .cover-title em {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    color: var(--color-accent);
  }
  .cover-sub { font-size: 15px; line-height: 1.55; color: rgba(21,20,15,0.65); margin-bottom: 28px; }
  .btn-primary {
    display: block; width: 100%; padding: 14px 24px; border-radius: 999px;
    background: var(--color-accent); color: #fff; font-family: var(--font-body);
    font-size: 15px; font-weight: 600; text-decoration: none; text-align: center;
    border: none; margin-bottom: 10px;
  }
  .btn-ghost {
    display: block; width: 100%; padding: 14px 24px; border-radius: 999px;
    background: transparent; color: var(--color-fg); font-family: var(--font-body);
    font-size: 15px; font-weight: 500; text-decoration: none; text-align: center;
    border: 1px solid var(--color-border);
  }
</style>
<section data-block-id="ru-hero-10-deck-cover">
<span class="cover-label">{{slot:kicker}}</span>
<div class="art-frame">{{slot:hero-image}}</div>
<h1 class="cover-title">{{slot:cover-title}}</h1>
<p class="cover-sub">{{slot:subhead}}</p>
<a class="btn-primary" href="#contact">{{slot:primary-cta}}</a>
<a class="btn-ghost" href="#portfolio">{{slot:secondary-cta}}</a>
</section>
