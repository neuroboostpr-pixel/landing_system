<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/open-design-landing-deck/example.html | License: Apache-2.0 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-hero-10-deck-cover — desktop</title>
<style>
  :root {
    --color-bg: #efe7d2;
    --color-fg: #15140f;
    --color-accent: #ed6f5c;
    --color-border: rgba(21,20,15,0.16);
    --font-display: 'Playfair Display', 'Times New Roman', serif;
    --font-body: 'Inter Tight', system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .slide-cover {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 600px;
    max-width: 1360px;
    margin: 0 auto;
    padding: 64px 80px;
    gap: 60px;
    align-items: center;
    position: relative;
  }
  .cover-copy {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .cover-label {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--color-accent);
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .cover-label::before {
    content: '';
    width: 22px;
    height: 1px;
    background: var(--color-accent);
  }
  .cover-title {
    font-family: var(--font-body);
    font-weight: 800;
    font-size: clamp(52px, 5.8vw, 84px);
    line-height: 0.96;
    letter-spacing: -0.03em;
    margin-bottom: 32px;
  }
  .cover-title em {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--color-accent);
  }
  .cover-sub {
    font-size: 16px;
    line-height: 1.55;
    color: rgba(21,20,15,0.65);
    max-width: 44ch;
    margin-bottom: 40px;
  }
  .cover-actions { display: flex; gap: 14px; }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 999px;
    background: var(--color-accent);
    color: #fff;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 999px;
    background: transparent;
    color: var(--color-fg);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid var(--color-border);
    cursor: pointer;
  }
  .cover-art {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .cover-art-frame {
    width: 100%;
    aspect-ratio: 1;
    background: rgba(21,20,15,0.06);
    border: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(21,20,15,0.3);
    border-radius: 4px;
    position: relative;
  }
  .corner { position: absolute; width: 20px; height: 20px; border-color: rgba(21,20,15,0.3); border-style: solid; border-width: 0; }
  .corner.tl { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
  .corner.tr { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
  .corner.bl { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
  .corner.br { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }
  .cover-meta {
    position: absolute;
    bottom: -24px;
    right: 0;
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(21,20,15,0.35);
  }
</style>
</head>
<body>
  <section class="slide-cover" data-block-id="ru-hero-10-deck-cover">
    <div class="cover-copy">
      <span class="cover-label" data-slot="kicker">[Ниша · Специализация]</span>
      <h1 class="cover-title" data-slot="headline">
        [Заголовок с <em>курсивным акцентом</em> на ключевом слове]
      </h1>
      <p class="cover-sub" data-slot="subhead">[Подзаголовок: что вы делаете, кому помогаете, какой результат получит клиент]</p>
      <div class="cover-actions">
        <a class="btn-primary" data-slot="primary-cta" href="#contact">[Обсудить проект]</a>
        <a class="btn-ghost" data-slot="secondary-cta" href="#portfolio">[Наши работы]</a>
      </div>
    </div>
    <div class="cover-art">
      <div class="cover-art-frame" data-slot="hero-image">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        Фото / Иллюстрация
      </div>
      <span class="cover-meta" data-slot="meta-label">[Раздел 001]</span>
    </div>
  </section>
</body>
</html>
