description: 'Hero с декоративными угловыми маркерами и нумерацией разделов в стиле
  deck-обложки: бежевый фон, курсив в заголовке, coral-акцент. Адаптирован из
  open-design-landing-deck (Apache-2.0).'
display_name_ru: Дек-обложка — угловые маркеры, нумерация, coral-акцент
layout_summary_ru: Двухколоночный layout (текст слева, фото с угловыми маркерами
  справа). Номер раздела под изображением, курсивный акцент в заголовке. Бежевый
  фон в стиле редакционного deck. Mobile — стек фото сверху.
slots:
