  name: kicker
  max_chars: 50
  required: false
- type: text
  name: headline
  max_chars: 75
  required: true
- type: text
  name: subhead
  max_chars: 200
  required: false
- type: photo
  name: hero-image
  ratio: '1:1'
  mobile_ratio: '4:3'
  required: false
- type: text
  name: meta-label
  max_chars: 20
  required: false
- type: cta
  name: primary-cta
  default_text: Обсудить проект
  required: true
- type: cta
  name: secondary-cta
  default_text: Наши работы
  required: false
conversion_notes: Угловые маркеры вокруг изображения — редакционная деталь, выделяющая
  на фоне стандартных лендингов. Хорошо работает для творческих ниш и агентств.
  Номер раздела добавляет структурированность.
source: opendesign
