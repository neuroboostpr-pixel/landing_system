<style>
  :root {
    --color-bg: #fff; --color-fg: #111; --color-accent: #333; --color-border: #ccc;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .hero { position: relative; width: 375px; aspect-ratio: 16/9; background: #bbb; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .hero-bg-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #888; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
  .hero-content { position: relative; z-index: 2; text-align: center; color: #fff; padding: 16px; }
  .headline { font-family: var(--font-display); font-size: 26px; line-height: 1.1; margin: 0 0 12px; }
  .hours-tag { display: inline-block; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); padding: 4px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; }
  .cta-wrap { padding: 16px 20px; background: var(--color-bg); }
  .cta { display: block; padding: 14px; background: var(--color-accent); color: #fff; text-align: center; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 16px; }
</style>
<section data-block-id="ru-hero-03-local-interior">
<div class="hero">
<div class="hero-bg-label">{{slot:interior-bg}}</div>
<div class="overlay"></div>
<div class="hero-content">
<h1 class="headline">{{slot:headline}}</h1>
<div class="hours-tag">{{slot:hours-tag}}</div>
</div>
</div>
<div class="cta-wrap">
<a class="cta" href="#booking">{{slot:primary-cta}}</a>
</div>
</section>
