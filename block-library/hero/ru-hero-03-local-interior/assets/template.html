<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-hero-03-local-interior — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .hero { position: relative; width: 100%; aspect-ratio: 16/9; background: #bbb; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .hero-bg-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  .hero-content { position: relative; z-index: 2; text-align: center; color: #fff; padding: var(--spacing-lg); }
  .headline { font-family: var(--font-display); font-size: 52px; line-height: 1.05; margin: 0 0 24px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .hours-tag { display: inline-block; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); padding: 6px 16px; border-radius: 4px; font-size: 15px; margin-bottom: 24px; }
  .cta { display: inline-block; padding: 16px 40px; background: #fff; color: var(--color-fg); text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 18px; }
</style>
</head>
<body>
  <section class="hero" data-block-id="ru-hero-03-local-interior">
    <div class="hero-bg-label" data-slot="interior-bg">photo · 16:9 · interior-bg</div>
    <div class="overlay"></div>
    <div class="hero-content">
      <h1 class="headline" data-slot="headline">[HEADLINE: название + локация]</h1>
      <div class="hours-tag" data-slot="hours-tag">[Пн-Вс 10-22]</div>
      <br>
      <a class="cta" data-slot="primary-cta" href="#booking">[Записаться]</a>
    </div>
  </section>
</body>
</html>
