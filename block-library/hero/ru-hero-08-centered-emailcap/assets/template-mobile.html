<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-accent: #333;
    --lp-accent: #333;
    --font-display: 'Syne', 'Inter Tight', system-ui, sans-serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; display: flex; flex-direction: column; min-height: 100vh; }
  .hero-upper {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 48px 16px 36px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lp-accent);
    margin-bottom: 14px;
  }
  .headline {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 48px;
    letter-spacing: -0.03em;
    line-height: 1.0;
    margin-bottom: 16px;
  }
  .subtext {
    font-size: 16px;
    line-height: 1.6;
    opacity: 0.8;
    margin-bottom: 28px;
  }
  .form-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .form-row input, .form-row button {
    width: 100%;
    padding: 14px 18px;
    font-family: var(--font-body);
    font-size: 15px;
    border-radius: 4px;
  }
  .form-row input {
    color: var(--lp-text);
    background: transparent;
    border: 1.5px solid var(--lp-border);
  }
  .form-row input::placeholder { color: rgba(26,20,16,0.4); }
  .form-row button {
    font-weight: 500;
    color:#fff;
    background: var(--lp-accent);
    border: none;
    cursor: pointer;
  }
  .deco-stripe { width: 100%; height: 12px; background: var(--lp-accent); }
  .ticker-wrap { overflow: hidden; background: rgba(0,0,0,0.85); padding: 8px 0; }
  .ticker-track {
    display: flex;
    gap: 20px;
    white-space: nowrap;
    animation: ticker 20s linear infinite;
  }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .ticker-unit {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ticker-star { color: var(--lp-accent); }
  .hero-deco { flex: 1; background: var(--lp-accent); min-height: 80px; }
</style>
<section class="hero-upper" data-block-id="ru-hero-08-centered-emailcap">
<div class="eyebrow">{{slot:kicker}}</div>
<h1 class="headline">{{slot:headline}}</h1>
<p class="subtext">{{slot:subhead}}</p>
<form class="form-row">
<input placeholder="Ваш email" type="email"/>
<button type="submit">{{slot:primary-cta}}</button>
</form>
</section>
<div aria-hidden="true" class="deco-stripe"></div>
<div aria-hidden="true" class="ticker-wrap">
<div class="ticker-track">
<span class="ticker-unit">{{slot:ticker-unit}} <span class="ticker-star">✳</span></span>
<span class="ticker-unit">{{slot:span-1}} <span class="ticker-star">✳</span></span>
<span class="ticker-unit">{{slot:span-2}} <span class="ticker-star">✳</span></span>
<span class="ticker-unit">{{slot:span-3}} <span class="ticker-star">✳</span></span>
</div>
</div>
<div aria-hidden="true" class="hero-deco"></div>
