<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/waitlist-page/example.html | License: Apache-2.0 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-hero-08-centered-emailcap — mobile</title>
<style>
  :root {
    --color-bg: #FDE8DF;
    --color-fg: #1A1410;
    --color-accent: #E8522A;
    --color-border: rgba(196,169,154,0.38);
    --color-deco: #E8835A;
    --color-stripe: #F5A623;
    --font-display: 'Syne', 'Inter Tight', system-ui, sans-serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; display: flex; flex-direction: column; min-height: 100vh; }
  .hero-upper {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 48px 16px 36px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 14px;
  }
  .headline {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 48px;
    letter-spacing: -0.03em;
    line-height: 1.0;
    margin-bottom: 16px;
  }
  .subtext {
    font-size: 16px;
    line-height: 1.6;
    opacity: 0.8;
    margin-bottom: 28px;
  }
  .form-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .form-row input, .form-row button {
    width: 100%;
    padding: 14px 18px;
    font-family: var(--font-body);
    font-size: 15px;
    border-radius: 4px;
  }
  .form-row input {
    color: var(--color-fg);
    background: transparent;
    border: 1.5px solid var(--color-border);
  }
  .form-row input::placeholder { color: rgba(26,20,16,0.4); }
  .form-row button {
    font-weight: 500;
    color: #fff;
    background: var(--color-accent);
    border: none;
    cursor: pointer;
  }
  .deco-stripe { width: 100%; height: 12px; background: var(--color-stripe); }
  .ticker-wrap { overflow: hidden; background: rgba(0,0,0,0.85); padding: 8px 0; }
  .ticker-track {
    display: flex;
    gap: 20px;
    white-space: nowrap;
    animation: ticker 20s linear infinite;
  }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .ticker-unit {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ticker-star { color: var(--color-stripe); }
  .hero-deco { flex: 1; background: var(--color-deco); min-height: 80px; }
</style>
</head>
<body>
  <section class="hero-upper" data-block-id="ru-hero-08-centered-emailcap">
    <div class="eyebrow" data-slot="kicker">[Скоро открытие]</div>
    <h1 class="headline" data-slot="headline">[Заголовок крупно]</h1>
    <p class="subtext" data-slot="subhead">[Что предлагаете и для кого]</p>
    <form class="form-row">
      <input type="email" placeholder="Ваш email" />
      <button type="submit" data-slot="primary-cta">[Получить доступ]</button>
    </form>
  </section>
  <div class="deco-stripe" aria-hidden="true"></div>
  <div class="ticker-wrap" aria-hidden="true">
    <div class="ticker-track">
      <span class="ticker-unit">[Бегущая строка] <span class="ticker-star">✳</span></span>
      <span class="ticker-unit">[Бегущая строка] <span class="ticker-star">✳</span></span>
      <span class="ticker-unit">[Бегущая строка] <span class="ticker-star">✳</span></span>
      <span class="ticker-unit">[Бегущая строка] <span class="ticker-star">✳</span></span>
    </div>
  </div>
  <div class="hero-deco" aria-hidden="true"></div>
</body>
</html>
