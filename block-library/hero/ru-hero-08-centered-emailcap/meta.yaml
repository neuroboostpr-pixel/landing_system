id: ru-hero-08-centered-emailcap
category: hero
ru_market: true
use_cases:
- b2c
- services
description: 'Hero с центрированным заголовком и формой сбора email: терракотовый
  фон, бегущая строка внизу, декоративный цветной подвал. Адаптирован из waitlist-page
  (Open Design, Apache-2.0).'
display_name_ru: Центрированный герой — email-форма + бегущая строка
layout_summary_ru: 'Центрированный макет — eyebrow, крупный заголовок, подзаголовок,
  inline email-форма. Внизу цветная полоска, бегущая строка, декоративный подвал.
  Mobile — форма вертикальная, стек.'
slots:
- type: text
  name: kicker
  max_chars: 50
  required: false
- type: text
  name: headline
  max_chars: 60
  required: true
- type: text
  name: subhead
  max_chars: 160
  required: false
- type: text
  name: email-placeholder
  max_chars: 30
  required: false
- type: cta
  name: primary-cta
  default_text: Получить доступ
  required: true
- type: text
  name: ticker-text
  max_chars: 60
  required: false
conversion_notes: Inline email-форма прямо в hero даёт лучший CR для лид-магнитов
  и пресейлов. Бегущая строка создаёт ощущение активности и ажиотажа. НЕ использовать
  WhatsApp/Telegram в CTA (только email или нейтральная кнопка).
source: opendesign
