<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/open-design-landing-deck/example.html | License: Apache-2.0 -->
<html lang="ru"><head><meta charset="UTF-8"><title>ru-social-proof-08-stats-deck — mobile</title>
<style>
  :root { --color-bg:#efe7d2; --color-fg:#15140f; --color-accent:#ed6f5c; --color-border:rgba(21,20,15,0.16); --color-bone:#f7f1de; --font-body:'Inter Tight',system-ui,sans-serif; --font-display:'Playfair Display',Georgia,serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); width:375px; padding:40px 0; }
  .stats-head { padding:0 20px 32px; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent); margin-bottom:14px; }
  .section-title { font-size:32px; font-weight:800; letter-spacing:-0.028em; }
  .section-title em { font-family:var(--font-display); font-style:italic; font-weight:500; }
  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--color-border); border-top:1px solid var(--color-border); }
  .stat-card { background:var(--color-bone); padding:24px 20px; }
  .stat-card:nth-child(2n) { background:var(--color-bg); }
  .stat-value { font-size:48px; font-weight:800; letter-spacing:-0.04em; line-height:1; margin-bottom:8px; }
  .stat-value .accent { color:var(--color-accent); }
  .stat-label { font-size:12px; color:rgba(21,20,15,0.6); line-height:1.4; }
</style></head>
<body>
  <section data-block-id="ru-social-proof-08-stats-deck">
    <div class="stats-head">
      <div class="kicker" data-slot="kicker">[В цифрах]</div>
      <h2 class="section-title" data-slot="headline">[Заголовок с <em>акцентом</em>]</h2>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">[N<span class="accent">+</span>]</div><div class="stat-label" data-slot="stat-1-label">[Метрика 1]</div></div>
      <div class="stat-card"><div class="stat-value">[N<span class="accent">%</span>]</div><div class="stat-label" data-slot="stat-2-label">[Метрика 2]</div></div>
      <div class="stat-card"><div class="stat-value">[N<span class="accent">×</span>]</div><div class="stat-label" data-slot="stat-3-label">[Метрика 3]</div></div>
      <div class="stat-card"><div class="stat-value">[N<span class="accent">k</span>]</div><div class="stat-label" data-slot="stat-4-label">[Метрика 4]</div></div>
    </div>
  </section>
</body></html>
