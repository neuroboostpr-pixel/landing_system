<style>
  :root { --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0; --lp-bg-alt: #e8e8e8; --lp-font-body:'Inter Tight',system-ui,sans-serif; --lp-font-display:'Playfair Display',Georgia,serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--lp-font-body); background:var(--lp-bg); color:var(--lp-text); width:375px; padding:40px 0; }
  .stats-head { padding:0 20px 32px; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--lp-accent); margin-bottom:14px; }
  .section-title { font-size:32px; font-weight:800; letter-spacing:-0.028em; }
  .section-title em { font-family:var(--lp-font-display); font-style:italic; font-weight:500; }
  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--lp-border); border-top:1px solid var(--lp-border); }
  .stat-card { background:var(--lp-bg-alt); padding:24px 20px; }
  .stat-card:nth-child(2n) { background:var(--lp-bg); }
  .stat-value { font-size:48px; font-weight:800; letter-spacing:-0.04em; line-height:1; margin-bottom:8px; }
  .stat-value .accent { color:var(--lp-accent); }
  .stat-label { font-size:12px; color:rgba(21,20,15,0.6); line-height:1.4; }
</style>
<section data-block-id="ru-social-proof-08-stats-deck">
<div class="stats-head">
<div class="kicker">{{slot:kicker}}</div>
<h2 class="section-title">{{slot:section-title}}</h2>
</div>
<div class="stats-grid">
<div class="stat-card"><div class="stat-value">{{slot:stat-value}}</div><div class="stat-label">{{slot:stat-1-label}}</div></div>
<div class="stat-card"><div class="stat-value">{{slot:div-1}}</div><div class="stat-label">{{slot:stat-2-label}}</div></div>
<div class="stat-card"><div class="stat-value">{{slot:div-2}}</div><div class="stat-label">{{slot:stat-3-label}}</div></div>
<div class="stat-card"><div class="stat-value">{{slot:div-3}}</div><div class="stat-label">{{slot:stat-4-label}}</div></div>
</div>
</section>
