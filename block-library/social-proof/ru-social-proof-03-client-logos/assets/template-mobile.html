<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-social-proof-03-client-logos — mobile wireframe</title>
<style>
  /* Wireframe: ч/б, CSS-only, no external deps.
     CSS vars in :root are MANDATORY — block-composition/inject-tokens.py relies on these names. */
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: #f9f9f9; color: var(--color-fg); width: 375px; }
  .logos-section { padding: 32px 16px; text-align: center; }
  .section-headline { font-family: var(--font-display); font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 24px; }
  .logos-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .logo-slot { background: #eee; border-radius: 4px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #bbb; filter: grayscale(100%); opacity: 0.6; }
</style>
</head>
<body>
  <section class="logos-section" data-block-id="ru-social-proof-03-client-logos">
    <h2 class="section-headline" data-slot="headline">[Нам доверяют]</h2>
    <div class="logos-grid">
      <div class="logo-slot" data-slot="logo-1">[1]</div>
      <div class="logo-slot" data-slot="logo-2">[2]</div>
      <div class="logo-slot" data-slot="logo-3">[3]</div>
      <div class="logo-slot" data-slot="logo-4">[4]</div>
      <div class="logo-slot" data-slot="logo-5">[5]</div>
      <div class="logo-slot" data-slot="logo-6">[6]</div>
      <div class="logo-slot" data-slot="logo-7">[7]</div>
      <div class="logo-slot" data-slot="logo-8">[8]</div>
    </div>
  </section>
</body>
</html>
