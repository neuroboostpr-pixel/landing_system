<style>
  :root { --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0; --lp-font-display:'Playfair Display',Georgia,serif; --lp-font-body:'Inter Tight',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--lp-font-body); background:var(--lp-bg); color:var(--lp-text); width:375px; padding:40px 20px; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--lp-accent); margin-bottom:20px; }
  .quote { font-family:var(--lp-font-display); font-size:24px; line-height:1.4; font-weight:500; margin-bottom:24px; }
  .quote em { font-style:italic; color:var(--lp-accent); }
  .author { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .avatar { width:38px; height:38px; border-radius:50%; background:rgba(21,20,15,0.12); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
  .author-info { font-size:13px; line-height:1.4; }
  .author-info strong { display:block; font-weight:700; }
  .author-info span { color:rgba(21,20,15,0.55); font-size:12px; }
  .divider { height:1px; background:var(--lp-border); margin:20px 0; }
  .partners { display:flex; flex-direction:column; gap:14px; }
  .partner-name { font-size:13px; font-weight:600; }
  .partner-role { font-size:11px; color:rgba(21,20,15,0.45); letter-spacing:0.12em; text-transform:uppercase; }
</style>
<section data-block-id="ru-social-proof-06-editorial-quote">
<div class="kicker">{{slot:kicker}}</div>
<p class="quote">«[Цитата клиента с <em>акцентом</em>]»</p>
<div class="author">
<div class="avatar">{{slot:author-initial}}</div>
<div class="author-info">
<strong>{{slot:author-name}}</strong>
<span>{{slot:author-role}}</span>
</div>
</div>
<div class="divider"></div>
<div class="partners">
<div><span class="partner-name">{{slot:partner-1}}</span> <span class="partner-role">{{slot:partner-1-role}}</span></div>
<div><span class="partner-name">{{slot:partner-2}}</span> <span class="partner-role">{{slot:partner-2-role}}</span></div>
<div><span class="partner-name">{{slot:partner-3}}</span> <span class="partner-role">{{slot:partner-3-role}}</span></div>
</div>
</section>
