description: 'Редакционная цитата в засечном шрифте с фото автора, инициалами-аватаром
  и блоком логотипов партнёров. Стиль testimonial-section от open-design-landing.'
display_name_ru: Редакционная цитата — засечный шрифт + партнёры
layout_summary_ru: Двухколоночный layout (цитата + автор + партнёры слева, фото справа).
  Нумерация раздела в стиле roman-цифр. Курсивный засечный шрифт для цитаты. Mobile — стек.
