<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-testimonials-01-video-circles — mobile</title>
<style>
  :root {
    --color-bg: #fff; --color-fg: #111; --color-accent: #333; --color-border: #ccc;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .testimonials { padding: 40px 0; }
  .section-headline { font-family: var(--font-display); font-size: 24px; text-align: center; margin: 0 0 28px; padding: 0 16px; }
  .circles-row { display: flex; gap: 20px; overflow-x: auto; padding: 8px 16px 16px; -webkit-overflow-scrolling: touch; }
  .circle-item { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 120px; text-align: center; flex-shrink: 0; }
  .circle-photo { width: 96px; height: 96px; border-radius: 50%; background: #ddd; border: 3px solid var(--color-border); display: flex; align-items: center; justify-content: center; font-size: 8px; color: #888; }
  .client-name { font-weight: 700; font-size: 13px; margin: 0; }
  .client-quote { font-size: 12px; color: #555; margin: 0; line-height: 1.4; }
</style>
</head>
<body>
  <section class="testimonials" data-block-id="ru-testimonials-01-video-circles">
    <h2 class="section-headline" data-slot="headline">[HEADLINE]</h2>
    <div class="circles-row">
      <div class="circle-item">
        <div class="circle-photo" data-slot="testimonial-1-photo">photo</div>
        <p class="client-name" data-slot="testimonial-1-name">[Имя 1]</p>
        <p class="client-quote" data-slot="testimonial-1-quote">[Отзыв 1]</p>
      </div>
      <div class="circle-item">
        <div class="circle-photo" data-slot="testimonial-2-photo">photo</div>
        <p class="client-name" data-slot="testimonial-2-name">[Имя 2]</p>
        <p class="client-quote" data-slot="testimonial-2-quote">[Отзыв 2]</p>
      </div>
      <div class="circle-item">
        <div class="circle-photo" data-slot="testimonial-3-photo">photo</div>
        <p class="client-name" data-slot="testimonial-3-name">[Имя 3]</p>
        <p class="client-quote" data-slot="testimonial-3-quote">[Отзыв 3]</p>
      </div>
      <div class="circle-item">
        <div class="circle-photo" data-slot="testimonial-4-photo">photo</div>
        <p class="client-name" data-slot="testimonial-4-name">[Имя 4]</p>
        <p class="client-quote" data-slot="testimonial-4-quote">[Отзыв 4]</p>
      </div>
      <div class="circle-item">
        <div class="circle-photo" data-slot="testimonial-5-photo">photo</div>
        <p class="client-name" data-slot="testimonial-5-name">[Имя 5]</p>
        <p class="client-quote" data-slot="testimonial-5-quote">[Отзыв 5]</p>
      </div>
    </div>
  </section>
</body>
</html>
