<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-testimonials-01-video-circles — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .testimonials { padding: 64px var(--spacing-lg); max-width: 1100px; margin: 0 auto; }
  .section-headline { font-family: var(--font-display); font-size: 36px; text-align: center; margin: 0 0 48px; }
  .circles-row { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; }
  .circle-item { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 160px; text-align: center; }
  .circle-photo { width: 120px; height: 120px; border-radius: 50%; background: #ddd; border: 3px solid var(--color-border); display: flex; align-items: center; justify-content: center; font-size: 9px; color: #888; text-transform: uppercase; }
  .client-name { font-weight: 700; font-size: 14px; margin: 0; }
  .client-quote { font-size: 13px; color: #555; margin: 0; line-height: 1.4; }
</style>
</head>
<body>
  <section class="testimonials" data-block-id="ru-testimonials-01-video-circles">
    <h2 class="section-headline" data-slot="headline">[HEADLINE: что говорят клиенты]</h2>
    <div class="circles-row">
      <div class="circle-item">
        <div class="circle-photo" data-slot="testimonial-1-photo">photo · 1:1</div>
        <p class="client-name" data-slot="testimonial-1-name">[Имя 1]</p>
        <p class="client-quote" data-slot="testimonial-1-quote">[Краткий отзыв клиента 1]</p>
      </div>
      <div class="circle-item">
        <div class="circle-photo" data-slot="testimonial-2-photo">photo · 1:1</div>
        <p class="client-name" data-slot="testimonial-2-name">[Имя 2]</p>
        <p class="client-quote" data-slot="testimonial-2-quote">[Краткий отзыв клиента 2]</p>
      </div>
      <div class="circle-item">
        <div class="circle-photo" data-slot="testimonial-3-photo">photo · 1:1</div>
        <p class="client-name" data-slot="testimonial-3-name">[Имя 3]</p>
        <p class="client-quote" data-slot="testimonial-3-quote">[Краткий отзыв клиента 3]</p>
      </div>
      <div class="circle-item">
        <div class="circle-photo" data-slot="testimonial-4-photo">photo · 1:1</div>
        <p class="client-name" data-slot="testimonial-4-name">[Имя 4]</p>
        <p class="client-quote" data-slot="testimonial-4-quote">[Краткий отзыв клиента 4]</p>
      </div>
      <div class="circle-item">

        <p class="client-quote" data-slot="testimonial-5-quote">[Краткий отзыв клиента 5]</p>
      </div>
    </div>
  </section>
</body>
</html>
