<style>.lp-social-proof-cinematic-split {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
  overflow: hidden;
}

.lp-social-proof-cinematic-split__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  max-width: 1280px;
  margin: 0 auto;
}

.lp-social-proof-cinematic-split__media {
  position: relative;
  min-height: 18rem;
  border-radius: var(--lp-radius-lg);
  overflow: hidden;
  background: var(--lp-bg-alt);
  border: 1px solid var(--lp-border);
}

.lp-social-proof-cinematic-split__media picture,
.lp-social-proof-cinematic-split__media img {
  display: block;
  width: 100%;
  height: 100%;
}

.lp-social-proof-cinematic-split__media img {
  object-fit: cover;
  aspect-ratio: 4 / 3;
}

.lp-social-proof-cinematic-split__badge {
  position: absolute;
  left: var(--lp-spacing-md);
  bottom: var(--lp-spacing-md);
  max-width: 80%;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
  color: var(--lp-accent);
  font-family: var(--lp-font-display);
  font-size: 0.85rem;
  line-height: 1.2;
  text-transform: uppercase;
  transform: skew(-10deg);
}

.lp-social-proof-cinematic-split__badge span {
  display: inline-block;
  transform: skew(10deg);
}

.lp-social-proof-cinematic-split__content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--lp-spacing-md);
}

.lp-social-proof-cinematic-split__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-family: var(--lp-font-display);
  font-size: 0.8rem;
  line-height: 1.2;
  text-transform: uppercase;
}

.lp-social-proof-cinematic-split__title {
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 8vw, 4.75rem);
  line-height: 0.95;
  text-transform: uppercase;
  transform: skew(-8deg);
  transform-origin: left center;
}

.lp-social-proof-cinematic-split__quote {
  margin: 0;
  padding: var(--lp-spacing-md);
  border-left: 0.25rem solid var(--lp-accent);
  background: var(--lp-bg-alt);
  border-radius: var(--lp-radius);
}

.lp-social-proof-cinematic-split__quote p {
  margin: 0;
  color: var(--lp-text);
  font-size: 1.05rem;
  line-height: 1.65;
}

.lp-social-proof-cinematic-split__author {
  display: grid;
  gap: var(--lp-spacing-xs);
  margin-top: var(--lp-spacing-md);
}

.lp-social-proof-cinematic-split__author-name {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 1rem;
  line-height: 1.2;
}

.lp-social-proof-cinematic-split__author-meta {
  color: var(--lp-text-muted);
  font-size: 0.95rem;
  line-height: 1.4;
}

.lp-social-proof-cinematic-split__stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--lp-spacing-sm);
  width: 100%;
  margin: 0;
  padding: 0;
  list-style: none;
}

.lp-social-proof-cinematic-split__stats li {
  padding: var(--lp-spacing-md);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg-alt);
}

.lp-social-proof-cinematic-split__stats strong {
  display: block;
  color: var(--lp-accent);
  font-family: var(--lp-font-display);
  font-size: 1.5rem;
  line-height: 1;
}

.lp-social-proof-cinematic-split__stats span {
  display: block;
  margin-top: var(--lp-spacing-xs);
  color: var(--lp-text-muted);
  font-size: 0.9rem;
  line-height: 1.35;
}

.lp-social-proof-cinematic-split__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-sm);
  width: 100%;
}

.lp-social-proof-cinematic-split__cta,
.lp-social-proof-cinematic-split__secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  border-radius: var(--lp-radius);
  font-family: var(--lp-font-display);
  font-size: 0.95rem;
  line-height: 1.2;
  text-decoration: none;
  text-transform: uppercase;
}

.lp-social-proof-cinematic-split__cta {
  background: var(--lp-accent);
  color: var(--lp-bg);
  border: 1px solid var(--lp-accent);
}

.lp-social-proof-cinematic-split__secondary {
  background: transparent;
  color: var(--lp-text);
  border: 1px solid var(--lp-border);
}

.lp-social-proof-cinematic-split__cta:focus-visible,
.lp-social-proof-cinematic-split__secondary:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 3px;
}

@media (min-width: 768px) {
  .lp-social-proof-cinematic-split {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-social-proof-cinematic-split__inner {
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    align-items: center;
    gap: var(--lp-spacing-xl);
  }

  .lp-social-proof-cinematic-split__media {
    min-height: 34rem;
  }

  .lp-social-proof-cinematic-split__media img {
    aspect-ratio: auto;
  }

  .lp-social-proof-cinematic-split__content {
    gap: var(--lp-spacing-lg);
  }

  .lp-social-proof-cinematic-split__quote {
    padding: var(--lp-spacing-lg);
  }

  .lp-social-proof-cinematic-split__actions {
    width: auto;
  }
}
</style>
<section class="lp-social-proof-cinematic-split" aria-labelledby="lp-social-proof-cinematic-split-title">
  <div class="lp-social-proof-cinematic-split__inner">
    <div class="lp-social-proof-cinematic-split__media">
      <picture>
        <source media="(max-width: 767px)" srcset="{{slot:case-image-mobile}}">
        <img src="{{slot:case-image}}" alt="{{slot:case-image-alt}}" loading="lazy">
      </picture>
      <div class="lp-social-proof-cinematic-split__badge">
        <span>{{slot:case-badge}}</span>
      </div>
    </div>

    <div class="lp-social-proof-cinematic-split__content">
      <p class="lp-social-proof-cinematic-split__eyebrow">{{slot:eyebrow}}</p>
      <h2 id="lp-social-proof-cinematic-split-title" class="lp-social-proof-cinematic-split__title">
        {{slot:heading}}
      </h2>
      <blockquote class="lp-social-proof-cinematic-split__quote">
        <p>{{slot:testimonial-text}}</p>
        <footer class="lp-social-proof-cinematic-split__author">
          <span class="lp-social-proof-cinematic-split__author-name">{{slot:author-name}}</span>
          <span class="lp-social-proof-cinematic-split__author-meta">{{slot:author-meta}}</span>
        </footer>
      </blockquote>

      <ul class="lp-social-proof-cinematic-split__stats" aria-label="{{slot:stats-label}}">
        <li>
          <strong>{{slot:stat-1-value}}</strong>
          <span>{{slot:stat-1-label}}</span>
        </li>
        <li>
          <strong>{{slot:stat-2-value}}</strong>
          <span>{{slot:stat-2-label}}</span>
        </li>
      </ul>

      <div class="lp-social-proof-cinematic-split__actions">
        <a class="lp-social-proof-cinematic-split__cta" href="{{slot:primary-cta-link}}">
          {{slot:primary-cta-label}}
        </a>
        <a class="lp-social-proof-cinematic-split__secondary" href="{{slot:secondary-cta-link}}">
          {{slot:secondary-cta-label}}
        </a>
      </div>
    </div>
  </div>
</section>
