<!DOCTYPE html>
<!-- Source: /tmp/open-design/skills/field-notes-editorial-template/example.html (Apache-2.0, adapted for RU block-library schema) -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ru-social-proof-05-metrics-editorial — mobile</title>
<style>
  :root {
    --color-bg: #f4f0e8;
    --color-fg: #181715;
    --color-accent: #c9d57a;
    --color-border: rgba(24,23,21,.15);
    --font-display: Georgia, serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; padding: 32px 16px; }
  .section-label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .65; margin-bottom: 16px; }
  .metrics-stack { display: flex; flex-direction: column; gap: 12px; }
  .hero-card { background: var(--color-accent); border-radius: var(--radius); padding: 24px; }
  .hero-card em { display: block; font-family: var(--font-display); font-size: 1.1rem; line-height: 1.3; font-style: italic; margin-bottom: 14px; }
  .hero-metric { font-family: var(--font-display); font-size: 4.5rem; line-height: .9; font-weight: 700; }
  .side-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .side-card { border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; }
  .side-card.pink { background: #e4b8cc; }
  .side-card.peach { background: #e9cbaf; }
  .metric-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .75; margin-bottom: 6px; }
  .metric-value { font-family: var(--font-display); font-size: 2.4rem; line-height: 1; font-weight: 700; }
</style>
</head>
<body>
  <section data-block-id="ru-social-proof-05-metrics-editorial">
    <div class="section-label" data-slot="headline">[В цифрах]</div>
    <div class="metrics-stack">
      <article class="hero-card">
        <em data-slot="hero-context">[Контекст для главной цифры]</em>
        <div class="hero-metric" data-slot="hero-metric">[97%]</div>
      </article>
      <div class="side-row">
        <article class="side-card pink">
          <div class="metric-label" data-slot="metric-2-label">[Показатель 2]</div>
          <div class="metric-value" data-slot="metric-2-value">[120]</div>
        </article>
        <article class="side-card peach">
          <div class="metric-label" data-slot="metric-3-label">[Показатель 3]</div>
          <div class="metric-value" data-slot="metric-3-value">[5+]</div>
        </article>
      </div>
    </div>
  </section>
</body>
</html>
