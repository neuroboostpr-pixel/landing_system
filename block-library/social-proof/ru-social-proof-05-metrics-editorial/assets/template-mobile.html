<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: Georgia, serif;
    --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; padding: 32px 16px; }
  .section-label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .65; margin-bottom: 16px; }
  .metrics-stack { display: flex; flex-direction: column; gap: 12px; }
  .hero-card { background: var(--lp-accent); border-radius: var(--radius); padding: 24px; }
  .hero-card em { display: block; font-family: var(--lp-font-display); font-size: 1.1rem; line-height: 1.3; font-style: italic; margin-bottom: 14px; }
  .hero-metric { font-family: var(--lp-font-display); font-size: 4.5rem; line-height: .9; font-weight: 700; }
  .side-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .side-card { border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; }
  .side-card.pink { background:var(--lp-bg); }
  .side-card.peach { background:var(--lp-bg); }
  .metric-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .75; margin-bottom: 6px; }
  .metric-value { font-family: var(--lp-font-display); font-size: 2.4rem; line-height: 1; font-weight: 700; }
</style>
<section data-block-id="ru-social-proof-05-metrics-editorial">
<div class="section-label">{{slot:headline}}</div>
<div class="metrics-stack">
<article class="hero-card">
<em>{{slot:hero-context}}</em>
<div class="hero-metric">{{slot:hero-metric}}</div>
</article>
<div class="side-row">
<article class="side-card pink">
<div class="metric-label">{{slot:metric-2-label}}</div>
<div class="metric-value">{{slot:metric-2-value}}</div>
</article>
<article class="side-card peach">
<div class="metric-label">{{slot:metric-3-label}}</div>
<div class="metric-value">{{slot:metric-3-value}}</div>
</article>
</div>
</div>
</section>
