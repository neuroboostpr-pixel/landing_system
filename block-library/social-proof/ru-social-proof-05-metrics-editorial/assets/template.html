<!DOCTYPE html>
<!-- Source: /tmp/open-design/skills/field-notes-editorial-template/example.html (Apache-2.0, adapted for RU block-library schema) -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-social-proof-05-metrics-editorial — desktop</title>
<style>
  :root {
    --color-bg: #f4f0e8;
    --color-fg: #181715;
    --color-accent: #c9d57a;
    --color-border: rgba(24,23,21,.15);
    --font-display: Georgia, serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
    --radius: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .metrics-wrap { padding: 60px var(--spacing-lg); max-width: 1100px; margin: 0 auto; }
  .section-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .65; margin-bottom: 24px; }
  .metrics-grid { display: grid; grid-template-columns: 1.8fr 1fr; grid-template-rows: 1fr 1fr; gap: 18px; min-height: 420px; }
  .hero-card { grid-row: 1 / -1; background: var(--color-accent); border-radius: var(--radius); padding: 32px; display: flex; flex-direction: column; justify-content: space-between; }
  .hero-card em { display: block; font-family: var(--font-display); font-size: 1.4rem; line-height: 1.3; font-style: italic; max-width: 420px; margin-bottom: 16px; }
  .hero-metric { font-family: var(--font-display); font-size: 96px; line-height: .9; font-weight: 700; }
  .side-card { background: #fff4; border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; justify-content: flex-end; }
  .side-card.pink { background: #e4b8cc; }
  .side-card.peach { background: #e9cbaf; }
  .metric-label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .75; margin-bottom: 8px; }
  .metric-value { font-family: var(--font-display); font-size: 4rem; line-height: 1; font-weight: 700; }
</style>
</head>
<body>
  <section class="metrics-wrap" data-block-id="ru-social-proof-05-metrics-editorial">
    <div class="section-label" data-slot="headline">[HEADLINE: в цифрах]</div>
    <div class="metrics-grid">
      <article class="hero-card">
        <em data-slot="hero-context">[Контекст для главной цифры — что она означает для клиента]</em>
        <div class="hero-metric" data-slot="hero-metric">[97%]</div>
      </article>
      <article class="side-card pink">
        <div class="metric-label" data-slot="metric-2-label">[Показатель 2]</div>
        <div class="metric-value" data-slot="metric-2-value">[120]</div>
      </article>
      <article class="side-card peach">
        <div class="metric-label" data-slot="metric-3-label">[Показатель 3]</div>
        <div class="metric-value" data-slot="metric-3-value">[5+]</div>
      </article>
    </div>
  </section>
</body>
</html>
