<!DOCTYPE html>

<html lang="ru"><head><meta charset="UTF-8"><title>ru-social-proof-07-logo-ticker — desktop</title>
<style>
  :root { --color-bg:#efe7d2; --color-fg:#15140f; --color-accent:#ed6f5c; --color-border:rgba(21,20,15,0.16); --font-body:'Inter Tight',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); }
  .ticker-section { border-top:1px solid var(--color-border); border-bottom:1px solid var(--color-border); padding:28px 0; overflow:hidden; }
  .ticker-inner { display:grid; grid-template-columns:minmax(180px,220px) minmax(0,1fr); gap:32px; align-items:center; max-width:1360px; margin:0 auto; padding:0 64px; }
  .ticker-left { display:flex; align-items:center; gap:14px; border-right:1px solid var(--color-border); padding-right:24px; min-height:48px; }
  .pulse { width:6px; height:6px; border-radius:50%; background:var(--color-accent); display:inline-block; animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .ticker-title { font-size:11px; line-height:1.4; display:flex; flex-direction:column; gap:2px; }
  .ticker-title b { color:var(--color-fg); font-weight:700; letter-spacing:0.18em; text-transform:uppercase; }
  .ticker-title span { color:rgba(21,20,15,0.45); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; }
  .ticker-row { overflow:hidden; mask-image:linear-gradient(90deg, transparent, black 5%, black 95%, transparent); -webkit-mask-image:linear-gradient(90deg, transparent, black 5%, black 95%, transparent); }
  .marquee-track { display:inline-flex; align-items:center; gap:48px; width:max-content; white-space:nowrap; animation:marquee 36s linear infinite; }
  @keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .logo-item { display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:600; letter-spacing:-0.01em; color:rgba(21,20,15,0.6); flex-shrink:0; }
  .logo-item .sep { color:var(--color-accent); font-size:18px; }
</style></head>
<body>
  <section class="ticker-section" data-block-id="ru-social-proof-07-logo-ticker">
    <div class="ticker-inner">
      <div class="ticker-left">
        <span class="pulse" aria-hidden="true"></span>
        <div class="ticker-title">
          <b data-slot="ticker-label">[Нам доверяют]</b>
          <span data-slot="ticker-sub">[N+ клиентов]</span>
        </div>
      </div>
      <div class="ticker-row" aria-hidden="true">
        <div class="marquee-track">
          <span class="logo-item"><span class="sep">·</span><span data-slot="client-1">[Клиент 1]</span></span>
          <span class="logo-item"><span class="sep">·</span><span data-slot="client-2">[Клиент 2]</span></span>
          <span class="logo-item"><span class="sep">·</span><span data-slot="client-3">[Клиент 3]</span></span>
          <span class="logo-item"><span class="sep">·</span><span data-slot="client-4">[Клиент 4]</span></span>
          <span class="logo-item"><span class="sep">·</span><span data-slot="client-5">[Клиент 5]</span></span>
          <span class="logo-item"><span class="sep">·</span><span data-slot="client-6">[Клиент 6]</span></span>
          <span class="logo-item"><span class="sep">·</span><span data-slot="client-7">[Клиент 7]</span></span>
          <span class="logo-item"><span class="sep">·</span><span data-slot="client-8">[Клиент 8]</span></span>
          <!-- дублировать для бесшовного зацикливания -->
          <span class="logo-item"><span class="sep">·</span><span>[Клиент 1]</span></span>
          <span class="logo-item"><span class="sep">·</span><span>[Клиент 2]</span></span>
          <span class="logo-item"><span class="sep">·</span><span>[Клиент 3]</span></span>
          <span class="logo-item"><span class="sep">·</span><span>[Клиент 4]</span></span>
          <span class="logo-item"><span class="sep">·</span><span>[Клиент 5]</span></span>
          <span class="logo-item"><span class="sep">·</span><span>[Клиент 6]</span></span>
          <span class="logo-item"><span class="sep">·</span><span>[Клиент 7]</span></span>
          <span class="logo-item"><span class="sep">·</span><span>[Клиент 8]</span></span>
        </div>
      </div>
    </div>
  </section>
</body></html>
