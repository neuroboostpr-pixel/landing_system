<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-social-proof-04-authority-cases — mobile wireframe</title>
<style>
  /* Wireframe: ч/б, CSS-only, no external deps.
     CSS vars in :root are MANDATORY — block-composition/inject-tokens.py relies on these names. */
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .cases { padding: 40px 16px; }
  .section-headline { font-family: var(--font-display); font-size: 24px; text-align: center; margin: 0 0 32px; }
  .case-card { border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
  .case-photo { background: #ddd; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999; }
  .case-body { padding: 14px; }
  .case-tag { display: inline-block; background: var(--color-accent); color: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; margin: 0 0 8px; }
  .case-name { font-weight: 700; font-size: 15px; margin: 0 0 6px; }
  .case-result { font-size: 13px; color: #555; margin: 0; }
</style>
</head>
<body>
  <section class="cases" data-block-id="ru-social-proof-04-authority-cases">
    <h2 class="section-headline" data-slot="headline">[Наши лучшие кейсы]</h2>
    <div class="case-card">
      <div class="case-photo" data-slot="case-1-photo">[Фото 1]</div>
      <div class="case-body">
        <span class="case-tag" data-slot="case-1-tag">Самый масштабный</span>
        <p class="case-name" data-slot="case-1-name">[Клиент 1]</p>
        <p class="case-result" data-slot="case-1-result">[Результат]</p>
      </div>
    </div>
    <div class="case-card">
      <div class="case-photo" data-slot="case-2-photo">[Фото 2]</div>
      <div class="case-body">
        <span class="case-tag" data-slot="case-2-tag">Рекорд скорости</span>
        <p class="case-name" data-slot="case-2-name">[Клиент 2]</p>
        <p class="case-result" data-slot="case-2-result">[Результат]</p>
      </div>
    </div>
    <div class="case-card">
      <div class="case-photo" data-slot="case-3-photo">[Фото 3]</div>
      <div class="case-body">
        <span class="case-tag" data-slot="case-3-tag">Предмет гордости</span>
        <p class="case-name" data-slot="case-3-name">[Клиент 3]</p>
        <p class="case-result" data-slot="case-3-result">[Результат]</p>
      </div>
    </div>
  </section>
</body>
</html>
