<style>
  /* Wireframe: ч/б, CSS-only, no external deps.
     CSS vars in :root are MANDATORY — block-composition/inject-tokens.py relies on these names. */
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif;
    --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); width: 375px; }
  .cases { padding: 40px 16px; }
  .section-headline { font-family: var(--lp-font-display); font-size: 24px; text-align: center; margin: 0 0 32px; }
  .case-card { border: 1px solid var(--lp-border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
  .case-photo { background:var(--lp-bg); aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; font-size: 11px; color:#999; }
  .case-body { padding: 14px; }
  .case-tag { display: inline-block; background: var(--lp-accent); color:#fff; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; margin: 0 0 8px; }
  .case-name { font-weight: 700; font-size: 15px; margin: 0 0 6px; }
  .case-result { font-size: 13px; color:#555; margin: 0; }
</style>
<section class="cases" data-block-id="ru-social-proof-04-authority-cases">
<h2 class="section-headline">{{slot:headline}}</h2>
<div class="case-card">
<div class="case-photo">{{slot:case-1-photo}}</div>
<div class="case-body">
<span class="case-tag">{{slot:case-1-tag}}</span>
<p class="case-name">{{slot:case-1-name}}</p>
<p class="case-result">{{slot:case-1-result}}</p>
</div>
</div>
<div class="case-card">
<div class="case-photo">{{slot:case-2-photo}}</div>
<div class="case-body">
<span class="case-tag">{{slot:case-2-tag}}</span>
<p class="case-name">{{slot:case-2-name}}</p>
<p class="case-result">{{slot:case-2-result}}</p>
</div>
</div>
<div class="case-card">
<div class="case-photo">{{slot:case-3-photo}}</div>
<div class="case-body">
<span class="case-tag">{{slot:case-3-tag}}</span>
<p class="case-name">{{slot:case-3-name}}</p>
<p class="case-result">{{slot:case-3-result}}</p>
</div>
</div>
</section>
