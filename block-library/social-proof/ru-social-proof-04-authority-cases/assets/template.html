<style>
  /* Wireframe: ч/б, CSS-only, no external deps.
     CSS vars in :root are MANDATORY — block-composition/inject-tokens.py relies on these names. */
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .cases { padding: 64px var(--spacing-lg); max-width: 1100px; margin: 0 auto; }
  .section-headline { font-family: var(--font-display); font-size: 36px; text-align: center; margin: 0 0 48px; }
  .cases-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .case-card { border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; }
  .case-photo {
    background: #ddd;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #999;
    text-transform: uppercase;
  }
  .case-body { padding: 16px; }
  .case-tag {
    display: inline-block;
    background: var(--color-accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 3px;
    margin: 0 0 10px;
  }
  .case-name { font-weight: 700; font-size: 17px; margin: 0 0 8px; }
  .case-result { font-size: 14px; color: #555; margin: 0; line-height: 1.5; }
</style>
<section class="cases" data-block-id="ru-social-proof-04-authority-cases">
<h2 class="section-headline">{{slot:headline}}</h2>
<div class="cases-grid">
<div class="case-card">
<div class="case-photo">{{slot:case-1-photo}}</div>
<div class="case-body">
<span class="case-tag">{{slot:case-1-tag}}</span>
<p class="case-name">{{slot:case-1-name}}</p>
<p class="case-result">{{slot:case-1-result}}</p>
</div>
</div>
<div class="case-card">
<div class="case-photo">{{slot:case-2-photo}}</div>
<div class="case-body">
<span class="case-tag">{{slot:case-2-tag}}</span>
<p class="case-name">{{slot:case-2-name}}</p>
<p class="case-result">{{slot:case-2-result}}</p>
</div>
</div>
<div class="case-card">
<div class="case-photo">{{slot:case-3-photo}}</div>
<div class="case-body">
<span class="case-tag">{{slot:case-3-tag}}</span>
<p class="case-name">{{slot:case-3-name}}</p>
<p class="case-result">{{slot:case-3-result}}</p>
</div>
</div>
</div>
</section>
