<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-testimonials-02-text-photo — mobile</title>
<style>
  :root {
    --color-bg: #fff; --color-fg: #111; --color-accent: #333; --color-border: #ccc;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .testimonials { padding: 40px 16px; }
  .section-headline { font-family: var(--font-display); font-size: 24px; text-align: center; margin: 0 0 28px; }
  .card { border: 1px solid var(--color-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card-top { display: flex; gap: 12px; margin-bottom: 12px; }
  .client-photo { width: 56px; height: 56px; border-radius: 8px; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #888; flex-shrink: 0; }
  .client-quote { font-size: 14px; color: #333; line-height: 1.5; margin: 0; font-style: italic; }
  .card-footer { border-top: 1px solid var(--color-border); padding-top: 10px; }
  .client-name { font-weight: 700; font-size: 14px; margin: 0 0 2px; }
  .client-role { font-size: 12px; color: #777; margin: 0; }
</style>
</head>
<body>
  <section class="testimonials" data-block-id="ru-testimonials-02-text-photo">
    <h2 class="section-headline" data-slot="headline">[HEADLINE]</h2>
    <div class="card">
      <div class="card-top">
        <div class="client-photo" data-slot="testimonial-1-photo">photo</div>
        <p class="client-quote" data-slot="testimonial-1-quote">[Цитата 1]</p>
      </div>
      <div class="card-footer">
        <p class="client-name" data-slot="testimonial-1-name">[Имя 1]</p>
        <p class="client-role" data-slot="testimonial-1-role">[Роль 1]</p>
      </div>
    </div>
    <div class="card">
      <div class="card-top">
        <div class="client-photo" data-slot="testimonial-2-photo">photo</div>
        <p class="client-quote" data-slot="testimonial-2-quote">[Цитата 2]</p>
      </div>
      <div class="card-footer">
        <p class="client-name" data-slot="testimonial-2-name">[Имя 2]</p>
        <p class="client-role" data-slot="testimonial-2-role">[Роль 2]</p>
      </div>
    </div>
    <div class="card">
      <div class="card-top">
        <div class="client-photo" data-slot="testimonial-3-photo">photo</div>
        <p class="client-quote" data-slot="testimonial-3-quote">[Цитата 3]</p>
      </div>
      <div class="card-footer">
        <p class="client-name" data-slot="testimonial-3-name">[Имя 3]</p>
        <p class="client-role" data-slot="testimonial-3-role">[Роль 3]</p>
      </div>
    </div>
    <div class="card">
      <div class="card-top">
        <div class="client-photo" data-slot="testimonial-4-photo">photo</div>
        <p class="client-quote" data-slot="testimonial-4-quote">[Цитата 4]</p>
      </div>
      <div class="card-footer">
        <p class="client-name" data-slot="testimonial-4-name">[Имя 4]</p>
        <p class="client-role" data-slot="testimonial-4-role">[Роль 4]</p>
      </div>
    </div>
  </section>
</body>
</html>
