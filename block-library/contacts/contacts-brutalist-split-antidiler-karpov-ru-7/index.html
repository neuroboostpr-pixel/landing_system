<section class="lp-contacts-brutalist-split" aria-labelledby="lp-contacts-brutalist-split-title">
  <div class="lp-contacts-brutalist-split__content">
    <p class="lp-contacts-brutalist-split__eyebrow">{{slot:contacts-eyebrow}}</p>
    <h2 class="lp-contacts-brutalist-split__title" id="lp-contacts-brutalist-split-title">{{slot:contacts-title}}</h2>
    <p class="lp-contacts-brutalist-split__caption">{{slot:contacts-caption}}</p>
  </div>

  <div class="lp-contacts-brutalist-split__action" aria-label="{{slot:contacts-action-label}}">
    <a class="lp-contacts-brutalist-split__phone" href="{{slot:phone-link}}">{{slot:phone}}</a>
    <a class="lp-contacts-brutalist-split__link" href="{{slot:secondary-link-url}}">{{slot:secondary-link-label}}</a>
  </div>
</section>
