<style>.lp-contacts-corporate-split {
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
}

.lp-contacts-corporate-split__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  max-width: 1180px;
  margin: 0 auto;
}

.lp-contacts-corporate-split__content {
  display: flex;
  flex-direction: column;
  gap: var(--lp-spacing-md);
}

.lp-contacts-corporate-split__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-contacts-corporate-split__title {
  margin: 0;
  max-width: 11em;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2.25rem, 2rem + 2vw, 4.75rem);
  line-height: 0.95;
  letter-spacing: 0;
}

.lp-contacts-corporate-split__text {
  margin: 0;
  max-width: 42rem;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.7;
}

.lp-contacts-corporate-split__list {
  display: grid;
  gap: var(--lp-spacing-sm);
  padding: 0;
  margin: var(--lp-spacing-sm) 0 0;
  list-style: none;
}

.lp-contacts-corporate-split__item {
  display: grid;
  gap: var(--lp-spacing-xs);
  padding: var(--lp-spacing-md);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg-alt);
}

.lp-contacts-corporate-split__item-label {
  color: var(--lp-text-muted);
  font-size: 0.85rem;
}

.lp-contacts-corporate-split__item-link {
  color: var(--lp-text);
  font-weight: 700;
  text-decoration: none;
}

.lp-contacts-corporate-split__item-link:focus-visible,
.lp-contacts-corporate-split__button:focus-visible,
.lp-contacts-corporate-split input:focus-visible,
.lp-contacts-corporate-split select:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: var(--lp-spacing-xs);
}

.lp-contacts-corporate-split__form {
  display: grid;
  gap: var(--lp-spacing-md);
  padding: var(--lp-spacing-lg);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
}

.lp-contacts-corporate-split__grid {
  display: grid;
  gap: var(--lp-spacing-md);
}

.lp-contacts-corporate-split__field {
  display: grid;
  gap: var(--lp-spacing-xs);
}

.lp-contacts-corporate-split label {
  color: var(--lp-text);
  font-size: 0.9rem;
  font-weight: 700;
}

.lp-contacts-corporate-split input,
.lp-contacts-corporate-split select {
  width: 100%;
  min-height: 3.25rem;
  box-sizing: border-box;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg);
  color: var(--lp-text);
  font: inherit;
}

.lp-contacts-corporate-split input::placeholder {
  color: var(--lp-text-muted);
}

.lp-contacts-corporate-split__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3.4rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  border: 1px solid var(--lp-accent);
  border-radius: var(--lp-radius);
  background: var(--lp-accent);
  color: white;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

.lp-contacts-corporate-split__button:hover {
  background: var(--lp-primary);
  border-color: var(--lp-primary);
}

.lp-contacts-corporate-split__note {
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 0.85rem;
  line-height: 1.5;
}

@media (min-width: 768px) {
  .lp-contacts-corporate-split {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-contacts-corporate-split__inner {
    grid-template-columns: minmax(0, 1fr) minmax(22rem, 0.82fr);
    align-items: center;
    gap: var(--lp-spacing-xl);
  }

  .lp-contacts-corporate-split__grid {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
<section class="lp-contacts-corporate-split" aria-labelledby="contacts-corporate-split-title">
  <div class="lp-contacts-corporate-split__inner">
    <div class="lp-contacts-corporate-split__content">
      <p class="lp-contacts-corporate-split__eyebrow">{{slot:contacts-eyebrow}}</p>
      <h2 class="lp-contacts-corporate-split__title" id="contacts-corporate-split-title">{{slot:contacts-heading}}</h2>
      <p class="lp-contacts-corporate-split__text">{{slot:contacts-subhead}}</p>

      <ul class="lp-contacts-corporate-split__list" aria-label="{{slot:contacts-list-label}}">
        <li class="lp-contacts-corporate-split__item">
          <span class="lp-contacts-corporate-split__item-label">{{slot:contact-method-one-label}}</span>
          <a class="lp-contacts-corporate-split__item-link" href="{{slot:contact-method-one-link}}">{{slot:contact-method-one-text}}</a>
        </li>
        <li class="lp-contacts-corporate-split__item">
          <span class="lp-contacts-corporate-split__item-label">{{slot:contact-method-two-label}}</span>
          <a class="lp-contacts-corporate-split__item-link" href="{{slot:contact-method-two-link}}">{{slot:contact-method-two-text}}</a>
        </li>
      </ul>
    </div>

    <form class="lp-contacts-corporate-split__form" action="{{slot:form-action}}" method="post" aria-label="{{slot:form-label}}">
      <div class="lp-contacts-corporate-split__field">
        <label for="contacts-name">{{slot:name-label}}</label>
        <input id="contacts-name" name="name" type="text" placeholder="{{slot:name-placeholder}}" autocomplete="name">
      </div>

      <div class="lp-contacts-corporate-split__field">
        <label for="contacts-contact">{{slot:contact-label}}</label>
        <input id="contacts-contact" name="contact" type="text" placeholder="{{slot:contact-placeholder}}" autocomplete="email">
      </div>

      <div class="lp-contacts-corporate-split__grid">
        <div class="lp-contacts-corporate-split__field">
          <label for="contacts-date">{{slot:date-label}}</label>
          <input id="contacts-date" name="date" type="date" aria-label="{{slot:date-aria-label}}">
        </div>

        <div class="lp-contacts-corporate-split__field">
          <label for="contacts-time">{{slot:time-label}}</label>
          <select id="contacts-time" name="time" aria-label="{{slot:time-aria-label}}">
            <option value="">{{slot:time-option-default}}</option>
            <option value="{{slot:time-option-one-value}}">{{slot:time-option-one-label}}</option>
            <option value="{{slot:time-option-two-value}}">{{slot:time-option-two-label}}</option>
            <option value="{{slot:time-option-three-value}}">{{slot:time-option-three-label}}</option>
          </select>
        </div>
      </div>

      <button class="lp-contacts-corporate-split__button" type="submit">{{slot:primary-cta-label}}</button>
      <p class="lp-contacts-corporate-split__note">{{slot:form-note}}</p>
    </form>
  </div>
</section>
