<style>
  :root {
    --color-bg: #fff; --color-fg: #111; --color-accent: #333; --color-border: #ccc;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: #f5f5f5; color: var(--color-fg); width: 375px; }
  .calc-card { background: var(--color-bg); min-height: 100vh; padding: 28px 16px 40px; box-sizing: border-box; }
  .headline { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0 0 24px; text-align: center; }
  .param-group { margin-bottom: 20px; }
  .param-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block; }
  .radio-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .radio-opt input[type=radio] { position: absolute; opacity: 0; width: 0; height: 0; }
  .radio-opt label { display: block; padding: 10px 14px; border: 2px solid var(--color-border); border-radius: 8px; cursor: pointer; font-size: 13px; }
  .radio-opt input[type=radio]:checked + label { border-color: var(--color-accent); background: #f8f8f8; font-weight: 600; }
  .result-box { border: 2px dashed var(--color-accent); border-radius: 12px; padding: 18px 20px; margin: 20px 0; text-align: center; }
  .result-prefix { font-size: 13px; color: #666; margin-bottom: 4px; }
  .result-value { font-family: var(--font-display); font-size: 28px; font-weight: 900; color: var(--color-accent); }
  .result-note { font-size: 11px; color: #999; margin-top: 4px; }
  .cta-button { display: block; background: var(--color-accent); color: #fff; font-size: 16px; font-weight: 700; padding: 16px; border-radius: 10px; text-decoration: none; text-align: center; }
</style>
<div class="calc-card" data-block-id="ru-quiz-12-mini-calculator">
<h2 class="headline">{{slot:headline}}</h2>
<div class="param-group">
<span class="param-label">{{slot:param-1-label}}</span>
<div class="radio-options">
<div class="radio-opt"><input checked="" id="mr1" name="room" type="radio" value="small"/><label for="mr1">{{slot:param-1-opt-1}}</label></div>
<div class="radio-opt"><input id="mr2" name="room" type="radio" value="large"/><label for="mr2">{{slot:param-1-opt-2}}</label></div>
</div>
</div>
<div class="param-group">
<span class="param-label">{{slot:param-2-label}}</span>
<div class="radio-options">
<div class="radio-opt"><input checked="" id="mc1" name="cover" type="radio" value="laminate"/><label for="mc1">{{slot:param-2-opt-1}}</label></div>
<div class="radio-opt"><input id="mc2" name="cover" type="radio" value="parquet"/><label for="mc2">{{slot:param-2-opt-2}}</label></div>
</div>
</div>
<div class="result-box">
<div class="result-prefix">{{slot:result-prefix}}</div>
<div class="result-value">от 45 000 ₽</div>
<div class="result-note">Точный расчёт — после звонка</div>
</div>
<a class="cta-button" href="#">{{slot:cta-button}}</a>
</div>
