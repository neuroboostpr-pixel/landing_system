<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-quiz-08-slider-range — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: #f5f5f5; color: var(--color-fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .step-card { background: var(--color-bg); border-radius: 16px; padding: 48px 48px 56px; max-width: 560px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .progress-bar-wrap { margin-bottom: 28px; }
  .progress-label { font-size: 12px; color: #999; margin-bottom: 6px; }
  .progress-track { background: #eee; border-radius: 4px; height: 6px; }
  .progress-fill { background: var(--color-accent); height: 6px; border-radius: 4px; width: 60%; }
  .question-text { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.25; margin: 0 0 40px; text-align: center; }
  .slider-wrap { padding: 0 8px; }
  .slider-value-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .slider-value-display { font-family: var(--font-display); font-size: 36px; font-weight: 700; }
  .slider-unit { font-size: 18px; color: #555; }
  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 4px; background: #e0e0e0; outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--color-accent); cursor: pointer; border: 3px solid var(--color-bg); box-shadow: 0 1px 6px rgba(0,0,0,0.2); }
  .slider-range-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: #999; }
  .question-comment { margin-top: 28px; font-size: 13px; color: #999; text-align: center; }
  .next-btn { display: block; margin: 32px auto 0; background: var(--color-accent); color: #fff; border: none; border-radius: 8px; padding: 14px 48px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
</style>
</head>
<body>
  <div class="step-card" data-block-id="ru-quiz-08-slider-range">
    <div class="progress-bar-wrap">
      <div class="progress-label" data-slot="progress-label">Вопрос 3 из 5 · осталось ~1 мин</div>
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>
    <p class="question-text" data-slot="question-text">Какой бюджет вы планируете на покрытие пола?</p>
    <div class="slider-wrap">
      <div class="slider-value-row">
        <span class="slider-value-display">50 000</span>
        <span class="slider-unit" data-slot="unit-label">₽</span>
      </div>
      <input type="range" min="10000" max="300000" value="50000" step="5000">
      <div class="slider-range-labels">
        <span data-slot="min-label">от 10 000 ₽</span>
        <span data-slot="max-label">от 300 000 ₽</span>
      </div>
    </div>
    <p class="question-comment" data-slot="question-comment">💡 Укажите примерный бюджет — точный расчёт сделает менеджер</p>
    <a class="next-btn" href="#">Далее →</a>
  </div>
</body>
</html>
