<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-quiz-08-slider-range — mobile</title>
<style>
  :root {
    --color-bg: #fff; --color-fg: #111; --color-accent: #333; --color-border: #ccc;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: #f5f5f5; color: var(--color-fg); width: 375px; }
  .step-card { background: var(--color-bg); min-height: 100vh; padding: 28px 20px 40px; box-sizing: border-box; }
  .progress-bar-wrap { margin-bottom: 20px; }
  .progress-label { font-size: 11px; color: #999; margin-bottom: 5px; }
  .progress-track { background: #eee; border-radius: 4px; height: 5px; }
  .progress-fill { background: var(--color-accent); height: 5px; border-radius: 4px; width: 60%; }
  .question-text { font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1.25; margin: 0 0 32px; text-align: center; }
  .slider-value-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .slider-value-display { font-family: var(--font-display); font-size: 32px; font-weight: 700; }
  .slider-unit { font-size: 16px; color: #555; }
  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 4px; background: #e0e0e0; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--color-accent); border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.2); }
  .slider-range-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #999; }
  .question-comment { margin-top: 20px; font-size: 13px; color: #999; text-align: center; }
  .next-btn { display: block; margin: 28px 0 0; background: var(--color-accent); color: #fff; border: none; border-radius: 8px; padding: 16px; width: 100%; font-size: 16px; font-weight: 700; text-decoration: none; text-align: center; box-sizing: border-box; }
</style>
</head>
<body>
  <div class="step-card" data-block-id="ru-quiz-08-slider-range">
    <div class="progress-bar-wrap">
      <div class="progress-label" data-slot="progress-label">Вопрос 3 из 5</div>
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>
    <p class="question-text" data-slot="question-text">Какой бюджет вы планируете на покрытие?</p>
    <div class="slider-value-row">
      <span class="slider-value-display">50 000</span>
      <span class="slider-unit" data-slot="unit-label">₽</span>
    </div>
    <input type="range" min="10000" max="300000" value="50000" step="5000">
    <div class="slider-range-labels">
      <span data-slot="min-label">от 10 000 ₽</span>
      <span data-slot="max-label">от 300 000 ₽</span>
    </div>
    <p class="question-comment" data-slot="question-comment">💡 Точный расчёт сделает менеджер</p>
    <a class="next-btn" href="#">Далее →</a>
  </div>
</body>
</html>
