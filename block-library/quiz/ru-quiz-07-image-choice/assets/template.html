<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background:#f5f5f5; color: var(--lp-text); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .step-card { background: var(--lp-bg); border-radius: 16px; padding: 40px 40px 48px; max-width: 620px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .progress-bar-wrap { margin-bottom: 28px; }
  .progress-label { font-size: 12px; color:#999; margin-bottom: 6px; }
  .progress-track { background:#eee; border-radius: 4px; height: 6px; }
  .progress-fill { background: var(--lp-accent); height: 6px; border-radius: 4px; width: 40%; }
  .question-text { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.25; margin: 0 0 28px; text-align: center; }
  .image-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  /* CSS-only selection via hidden radio + label */
  .image-option input[type=radio] { position: absolute; opacity: 0; width: 0; height: 0; }
  .image-option label { display: block; border: 2px solid var(--lp-border); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color 0.15s; }
  .image-option input[type=radio]:checked + label { border-color: var(--lp-accent); box-shadow: 0 0 0 2px var(--lp-accent); }
  .image-option label:hover { border-color:#888; }
  .img-placeholder { width: 100%; height: 140px; background:#e8e8e8; display: flex; align-items: center; justify-content: center; font-size: 13px; color:#999; }
  .img-label { padding: 10px 14px; font-size: 15px; font-weight: 500; text-align: center; background: var(--lp-bg); }
  .next-btn { display: block; margin: 28px auto 0; background: var(--lp-accent); color:#fff; border: none; border-radius: 8px; padding: 14px 48px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
</style>
<div class="step-card" data-block-id="ru-quiz-07-image-choice">
<div class="progress-bar-wrap">
<div class="progress-label">{{slot:progress-label}}</div>
<div class="progress-track"><div class="progress-fill"></div></div>
</div>
<p class="question-text">{{slot:question-text}}</p>
<div class="image-grid">
<div class="image-option">
<input id="opt1" name="img-choice" type="radio" value="1"/>
<label for="opt1">
<div class="img-placeholder">{{slot:image-1}}</div>
<div class="img-label">{{slot:label-1}}</div>
</label>
</div>
<div class="image-option">
<input id="opt2" name="img-choice" type="radio" value="2"/>
<label for="opt2">
<div class="img-placeholder">{{slot:image-2}}</div>
<div class="img-label">{{slot:label-2}}</div>
</label>
</div>
<div class="image-option">
<input id="opt3" name="img-choice" type="radio" value="3"/>
<label for="opt3">
<div class="img-placeholder">{{slot:image-3}}</div>
<div class="img-label">{{slot:label-3}}</div>
</label>
</div>
<div class="image-option">
<input id="opt4" name="img-choice" type="radio" value="4"/>
<label for="opt4">
<div class="img-placeholder">{{slot:image-4}}</div>
<div class="img-label">{{slot:label-4}}</div>
</label>
</div>
</div>
<a class="next-btn" href="#">Далее →</a>
</div>
