<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-quiz-02-progress-top — mobile</title>
<style>
  :root {
    --color-bg: #fff; --color-fg: #111; --color-accent: #333; --color-border: #ccc;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .progress-bar { position: sticky; top: 0; z-index: 100; background: var(--color-bg); border-bottom: 1px solid var(--color-border); padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .progress-text { font-size: 13px; color: #777; white-space: nowrap; flex-shrink: 0; }
  .progress-track { flex: 1; height: 5px; background: #e8e8e8; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--color-accent); border-radius: 3px; width: 40%; }
</style>
</head>
<body>
  <header class="progress-bar" data-block-id="ru-quiz-02-progress-top">
    <span class="progress-text" data-slot="progress-text">[Вопрос 2 из 5]</span>
    <div class="progress-track">
      <div class="progress-fill" data-slot="progress-bar" style="width: 40%;"></div>
    </div>
  </header>
</body>
</html>
