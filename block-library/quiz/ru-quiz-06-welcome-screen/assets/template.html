<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-quiz-06-welcome-screen — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: #f5f5f5; color: var(--color-fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .welcome-card { background: var(--color-bg); border-radius: 16px; padding: 56px 48px; max-width: 600px; width: 100%; box-shadow: 0 4px 32px rgba(0,0,0,0.08); text-align: center; }
  .welcome-badge { display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-accent); border: 1.5px solid var(--color-accent); border-radius: 20px; padding: 4px 14px; margin-bottom: 24px; }
  .headline { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.2; margin: 0 0 16px; }
  .subheadline { font-size: 18px; color: #555; line-height: 1.5; margin: 0 0 32px; }
  .lead-magnet { background: #f8f8f0; border: 1.5px dashed var(--color-border); border-radius: 10px; padding: 14px 20px; margin-bottom: 32px; font-size: 15px; color: #444; }
  .lead-magnet strong { color: var(--color-fg); }
  .cta-button { display: inline-block; background: var(--color-accent); color: #fff; font-size: 18px; font-weight: 700; padding: 18px 48px; border-radius: 10px; text-decoration: none; cursor: pointer; letter-spacing: 0.02em; border: none; }
  .trust-note { margin-top: 18px; font-size: 13px; color: #999; }
</style>
</head>
<body>
  <div class="welcome-card" data-block-id="ru-quiz-06-welcome-screen">
    <div class="welcome-badge">Бесплатный подбор</div>
    <h1 class="headline" data-slot="headline">Подберём идеальное покрытие пола за 2 минуты</h1>
    <p class="subheadline" data-slot="subheadline">Ответьте на 5 вопросов — получите персональную подборку с ценами и скидкой специально для вас</p>
    <div class="lead-magnet" data-slot="lead-magnet">🎁 <strong>Подарок за прохождение:</strong> скидка 10% на первый заказ + бесплатный замер</div>
    <a class="cta-button" href="#" data-slot="cta-button">Начать подбор →</a>
    <p class="trust-note" data-slot="trust-note">Уже прошли 1 200 человек · Займёт ~2 минуты</p>
  </div>
</body>
</html>
