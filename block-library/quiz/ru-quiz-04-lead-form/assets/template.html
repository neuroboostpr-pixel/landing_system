<style>
  :root {
    --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333;
    --lp-border: #e0e0e0; --spacing-md: 16px; --spacing-lg: 32px;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); }
  .lead-form { max-width: 520px; margin: 80px auto; padding: 32px; border: 1px solid var(--lp-border); border-radius: 12px; }
  .headline { font-size: 28px; line-height: 1.2; margin: 0 0 12px; }
  .subhead { color:#555; margin: 0 0 24px; }
  .field { margin-bottom: 16px; }
  .field input[type=text], .field input[type=tel] { width: 100%; padding: 12px; border: 1px solid var(--lp-border); border-radius: 6px; font-size: 16px; box-sizing: border-box; }
  .channel-choice { display: flex; gap: 12px; margin-bottom: 16px; }
  .channel-choice label { flex: 1; padding: 12px; border: 1px solid var(--lp-border); border-radius: 6px; cursor: pointer; text-align: center; }
  .channel-choice input { display: none; }
  .channel-choice input:checked + span { font-weight: 600; }
  .agreement { display: flex; gap: 8px; font-size: 13px; color:#666; margin-bottom: 16px; }
  .cta { width: 100%; padding: 16px; background: var(--lp-accent); color:#fff; border: none; border-radius: 6px; font-weight: 600; font-size: 16px; cursor: pointer; }
</style>
<section class="lead-form" data-block-id="ru-quiz-04-lead-form">
<h2 class="headline">{{slot:headline}}</h2>
<p class="subhead">{{slot:subhead}}</p>
<div class="field"><input placeholder="Имя" type="text"/>{{slot:name-input}}</div>
<div class="field"><input placeholder="+7 ___ ___ __ __" required="" type="tel"/>{{slot:phone-input}}</div>
<fieldset class="channel-choice">
<label><input checked="" name="ch" type="radio" value="tg"/><span>Telegram</span></label>
<label><input name="ch" type="radio" value="max"/><span>Max</span></label>
<label><input name="ch" type="radio" value="phone"/><span>Звонок</span></label>
</fieldset>
<label class="agreement"><input required="" type="checkbox"/><span>{{slot:agreement-text}}</span></label>
<button class="cta">{{slot:submit-cta}}</button>
</section>
