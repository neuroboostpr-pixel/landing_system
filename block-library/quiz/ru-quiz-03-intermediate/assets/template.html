<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-quiz-03-intermediate — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .intermediate { text-align: center; padding: var(--spacing-lg); max-width: 480px; }
  .emoji-icon { font-size: 96px; line-height: 1; margin: 0 0 24px; display: block; }
  .motivation-text { font-family: var(--font-display); font-size: 28px; line-height: 1.2; margin: 0 0 40px; }
  .cta { display: inline-block; padding: 16px 48px; background: var(--color-accent); color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 18px; }
</style>
</head>
<body>
  <div class="intermediate" data-block-id="ru-quiz-03-intermediate">
    <span class="emoji-icon" data-slot="emoji-icon">💪</span>
    <p class="motivation-text" data-slot="motivation-text">[Осталось 2 шага, держись!]</p>
    <a class="cta" data-slot="continue-cta" href="#next">[Продолжить]</a>
  </div>

</html>
