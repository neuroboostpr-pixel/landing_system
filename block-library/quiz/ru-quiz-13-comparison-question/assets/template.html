<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-quiz-13-comparison-question — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: #f5f5f5; color: var(--color-fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .step-card { background: var(--color-bg); border-radius: 16px; padding: 44px 44px 52px; max-width: 600px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .progress-bar-wrap { margin-bottom: 28px; }
  .progress-label { font-size: 12px; color: #999; margin-bottom: 6px; }
  .progress-track { background: #eee; border-radius: 4px; height: 6px; }
  .progress-fill { background: var(--color-accent); height: 6px; border-radius: 4px; width: 50%; }
  .question-text { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.25; margin: 0 0 32px; text-align: center; }
  .vs-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; }
  .vs-divider { display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #999; }
  /* CSS-only radio for comparison */
  .cmp-option input[type=radio] { position: absolute; opacity: 0; width: 0; height: 0; }
  .cmp-option label { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 20px; border: 2px solid var(--color-border); border-radius: 12px; cursor: pointer; text-align: center; height: 100%; box-sizing: border-box; transition: border-color 0.15s, background 0.15s; }
  .cmp-option input[type=radio]:checked + label { border-color: var(--color-accent); background: #f9f9f9; }
  .cmp-option label:hover { border-color: #888; }
  .cmp-icon { font-size: 40px; }
  .cmp-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
  .cmp-desc { font-size: 14px; color: #666; line-height: 1.4; }
  .question-comment { margin-top: 24px; font-size: 13px; color: #999; text-align: center; }
</style>
</head>
<body>
  <div class="step-card" data-block-id="ru-quiz-13-comparison-question">
    <div class="progress-bar-wrap">
      <div class="progress-label" data-slot="progress-label">Вопрос 2 из 5 · осталось ~1 мин</div>
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>
    <p class="question-text" data-slot="question-text">Что для вас важнее при выборе покрытия?</p>
    <div class="vs-row">
      <div class="cmp-option">
        <input type="radio" name="comparison" id="optA" value="A">
        <label for="optA">
          <span class="cmp-icon">💰</span>
          <span class="cmp-title" data-slot="option-a-title">Низкая цена</span>
          <span class="cmp-desc" data-slot="option-a-description">Сэкономить сейчас, заменить через 5–7 лет</span>
        </label>
      </div>
      <div class="vs-divider">VS</div>
      <div class="cmp-option">
        <input type="radio" name="comparison" id="optB" value="B">
        <label for="optB">
          <span class="cmp-icon">🏆</span>
          <span class="cmp-title" data-slot="option-b-title">Высокое качество</span>
          <span class="cmp-desc" data-slot="option-b-description">Вложить больше, но забыть на 20+ лет</span>
        </label>
      </div>
    </div>
    <p class="question-comment" data-slot="question-comment">Нет правильного ответа — это поможет подобрать лучшее предложение</p>
  </div>
</body>
</html>
