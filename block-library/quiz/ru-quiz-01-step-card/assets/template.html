<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-quiz-01-step-card — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: #f5f5f5; color: var(--color-fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .step-card { background: var(--color-bg); border-radius: 16px; padding: 48px 40px; max-width: 560px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .question-text { font-family: var(--font-display); font-size: 26px; line-height: 1.2; margin: 0 0 32px; text-align: center; }
  .answers { display: flex; flex-direction: column; gap: 12px; }
  .answer-btn { display: block; padding: 16px 20px; border: 2px solid var(--color-border); border-radius: 8px; font-size: 16px; text-align: left; cursor: pointer; background: var(--color-bg); color: var(--color-fg); text-decoration: none; transition: border-color 0.15s; }
  .answer-btn:hover { border-color: var(--color-accent); }
  .question-comment { margin-top: 24px; font-size: 13px; color: #999; text-align: center; }
</style>
</head>
<body>
  <div class="step-card" data-block-id="ru-quiz-01-step-card">
    <p class="question-text" data-slot="question-text">[ВОПРОС: что вам нужно?]</p>
    <div class="answers">
      <a class="answer-btn" data-slot="answer-1-text" href="#">[Вариант ответа 1]</a>
      <a class="answer-btn" data-slot="answer-2-text" href="#">[Вариант ответа 2]</a>
      <a class="answer-btn" data-slot="answer-3-text" href="#">[Вариант ответа 3]</a>
      <a class="answer-btn" data-slot="answer-4-text" href="#">[Вариант ответа 4]</a>
    </div>
    <p class="question-comment" data-slot="question-comment">[Зачем спрашиваем: объяснение мелким шрифтом]</p>
  </div>
</body>
</html>
