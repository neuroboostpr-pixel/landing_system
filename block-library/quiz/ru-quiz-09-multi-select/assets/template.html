<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-quiz-09-multi-select — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: #f5f5f5; color: var(--color-fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .step-card { background: var(--color-bg); border-radius: 16px; padding: 40px 40px 48px; max-width: 560px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .progress-bar-wrap { margin-bottom: 28px; }
  .progress-label { font-size: 12px; color: #999; margin-bottom: 6px; }
  .progress-track { background: #eee; border-radius: 4px; height: 6px; }
  .progress-fill { background: var(--color-accent); height: 6px; border-radius: 4px; width: 80%; }
  .question-text { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.25; margin: 0 0 8px; text-align: center; }
  .question-hint { font-size: 14px; color: #999; text-align: center; margin-bottom: 24px; }
  .options-list { display: flex; flex-direction: column; gap: 10px; }
  /* CSS-only checkbox selection */
  .check-option input[type=checkbox] { position: absolute; opacity: 0; width: 0; height: 0; }
  .check-option label { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border: 2px solid var(--color-border); border-radius: 8px; cursor: pointer; font-size: 15px; transition: border-color 0.15s; }
  .check-option input[type=checkbox]:checked + label { border-color: var(--color-accent); background: #f8f8f8; }
  .check-option label:hover { border-color: #888; }
  .check-box { width: 20px; height: 20px; border: 2px solid var(--color-border); border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .check-option input[type=checkbox]:checked + label .check-box { background: var(--color-accent); border-color: var(--color-accent); }
  .check-option input[type=checkbox]:checked + label .check-box::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; }
  .next-btn { display: block; margin: 28px auto 0; background: var(--color-accent); color: #fff; border: none; border-radius: 8px; padding: 14px 48px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
</style>
</head>
<body>
  <div class="step-card" data-block-id="ru-quiz-09-multi-select">
    <div class="progress-bar-wrap">
      <div class="progress-label" data-slot="progress-label">Вопрос 4 из 5 · осталось ~30 сек</div>
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>
    <p class="question-text" data-slot="question-text">Что важно при выборе покрытия?</p>
    <p class="question-hint">Выберите все подходящие варианты</p>
    <div class="options-list">
      <div class="check-option">
        <input type="checkbox" id="ch1" name="importance" value="1">
        <label for="ch1"><span class="check-box"></span><span data-slot="option-1">Долговечность (10+ лет)</span></label>
      </div>
      <div class="check-option">
        <input type="checkbox" id="ch2" name="importance" value="2">
        <label for="ch2"><span class="check-box"></span><span data-slot="option-2">Лёгкий уход и чистка</span></label>
      </div>
      <div class="check-option">
        <input type="checkbox" id="ch3" name="importance" value="3">
        <label for="ch3"><span class="check-box"></span><span data-slot="option-3">Водостойкость</span></label>
      </div>
      <div class="check-option">
        <input type="checkbox" id="ch4" name="importance" value="4">
        <label for="ch4"><span class="check-box"></span><span data-slot="option-4">Тёплое на ощупь</span></label>
      </div>
      <div class="check-option">
        <input type="checkbox" id="ch5" name="importance" value="5">
        <label for="ch5"><span class="check-box"></span><span data-slot="option-5">Экологически чистое</span></label>
      </div>
      <div class="check-option">
        <input type="checkbox" id="ch6" name="importance" value="6">
        <label for="ch6"><span class="check-box"></span><span data-slot="option-6">Цена/качество</span></label>
      </div>
    </div>
    <a class="next-btn" href="#" data-slot="next-button">Далее →</a>
  </div>
</body>
</html>
