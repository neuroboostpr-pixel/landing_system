<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .thankyou { text-align: center; padding: var(--spacing-lg); max-width: 520px; }
  .success-icon { font-size: 80px; line-height: 1; margin: 0 0 24px; display: block; color: var(--color-accent); }
  .success-headline { font-family: var(--font-display); font-size: 40px; line-height: 1.1; margin: 0 0 16px; }
  .success-subhead { font-size: 18px; color: #555; margin: 0 0 40px; line-height: 1.5; }
  .cta { display: inline-block; padding: 14px 40px; background: transparent; color: var(--color-fg); border: 2px solid var(--color-border); text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 16px; }
</style>
<div class="thankyou" data-block-id="ru-quiz-05-thankyou">
<span class="success-icon">{{slot:success-icon}}</span>
<h1 class="success-headline">{{slot:success-headline}}</h1>
<p class="success-subhead">{{slot:success-subhead}}</p>
<a class="cta" href="/">{{slot:back-cta}}</a>
</div>
