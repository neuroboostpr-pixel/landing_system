<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-quiz-11-discount-bonus — mobile</title>
<style>
  :root {
    --color-bg: #fff; --color-fg: #111; --color-accent: #333; --color-border: #ccc;
    --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    --spacing-md: 16px; --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px 20px; box-sizing: border-box; }
  .bonus-card { text-align: center; width: 100%; }
  .bonus-badge { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--color-accent); margin-bottom: 20px; }
  .bonus-value { font-family: var(--font-display); font-size: 30px; font-weight: 900; color: var(--color-accent); line-height: 1; }
  .bonus-unit { font-size: 12px; color: var(--color-accent); font-weight: 600; }
  .headline { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0 0 10px; }
  .discount-description { font-size: 15px; color: #555; margin: 0 0 20px; line-height: 1.5; }
  .bonus-list { list-style: none; padding: 0; margin: 0 0 24px; text-align: left; }
  .bonus-list li { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 8px; }
  .bonus-list li::before { content: '✓'; font-weight: 700; color: var(--color-accent); }
  .cta-button { display: block; width: 100%; background: var(--color-accent); color: #fff; font-size: 17px; font-weight: 700; padding: 16px; border-radius: 10px; text-decoration: none; text-align: center; box-sizing: border-box; }
  .urgency-note { margin-top: 14px; font-size: 12px; color: #999; }
</style>
</head>
<body>
  <div class="bonus-card" data-block-id="ru-quiz-11-discount-bonus">
    <div class="bonus-badge">
      <span class="bonus-value" data-slot="discount-value">-15%</span>
      <span class="bonus-unit">скидка</span>
    </div>
    <h2 class="headline" data-slot="headline">🎁 Вы получили подарок!</h2>
    <p class="discount-description" data-slot="discount-description">За прохождение квиза — скидка 15% и два бонуса</p>
    <ul class="bonus-list">
      <li data-slot="bonus-item-1">Скидка 15% на заказ</li>
      <li data-slot="bonus-item-2">Бесплатный выезд замерщика</li>
    </ul>
    <a class="cta-button" href="#" data-slot="cta-button">Получить подарок →</a>
    <p class="urgency-note" data-slot="urgency-note">⏰ Предложение действует 24 часа</p>
  </div>
</body>
</html>
