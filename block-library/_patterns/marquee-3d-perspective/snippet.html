<!-- marquee-3d-perspective: Бегущая строка с 3D-перспективой.
     Requires snippet.css and snippet.js. -->

<!-- Standard 3D perspective marquee -->
<div class="mq3d-track" style="background:#fff; padding:2rem 0;">
  <div class="mq3d-perspective">
    <div class="mq3d-stage">
      <ul class="mq3d-list" data-speed="25">
        <li>Лидогенерация</li>
        <li>Конверсия</li>
        <li>Продажи</li>
        <li>Клиенты</li>
        <li>Результат</li>
        <li>Рост</li>
        <li>Прибыль</li>
        <li>Масштаб</li>
      </ul>
    </div>
  </div>
</div>

<!-- Reverse direction, flat (no tilt), slower -->
<div class="mq3d-track mq3d-track--flat" style="background:#f5f5f5; padding:1.5rem 0; margin-top:1rem;">
  <div class="mq3d-perspective">
    <div class="mq3d-stage">
      <ul class="mq3d-list mq3d-list--reverse" data-speed="40"
          style="--mq3d-color:#555; --mq3d-font-size:0.95rem;">
        <li>Digital Marketing</li>
        <li>Lead Generation</li>
        <li>Conversion Rate</li>
        <li>Customer Acquisition</li>
        <li>Revenue Growth</li>
        <li>Brand Awareness</li>
      </ul>
    </div>
  </div>
</div>

<script src="snippet.js" defer></script>
