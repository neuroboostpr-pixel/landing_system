<!-- scroll-reveal: базовый пример применения -->

<!-- Простой блок снизу -->
<section data-reveal>
  <h2>Почему выбирают нас</h2>
  <p>Появляется плавно при скролле.</p>
</section>

<!-- Сетка с stagger (карточки появляются поочерёдно) -->
<div class="features-grid" data-reveal-stagger>
  <div class="card" data-reveal>Преимущество 1</div>
  <div class="card" data-reveal>Преимущество 2</div>
  <div class="card" data-reveal>Преимущество 3</div>
</div>

<!-- Слева и справа (для split-секций) -->
<div class="split">
  <div data-reveal="left">Контент слева</div>
  <div data-reveal="right">Контент справа</div>
</div>
