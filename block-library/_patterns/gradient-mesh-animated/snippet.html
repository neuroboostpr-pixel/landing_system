<!-- gradient-mesh-animated: Cinematic background, zero-JS.
     Add class "gma-bg" to any section. Content sits above via z-index auto. -->

<!-- Default (purple-blue-rose-teal) -->
<section class="gma-bg" style="min-height:400px; display:grid; place-items:center; background:#0a0a14;">
  <h2 style="color:#fff; font-size:clamp(2rem,5vw,4rem); font-weight:700; position:relative; z-index:1;">
    Cinematic Gradient Mesh
  </h2>
</section>

<!-- Warm variant — for editorial-warm mood -->
<section class="gma-bg gma-bg--warm" style="min-height:300px; display:grid; place-items:center; background:#f5f4ed;">
  <p style="position:relative; z-index:1; font-size:1.25rem; color:#141413;">
    Warm editorial palette variant
  </p>
</section>
