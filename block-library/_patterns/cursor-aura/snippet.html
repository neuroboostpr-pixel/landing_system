<!-- cursor-aura: Light spot follows the cursor.
     Requires snippet.css and snippet.js. -->

<section class="cursor-aura" style="min-height:400px; background:#0d0d14; display:grid; place-items:center;">
  <div style="text-align:center; color:#fff; padding:2rem;">
    <h2 style="font-size:clamp(2rem,5vw,3.5rem); font-weight:700; margin-bottom:1rem;">
      Move your cursor here
    </h2>
    <p style="opacity:0.6; font-size:1.1rem;">The light follows you.</p>
  </div>
</section>

<!-- Warm variant for editorial-warm mood -->
<section class="cursor-aura cursor-aura--warm" style="min-height:300px; background:#f5f4ed; display:grid; place-items:center;">
  <p style="color:#141413; font-size:1.25rem;">Warm aura on parchment</p>
</section>

<script src="snippet.js" defer></script>
