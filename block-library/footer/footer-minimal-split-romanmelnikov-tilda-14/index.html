<footer class="lp-footer-minimal-split" aria-labelledby="lp-footer-minimal-split-title">
  <div class="lp-footer-minimal-split__inner">
    <div class="lp-footer-minimal-split__brand">
      <a class="lp-footer-minimal-split__brand-link" href="{{slot:brand-url}}" aria-label="{{slot:brand-aria-label}}">
        <span class="lp-footer-minimal-split__mark" aria-hidden="true"></span>
        <span id="lp-footer-minimal-split-title" class="lp-footer-minimal-split__name">{{slot:brand-name}}</span>
      </a>
      <p class="lp-footer-minimal-split__summary">{{slot:footer-summary}}</p>
    </div>

    <div class="lp-footer-minimal-split__meta">
      <address class="lp-footer-minimal-split__contacts">
        <a href="{{slot:phone-url}}" class="lp-footer-minimal-split__contact">{{slot:phone-label}}</a>
        <a href="{{slot:email-url}}" class="lp-footer-minimal-split__contact">{{slot:email-label}}</a>
        <span class="lp-footer-minimal-split__contact">{{slot:address-line}}</span>
      </address>

      <nav class="lp-footer-minimal-split__legal" aria-label="{{slot:legal-nav-label}}">
        <a href="{{slot:privacy-url}}">{{slot:privacy-label}}</a>
        <a href="{{slot:terms-url}}">{{slot:terms-label}}</a>
        <a href="{{slot:cookies-url}}">{{slot:cookies-label}}</a>
      </nav>

      <p class="lp-footer-minimal-split__copyright">{{slot:copyright}}</p>
    </div>
  </div>
</footer>
