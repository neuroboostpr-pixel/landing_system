<footer class="lp-footer-corporate-split" aria-labelledby="lp-footer-corporate-split-title">
  <div class="lp-footer-corporate-split__inner">
    <div class="lp-footer-corporate-split__brand">
      <a class="lp-footer-corporate-split__brand-link" href="{{slot:brand-link}}" aria-label="{{slot:brand-aria-label}}">
        <img class="lp-footer-corporate-split__logo" src="{{slot:logo-image}}" alt="{{slot:logo-image-alt}}" loading="lazy">
      </a>
      <h2 class="lp-footer-corporate-split__title" id="lp-footer-corporate-split-title">{{slot:footer-heading}}</h2>
      <p class="lp-footer-corporate-split__text">{{slot:footer-description}}</p>
    </div>

    <div class="lp-footer-corporate-split__action" aria-label="{{slot:contact-area-label}}">
      <a class="lp-footer-corporate-split__button" href="{{slot:primary-cta-link}}">
        {{slot:primary-cta-label}}
      </a>
      <p class="lp-footer-corporate-split__note">{{slot:contact-note}}</p>
    </div>

    <nav class="lp-footer-corporate-split__nav" aria-label="{{slot:footer-nav-label}}">
      <a class="lp-footer-corporate-split__link" href="{{slot:nav-link-1-url}}">{{slot:nav-link-1-label}}</a>
      <a class="lp-footer-corporate-split__link" href="{{slot:nav-link-2-url}}">{{slot:nav-link-2-label}}</a>
      <a class="lp-footer-corporate-split__link" href="{{slot:nav-link-3-url}}">{{slot:nav-link-3-label}}</a>
      <a class="lp-footer-corporate-split__link" href="{{slot:nav-link-4-url}}">{{slot:nav-link-4-label}}</a>
    </nav>
  </div>

  <div class="lp-footer-corporate-split__bottom">
    <p class="lp-footer-corporate-split__legal">{{slot:legal-text}}</p>
    <nav class="lp-footer-corporate-split__legal-nav" aria-label="{{slot:legal-nav-label}}">
      <a class="lp-footer-corporate-split__legal-link" href="{{slot:legal-link-1-url}}">{{slot:legal-link-1-label}}</a>
      <a class="lp-footer-corporate-split__legal-link" href="{{slot:legal-link-2-url}}">{{slot:legal-link-2-label}}</a>
    </nav>
  </div>
</footer>
