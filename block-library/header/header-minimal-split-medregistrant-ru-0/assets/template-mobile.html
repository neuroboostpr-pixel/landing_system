<style>.lp-header-minimal-split {
  width: 100%;
  background: var(--lp-bg);
  color: var(--lp-text);
  border-bottom: 1px solid var(--lp-border);
  font-family: var(--lp-font-body);
}

.lp-header-minimal-split__inner {
  width: min(100%, 1280px);
  margin: 0 auto;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--lp-spacing-sm);
  align-items: center;
}

.lp-header-minimal-split__brand {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: var(--lp-spacing-sm);
  color: var(--lp-text);
  text-decoration: none;
}

.lp-header-minimal-split__logo {
  width: 2.25rem;
  height: 2.25rem;
  flex: 0 0 auto;
  object-fit: contain;
  border-radius: var(--lp-radius);
}

.lp-header-minimal-split__brand-text {
  min-width: 0;
  overflow-wrap: anywhere;
  font-family: var(--lp-font-display);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.2;
}

.lp-header-minimal-split__nav {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: var(--lp-spacing-xs) var(--lp-spacing-md);
  align-items: center;
}

.lp-header-minimal-split__nav-link {
  color: var(--lp-text-muted);
  text-decoration: none;
  font-size: 0.92rem;
  line-height: 1.4;
}

.lp-header-minimal-split__nav-link:hover,
.lp-header-minimal-split__nav-link:focus-visible {
  color: var(--lp-primary);
}

.lp-header-minimal-split__actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--lp-spacing-sm);
}

.lp-header-minimal-split__contact {
  display: none;
  color: var(--lp-text);
  text-decoration: none;
  line-height: 1.2;
}

.lp-header-minimal-split__contact-label {
  display: block;
  color: var(--lp-text-muted);
  font-size: 0.75rem;
}

.lp-header-minimal-split__contact-value {
  display: block;
  font-size: 0.92rem;
  font-weight: 700;
}

.lp-header-minimal-split__cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 2.5rem;
  padding: var(--lp-spacing-xs) var(--lp-spacing-md);
  border-radius: var(--lp-radius);
  border: 1px solid var(--lp-primary);
  background: var(--lp-primary);
  color: var(--lp-bg);
  text-decoration: none;
  font-size: 0.92rem;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
}

.lp-header-minimal-split__cta:hover,
.lp-header-minimal-split__cta:focus-visible {
  background: var(--lp-accent);
  border-color: var(--lp-accent);
}

.lp-header-minimal-split__brand:focus-visible,
.lp-header-minimal-split__nav-link:focus-visible,
.lp-header-minimal-split__contact:focus-visible,
.lp-header-minimal-split__cta:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 3px;
}

@media (min-width: 768px) {
  .lp-header-minimal-split__inner {
    grid-template-columns: auto 1fr auto;
    gap: var(--lp-spacing-lg);
    padding: var(--lp-spacing-sm) var(--lp-spacing-xl);
  }

  .lp-header-minimal-split__nav {
    grid-column: auto;
    justify-content: center;
    flex-wrap: nowrap;
  }

  .lp-header-minimal-split__contact {
    display: block;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<header class="lp-header-minimal-split" aria-label="{{slot:header-aria-label}}">
  <div class="lp-header-minimal-split__inner">
    <a class="lp-header-minimal-split__brand" href="{{slot:brand-link}}" aria-label="{{slot:brand-aria-label}}">
      <img class="lp-header-minimal-split__logo" src="{{slot:logo-image}}" alt="{{slot:logo-image-alt}}" loading="lazy">
      <span class="lp-header-minimal-split__brand-text">{{slot:brand-name}}</span>
    </a>

    <nav class="lp-header-minimal-split__nav" aria-label="{{slot:navigation-aria-label}}">
      <a class="lp-header-minimal-split__nav-link" href="{{slot:nav-link-1-url}}">{{slot:nav-link-1-label}}</a>
      <a class="lp-header-minimal-split__nav-link" href="{{slot:nav-link-2-url}}">{{slot:nav-link-2-label}}</a>
      <a class="lp-header-minimal-split__nav-link" href="{{slot:nav-link-3-url}}">{{slot:nav-link-3-label}}</a>
      <a class="lp-header-minimal-split__nav-link" href="{{slot:nav-link-4-url}}">{{slot:nav-link-4-label}}</a>
    </nav>

    <div class="lp-header-minimal-split__actions">
      <a class="lp-header-minimal-split__contact" href="{{slot:contact-link}}">
        <span class="lp-header-minimal-split__contact-label">{{slot:contact-label}}</span>
        <span class="lp-header-minimal-split__contact-value">{{slot:contact-value}}</span>
      </a>
      <a class="lp-header-minimal-split__cta" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
    </div>
  </div>
</header>
