<style>.lp-header-minimal-split {
  background: var(--lp-bg);
  border-bottom: 1px solid var(--lp-border);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
}

.lp-header-minimal-split__inner {
  display: grid;
  gap: var(--lp-spacing-sm);
  align-items: center;
  max-width: 1280px;
  margin: 0 auto;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
}

.lp-header-minimal-split__brand {
  display: inline-flex;
  align-items: center;
  gap: var(--lp-spacing-sm);
  color: var(--lp-text);
  text-decoration: none;
  min-width: 0;
}

.lp-header-minimal-split__logo {
  width: 2.25rem;
  height: 2.25rem;
  object-fit: contain;
  border-radius: var(--lp-radius);
  background: var(--lp-bg-alt);
}

.lp-header-minimal-split__brand-text {
  font-family: var(--lp-font-display);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.lp-header-minimal-split__nav {
  display: flex;
  align-items: center;
  gap: var(--lp-spacing-sm);
  overflow-x: auto;
  padding: var(--lp-spacing-xs) 0;
}

.lp-header-minimal-split__nav-link {
  color: var(--lp-text-muted);
  font-size: 0.9375rem;
  line-height: 1.3;
  text-decoration: none;
  white-space: nowrap;
}

.lp-header-minimal-split__nav-link:hover,
.lp-header-minimal-split__nav-link:focus-visible {
  color: var(--lp-primary);
}

.lp-header-minimal-split__actions {
  display: flex;
  align-items: center;
  gap: var(--lp-spacing-xs);
  flex-wrap: wrap;
}

.lp-header-minimal-split__contact {
  display: grid;
  gap: 0.125rem;
  color: var(--lp-text);
  text-decoration: none;
  min-width: 0;
  margin-right: var(--lp-spacing-xs);
}

.lp-header-minimal-split__contact-label {
  color: var(--lp-text-muted);
  font-size: 0.75rem;
  line-height: 1.2;
}

.lp-header-minimal-split__contact-value {
  color: var(--lp-text);
  font-size: 0.9375rem;
  font-weight: 700;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.lp-header-minimal-split__icon-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  color: var(--lp-text);
  background: var(--lp-bg-alt);
  text-decoration: none;
}

.lp-header-minimal-split__icon-link:hover,
.lp-header-minimal-split__icon-link:focus-visible {
  border-color: var(--lp-primary);
  color: var(--lp-primary);
}

.lp-header-minimal-split__icon {
  width: 1rem;
  height: 1rem;
  border: 2px solid currentColor;
  border-radius: 50%;
  position: relative;
}

.lp-header-minimal-split__icon::after {
  content: "";
  position: absolute;
  width: 0.45rem;
  height: 2px;
  right: -0.35rem;
  bottom: -0.2rem;
  background: currentColor;
  transform: rotate(45deg);
  border-radius: var(--lp-radius);
}

.lp-header-minimal-split__icon--alt {
  border-radius: var(--lp-radius);
}

.lp-header-minimal-split__icon--alt::after {
  width: 0.35rem;
  height: 0.35rem;
  right: -0.15rem;
  bottom: -0.15rem;
  border-radius: 50%;
}

.lp-header-minimal-split__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 2.25rem;
  padding: 0 var(--lp-spacing-sm);
  border-radius: var(--lp-radius);
  background: var(--lp-primary);
  color: var(--lp-bg);
  font-size: 0.9375rem;
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
  text-align: center;
}

.lp-header-minimal-split__button:hover,
.lp-header-minimal-split__button:focus-visible {
  background: var(--lp-accent);
  color: var(--lp-text);
}

@media (min-width: 768px) {
  .lp-header-minimal-split__inner {
    grid-template-columns: minmax(10rem, 1fr) auto minmax(16rem, 1fr);
    gap: var(--lp-spacing-md);
    padding: var(--lp-spacing-sm) var(--lp-spacing-xl);
  }

  .lp-header-minimal-split__nav {
    justify-content: center;
    overflow: visible;
  }

  .lp-header-minimal-split__actions {
    justify-content: flex-end;
    flex-wrap: nowrap;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<header class="lp-header-minimal-split">
  <div class="lp-header-minimal-split__inner">
    <a class="lp-header-minimal-split__brand" href="{{slot:brand-link}}" aria-label="{{slot:brand-aria-label}}">
      <img class="lp-header-minimal-split__logo" src="{{slot:logo-image}}" alt="{{slot:logo-image-alt}}" loading="lazy">
      <span class="lp-header-minimal-split__brand-text">{{slot:brand-name}}</span>
    </a>

    <nav class="lp-header-minimal-split__nav" aria-label="{{slot:navigation-aria-label}}">
      <a class="lp-header-minimal-split__nav-link" href="{{slot:nav-link-1-url}}">{{slot:nav-link-1-label}}</a>
      <a class="lp-header-minimal-split__nav-link" href="{{slot:nav-link-2-url}}">{{slot:nav-link-2-label}}</a>
      <a class="lp-header-minimal-split__nav-link" href="{{slot:nav-link-3-url}}">{{slot:nav-link-3-label}}</a>
      <a class="lp-header-minimal-split__nav-link" href="{{slot:nav-link-4-url}}">{{slot:nav-link-4-label}}</a>
    </nav>

    <div class="lp-header-minimal-split__actions">
      <a class="lp-header-minimal-split__contact" href="{{slot:contact-link}}">
        <span class="lp-header-minimal-split__contact-label">{{slot:contact-label}}</span>
        <span class="lp-header-minimal-split__contact-value">{{slot:contact-value}}</span>
      </a>

      <a class="lp-header-minimal-split__icon-link" href="{{slot:action-1-url}}" aria-label="{{slot:action-1-aria-label}}">
        <span class="lp-header-minimal-split__icon" aria-hidden="true"></span>
      </a>

      <a class="lp-header-minimal-split__icon-link" href="{{slot:action-2-url}}" aria-label="{{slot:action-2-aria-label}}">
        <span class="lp-header-minimal-split__icon lp-header-minimal-split__icon--alt" aria-hidden="true"></span>
      </a>

      <a class="lp-header-minimal-split__button" href="{{slot:cta-url}}">{{slot:cta-label}}</a>
    </div>
  </div>
</header>
