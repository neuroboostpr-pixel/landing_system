<header class="lp-header-luxury-split" aria-label="{{slot:header-aria-label}}">
  <div class="lp-header-luxury-split__inner">
    <a class="lp-header-luxury-split__brand" href="{{slot:brand-link}}" aria-label="{{slot:brand-aria-label}}">
      <span class="lp-header-luxury-split__brand-mark" aria-hidden="true"></span>
      <span class="lp-header-luxury-split__brand-text">{{slot:brand-name}}</span>
    </a>

    <nav class="lp-header-luxury-split__nav" aria-label="{{slot:navigation-aria-label}}">
      <a class="lp-header-luxury-split__link" href="{{slot:nav-link-1}}">{{slot:nav-label-1}}</a>
      <a class="lp-header-luxury-split__link" href="{{slot:nav-link-2}}">{{slot:nav-label-2}}</a>
      <a class="lp-header-luxury-split__link" href="{{slot:nav-link-3}}">{{slot:nav-label-3}}</a>
      <a class="lp-header-luxury-split__link" href="{{slot:nav-link-4}}">{{slot:nav-label-4}}</a>
    </nav>

    <div class="lp-header-luxury-split__actions">
      <a class="lp-header-luxury-split__contact" href="{{slot:contact-link}}">{{slot:contact-label}}</a>
      <a class="lp-header-luxury-split__cta" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
    </div>
  </div>
</header>
