<header class="lp-header-playful-split" aria-label="{{slot:header-aria-label}}">
  <div class="lp-header-playful-split__inner">
    <a class="lp-header-playful-split__brand" href="{{slot:brand-link}}" aria-label="{{slot:brand-aria-label}}">
      <img class="lp-header-playful-split__logo" src="{{slot:brand-logo}}" alt="{{slot:brand-logo-alt}}" loading="lazy">
      <span class="lp-header-playful-split__brand-text">{{slot:brand-name}}</span>
    </a>

    <nav class="lp-header-playful-split__nav" aria-label="{{slot:nav-aria-label}}">
      <a class="lp-header-playful-split__nav-link" href="{{slot:nav-link-1-url}}">{{slot:nav-link-1-label}}</a>
      <a class="lp-header-playful-split__nav-link" href="{{slot:nav-link-2-url}}">{{slot:nav-link-2-label}}</a>
      <a class="lp-header-playful-split__nav-link" href="{{slot:nav-link-3-url}}">{{slot:nav-link-3-label}}</a>
      <a class="lp-header-playful-split__nav-link" href="{{slot:nav-link-4-url}}">{{slot:nav-link-4-label}}</a>
    </nav>

    <div class="lp-header-playful-split__actions">
      <a class="lp-header-playful-split__contact" href="{{slot:contact-link}}">{{slot:contact-label}}</a>
      <a class="lp-header-playful-split__cta" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
    </div>
  </div>
</header>
