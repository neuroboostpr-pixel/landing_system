<style>.lp-header-corporate-split {
  background: var(--lp-bg);
  border-bottom: 1px solid var(--lp-border);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
}

.lp-header-corporate-split__inner {
  display: grid;
  grid-template-columns: auto auto;
  align-items: center;
  gap: var(--lp-spacing-md);
  width: min(100% - var(--lp-spacing-md), 1280px);
  margin: 0 auto;
  padding: var(--lp-spacing-sm) 0;
}

.lp-header-corporate-split__brand {
  display: inline-flex;
  align-items: center;
  justify-self: start;
  color: var(--lp-text);
  text-decoration: none;
}

.lp-header-corporate-split__brand--center {
  display: none;
}

.lp-header-corporate-split__logo {
  display: block;
  width: auto;
  max-width: 9rem;
  height: 2.25rem;
  object-fit: contain;
}

.lp-header-corporate-split__nav {
  display: none;
}

.lp-header-corporate-split__actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--lp-spacing-sm);
}

.lp-header-corporate-split__phone {
  display: none;
  color: var(--lp-text-muted);
  font-size: 0.9375rem;
  line-height: 1.4;
  text-decoration: none;
}

.lp-header-corporate-split__cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 2.75rem;
  padding: var(--lp-spacing-xs) var(--lp-spacing-md);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  background: var(--lp-bg-alt);
  color: var(--lp-primary);
  font-family: var(--lp-font-body);
  font-size: 0.9375rem;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
}

.lp-header-corporate-split__link {
  color: var(--lp-text);
  font-size: 0.9375rem;
  line-height: 1.4;
  text-decoration: none;
}

.lp-header-corporate-split__link:focus-visible,
.lp-header-corporate-split__phone:focus-visible,
.lp-header-corporate-split__cta:focus-visible,
.lp-header-corporate-split__brand:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 3px;
}

@media (min-width: 768px) {
  .lp-header-corporate-split__inner {
    grid-template-columns: 1fr auto;
    gap: var(--lp-spacing-lg);
    padding: var(--lp-spacing-md) 0;
  }

  .lp-header-corporate-split__inner > .lp-header-corporate-split__brand {
    display: none;
  }

  .lp-header-corporate-split__nav {
    display: grid;
    grid-template-columns: repeat(2, auto) auto repeat(2, auto);
    align-items: center;
    gap: var(--lp-spacing-lg);
  }

  .lp-header-corporate-split__brand--center {
    display: inline-flex;
    justify-self: center;
    margin: 0 var(--lp-spacing-md);
  }

  .lp-header-corporate-split__logo {
    max-width: 10rem;
    height: 2.5rem;
  }

  .lp-header-corporate-split__phone {
    display: inline-flex;
  }

  .lp-header-corporate-split__cta {
    min-height: 2.875rem;
    padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  }
}
</style>
<header class="lp-header-corporate-split">
  <div class="lp-header-corporate-split__inner">
    <a class="lp-header-corporate-split__brand" href="{{slot:brand-link}}" aria-label="{{slot:brand-aria-label}}">
      <img class="lp-header-corporate-split__logo" src="{{slot:brand-logo}}" alt="{{slot:brand-logo-alt}}" loading="lazy">
    </a>

    <nav class="lp-header-corporate-split__nav" aria-label="{{slot:navigation-aria-label}}">
      <a class="lp-header-corporate-split__link" href="{{slot:nav-link-1}}">{{slot:nav-label-1}}</a>
      <a class="lp-header-corporate-split__link" href="{{slot:nav-link-2}}">{{slot:nav-label-2}}</a>

      <a class="lp-header-corporate-split__brand lp-header-corporate-split__brand--center" href="{{slot:brand-link}}" aria-label="{{slot:brand-aria-label}}">
        <img class="lp-header-corporate-split__logo" src="{{slot:brand-logo}}" alt="{{slot:brand-logo-alt}}" loading="lazy">
      </a>

      <a class="lp-header-corporate-split__link" href="{{slot:nav-link-3}}">{{slot:nav-label-3}}</a>
      <a class="lp-header-corporate-split__link" href="{{slot:nav-link-4}}">{{slot:nav-label-4}}</a>
    </nav>

    <div class="lp-header-corporate-split__actions">
      <a class="lp-header-corporate-split__phone" href="{{slot:phone-link}}">{{slot:phone-label}}</a>
      <a class="lp-header-corporate-split__cta" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
    </div>
  </div>
</header>
