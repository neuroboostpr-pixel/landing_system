<header class="lp-header-corporate-split">
  <div class="lp-header-corporate-split__inner">
    <a class="lp-header-corporate-split__brand" href="{{slot:brand-link}}" aria-label="{{slot:brand-aria-label}}">
      <img class="lp-header-corporate-split__logo" src="{{slot:brand-logo}}" alt="{{slot:brand-logo-alt}}" loading="lazy">
    </a>

    <nav class="lp-header-corporate-split__nav" aria-label="{{slot:navigation-aria-label}}">
      <a class="lp-header-corporate-split__link" href="{{slot:nav-link-1}}">{{slot:nav-label-1}}</a>
      <a class="lp-header-corporate-split__link" href="{{slot:nav-link-2}}">{{slot:nav-label-2}}</a>

      <a class="lp-header-corporate-split__brand lp-header-corporate-split__brand--center" href="{{slot:brand-link}}" aria-label="{{slot:brand-aria-label}}">
        <img class="lp-header-corporate-split__logo" src="{{slot:brand-logo}}" alt="{{slot:brand-logo-alt}}" loading="lazy">
      </a>

      <a class="lp-header-corporate-split__link" href="{{slot:nav-link-3}}">{{slot:nav-label-3}}</a>
      <a class="lp-header-corporate-split__link" href="{{slot:nav-link-4}}">{{slot:nav-label-4}}</a>
    </nav>

    <div class="lp-header-corporate-split__actions">
      <a class="lp-header-corporate-split__phone" href="{{slot:phone-link}}">{{slot:phone-label}}</a>
      <a class="lp-header-corporate-split__cta" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
    </div>
  </div>
</header>
