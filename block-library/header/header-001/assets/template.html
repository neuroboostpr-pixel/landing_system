<style>.lp-header-cinematic-split {
  font-family: var(--lp-font-body);
  color: var(--lp-text);
  background: var(--lp-bg);
  border-bottom: 1px solid var(--lp-border);
}

.lp-header-cinematic-split__inner {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--lp-spacing-md);
  width: min(100%, 1280px);
  margin: 0 auto;
  padding: var(--lp-spacing-sm) var(--lp-spacing-md);
}

.lp-header-cinematic-split__brand {
  display: inline-flex;
  align-items: center;
  gap: var(--lp-spacing-sm);
  min-width: 0;
  color: var(--lp-text);
  text-decoration: none;
}

.lp-header-cinematic-split__logo-mark {
  width: 2rem;
  height: 2rem;
  flex: 0 0 auto;
  border: 1px solid var(--lp-accent);
  border-radius: var(--lp-radius);
  background: var(--lp-bg-alt);
  box-shadow: inset 0 0 0 0.35rem var(--lp-bg);
}

.lp-header-cinematic-split__brand-text {
  overflow: hidden;
  font-family: var(--lp-font-display);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.lp-header-cinematic-split__nav {
  display: none;
}

.lp-header-cinematic-split__nav a {
  color: var(--lp-text-muted);
  font-size: 0.9rem;
  line-height: 1.2;
  text-decoration: none;
}

.lp-header-cinematic-split__nav a:hover,
.lp-header-cinematic-split__nav a:focus-visible {
  color: var(--lp-accent);
}

.lp-header-cinematic-split__actions {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--lp-spacing-sm);
  min-width: 0;
}

.lp-header-cinematic-split__contact {
  display: none;
  color: var(--lp-text);
  text-align: right;
  text-decoration: none;
}

.lp-header-cinematic-split__contact span {
  display: block;
  color: var(--lp-text-muted);
  font-size: 0.75rem;
  line-height: 1.1;
}

.lp-header-cinematic-split__contact strong {
  display: block;
  margin-top: var(--lp-spacing-xs);
  color: var(--lp-text);
  font-size: 0.95rem;
  line-height: 1.1;
}

.lp-header-cinematic-split__socials {
  display: inline-flex;
  align-items: center;
  gap: var(--lp-spacing-xs);
}

.lp-header-cinematic-split__icon-link {
  display: inline-grid;
  width: 2.25rem;
  height: 2.25rem;
  place-items: center;
  color: var(--lp-text);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg-alt);
  text-decoration: none;
}

.lp-header-cinematic-split__icon-link:hover,
.lp-header-cinematic-split__icon-link:focus-visible {
  color: var(--lp-accent);
  border-color: var(--lp-accent);
}

.lp-header-cinematic-split__icon-link svg {
  width: 1.1rem;
  height: 1.1rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

@media (min-width: 768px) {
  .lp-header-cinematic-split__inner {
    grid-template-columns: auto 1fr auto;
    gap: var(--lp-spacing-lg);
    padding: var(--lp-spacing-sm) var(--lp-spacing-xl);
  }

  .lp-header-cinematic-split__nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--lp-spacing-lg);
    min-width: 0;
  }

  .lp-header-cinematic-split__contact {
    display: block;
  }
}
</style>
<header class="lp-header-cinematic-split" aria-label="{{slot:header-aria-label}}">
  <div class="lp-header-cinematic-split__inner">
    <a class="lp-header-cinematic-split__brand" href="{{slot:brand-link}}" aria-label="{{slot:brand-aria-label}}">
      <span class="lp-header-cinematic-split__logo-mark" aria-hidden="true"></span>
      <span class="lp-header-cinematic-split__brand-text">{{slot:brand-name}}</span>
    </a>

    <nav class="lp-header-cinematic-split__nav" aria-label="{{slot:nav-aria-label}}">
      <a href="{{slot:nav-link-1}}">{{slot:nav-label-1}}</a>
      <a href="{{slot:nav-link-2}}">{{slot:nav-label-2}}</a>
      <a href="{{slot:nav-link-3}}">{{slot:nav-label-3}}</a>
      <a href="{{slot:nav-link-4}}">{{slot:nav-label-4}}</a>
    </nav>

    <div class="lp-header-cinematic-split__actions">
      <a class="lp-header-cinematic-split__contact" href="{{slot:contact-link}}">
        <span>{{slot:contact-caption}}</span>
        <strong>{{slot:contact-value}}</strong>
      </a>

      <div class="lp-header-cinematic-split__socials" aria-label="{{slot:socials-aria-label}}">
        <a class="lp-header-cinematic-split__icon-link" href="{{slot:social-link-1}}" aria-label="{{slot:social-label-1}}">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 6.5h16v11H4z"></path>
            <path d="m5 7 7 6 7-6"></path>
          </svg>
        </a>
        <a class="lp-header-cinematic-split__icon-link" href="{{slot:social-link-2}}" aria-label="{{slot:social-label-2}}">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"></path>
            <path d="M8.5 12.5 11 15l4.5-6"></path>
          </svg>
        </a>
      </div>
    </div>
  </div>
</header>
