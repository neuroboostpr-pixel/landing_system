<section class="lp-faq-minimal-stacked" aria-labelledby="lp-faq-minimal-stacked-title">
  <div class="lp-faq-minimal-stacked__inner">
    <div class="lp-faq-minimal-stacked__header">
      <p class="lp-faq-minimal-stacked__eyebrow">{{slot:faq-eyebrow}}</p>
      <h2 class="lp-faq-minimal-stacked__title" id="lp-faq-minimal-stacked-title">{{slot:faq-title}}</h2>
      <p class="lp-faq-minimal-stacked__subhead">{{slot:faq-subhead}}</p>
    </div>

    <div class="lp-faq-minimal-stacked__list">
      <details class="lp-faq-minimal-stacked__item">
        <summary class="lp-faq-minimal-stacked__question">
          <span>{{slot:faq-question-1}}</span>
          <span class="lp-faq-minimal-stacked__icon" aria-hidden="true"></span>
        </summary>
        <div class="lp-faq-minimal-stacked__answer">
          <p>{{slot:faq-answer-1}}</p>
        </div>
      </details>

      <details class="lp-faq-minimal-stacked__item">
        <summary class="lp-faq-minimal-stacked__question">
          <span>{{slot:faq-question-2}}</span>
          <span class="lp-faq-minimal-stacked__icon" aria-hidden="true"></span>
        </summary>
        <div class="lp-faq-minimal-stacked__answer">
          <p>{{slot:faq-answer-2}}</p>
        </div>
      </details>

      <details class="lp-faq-minimal-stacked__item">
        <summary class="lp-faq-minimal-stacked__question">
          <span>{{slot:faq-question-3}}</span>
          <span class="lp-faq-minimal-stacked__icon" aria-hidden="true"></span>
        </summary>
        <div class="lp-faq-minimal-stacked__answer">
          <p>{{slot:faq-answer-3}}</p>
        </div>
      </details>

      <details class="lp-faq-minimal-stacked__item">
        <summary class="lp-faq-minimal-stacked__question">
          <span>{{slot:faq-question-4}}</span>
          <span class="lp-faq-minimal-stacked__icon" aria-hidden="true"></span>
        </summary>
        <div class="lp-faq-minimal-stacked__answer">
          <p>{{slot:faq-answer-4}}</p>
        </div>
      </details>
    </div>
  </div>
</section>
