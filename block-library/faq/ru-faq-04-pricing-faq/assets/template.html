<style>
  :root { --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0; --lp-text-muted: #999; --font-body:system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--lp-bg); color:var(--lp-text); }
  .faq-section { padding:80px 0; }
  .wrap { max-width:800px; margin:0 auto; padding:0 32px; }
  .faq-head { margin-bottom:40px; }
  .faq-label { font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--lp-text-muted); margin-bottom:12px; font-weight:500; }
  .faq-head h2 { font-size:clamp(24px,3vw,36px); font-weight:700; letter-spacing:-0.02em; }
  .faq-item { border-top:1px solid var(--lp-border); padding:22px 0; }
  .faq-item:last-child { border-bottom:1px solid var(--lp-border); }
  .faq-q { font-size:16px; font-weight:600; margin-bottom:10px; color:var(--lp-text); }
  .faq-a { font-size:14.5px; line-height:1.65; color:var(--lp-text-muted); }
  .faq-a a { color:var(--lp-accent); }
</style>
<section class="faq-section" data-block-id="ru-faq-04-pricing-faq">
<div class="wrap">
<div class="faq-head">
<div class="faq-label">{{slot:section-label}}</div>
<h2>{{slot:headline}}</h2>
</div>
<div class="faq-item">
<div class="faq-q">{{slot:q-1}}</div>
<div class="faq-a">{{slot:a-1}}</div>
</div>
<div class="faq-item">
<div class="faq-q">{{slot:q-2}}</div>
<div class="faq-a">{{slot:a-2}}</div>
</div>
<div class="faq-item">
<div class="faq-q">{{slot:q-3}}</div>
<div class="faq-a">{{slot:a-3}}</div>
</div>
<div class="faq-item">
<div class="faq-q">{{slot:q-4}}</div>
<div class="faq-a">{{slot:a-4}}</div>
</div>
<div class="faq-item">
<div class="faq-q">{{slot:q-5}}</div>
<div class="faq-a">{{slot:a-5}}</div>
</div>
</div>
</section>
