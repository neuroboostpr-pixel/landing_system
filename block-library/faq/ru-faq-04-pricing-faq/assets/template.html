<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/pricing-page/example.html | License: Apache-2.0 -->
<html lang="ru"><head><meta charset="UTF-8"><title>ru-faq-04-pricing-faq — desktop</title>
<style>
  :root { --color-bg:#ffffff; --color-fg:#111110; --color-accent:#2563eb; --color-border:#e5e7eb; --color-muted:#6b7280; --font-body:system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); }
  .faq-section { padding:80px 0; }
  .wrap { max-width:800px; margin:0 auto; padding:0 32px; }
  .faq-head { margin-bottom:40px; }
  .faq-label { font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--color-muted); margin-bottom:12px; font-weight:500; }
  .faq-head h2 { font-size:clamp(24px,3vw,36px); font-weight:700; letter-spacing:-0.02em; }
  .faq-item { border-top:1px solid var(--color-border); padding:22px 0; }
  .faq-item:last-child { border-bottom:1px solid var(--color-border); }
  .faq-q { font-size:16px; font-weight:600; margin-bottom:10px; color:var(--color-fg); }
  .faq-a { font-size:14.5px; line-height:1.65; color:var(--color-muted); }
  .faq-a a { color:var(--color-accent); }
</style></head>
<body>
  <section class="faq-section" data-block-id="ru-faq-04-pricing-faq">
    <div class="wrap">
      <div class="faq-head">
        <div class="faq-label" data-slot="section-label">[Вопросы и ответы]</div>
        <h2 data-slot="headline">[Часто задаваемые вопросы]</h2>
      </div>
      <div class="faq-item">
        <div class="faq-q" data-slot="q-1">[Вопрос 1]</div>
        <div class="faq-a" data-slot="a-1">[Подробный ответ на первый вопрос. Используйте конкретные факты и числа.]</div>
      </div>
      <div class="faq-item">
        <div class="faq-q" data-slot="q-2">[Вопрос 2]</div>
        <div class="faq-a" data-slot="a-2">[Ответ 2]</div>
      </div>
      <div class="faq-item">
        <div class="faq-q" data-slot="q-3">[Вопрос 3]</div>
        <div class="faq-a" data-slot="a-3">[Ответ 3]</div>
      </div>
      <div class="faq-item">
        <div class="faq-q" data-slot="q-4">[Вопрос 4]</div>
        <div class="faq-a" data-slot="a-4">[Ответ 4]</div>
      </div>
      <div class="faq-item">
        <div class="faq-q" data-slot="q-5">[Вопрос 5]</div>
        <div class="faq-a" data-slot="a-5">[Ответ 5]</div>
      </div>
    </div>
  </section>
</body></html>
