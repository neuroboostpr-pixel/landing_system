<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-faq-02-why-us — mobile</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .faq { padding: 40px 16px; }
  .section-headline { font-family: var(--font-display); font-size: 24px; text-align: center; margin: 0 0 6px; }
  .section-sub { text-align: center; color: #666; font-size: 14px; margin: 0 0 32px; }
  details { border-bottom: 1px solid var(--color-border); }
  details:first-of-type { border-top: 1px solid var(--color-border); }
  summary {
    padding: 16px 0; font-weight: 600; font-size: 15px; cursor: pointer;
    list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 20px; color: var(--color-accent); flex-shrink: 0; }
  details[open] summary::after { content: "−"; }
  .faq-answer { padding: 0 0 16px; font-size: 14px; color: #444; line-height: 1.6; }
</style>
</head>
<body>
  <section class="faq" data-block-id="ru-faq-02-why-us">
    <h2 class="section-headline" data-slot="headline">[Почему именно мы?]</h2>
    <p class="section-sub">С цифрами и фактами</p>
    <details>
      <summary data-slot="faq-1-q">[Вопрос 1]</summary>
      <div class="faq-answer" data-slot="faq-1-a">[Ответ 1]</div>
    </details>
    <details>
      <summary data-slot="faq-2-q">[Вопрос 2]</summary>
      <div class="faq-answer" data-slot="faq-2-a">[Ответ 2]</div>
    </details>
    <details>
      <summary data-slot="faq-3-q">[Вопрос 3]</summary>
      <div class="faq-answer" data-slot="faq-3-a">[Ответ 3]</div>
    </details>
    <details>
      <summary data-slot="faq-4-q">[Вопрос 4]</summary>
      <div class="faq-answer" data-slot="faq-4-a">[Ответ 4]</div>
    </details>
    <details>
      <summary data-slot="faq-5-q">[Вопрос 5]</summary>
      <div class="faq-answer" data-slot="faq-5-a">[Ответ 5]</div>
    </details>
  </section>
</body>
</html>
