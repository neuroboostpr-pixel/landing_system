<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-faq-01-accordion — desktop</title>
<style>
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .faq { padding: 64px var(--spacing-lg); max-width: 800px; margin: 0 auto; }
  .section-headline { font-family: var(--font-display); font-size: 36px; text-align: center; margin: 0 0 48px; }
  details { border-bottom: 1px solid var(--color-border); }
  details:first-of-type { border-top: 1px solid var(--color-border); }
  summary { padding: 20px 0; font-weight: 600; font-size: 17px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 22px; color: var(--color-accent); flex-shrink: 0; }
  details[open] summary::after { content: "−"; }
  .faq-answer { padding: 0 0 20px; font-size: 15px; color: #444; line-height: 1.7; }
</style>
</head>
<body>
  <section class="faq" data-block-id="ru-faq-01-accordion">
    <h2 class="section-headline" data-slot="headline">[HEADLINE: частые вопросы]</h2>
    <details>
      <summary data-slot="faq-1-q">[Вопрос 1 — самое частое возражение]</summary>
      <div class="faq-answer" data-slot="faq-1-a">[Ответ на вопрос 1 — честно и конкретно]</div>
    </details>
    <details>
      <summary data-slot="faq-2-q">[Вопрос 2]</summary>
      <div class="faq-answer" data-slot="faq-2-a">[Ответ на вопрос 2]</div>
    </details>
    <details>
      <summary data-slot="faq-3-q">[Вопрос 3]</summary>
      <div class="faq-answer" data-slot="faq-3-a">[Ответ на вопрос 3]</div>
    </details>
    <details>
      <summary data-slot="faq-4-q">[Вопрос 4]</summary>
      <div class="faq-answer" data-slot="faq-4-a">[Ответ на вопрос 4]</div>
    </details>
    <details>
      <summary data-slot="faq-5-q">[Вопрос 5]</summary>
      <div class="faq-answer" data-slot="faq-5-a">[Ответ на вопрос 5]</div>
    </details>
    <details>
      <summary data-slot="faq-6-q">[Вопрос 6]</summary>
      <div class="faq-answer" data-slot="faq-6-a">[Ответ на вопрос 6]</div>
    </details>
  </section>
</body>
</html>
