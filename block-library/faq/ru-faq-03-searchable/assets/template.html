<!DOCTYPE html>
<!-- Source: /tmp/open-design/skills/faq-page/example.html (Apache-2.0, adapted for RU block-library schema) -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-faq-03-searchable — desktop</title>
<style>
  :root {
    --color-bg: #fafafa;
    --color-fg: #1a1a1a;
    --color-accent: #0066ff;
    --color-border: #e0e0e0;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .faq-wrap { max-width: 800px; margin: 0 auto; padding: 60px 24px 80px; }
  .faq-header { text-align: center; margin-bottom: 40px; }
  .faq-header h2 { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; margin-bottom: 10px; }
  .faq-header p { color: #666; font-size: 1.1rem; }
  .search-box { position: relative; margin-bottom: 28px; }
  .search-box input { width: 100%; padding: 14px 46px 14px 18px; font-size: 1rem; border: 2px solid var(--color-border); border-radius: 10px; background: #fff; outline: none; transition: border-color .2s; }
  .search-box input:focus { border-color: var(--color-accent); }
  .search-box svg { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #999; }
  .faq-cats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 36px; }
  .faq-cat { padding: 9px 18px; border: 2px solid var(--color-border); border-radius: 22px; background: #fff; font-size: .9rem; font-weight: 500; cursor: pointer; transition: all .2s; }
  .faq-cat.active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .faq-list { display: flex; flex-direction: column; gap: 14px; }
  .faq-item { background: #fff; border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; }
  .faq-question { width: 100%; padding: 18px 22px; text-align: left; font-size: 1rem; font-weight: 600; background: none; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  .faq-icon { flex-shrink: 0; width: 20px; height: 20px; transition: transform .3s; }
  .faq-item.open .faq-icon { transform: rotate(180deg); }
  .faq-answer { max-height: 0; overflow: hidden; transition: max-height .3s ease-out; }
  .faq-item.open .faq-answer { max-height: 400px; }
  .faq-answer-content { padding: 0 22px 18px; color: #555; font-size: .95rem; line-height: 1.7; }
  .footer-cta-block { margin-top: 56px; padding: 28px; background: #fff; border: 1px solid var(--color-border); border-radius: 12px; text-align: center; }
  .footer-cta-block h3 { font-size: 1.4rem; margin-bottom: 10px; }
  .footer-cta-block p { color: #666; margin-bottom: 18px; }
  .cta-btn { display: inline-block; padding: 12px 30px; background: var(--color-accent); color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
</style>
</head>
<body>
  <section class="faq-wrap" data-block-id="ru-faq-03-searchable">
    <header class="faq-header">
      <h2 data-slot="headline">[HEADLINE: частые вопросы]</h2>
      <p data-slot="subhead">[SUBHEAD: найдите ответ на свой вопрос]</p>
    </header>
    <div class="search-box">
      <input type="text" id="faqSearch" placeholder="Поиск по вопросам..." aria-label="Поиск FAQ">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM18 18l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div class="faq-cats">
      <button class="faq-cat active" data-cat="all">Все</button>
      <button class="faq-cat" data-cat="cat1" data-slot="faq-cat-1">[Категория 1]</button>
      <button class="faq-cat" data-cat="cat2" data-slot="faq-cat-2">[Категория 2]</button>
      <button class="faq-cat" data-cat="cat3" data-slot="faq-cat-3">[Категория 3]</button>
    </div>
    <div class="faq-list" id="faqList">
      <div class="faq-item" data-cat="cat1">
        <button class="faq-question">
          <span data-slot="faq-1-q">[Вопрос 1 — главное возражение]</span>
          <svg class="faq-icon" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="faq-answer"><div class="faq-answer-content" data-slot="faq-1-a">[Ответ 1 — честный и конкретный]</div></div>
      </div>
      <div class="faq-item" data-cat="cat1">
        <button class="faq-question">
          <span data-slot="faq-2-q">[Вопрос 2]</span>
          <svg class="faq-icon" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="faq-answer"><div class="faq-answer-content" data-slot="faq-2-a">[Ответ 2]</div></div>
      </div>
      <div class="faq-item" data-cat="cat2">
        <button class="faq-question">
          <span data-slot="faq-3-q">[Вопрос 3]</span>
          <svg class="faq-icon" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="faq-answer"><div class="faq-answer-content" data-slot="faq-3-a">[Ответ 3]</div></div>
      </div>
    </div>
    <div class="footer-cta-block">
      <h3>Не нашли ответ?</h3>
      <p>Наш менеджер ответит в течение часа.</p>
      <a class="cta-btn" data-slot="footer-cta" href="#contact">[CTA: Задать вопрос]</a>
    </div>
  </section>
  <script>
    const items = document.querySelectorAll('.faq-item');
    items.forEach(item => {
      item.querySelector('.faq-question').addEventListener('click', () => {
        item.classList.toggle('open');
      });
    });
    const search = document.getElementById('faqSearch');
    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(q) ? '' : 'none';
      });
    });
    document.querySelectorAll('.faq-cat').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.faq-cat').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.cat;
        items.forEach(item => {
          item.style.display = (cat === 'all' || item.dataset.cat === cat) ? '' : 'none';
        });
      });
    });
  </script>
</body>
</html>
