<style>
  :root {
    --color-bg: #fafafa;
    --color-fg: #1a1a1a;
    --color-accent: #0066ff;
    --color-border: #e0e0e0;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .faq-wrap { padding: 40px 16px 64px; }
  .faq-header { text-align: center; margin-bottom: 28px; }
  .faq-header h2 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
  .faq-header p { color: #666; font-size: .95rem; }
  .search-box { margin-bottom: 18px; }
  .search-box input { width: 100%; padding: 12px 16px; font-size: .95rem; border: 2px solid var(--color-border); border-radius: 10px; background: #fff; }
  .faq-cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .faq-cat { padding: 7px 14px; border: 1.5px solid var(--color-border); border-radius: 20px; background: #fff; font-size: .8rem; font-weight: 500; cursor: pointer; }
  .faq-cat.active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .faq-list { display: flex; flex-direction: column; gap: 10px; }
  .faq-item { background: #fff; border: 1px solid var(--color-border); border-radius: 10px; overflow: hidden; }
  .faq-question { width: 100%; padding: 14px 16px; text-align: left; font-size: .9rem; font-weight: 600; background: none; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .faq-icon { flex-shrink: 0; width: 18px; height: 18px; transition: transform .3s; }
  .faq-item.open .faq-icon { transform: rotate(180deg); }
  .faq-answer { max-height: 0; overflow: hidden; transition: max-height .3s ease-out; }
  .faq-item.open .faq-answer { max-height: 400px; }
  .faq-answer-content { padding: 0 16px 14px; color: #555; font-size: .875rem; line-height: 1.65; }
  .footer-cta-block { margin-top: 36px; padding: 20px 16px; background: #fff; border: 1px solid var(--color-border); border-radius: 10px; text-align: center; }
  .footer-cta-block h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .footer-cta-block p { color: #666; font-size: .875rem; margin-bottom: 14px; }
  .cta-btn { display: block; padding: 12px 24px; background: var(--color-accent); color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: .95rem; }
</style>
<section class="faq-wrap" data-block-id="ru-faq-03-searchable">
<header class="faq-header">
<h2>{{slot:headline}}</h2>
<p>{{slot:subhead}}</p>
</header>
<div class="search-box">
<input aria-label="Поиск FAQ" id="faqSearch" placeholder="Поиск..." type="text"/>
</div>
<div class="faq-cats">
<button class="faq-cat active" data-cat="all">Все</button>
<button class="faq-cat" data-cat="cat1">{{slot:faq-cat-1}}</button>
<button class="faq-cat" data-cat="cat2">{{slot:faq-cat-2}}</button>
</div>
<div class="faq-list" id="faqList">
<div class="faq-item" data-cat="cat1">
<button class="faq-question">
<span>{{slot:faq-1-q}}</span>
<svg class="faq-icon" fill="none" viewbox="0 0 20 20"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</button>
<div class="faq-answer"><div class="faq-answer-content">{{slot:faq-1-a}}</div></div>
</div>
<div class="faq-item" data-cat="cat1">
<button class="faq-question">
<span>{{slot:faq-2-q}}</span>
<svg class="faq-icon" fill="none" viewbox="0 0 20 20"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</button>
<div class="faq-answer"><div class="faq-answer-content">{{slot:faq-2-a}}</div></div>
</div>
<div class="faq-item" data-cat="cat2">
<button class="faq-question">
<span>{{slot:faq-3-q}}</span>
<svg class="faq-icon" fill="none" viewbox="0 0 20 20"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></svg>
</button>
<div class="faq-answer"><div class="faq-answer-content">{{slot:faq-3-a}}</div></div>
</div>
</div>
<div class="footer-cta-block">
<h3>Не нашли ответ?</h3>
<p>Ответим в течение часа.</p>
<a class="cta-btn" href="#contact">{{slot:footer-cta}}</a>
</div>
</section>
<script>
    document.querySelectorAll('.faq-question').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('.faq-item').classList.toggle('open'));
    });
  </script>
