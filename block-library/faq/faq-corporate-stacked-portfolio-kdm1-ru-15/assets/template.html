<style>.lp-faq-corporate-stacked {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-faq-corporate-stacked__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  max-width: 960px;
  margin: 0 auto;
}

.lp-faq-corporate-stacked__header {
  display: grid;
  gap: var(--lp-spacing-sm);
}

.lp-faq-corporate-stacked__eyebrow {
  margin: 0;
  color: var(--lp-accent);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.lp-faq-corporate-stacked__title {
  margin: 0;
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 7vw, 4.25rem);
  line-height: 0.95;
  letter-spacing: 0;
}

.lp-faq-corporate-stacked__subhead {
  max-width: 680px;
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.6;
}

.lp-faq-corporate-stacked__list {
  display: grid;
  gap: var(--lp-spacing-sm);
}

.lp-faq-corporate-stacked__item {
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  background: var(--lp-bg-alt);
  overflow: hidden;
}

.lp-faq-corporate-stacked__question {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--lp-spacing-md);
  padding: var(--lp-spacing-md);
  color: var(--lp-text);
  cursor: pointer;
  font-family: var(--lp-font-display);
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.25;
  list-style: none;
}

.lp-faq-corporate-stacked__question::-webkit-details-marker {
  display: none;
}

.lp-faq-corporate-stacked__question::after {
  content: "+";
  display: inline-grid;
  flex: 0 0 auto;
  place-items: center;
  width: 1.75rem;
  height: 1.75rem;
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  color: var(--lp-accent);
  font-family: var(--lp-font-body);
  font-size: 1.25rem;
  line-height: 1;
}

.lp-faq-corporate-stacked__item[open] .lp-faq-corporate-stacked__question::after {
  content: "-";
  color: var(--lp-text);
  background: var(--lp-accent);
  border-color: var(--lp-accent);
}

.lp-faq-corporate-stacked__answer {
  padding: 0 var(--lp-spacing-md) var(--lp-spacing-md);
  color: var(--lp-text-muted);
  font-size: 0.98rem;
  line-height: 1.65;
}

.lp-faq-corporate-stacked__answer p {
  margin: 0;
}

.lp-faq-corporate-stacked__footer {
  display: grid;
  gap: var(--lp-spacing-md);
  align-items: center;
  padding-top: var(--lp-spacing-sm);
}

.lp-faq-corporate-stacked__note {
  margin: 0;
  color: var(--lp-text-muted);
  font-size: 0.95rem;
  line-height: 1.5;
}

.lp-faq-corporate-stacked__cta {
  display: inline-flex;
  width: fit-content;
  align-items: center;
  justify-content: center;
  min-height: 3rem;
  padding: var(--lp-spacing-sm) var(--lp-spacing-lg);
  border-radius: var(--lp-radius);
  background: var(--lp-accent);
  color: var(--lp-bg);
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
}

.lp-faq-corporate-stacked__cta:focus-visible,
.lp-faq-corporate-stacked__question:focus-visible {
  outline: 2px solid var(--lp-accent);
  outline-offset: 3px;
}

@media (min-width: 768px) {
  .lp-faq-corporate-stacked {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-faq-corporate-stacked__inner {
    gap: var(--lp-spacing-xl);
  }

  .lp-faq-corporate-stacked__header {
    max-width: 760px;
  }

  .lp-faq-corporate-stacked__question {
    padding: var(--lp-spacing-lg);
    font-size: 1.18rem;
  }

  .lp-faq-corporate-stacked__answer {
    padding: 0 var(--lp-spacing-lg) var(--lp-spacing-lg);
  }

  .lp-faq-corporate-stacked__footer {
    grid-template-columns: 1fr auto;
  }
}
</style>
<section class="lp-faq-corporate-stacked" aria-labelledby="lp-faq-corporate-stacked-title">
  <div class="lp-faq-corporate-stacked__inner">
    <div class="lp-faq-corporate-stacked__header">
      <p class="lp-faq-corporate-stacked__eyebrow">{{slot:eyebrow}}</p>
      <h2 class="lp-faq-corporate-stacked__title" id="lp-faq-corporate-stacked-title">{{slot:heading}}</h2>
      <p class="lp-faq-corporate-stacked__subhead">{{slot:subhead}}</p>
    </div>

    <div class="lp-faq-corporate-stacked__list">
      <details class="lp-faq-corporate-stacked__item" open>
        <summary class="lp-faq-corporate-stacked__question">{{slot:question-1}}</summary>
        <div class="lp-faq-corporate-stacked__answer">
          <p>{{slot:answer-1}}</p>
        </div>
      </details>

      <details class="lp-faq-corporate-stacked__item">
        <summary class="lp-faq-corporate-stacked__question">{{slot:question-2}}</summary>
        <div class="lp-faq-corporate-stacked__answer">
          <p>{{slot:answer-2}}</p>
        </div>
      </details>

      <details class="lp-faq-corporate-stacked__item">
        <summary class="lp-faq-corporate-stacked__question">{{slot:question-3}}</summary>
        <div class="lp-faq-corporate-stacked__answer">
          <p>{{slot:answer-3}}</p>
        </div>
      </details>

      <details class="lp-faq-corporate-stacked__item">
        <summary class="lp-faq-corporate-stacked__question">{{slot:question-4}}</summary>
        <div class="lp-faq-corporate-stacked__answer">
          <p>{{slot:answer-4}}</p>
        </div>
      </details>
    </div>

    <div class="lp-faq-corporate-stacked__footer">
      <p class="lp-faq-corporate-stacked__note">{{slot:note}}</p>
      <a class="lp-faq-corporate-stacked__cta" href="{{slot:cta-link}}">{{slot:cta-label}}</a>
    </div>
  </div>
</section>
