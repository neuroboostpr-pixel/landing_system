<style>
  :root { --color-bg:#fafaf9; --color-fg:#1c1b1a; --color-border:#e6e4e0; --color-muted:#6b6964; --font-body:system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); width:375px; padding:40px 20px; text-align:center; border-top:1px solid var(--color-border); border-bottom:1px solid var(--color-border); }
  .proof-label { font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--color-muted); margin-bottom:24px; font-weight:500; }
  .logos { display:flex; justify-content:center; align-items:center; gap:24px; flex-wrap:wrap; opacity:0.55; }
  .logo-item { font-size:16px; font-weight:700; letter-spacing:-0.01em; color:var(--color-fg); }
</style>
<section data-block-id="ru-trust-07-partner-logos">
<p class="proof-label">{{slot:section-label}}</p>
<div class="logos">
<span class="logo-item">{{slot:logo-1}}</span>
<span class="logo-item">{{slot:logo-2}}</span>
<span class="logo-item">{{slot:logo-3}}</span>
<span class="logo-item">{{slot:logo-4}}</span>
<span class="logo-item">{{slot:logo-5}}</span>
</div>
</section>
