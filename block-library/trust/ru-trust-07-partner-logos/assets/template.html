<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/saas-landing/example.html | License: Apache-2.0 -->
<html lang="ru"><head><meta charset="UTF-8"><title>ru-trust-07-partner-logos — desktop</title>
<style>
  :root { --color-bg:#fafaf9; --color-fg:#1c1b1a; --color-accent:#c96442; --color-border:#e6e4e0; --color-muted:#6b6964; --font-body:system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); }
  .proof-section { padding:60px 0; text-align:center; border-top:1px solid var(--color-border); border-bottom:1px solid var(--color-border); }
  .wrap { max-width:1080px; margin:0 auto; padding:0 32px; }
  .proof-label { font-size:13px; text-transform:uppercase; letter-spacing:0.1em; color:var(--color-muted); margin-bottom:32px; font-weight:500; }
  .logos { display:flex; justify-content:center; align-items:center; gap:56px; flex-wrap:wrap; opacity:0.55; }
  .logo-item { font-size:18px; font-weight:700; letter-spacing:-0.01em; color:var(--color-fg); white-space:nowrap; }
</style></head>
<body>
  <section class="proof-section" data-block-id="ru-trust-07-partner-logos">
    <div class="wrap">
      <p class="proof-label" data-slot="section-label">[Нам доверяют компании:]</p>
      <div class="logos">
        <span class="logo-item" data-slot="logo-1">[Компания 1]</span>
        <span class="logo-item" data-slot="logo-2">[Компания 2]</span>
        <span class="logo-item" data-slot="logo-3">[Компания 3]</span>
        <span class="logo-item" data-slot="logo-4">[Компания 4]</span>
        <span class="logo-item" data-slot="logo-5">[Компания 5]</span>
      </div>
    </div>
  </section>
</body></html>
