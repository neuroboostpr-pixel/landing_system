<style>
  :root { --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0; --font-display:'Source Serif 4',Charter,Georgia,serif; --font-body:'Source Sans 3',system-ui,sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap');
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-display); background:var(--lp-bg); color:var(--lp-text); }
  .manifesto-section { border-top:1px solid var(--lp-border); border-bottom:1px solid var(--lp-border); padding:56px 0; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 64px; }
  .manifesto-grid { display:grid; grid-template-columns:1fr 1.85fr; gap:56px; align-items:start; }
  .manifesto-label { font-family:var(--font-body); font-size:12px; font-weight:500; letter-spacing:1.2px; text-transform:uppercase; color:var(--lp-text); }
  .manifesto-body { font-family:var(--font-display); font-weight:400; font-size:21px; line-height:1.65; letter-spacing:0.03em; color:var(--lp-text); border-left:2px solid var(--lp-accent); padding:4px 0 4px 24px; }
  .manifesto-body strong { color:var(--lp-text); font-weight:500; }
  .manifesto-sig { margin-top:22px; display:flex; align-items:center; gap:14px; }
  .sig-line { width:40px; height:1px; background:var(--lp-border); }
  .sig-text { font-family:var(--font-body); font-size:12px; letter-spacing:0.8px; text-transform:uppercase; color:var(--lp-text); }
</style>
<section class="manifesto-section" data-block-id="ru-trust-05-manifesto-text">
<div class="wrap">
<div class="manifesto-grid">
<div class="manifesto-label">{{slot:section-label}}</div>
<div>
<p class="manifesto-body">{{slot:manifesto-body}}</p>
<div class="manifesto-sig">
<div class="sig-line"></div>
<span class="sig-text">{{slot:sig-text}}</span>
</div>
</div>
</div>
</div>
</section>
