<style>
  :root { --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0; --font-display:'Source Serif 4',Charter,Georgia,serif; --font-body:'Source Sans 3',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-display); background:var(--lp-bg); color:var(--lp-text); width:375px; padding:36px 20px; }
  .section-label { font-family:var(--font-body); font-size:11px; font-weight:500; letter-spacing:1.2px; text-transform:uppercase; color:var(--lp-text); border-bottom:1px solid var(--lp-border); padding-bottom:14px; margin-bottom:24px; }
  .manifesto-body { font-size:19px; line-height:1.65; color:var(--lp-text); border-left:2px solid var(--lp-accent); padding:4px 0 4px 20px; }
  .manifesto-body strong { color:var(--lp-text); font-weight:500; }
  .sig { margin-top:18px; display:flex; align-items:center; gap:12px; }
  .sig-line { width:30px; height:1px; background:var(--lp-border); }
  .sig-text { font-family:var(--font-body); font-size:11px; letter-spacing:0.8px; text-transform:uppercase; color:var(--lp-text); }
</style>
<section data-block-id="ru-trust-05-manifesto-text" style="border-top:1px solid var(--lp-border);border-bottom:1px solid var(--lp-border);">
<div class="section-label">{{slot:section-label}}</div>
<p class="manifesto-body">{{slot:manifesto-body}}</p>
<div class="sig">
<div class="sig-line"></div>
<span class="sig-text">{{slot:sig-text}}</span>
</div>
</section>
