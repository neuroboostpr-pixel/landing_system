<style>
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --lp-font-display: system-ui, sans-serif;
    --lp-font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--lp-font-body); background: var(--lp-bg); color: var(--lp-text); }

  .trust-numbers {
    padding: var(--spacing-lg) calc(var(--spacing-lg) * 2);
    text-align: center;
  }

  .section-headline {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color:#777;
    margin: 0 0 var(--spacing-lg);
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }

  .stat-cell {
    padding: var(--spacing-lg) var(--spacing-md);
    border-right: 1px solid var(--lp-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .stat-cell:last-child { border-right: none; }

  .stat-number {
    font-family: var(--lp-font-display);
    font-size: 56px;
    font-weight: 900;
    line-height: 1;
    color: var(--lp-text);
    margin: 0;
  }

  .stat-label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color:#666;
    margin: 0;
    line-height: 1.4;
  }
</style>
<section class="trust-numbers" data-block-id="ru-trust-02-numbers-row">
<p class="section-headline">{{slot:headline}}</p>
<div class="stats-row">
<div class="stat-cell">
<p class="stat-number">{{slot:stat-1-number}}</p>
<p class="stat-label">{{slot:stat-1-label}}</p>
</div>
<div class="stat-cell">
<p class="stat-number">{{slot:stat-2-number}}</p>
<p class="stat-label">{{slot:stat-2-label}}</p>
</div>
<div class="stat-cell">
<p class="stat-number">{{slot:stat-3-number}}</p>
<p class="stat-label">{{slot:stat-3-label}}</p>
</div>
<div class="stat-cell">
<p class="stat-number">{{slot:stat-4-number}}</p>
<p class="stat-label">{{slot:stat-4-label}}</p>
</div>
</div>
</section>
