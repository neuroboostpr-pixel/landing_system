<style>.lp-trust-technical-grid-3 {
  background: var(--lp-bg);
  color: var(--lp-text);
  font-family: var(--lp-font-body);
  padding: var(--lp-spacing-xl) var(--lp-spacing-md);
}

.lp-trust-technical-grid-3__inner {
  display: grid;
  gap: var(--lp-spacing-lg);
  margin: 0 auto;
  max-width: 1180px;
}

.lp-trust-technical-grid-3__header {
  display: grid;
  gap: var(--lp-spacing-sm);
  max-width: 760px;
}

.lp-trust-technical-grid-3__eyebrow {
  color: var(--lp-accent);
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.3;
  margin: 0;
}

.lp-trust-technical-grid-3__title {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: clamp(2rem, 5vw, 3.25rem);
  line-height: 1.08;
  margin: 0;
}

.lp-trust-technical-grid-3__lead {
  color: var(--lp-text-muted);
  font-size: 1rem;
  line-height: 1.7;
  margin: 0;
}

.lp-trust-technical-grid-3__grid {
  display: grid;
  gap: var(--lp-spacing-md);
  list-style: none;
  margin: 0;
  padding: 0;
}

.lp-trust-technical-grid-3__card {
  align-items: flex-start;
  background: var(--lp-bg-alt);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius-lg);
  display: flex;
  gap: var(--lp-spacing-md);
  min-height: 100%;
  padding: var(--lp-spacing-lg);
}

.lp-trust-technical-grid-3__icon {
  align-items: center;
  background: var(--lp-bg);
  border: 1px solid var(--lp-border);
  border-radius: var(--lp-radius);
  color: var(--lp-primary);
  display: inline-flex;
  flex: 0 0 auto;
  font-family: var(--lp-font-display);
  font-size: 1rem;
  font-weight: 700;
  height: 2.75rem;
  justify-content: center;
  line-height: 1;
  width: 2.75rem;
}

.lp-trust-technical-grid-3__card-body {
  display: grid;
  gap: var(--lp-spacing-xs);
}

.lp-trust-technical-grid-3__card-title {
  color: var(--lp-text);
  font-family: var(--lp-font-display);
  font-size: 1.08rem;
  line-height: 1.25;
  margin: 0;
}

.lp-trust-technical-grid-3__card-text {
  color: var(--lp-text-muted);
  font-size: 0.95rem;
  line-height: 1.65;
  margin: 0;
}

@media (min-width: 768px) {
  .lp-trust-technical-grid-3 {
    padding: var(--lp-spacing-xl) var(--lp-spacing-lg);
  }

  .lp-trust-technical-grid-3__inner {
    gap: var(--lp-spacing-xl);
  }

  .lp-trust-technical-grid-3__header {
    margin: 0 auto;
    text-align: center;
  }

  .lp-trust-technical-grid-3__grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lp-trust-technical-grid-3__card {
    flex-direction: column;
  }
}

/* Forced mobile viewport for preview */
@media (min-width: 0) {
  body, .lp-hero-cinematic-split, [class^="lp-"] { font-size: 14px; }
}
</style>
<section aria-labelledby="lp-trust-technical-grid-3-title" class="lp-trust-technical-grid-3">
<div class="lp-trust-technical-grid-3__inner">
<div class="lp-trust-technical-grid-3__header">
<p class="lp-trust-technical-grid-3__eyebrow">{{slot:eyebrow}}</p>
<h2 class="lp-trust-technical-grid-3__title" id="lp-trust-technical-grid-3-title">{{slot:heading}}</h2>
<p class="lp-trust-technical-grid-3__lead">{{slot:subhead}}</p>
</div>
<ul aria-label="{{slot:list-label}}" class="lp-trust-technical-grid-3__grid">
<li class="lp-trust-technical-grid-3__card">
<span aria-hidden="true" class="lp-trust-technical-grid-3__icon">{{slot:badge-1-icon}}</span>
<div class="lp-trust-technical-grid-3__card-body">
<h3 class="lp-trust-technical-grid-3__card-title">{{slot:badge-1-title}}</h3>
<p class="lp-trust-technical-grid-3__card-text">{{slot:badge-1-text}}</p>
</div>
</li>
<li class="lp-trust-technical-grid-3__card">
<span aria-hidden="true" class="lp-trust-technical-grid-3__icon">{{slot:badge-2-icon}}</span>
<div class="lp-trust-technical-grid-3__card-body">
<h3 class="lp-trust-technical-grid-3__card-title">{{slot:badge-2-title}}</h3>
<p class="lp-trust-technical-grid-3__card-text">{{slot:badge-2-text}}</p>
</div>
</li>
<li class="lp-trust-technical-grid-3__card">
<span aria-hidden="true" class="lp-trust-technical-grid-3__icon">{{slot:badge-3-icon}}</span>
<div class="lp-trust-technical-grid-3__card-body">
<h3 class="lp-trust-technical-grid-3__card-title">{{slot:badge-3-title}}</h3>
<p class="lp-trust-technical-grid-3__card-text">{{slot:badge-3-text}}</p>
</div>
</li>
</ul>
</div>
</section>
