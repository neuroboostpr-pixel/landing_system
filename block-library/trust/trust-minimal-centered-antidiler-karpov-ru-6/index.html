<section class="lp-trust-minimal-centered" aria-labelledby="trust-minimal-centered-title">
  <div class="lp-trust-minimal-centered__inner">
    <p class="lp-trust-minimal-centered__eyebrow">{{slot:trust-eyebrow}}</p>
    <h2 class="lp-trust-minimal-centered__title" id="trust-minimal-centered-title">{{slot:trust-heading}}</h2>
    <p class="lp-trust-minimal-centered__subhead">{{slot:trust-subhead}}</p>

    <ul class="lp-trust-minimal-centered__logo-grid" aria-label="{{slot:trust-logos-label}}">
      <li class="lp-trust-minimal-centered__logo-item">
        <img src="{{slot:partner-logo-1}}" alt="{{slot:partner-logo-1-alt}}" loading="lazy">
      </li>
      <li class="lp-trust-minimal-centered__logo-item">
        <img src="{{slot:partner-logo-2}}" alt="{{slot:partner-logo-2-alt}}" loading="lazy">
      </li>
      <li class="lp-trust-minimal-centered__logo-item">
        <img src="{{slot:partner-logo-3}}" alt="{{slot:partner-logo-3-alt}}" loading="lazy">
      </li>
      <li class="lp-trust-minimal-centered__logo-item">
        <img src="{{slot:partner-logo-4}}" alt="{{slot:partner-logo-4-alt}}" loading="lazy">
      </li>
      <li class="lp-trust-minimal-centered__logo-item">
        <img src="{{slot:partner-logo-5}}" alt="{{slot:partner-logo-5-alt}}" loading="lazy">
      </li>
      <li class="lp-trust-minimal-centered__logo-item">
        <img src="{{slot:partner-logo-6}}" alt="{{slot:partner-logo-6-alt}}" loading="lazy">
      </li>
    </ul>
  </div>
</section>
