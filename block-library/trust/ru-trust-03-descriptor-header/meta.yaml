description: "Шапка с дескриптором: 'Что / Что продаём / Кому продаём' — логотип слева, дескриптор по центру, телефон и CTA справа. Первый элемент, который видит пользователь."
display_name_ru: "🏷️ Шапка с дескриптором — кто мы"
layout_summary_ru: "Логотип слева, дескриптор по центру (Ниша + Продукт + Город), телефон и кнопка 'Связаться' справа. Белый фон, тонкая нижняя граница."
slots:
  - {type: photo, name: logo, ratio: "3:1", required: true}
  - {type: text, name: descriptor-text, max_chars: 60, required: true}
  - {type: text, name: phone, max_chars: 20, required: true}
  - {type: text, name: city-tag, max_chars: 30, required: false}
  - {type: cta, name: header-cta, default_text: "Связаться", required: false}
conversion_notes: "Дескриптор отвечает: ЧТО + ЧТО ПРОДАЁМ + КОМУ. Примеры: 'Франшиза мужских костюмов в Москве', 'Ремонт квартир в Екатеринбурге' (книга, стр. 4)."
