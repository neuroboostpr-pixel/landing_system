<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-trust-03-descriptor-header — mobile wireframe</title>
<style>
  /* Wireframe: ч/б, CSS-only, no external deps.
     CSS vars in :root are MANDATORY — block-composition/inject-tokens.py relies on these names. */
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); width: 375px; }
  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--color-border);
  }
  .logo-slot { background: #eee; border-radius: 3px; width: 80px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #bbb; flex-shrink: 0; }
  .phone { font-size: 14px; font-weight: 700; }
  .city { font-size: 10px; color: #888; }
  .header-cta { background: var(--color-accent); color: #fff; padding: 8px 14px; border-radius: 4px; font-size: 12px; font-weight: 600; text-decoration: none; flex-shrink: 0; }
</style>
</head>
<body>
  <section class="header-bar" data-block-id="ru-trust-03-descriptor-header">
    <div class="logo-slot" data-slot="logo">[Лого]</div>
    <div>
      <div class="phone" data-slot="phone">+7 000 000-00-00</div>
      <div class="city" data-slot="city-tag">[Город]</div>
    </div>
    <a href="#" class="header-cta" data-slot="header-cta">Связаться</a>
  </section>
</body>
</html>
