<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ru-trust-03-descriptor-header — desktop wireframe</title>
<style>
  /* Wireframe: ч/б, CSS-only, no external deps.
     CSS vars in :root are MANDATORY — block-composition/inject-tokens.py relies on these names. */
  :root {
    --color-bg: #fff;
    --color-fg: #111;
    --color-accent: #333;
    --color-border: #ccc;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-fg); }
  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px var(--spacing-lg);
    border-bottom: 1px solid var(--color-border);
    gap: 24px;
  }
  .logo-slot {
    background: #eee;
    border-radius: 4px;
    width: 120px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #999;
    flex-shrink: 0;
  }
  .descriptor { font-size: 15px; font-weight: 600; color: var(--color-fg); text-align: center; flex: 1; }
  .descriptor span { color: var(--color-accent); }
  .header-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .phone { font-size: 16px; font-weight: 700; }
  .city { font-size: 12px; color: #888; }
  .header-cta {
    background: var(--color-accent);
    color: #fff;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
  <section class="header-bar" data-block-id="ru-trust-03-descriptor-header">
    <div class="logo-slot" data-slot="logo">[Логотип]</div>
    <div class="descriptor">
      <span data-slot="descriptor-text">[Ниша + Продукт + Город / Регион]</span>
    </div>
    <div class="header-right">
      <div>
        <div class="phone" data-slot="phone">+7 (000) 000-00-00</div>
        <div class="city" data-slot="city-tag">[Город]</div>
      </div>
      <a href="#" class="header-cta" data-slot="header-cta">Связаться</a>
    </div>
  </section>
</body>
</html>
