<style>
  /* Wireframe: ч/б, CSS-only, no external deps.
     CSS vars in :root are MANDATORY — block-composition/inject-tokens.py relies on these names. */
  :root {
    --lp-bg: #f5f5f5;
    --lp-text: #1a1a1a;
    --lp-accent: #333;
    --lp-border: #e0e0e0;
    --font-display: system-ui, sans-serif;
    --font-body: system-ui, sans-serif;
    --spacing-md: 16px;
    --spacing-lg: 32px;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--lp-bg); color: var(--lp-text); }
  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px var(--spacing-lg);
    border-bottom: 1px solid var(--lp-border);
    gap: 24px;
  }
  .logo-slot {
    background:#eee;
    border-radius: 4px;
    width: 120px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color:#999;
    flex-shrink: 0;
  }
  .descriptor { font-size: 15px; font-weight: 600; color: var(--lp-text); text-align: center; flex: 1; }
  .descriptor span { color: var(--lp-accent); }
  .header-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .phone { font-size: 16px; font-weight: 700; }
  .city { font-size: 12px; color:#888; }
  .header-cta {
    background: var(--lp-accent);
    color:#fff;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
</style>
<section class="header-bar" data-block-id="ru-trust-03-descriptor-header">
<div class="logo-slot">{{slot:logo}}</div>
<div class="descriptor">
<span>{{slot:descriptor-text}}</span>
</div>
<div class="header-right">
<div>
<div class="phone">{{slot:phone}}</div>
<div class="city">{{slot:city-tag}}</div>
</div>
<a class="header-cta" href="#">{{slot:header-cta}}</a>
</div>
</section>
