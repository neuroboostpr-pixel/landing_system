<style>
  :root { --lp-bg: #f5f5f5; --lp-text: #1a1a1a; --lp-accent: #333; --lp-border: #e0e0e0; --lp-bg-alt: #e8e8e8; --font-display:'Playfair Display',Georgia,serif; --font-body:'Inter Tight',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--lp-bg); color:var(--lp-text); width:375px; padding:40px 16px; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--lp-accent); margin-bottom:14px; }
  h2 { font-size:32px; font-weight:800; letter-spacing:-0.028em; margin-bottom:28px; }
  h2 em { font-family:var(--font-display); font-style:italic; font-weight:500; }
  .labs-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .lab-card { background:var(--lp-bg-alt); border-radius:10px; padding:14px; box-shadow:inset 0 0 0 1px rgba(21,20,15,0.06); }
  .lab-img { aspect-ratio:4/3; background:rgba(21,20,15,0.08); border-radius:6px; margin-bottom:10px; display:flex; align-items:center; justify-content:center; font-size:9px; text-transform:uppercase; color:rgba(21,20,15,0.3); letter-spacing:0.12em; }
  .lab-title { font-size:13px; font-weight:700; margin-bottom:4px; }
  .lab-desc { font-size:11px; color:rgba(21,20,15,0.6); line-height:1.5; }
</style>
<section data-block-id="ru-trust-06-labs-showcase">
<div class="kicker">{{slot:kicker}}</div>
<h2>{{slot:h2-1}}</h2>
<div class="labs-grid">
<div class="lab-card"><div class="lab-img">Проект 1</div><div class="lab-title">{{slot:lab-1-title}}</div><div class="lab-desc">{{slot:lab-1-desc}}</div></div>
<div class="lab-card"><div class="lab-img">Проект 2</div><div class="lab-title">{{slot:lab-2-title}}</div><div class="lab-desc">{{slot:lab-2-desc}}</div></div>
<div class="lab-card"><div class="lab-img">Проект 3</div><div class="lab-title">{{slot:lab-3-title}}</div><div class="lab-desc">{{slot:lab-3-desc}}</div></div>
<div class="lab-card"><div class="lab-img">Проект 4</div><div class="lab-title">{{slot:lab-4-title}}</div><div class="lab-desc">{{slot:lab-4-desc}}</div></div>
</div>
</section>
