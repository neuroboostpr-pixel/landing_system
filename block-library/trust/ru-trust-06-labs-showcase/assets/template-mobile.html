<!DOCTYPE html>
<!-- Source: github.com/nexu-io/open-design @ main | design-templates/open-design-landing/example.html | License: Apache-2.0 -->
<html lang="ru"><head><meta charset="UTF-8"><title>ru-trust-06-labs-showcase — mobile</title>
<style>
  :root { --color-bg:#efe7d2; --color-fg:#15140f; --color-accent:#ed6f5c; --color-border:rgba(21,20,15,0.16); --color-bone:#f7f1de; --font-display:'Playfair Display',Georgia,serif; --font-body:'Inter Tight',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font-body); background:var(--color-bg); color:var(--color-fg); width:375px; padding:40px 16px; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent); margin-bottom:14px; }
  h2 { font-size:32px; font-weight:800; letter-spacing:-0.028em; margin-bottom:28px; }
  h2 em { font-family:var(--font-display); font-style:italic; font-weight:500; }
  .labs-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .lab-card { background:var(--color-bone); border-radius:10px; padding:14px; box-shadow:inset 0 0 0 1px rgba(21,20,15,0.06); }
  .lab-img { aspect-ratio:4/3; background:rgba(21,20,15,0.08); border-radius:6px; margin-bottom:10px; display:flex; align-items:center; justify-content:center; font-size:9px; text-transform:uppercase; color:rgba(21,20,15,0.3); letter-spacing:0.12em; }
  .lab-title { font-size:13px; font-weight:700; margin-bottom:4px; }
  .lab-desc { font-size:11px; color:rgba(21,20,15,0.6); line-height:1.5; }
</style></head>
<body>
  <section data-block-id="ru-trust-06-labs-showcase">
    <div class="kicker" data-slot="kicker">[Портфолио]</div>
    <h2 data-slot="headline">[Наши <em>реальные</em> проекты]</h2>
    <div class="labs-grid">
      <div class="lab-card"><div class="lab-img">Проект 1</div><div class="lab-title" data-slot="lab-1-title">[Проект 1]</div><div class="lab-desc" data-slot="lab-1-desc">[Описание]</div></div>
      <div class="lab-card"><div class="lab-img">Проект 2</div><div class="lab-title" data-slot="lab-2-title">[Проект 2]</div><div class="lab-desc" data-slot="lab-2-desc">[Описание]</div></div>
      <div class="lab-card"><div class="lab-img">Проект 3</div><div class="lab-title" data-slot="lab-3-title">[Проект 3]</div><div class="lab-desc" data-slot="lab-3-desc">[Описание]</div></div>
      <div class="lab-card"><div class="lab-img">Проект 4</div><div class="lab-title" data-slot="lab-4-title">[Проект 4]</div><div class="lab-desc" data-slot="lab-4-desc">[Описание]</div></div>
    </div>
  </section>
</body></html>
