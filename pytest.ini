[pytest]
# Support both test_*.py (pytest default) and test-*.py (our convention)
python_files = test_*.py test-*.py
testpaths = tests
pythonpath = .
norecursedirs = archive .claude node_modules
# importlib: одинаковые basenames тестов в разных phase-папках без __init__.py
# --ignore-glob "* 2.py": не собирать iCloud/merge-дубликаты «<name> 2.py»
#   (они байт-в-байт копии оригиналов; пока не вычищены — не дублируем прогон).
addopts = --import-mode=importlib --ignore-glob=*\ 2.py
