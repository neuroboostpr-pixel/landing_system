# Source of truth for landing-system stage gates.
# Read by scripts/gate-check.sh.

# Legacy bypass allowlist. Stages here can use `legacy: true` in state-file
# IF they also provide `legacy_reason:` field. Without both — gate fails.
# Reviewed by Code-Owner before adding to this list.
legacy_allowed: []  # Empty by default. Add entries explicitly when needed.

stages:
  "00_brief":
    name: "Brief"
    lock: soft
    require_approved: []
    hard_checks:
      - id: brief_file_exists
        type: file_exists
        path: "{project}/00_БРИФ/brief.md"
        required: true
        fix_hint: "Create 00_БРИФ/brief.md with project requirements"

  "01a_niche_analysis":
    name: "Niche analysis"
    lock: soft
    require_approved: ["00_brief"]
    hard_checks:
      - id: niche_analysis_md
        type: file_exists
        path: "{project}/01a_АНАЛИЗ_НИШИ/niche-analysis.md"
        required: true
        fix_hint: "niche-analyst agent creates this"
      - id: competitors_yaml
        type: file_exists
        path: "{project}/01a_АНАЛИЗ_НИШИ/competitors.yaml"
        required: true
        fix_hint: "niche-analyst agent creates this"
      - id: positioning_md
        type: file_exists
        path: "{project}/01a_АНАЛИЗ_НИШИ/positioning.md"
        required: true
        fix_hint: "niche-analyst agent creates this"
      - id: competitors_schema
        type: script
        script: "skills/niche-analysis/scripts/validate-competitors.py"
        args: ["{project}/01a_АНАЛИЗ_НИШИ/competitors.yaml"]
        required: true
        fix_hint: "Fix competitors.yaml — see script output for issues"
      - id: visual_requirements_md
        type: file_exists
        path: "{project}/01a_АНАЛИЗ_НИШИ/visual-requirements.md"
        required: true
        fix_hint: "niche-analyst agent creates this (step 11)"
      - id: visual_requirements_schema
        type: script
        script: "skills/niche-analysis/scripts/validate-visual-requirements.py"
        args: ["{project}/01a_АНАЛИЗ_НИШИ/visual-requirements.md"]
        required: true
        fix_hint: "Fix visual-requirements.md sections — see script output"
      - id: market_profile_md
        type: file_exists
        path: "{project}/01a_АНАЛИЗ_НИШИ/market-profile.md"
        required: true
        fix_hint: "niche-analyst agent creates this (step 7)"
      - id: market_profile_schema
        type: script
        script: "skills/niche-analysis/scripts/validate-market-profile.py"
        args: ["{project}/01a_АНАЛИЗ_НИШИ/market-profile.md"]
        required: true
        fix_hint: "Fix market-profile.md — see script output"
      - id: positioning_schema
        type: script
        script: "skills/niche-analysis/scripts/validate-positioning.py"
        args: ["{project}/01a_АНАЛИЗ_НИШИ/positioning.md"]
        required: true
        fix_hint: "Fix positioning.md — must have **Mode:** header and template sections for that mode"
      - id: landing_structure_md
        type: file_exists
        path: "{project}/01a_АНАЛИЗ_НИШИ/landing-structure.md"
        required: true
        fix_hint: "niche-analyst agent creates this (step 10)"
      - id: landing_structure_schema
        type: script
        script: "skills/niche-analysis/scripts/validate-landing-structure.py"
        args: ["{project}/01a_АНАЛИЗ_НИШИ/landing-structure.md"]
        required: true
        fix_hint: "Fix landing-structure.md — see script output"
    soft_checks:
      - id: positioning_max_2_angles
        prompt: "В positioning.md ровно 1 или 2 угла отстройки (не больше)? (yes / no)"
      - id: competitors_count_15_25
        prompt: "В competitors.yaml 15–25 записей? (yes / no)"

  "02_assets":
    name: "Materials collection"
    lock: soft
    require_approved: []
    hard_checks:
      - id: stock_photo_api
        type: api_validator_any_of
        validators: [pexels, unsplash, pixabay]
        required: true
        fix_hint: "Add at least one of PEXELS_API_KEY/UNSPLASH_ACCESS_KEY/PIXABAY_API_KEY to .env"
      - id: assets_folder
        type: file_exists
        path: "{project}/02_МАТЕРИАЛЫ_КЛИЕНТА/"
        required: true
        fix_hint: "Folder is created by /landing-new automatically"
    soft_checks:
      - id: photo_style_consistency
        prompt: "Фото клиента в одном стиле? (yes / no / partial)"
      - id: missing_photos_listed
        prompt: "Каких фото не хватает? Перечислены в notes.md? (yes / no)"

  "03_references":
    name: "References"
    lock: soft
    require_approved: []
    hard_checks:
      - id: refs_index_exists
        type: file_exists
        path: "{project}/03_РЕФЕРЕНСЫ/index.yaml"
        required: true
        fix_hint: "references-curator agent creates this"
      - id: refs_no_unresolved
        type: file_exists
        path: "{project}/03_РЕФЕРЕНСЫ/refs-palette.html"
        required: true
        fix_hint: "auto_fix: run extract-palette script; or: provide screenshot/description for each blocked URL"
    soft_checks:
      - id: min_3_approved_refs
        prompt: "В 03_РЕФЕРЕНСЫ/index.yaml минимум 3 референса со статусом approved? (yes / no)"

  "03b_visual_concept":
    name: "Visual concept"
    lock: hard
    require_approved: ["03_references"]
    hard_checks:
      - id: visual_concept_exists
        type: file_exists
        path: "{project}/03b_КОНЦЕПТ/visual-concept.yaml"
        required: true
        fix_hint: "visual-strategist agent creates this after manager approves a concept"

  "04_brand":
    name: "Brand kit"
    lock: soft
    require_approved: ["03b_visual_concept"]
    hard_checks:
      - id: visual_concept_approved
        type: file_exists
        path: "{project}/03b_КОНЦЕПТ/visual-concept.yaml"
        required: true
        fix_hint: "Run stage 03b: /landing-visual-concept to generate and approve visual concept"
      - id: brand_kit_exists
        type: file_exists
        path: "{project}/04_БРЕНД/brand-kit.md"
        required: true
        fix_hint: "brand-architect agent creates this"

  "05_design":
    name: "Design system"
    lock: soft
    require_approved: []
    hard_checks:
      - id: mockup_approved
        type: file_exists
        path: "{project}/05_ДИЗАЙН-СИСТЕМА/mockup-preview.html"
        required: true
        fix_hint: "design-system-generator creates mockup-preview.html at start of stage 05"
      - id: design_md
        type: file_exists
        path: "{project}/05_ДИЗАЙН-СИСТЕМА/DESIGN.md"
        required: true
      - id: tokens_json
        type: file_exists
        path: "{project}/05_ДИЗАЙН-СИСТЕМА/tokens.json"
        required: true
    # No automated post-approve hook mechanism yet (Path B).
    # After this stage is approved, run manually:
    manual_post_approve_steps:
      - "Run: python scripts/export-palettes-to-library.py --project <project> --library presets/palettes.yaml"

  "06_stack":
    name: "Stack selection"
    lock: soft
    require_approved: []
    hard_checks:
      - id: design_stack_yaml
        type: file_exists
        path: "{project}/06_СТЕК/design-stack.yaml"
        required: true
      - id: cdn_iconify
        type: http_ping
        url: "https://api.iconify.design/lucide/check.svg"
      - id: cdn_bunny_fonts
        type: http_ping
        url: "https://fonts.bunny.net/css?family=inter:400"
      - id: cdn_gsap
        type: http_ping
        url: "https://cdn.jsdelivr.net/npm/gsap@3"
    soft_checks:
      - id: free_libraries_only
        prompt: "Все библиотеки в design-stack.yaml бесплатные (free tier)? (yes / no)"

  "07_content":
    name: "Content"
    lock: soft
    require_approved: ["07a_prototype"]
    hard_checks:
      - id: content_md_exists
        type: file_exists
        path: "{project}/07_КОНТЕНТ/content.md"
        required: true
        fix_hint: "auto_fix: /landing-content"

      - id: content_no_lorem
        type: script
        script: "skills/landing-system/scripts/validate-content-extraction.py"
        args: ["{project}/07_КОНТЕНТ/content.md", "--check-no-lorem"]
        required: true
        fix_hint: "content.md содержит шаблонный текст (Lorem, template phrases). Запусти /landing-content с флагом --regenerate"

      - id: content_sections_match
        type: script
        script: "skills/landing-system/scripts/validate-content-extraction.py"
        args: ["{project}/07_КОНТЕНТ/content.md", "{project}/07_ПРОТОТИП/prototype.yaml", "--check-sections-match"]
        required: true
        fix_hint: "Кол-во секций в prototype.yaml не совпадает с content.md. Проверь extraction-log.md"

      - id: extraction_log_exists
        type: file_exists
        path: "{project}/07_КОНТЕНТ/extraction-log.md"
        required: true
        fix_hint: "auto_fix: /landing-content"

      - id: extraction_log_passed
        type: script
        script: "skills/landing-system/scripts/validate-content-extraction.py"
        args: ["{project}/07_КОНТЕНТ/extraction-log.md", "--check-log-passed"]
        required: true
        fix_hint: "extraction-log.md показывает failures. Проверь логи и запусти /landing-content --debug"

    soft_checks:
      - id: content_sections_count
        prompt: "Количество текстовых блоков в content.md адекватно (не менее 10)? (yes / no)"

  "07a_prototype":
    name: "Прототип (parse)"
    lock: soft
    require_approved: []
    hard_checks:
      - id: prototype_source_exists
        type: file_or_dir_exists
        path: "{project}/07_ПРОТОТИП/source"
        required: true
        fix_hint: "Положи prototype.pdf или prototype.md в 07_ПРОТОТИП/source/"
      # A1: канон этапа — prototype.md (дословный, без потерь).
      # prototype.yaml — производный артефакт для downstream-скриптов,
      # обязательным НЕ является (машинный разбор терял данные — спека §2.1).
      - id: prototype_md_exists
        type: file_exists
        path: "{project}/07_ПРОТОТИП/prototype.md"
        required: true
        fix_hint: "auto_fix: /landing-prototype"
      - id: prototype_fidelity
        type: script
        script: "skills/prototype-import/scripts/gate-prototype-fidelity.py"
        args: ["{project}"]
        required: true
        fix_hint: "Парсер потерял >10% текста или выдумал структуру (меню/фейк-цены). Открой 07_ПРОТОТИП/fidelity-report.md — перепарсь docx (extract-docx-text.py) или поправь prototype.yaml вручную, чтобы покрытие было ≥90%."

  # Этап wireframe удалён: блочный трек в архиве (reference-driven flow, спека §6).
  # Макет composed.html рисует агент по прототипу + референсу клиента.

  "07c_composed":
    name: "Composed (draft)"
    lock: hard
    require_approved: ["05_design", "07a_prototype"]
    hard_checks:
      - id: composed_html
        type: file_exists
        path: "{project}/07b_COMPOSED/composed.html"
        required: true
        fix_hint: "auto_fix: /landing-compose"
      - id: composed_premium_standard
        type: script
        script: "scripts/verify-composed-premium.sh"
        args: ["{project}/07b_COMPOSED/composed.html"]
        required: true
        fix_hint: "composed.html не соответствует premium-стандарту (docs/standards/premium-07b-checklist.md). block-composer должен доработать недостающие фичи (parallax / glassmorphism / slider / lightbox / count-up / reveal / gradient text) и прогнать verify заново."
      - id: content_preserved
        type: script
        script: "scripts/verify-content-preserved.sh"
        args: ["{project}"]
        required: true
        fix_hint: "Текст прототипа изменён в composed.html. Откати правки или обнови prototype.yaml если клиент дал новый текст."
      - id: photo_pipeline_valid
        type: script
        script: "scripts/verify-photo-pipeline.sh"
        args: ["{project}"]
        required: true
        fix_hint: "Photo pipeline не пройден. Запусти /landing-photos для обработки фото через codex. Проверь что в composed.html нет SVG placeholder'ов."
      # C3: все цвета через токены — иначе переключатель палитры «течёт»
      - id: tokens_only_colors
        type: script
        script: "scripts/verify_tokens.py"
        args: ["{project}/07b_COMPOSED/composed.html"]
        required: true
        fix_hint: "В composed.html прямые цвета вне :root. Замени на var(--…); легальные исключения — бренд-цвета мессенджеров и /* token-exempt */ (спека reference-driven §4.3)."
      # A2: поблочная сверка макета с прототипом (reference-driven-rules.md §4)
      - id: structure_check_md
        type: file_exists
        path: "{project}/07b_COMPOSED/structure-check.md"
        required: true
        fix_hint: "block-composer обязан поблочно сверить composed.html с prototype.md (порядок/состав/выравнивание) и записать результат в 07b_COMPOSED/structure-check.md — см. docs/standards/reference-driven-rules.md"
    soft_checks:
      - id: structure_matches_prototype
        prompt: "structure-check.md: все блоки прототипа на месте, порядок/состав совпадают, выдуманных элементов нет? (yes / no)"
      - id: visual_qa_passed
        prompt: "Запустить Visual QA через /landing-qa? (опционально, не блокирует этап)"
      - id: identity_preserved
        prompt: "Identity check для фоток прошёл (manifest.json без violations)? Опционально на этом этапе."

  "07d_photos":
    name: "Photos pipeline"
    lock: soft
    require_approved: []
    hard_checks:
      - id: photo_selections_yaml
        type: file_exists
        path: "{project}/07c_PHOTOS/selections.yaml"
        required: true
        fix_hint: "Открой 07c_PHOTOS/photo-board.html, расставь фото, нажми Подтвердить, скачай selections.yaml и положи в 07c_PHOTOS/"

  "07e_visuals":
    name: "Visuals pipeline (icons + infographics)"
    lock: soft
    require_approved: []
    hard_checks:
      - id: visuals_generated
        type: dir_has_files
        path: "{project}/07d_VISUALS/icons"
        required: false
        fix_hint: "auto_fix: /landing-visuals"

  "07f_composed_final":
    name: "Composed (final)"
    lock: soft
    require_approved: []
    hard_checks:
      - id: composed_has_real_visuals
        type: script
        script: "scripts/verify-composed-has-visuals.sh"
        args: ["{project}/07b_COMPOSED/composed.html"]
        required: true
        fix_hint: "auto_fix: /landing-compose"
      - id: composed_premium_standard
        type: script
        script: "scripts/verify-composed-premium.sh"
        args: ["{project}/07b_COMPOSED/composed.html"]
        required: true
        fix_hint: "Финальный composed.html не соответствует premium-стандарту (docs/standards/premium-07b-checklist.md). Прогнать /landing-compose заново и доработать недостающие фичи."
      - id: content_preserved
        type: script
        script: "scripts/verify-content-preserved.sh"
        args: ["{project}"]
        required: true
        fix_hint: "Текст прототипа изменён в composed.html. Откати правки или обнови prototype.yaml если клиент дал новый текст."
      - id: photo_pipeline_valid
        type: script
        script: "scripts/verify-photo-pipeline.sh"
        args: ["{project}"]
        required: true
        fix_hint: "Photo pipeline не пройден. Запусти /landing-photos для обработки фото через codex. Проверь что в composed.html нет SVG placeholder'ов."
      - id: identity_preserved
        type: script
        script: "scripts/verify-identity-preserved.sh"
        args: ["{project}"]
        required: true
        fix_hint: "Identity violation для одной или нескольких фоток. Проверь 07c_PHOTOS/processed/manifest.json. Решение: вернуть оригинал или переобработать с уточнённым промптом."
    soft_checks:
      - id: visual_qa_passed
        prompt: "Запустить Visual QA через /landing-qa? (опционально, не блокирует этап)"

  "08_build":
    name: "WP Build"
    lock: hard
    require_approved: ["07c_composed"]
    hard_checks:
      - id: design_md
        type: file_exists
        path: "{project}/05_ДИЗАЙН-СИСТЕМА/DESIGN.md"
        required: true
      # C2: болячки сборки — script-в-блоке, повторные функции, дефолты WP,
      # ширина обёрток, img-geometry (спека reference-driven §4.2)
      - id: theme_build_lint
        type: script
        script: "skills/wp-gutenberg-block-builder/scripts/lint-theme-php.py"
        args: ["{project}/08_КОД/wp-theme"]
        required: true
        fix_hint: "Сборка темы содержит известные болячки (§4.2). Вывод линтера показывает что чинить: <script> из block.php → в assets/js; функции → function_exists; убрать wp-block-styles; добавить wrapper-width/img-geometry CSS."
      # C3: токенизация темы синхронно с макетом
      - id: theme_tokens_only_colors
        type: script
        script: "scripts/verify_tokens.py"
        args: ["{project}/08_КОД/wp-theme/assets/css"]
        required: true
        fix_hint: "В CSS темы прямые цвета вне :root — замени на var(--…) (спека §4.3); исключения: бренд-цвета мессенджеров, /* token-exempt */."
      - id: final_copy
        type: file_exists
        path: "{project}/07_КОНТЕНТ/final-copy.md"
        required: true
      - id: theme_php_syntax_valid
        type: script
        script: "scripts/verify-php-syntax.sh"
        args: ["{project}/08_КОД/wp-theme"]
        required: true
        fix_hint: "wp-builder сгенерил невалидный PHP — посмотри логи wp-builder, re-run"
      - id: gutenberg_blocks_valid
        type: script
        script: "scripts/verify-gutenberg-json.sh"
        args: ["{project}/08_КОД/gutenberg-blocks"]
        required: false
        fix_hint: "Gutenberg block.json невалидный — посмотри errors output"
      - id: wp_theme_dir
        type: file_exists
        path: "{project}/08_КОД/wp-theme"
        required: true
        fix_hint: "Run /landing-build to generate the wp-theme scaffold."
      - id: block_registration
        type: script
        script: "scripts/lib/check-block-registration.sh"
        args: ["{project}"]
        fix_hint: "block registration missing: functions.php needs lzb/init + lazyblocks()->add_block(. Run: python scripts/generate-wp-blocks.py --project {project}"
      - id: acf_and_blocks_structure
        type: script
        script: "scripts/lib/stage_08_helper.py"
        args: ["{project}"]
        fix_hint: "Run: python scripts/generate-wp-blocks.py --project {project}"
      - id: composed_vs_spec_lint
        type: script
        script: "skills/wp-gutenberg-block-builder/scripts/lint-composed-vs-spec.py"
        args: ["--project", "{project}"]
        fix_hint: "Run: python3 skills/wp-gutenberg-block-builder/scripts/lint-composed-vs-spec.py --project {project} --fix"
    soft_checks:
      - id: legal_blocks_present
        title: "Cookie-banner, consent-init, legal-block присутствуют в теме"
        command: "bash scripts/checks/check_legal_blocks.sh {project_dir}"
        blocking: false

  "08b_style":
    name: "Frontend style"
    require_approved: ["08_build"]
    hard_checks:
      - id: design_md
        type: file_exists
        path: "{project}/05_ДИЗАЙН-СИСТЕМА/DESIGN.md"
        required: true
      - id: block_php_markers
        type: script
        script: "skills/wp-gutenberg-block-builder/scripts/check-block-php-markers.py"
        args: ["{project}"]
        required: true
        fix_hint: "Run /landing-style — every wp-theme/blocks/lazyblock-*/block.php must start with the frontend-builder marker comment"
      - id: section5_has_css
        type: script
        script: "skills/wp-gutenberg-block-builder/scripts/check-section5-css.py"
        args: ["{project}"]
        required: true
        fix_hint: "Run /landing-style — DESIGN.md §5 must contain a fenced ```css block under each `### Block N` heading"
      - id: main_css_regenerated
        type: file_exists
        path: "{project}/08_КОД/wp-theme/assets/css/main.css"
        required: true
        fix_hint: "Run /landing-style to regenerate assets/css/main.css from DESIGN.md"
    soft_checks:
      - id: visual_passable
        prompt: "Открой preview URL в браузере: визуал соответствует DESIGN.md §5 (Hero 2-col на desktop, FAQ accordion, Pricing badge)? (yes / no / partial)"

  "09_deploy":
    name: "Deploy"
    lock: hard
    require_approved: ["08_build", "10_qa"]
    hard_checks:
      - id: ssh_to_beget
        type: api_validator
        validator: beget_ssh
      - id: ym_counter
        type: api_validator
        validator: yandex_metrika
      - id: telegram_bot
        type: api_validator
        validator: telegram
      - id: crm_webhook
        type: api_validator_any_of
        validators: [amocrm, bitrix24]
      - id: theme_built
        type: file_exists
        path: "{project}/08_КОД/wp-theme/functions.php"
        required: true
      - id: site_url_accessible
        type: script
        script: "scripts/verify-site-url.sh"
        args: ["{project}/.landing-state.yaml"]
        required: true
        fix_hint: "Сайт не открывается по URL. Проверь Бегет credentials в ~/.beget-config или логи wp-deployer"
      - id: final_check
        type: script
        script: "scripts/landing-final-check.sh"
        args: ["{project}"]
        required: true
        fix_hint: "Final check fail. Смотри 10_QA/final-check-report.md."

  "10_qa":
    name: "QA"
    lock: hard
    require_approved: ["08_build"]
    hard_checks:
      - id: seo_audit_pass
        type: script
        script: "skills/seo-tech-audit/scripts/run-audit.py"
        args: ["--project", "{project}", "--json"]
        required: true
        fix_hint: "Открой 11_QA/audit-report.md — список failed checks с описанием. Чтобы запустить руками: python skills/seo-tech-audit/scripts/run-audit.py --project <path>"
    soft_checks:
      - id: site_live
        prompt: "Сайт открывается по HTTPS? (yes / no)"

  "11_analytics":
    name: "Analytics"
    lock: soft
    require_approved: ["09_deploy"]
    soft_checks:
      - id: metrika_works
        prompt: "Метрика принимает события (проверено в Вебвизоре)? (yes / no)"

  "12_seo":
    name: "SEO"
    lock: soft
    require_approved: ["09_deploy"]
    hard_checks:
