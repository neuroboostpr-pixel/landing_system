version: 1
page:
  title: Refined Heuristics Test
  slug: home
blocks:
  - slug: features
    title: Features
    icon: star
    category: design
    type: section-card
    probe_selector: '.features-section'
    probe_kind: card-collection
    card_probe_selector: '.feature-card'
    card_skip_selector: '.feature-statement'   # exclude statement card
    section_grid_class: 'features-grid'
    controls:
      - id: c_feat_stmt
        name: feat_statement
        type: textarea
        label: Statement
        target_selector: '.feature-statement'   # scope multi-p check
        default: |
          LiXiang — smart, quiet, and luxurious. Exactly as it should be.

          Li vehicles are built for people who no longer see a car as just transport.

          Every detail is designed to elevate everyday life.

          Li is a statement on the outside.
    card:
      slug: feature-card
      title: Feature Card
      controls:
        - { id: c_fc_title, name: title, type: text, label: Title, default: "Feat" }
        - { id: c_fc_text,  name: text,  type: textarea, label: Text, target_selector: '.feature-text', default: "Body text" }
        - { id: c_fc_icon,  name: icon_svg, type: textarea, label: Icon, default: "%3Csvg%3E%3C/svg%3E" }
      template:
        # 2 entries — matches the 2 non-statement .feature-card elements
        - { title: "Confidence", text: "Li is family-focused safety.",   icon_svg: "%3Csvg%3E%3C/svg%3E" }
        - { title: "Quietness",  text: "A refined ride.",                icon_svg: "%3Csvg%3E%3C/svg%3E" }
