name: HybridAutos backend quality

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'integration/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hybridautos-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lead reliability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the audited source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify all HybridAutos backend scenarios
        run: |
          set -euo pipefail
          critical_tests=(
            skills/wp-landing-config/tests/test_rest_lead_field_limits.php
            skills/wp-landing-config/tests/test_rest_lead_idempotency.php
            skills/wp-landing-config/tests/test_form_events.php
            skills/wp-landing-config/tests/test_urgent_delivery_log.php
          )
          for critical_test in "${critical_tests[@]}"; do test -f "$critical_test"; done
          php_test_count="$(find skills/wp-landing-config/tests -maxdepth 1 -type f -name 'test_*.php' | wc -l | tr -d '[:space:]')"
          test "$php_test_count" -ge 42
          find skills/wp-landing-config/tests -maxdepth 1 -type f -name 'test_*.php' -print0 | sort -z | xargs -0 -n1 php

      - name: Verify PHP syntax
        run: |
          set -euo pipefail
          php_file_count="$(find skills/wp-landing-config -type f -name '*.php' | wc -l | tr -d '[:space:]')"
          test "$php_file_count" -ge 111
          find skills/wp-landing-config -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
